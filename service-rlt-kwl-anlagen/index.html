<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Serv. RLT/KWL" />

    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('muther-theme');
          var r = document.documentElement;
          if (t === 'hell') r.setAttribute('data-theme', 'light');
          else if (t === 'dunkel') r.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>

    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/png" href="icon-180.png" />

    <script src="shared/lib/html2canvas.min.js" defer></script>
    <script src="shared/lib/jspdf.umd.min.js" defer></script>

    <style>
      /* Felder */
      .ferr {
        color: var(--bad);
        font-size: 14px;
        font-weight: 600;
        margin-top: 6px;
      }
      .mangel {
        margin-top: 4px;
      }
      .field.err input,
      .field.err textarea {
        border-color: var(--bad);
      }
      .inunit input {
        max-width: 260px;
        font-size: 22px;
      }
      .inunit .unit {
        color: var(--muted);
        font-weight: 600;
      }
      .soll {
        font-size: 14px;
        margin-top: 6px;
      }
      .calc {
        display: inline-block;
        padding: 10px 14px;
        background: var(--gold-soft);
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: 14px;
        font-weight: 700;
        min-width: 120px;
      }
      .calcnote {
        font-size: 13px;
        color: var(--muted);
        margin-left: 8px;
      }
      @media (max-width: 700px) {
        .frow {
          flex-direction: column;
          align-items: stretch;
        }
        .seg .btn {
          flex: 1;
        }
      }
      .sigwrap {
        border: 2px dashed var(--line);
        border-radius: 12px;
        background: #fff;
        margin-bottom: 8px;
      }
      canvas.sig {
        width: 100%;
        height: 170px;
        display: block;
        touch-action: none;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
      }
      @media (max-width: 640px) {
        .grid2 {
          grid-template-columns: 1fr;
        }
      }
      .err {
        color: var(--bad);
        font-weight: 600;
        margin-top: 10px;
        min-height: 1.2em;
      }
      a.jump {
        color: var(--ink);
        font-weight: 600;
        cursor: pointer;
        text-decoration: underline;
        text-decoration-color: var(--pri2);
        text-decoration-thickness: 2px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 3px solid var(--gold);
        outline-offset: 0;
        border-color: var(--pri2);
      }
      /* Meldung: Kapsel oben, Aussehen und Bewegung in shared/ios.css */
      #toast {
        position: fixed;
        left: 50%;
        opacity: 0;
        max-width: 90vw;
        text-align: center;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
      /* Feste Leiste unten (Zurück / Weiter / Abschließen / PDF) */
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
      }
      .warnbox .btn {
        margin-top: 10px;
      }
      .bar .btn {
        flex: 1;
        min-height: 52px;
        font-weight: 700;
        font-size: 15px;
      }
      .bar .btn.primary {
        border-color: var(--gold-dark);
      }
      body.hasbar main {
        padding-bottom: calc(110px + env(safe-area-inset-bottom));
      }
      /* PDF-Knopf mit Fortschritt */
      .bar .btn.pdfb {
        overflow: hidden;
      }
      .pdfb .fill {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.14);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 220ms linear;
        pointer-events: none;
      }
      .pdfb .l1,
      .pdfb .l2,
      .pdfb .lr {
        display: flex;
        align-items: center;
        gap: 6px;
        position: relative;
        transition:
          opacity var(--t-fast),
          transform var(--t-fast) var(--out);
      }
      .pdfb .l2,
      .pdfb .lr {
        position: absolute;
        opacity: 0;
        transform: translateY(8px);
      }
      .pdfb.run .l1,
      .pdfb.done .l1 {
        opacity: 0;
        transform: translateY(-8px);
      }
      .pdfb.run .lr {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .lr {
        opacity: 0;
      }
      .pdfb.done .l2 {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .fill {
        opacity: 0;
      }
      /* Wert wechselt: kurzes Aufleuchten */
      .flash {
        animation: flash 900ms var(--out);
      }
      @keyframes flash {
        from {
          background-color: var(--flash);
        }
      }
      /* Seitenwechsel zwischen den Schritten (.pg-*): shared/ios.css */
      /* Karten erscheinen gestaffelt (nur solange .entering am Container hängt) */
      .entering .stag {
        opacity: 0;
        transform: translateY(12px);
        animation: up var(--t-med) var(--out) forwards;
        animation-delay: calc(var(--i) * 70ms + 120ms);
      }
      @keyframes up {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          transition-duration: 0.001ms !important;
          transition-delay: 0ms !important;
          animation-duration: 0.001ms !important;
          animation-delay: 0ms !important;
        }
        .entering .stag {
          opacity: 1;
          transform: none;
        }
      }
      /* ===== Handy-Layout ===== */
      /* iPhone/iPad: Datumsfeld hat sonst eine feste Mindestbreite und ragt über den Rand */
      input[type='date'] {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        min-height: 50px;
        height: 50px;
        text-align: left;
        margin: 0;
      }
      input[type='date']::-webkit-date-and-time-value {
        text-align: left;
        min-width: 0;
        margin: 0;
      }
      input[type='date']::-webkit-datetime-edit {
        padding: 0;
        text-align: left;
      }
      /* Schmale Bildschirme (iPhone hochkant): Status kompakt, Tabellen als Karten */
      @media (max-width: 480px) {
        .net:not(.off) .nt,
        .net:not(.off) .sep,
        .net .nl {
          display: none;
        }
        .net:not(.off) .nd {
          margin-right: 0;
        }
        .net:not(.off) .np {
          margin-left: 5px;
        }
        .ib {
          width: 40px;
          height: 40px;
        }
        header {
          gap: 8px;
        }
        header .tt h1 {
          font-size: 15px;
        }
      }
      @media (max-width: 600px) {
        header {
          padding-left: 12px;
          padding-right: 12px;
        }
        main,
        #stepwrap {
          padding-left: 12px;
          padding-right: 12px;
        }
        .card {
          padding: 12px 14px;
        }
        .pagetitle {
          font-size: 22px;
        }
        .card > table thead {
          display: none;
        }
        .card > table,
        .card > table tbody,
        .card > table tr,
        .card > table td {
          display: block;
          width: 100%;
        }
        .card > table tr {
          padding: 10px 0;
          border-bottom: 1px solid var(--line);
        }
        .card > table tr:last-child {
          border-bottom: 0;
        }
        .card > table td {
          border: 0;
          padding: 2px 0;
          text-align: left !important;
          white-space: normal !important;
        }
        .card > table td:last-child {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          padding-top: 8px;
        }
      }
      /* ===== Ende Handy-Layout ===== */
      /* ===== Design 11/2026: Optik wie Startseite (Kacheln, Goldlinie), Handy-Feinschliff ===== */
      html {
        overscroll-behavior-y: none;
        -webkit-text-size-adjust: 100%;
      }
      header {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      main,
      #stepwrap {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      .bar {
        padding-left: max(14px, env(safe-area-inset-left));
        padding-right: max(14px, env(safe-area-inset-right));
      }
      header .tt h1 {
        font-size: 17px;
        letter-spacing: -0.01em;
      }
      header .tt span {
        font-size: 12.5px;
        opacity: 0.8;
      }
      button,
      a,
      [role='button'],
      label,
      .ib {
        touch-action: manipulation;
      }
      .btn,
      .ib,
      .steps button {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      input,
      select,
      textarea {
        font-size: 16px;
      }
      .btn:focus-visible,
      .ib:focus-visible,
      .steps button:focus-visible,
      a.jump:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .sect {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sect .n {
        background: var(--gold-soft);
        color: var(--gold-text);
        border-radius: 99px;
        padding: 1px 8px;
        font-size: 11.5px;
        letter-spacing: 0;
      }
      .emptybox {
        border: 1px dashed var(--line);
        border-radius: 16px;
        padding: 18px 14px;
        text-align: center;
        color: var(--muted);
        margin: 8px 0;
        overflow-wrap: anywhere;
      }
      h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        font-weight: 700;
        margin: 24px 2px 10px;
      }
      h2 .n {
        background: var(--gold-soft);
        color: var(--gold-text);
        border-radius: 99px;
        padding: 1px 8px;
        font-size: 11.5px;
      }
      .pcard {
        margin: 0 0 10px;
      }
      .phead {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px 14px;
        flex-wrap: wrap;
      }
      .ptxt {
        min-width: 0;
        flex: 1 1 220px;
        overflow-wrap: anywhere;
      }
      .pbadges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .pcard .btn.small {
        min-height: 44px;
      }
      /* Formular */
      .pagetitle {
        overflow-wrap: anywhere;
        letter-spacing: -0.01em;
      }
      .field label {
        overflow-wrap: anywhere;
      }
      .inunit input {
        min-width: 0;
      }
      @media (max-width: 480px) {
        .seg .btn {
          min-width: 0;
        }
        .bar .btn {
          font-size: 14.5px;
          padding-left: 8px;
          padding-right: 8px;
        }
      }
      /* ===== Ende Design 11/2026 ===== */
      /* Bericht */
      /* Schrift des Ausdrucks – lokal, damit das PDF auch offline gleich aussieht (SIL Open Font License) */
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(shared/lib/fonts/plus-jakarta-sans-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF,
          U+FFFD;
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(shared/lib/fonts/plus-jakarta-sans-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF,
          U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }
      .sheetwrap {
        background: var(--sheet);
        border-radius: 12px;
        padding: 16px 0 1px;
        overflow: hidden;
      }
      @media print {
        header,
        .noprint,
        #toast,
        .bar,
        #stepwrap {
          display: none !important;
        }
        html,
        body {
          background: #fff;
        }
        main {
          max-width: none;
          padding: 0 !important;
        }
        .stage {
          overflow: visible;
        }
        .sheetwrap {
          background: none;
          padding: 0;
          border-radius: 0;
        }
        .report {
          zoom: 1 !important;
        }
        .report .page {
          box-shadow: none;
          margin: 0;
          break-after: page;
        }
        @page {
          size: A4;
          margin: 0;
        }
      }
    </style>
    <link rel="stylesheet" href="shared/ios.css" />
  </head>
  <body>
    <header>
      <div class="logo">R</div>
      <div class="tt" id="ttl" data-act="home">
        <h1>Service RLT/KWL</h1>
        <span id="hsub">Wartungsprotokolle</span>
      </div>
      <span id="net" class="net"></span>
      <button
        type="button"
        class="ib themebtn"
        id="themebtn"
        aria-label="Darstellung wechseln"
      ></button>
      <button type="button" class="ib" id="btnset" data-act="settings" aria-label="Einstellungen">
        <span class="ag-icon ag-icon--sm" aria-hidden="true">settings</span>
      </button>
    </header>
    <div id="stepwrap" hidden></div>
    <div class="stage"><main id="app"></main></div>
    <div class="bar" id="bar" hidden></div>
    <div id="toast"></div>

    <script src="shared/core.js"></script>
    <script src="shared/pdf-bausteine.js"></script>
    <script src="shared/pdf.js"></script>
    <script src="shared/sync.js"></script>
    <script src="shared/settings.js"></script>
    <script src="shared/wizard.js"></script>
    <script src="shared/ios.js"></script>
    <script>
      'use strict';

      /* =====================================================================
   Feld-Definition – entspricht dem Blatt "Datenbank" in "Datenbank_RLT-KWL-Service".
   col = exakter Spaltenname im Google Sheet.
   group = Zwischenüberschrift in der App, show = nur anzeigen, wenn …
   table = Darstellung als Tabelle im PDF
   Die leeren Spalten "Bereich: …" im Sheet sind nur Trenner und werden nicht abgefragt.
   ===================================================================== */
      const OK3 = ['i.O.', 'n.i.O.', 'entfällt'];
      const MANGEL_SUFFIX = ' – Mangel';
      const BEWERTUNG = ['i.O.', 'n.i.O.'];
      const BEWERTUNG_KLASSEN = ['ok', 'bad'];
      const BEWERTUNG_ALT = new Map([
        ['Ja', 'ok'],
        ['Nein', 'bad'],
        ['Mangel', 'bad'],
      ]);
      function bewertungArt(x) {
        if (x === 'i.O.') {
          return 'ok';
        }
        if (x === 'n.i.O.') {
          return 'bad';
        }
        return BEWERTUNG_ALT.has(x) ? BEWERTUNG_ALT.get(x) : 'none';
      }
      function altwertHint(x) {
        if (!x || BEWERTUNG.includes(x) || bewertungArt(x) === 'none') {
          return '';
        }
        return `<div class="fhint">Altwert: ${esc(x)}</div>`;
      }
      const ok = (id, col, label, pdf, hint, extra) =>
        Object.assign({ id, col, label, pdf, hint, type: 'okfail' }, extra || {});
      const ANLAGENTYP = [
        'RLT mit WRG',
        'RLT ohne WRG',
        'KWL mit WRG',
        'KWL ohne WRG',
        'Teilklimaanlage',
        'Vollklimaanlage',
      ];
      const WRG_TYP = ['Rotations-WT', 'Kreuzstrom-WT', 'Platten-WT', 'KV-System', 'entfällt'];
      const FILTER = [
        'ePM1 70% (F7)',
        'ePM1 50% (F7)',
        'ePM2,5 50% (M6)',
        'ePM10 50% (M5)',
        'Coarse 70% (G4)',
        'Coarse 90% (G4)',
      ];
      const wrgShow = (v) => v.wrgTyp !== 'entfällt';
      const hwShow = (v) => v.hwChk !== 'Nein';
      const glyShow = (v) => v.glyChk !== 'Nein';
      const temp = (id, col, label, hint) => ({
        id,
        col,
        label,
        pdf: label,
        hint,
        group: 'Temperaturen',
        type: 'number',
        unit: '°C',
        min: -50,
        max: 80,
      });
      // Temperaturverhältnis Zuluftseite: η = (Zuluft − Außenluft) / (Abluft − Außenluft)
      const eta = (v) =>
        isN(v.tAu) && isN(v.tZu) && isN(v.tAb) && num(v.tAb) !== num(v.tAu)
          ? round(((num(v.tZu) - num(v.tAu)) / (num(v.tAb) - num(v.tAu))) * 100, 0)
          : '';
      const HINWEIS =
        'Die regelmäßige Wartung der Lüftungsanlage ist aus hygienischen sowie energetischen Gründen erforderlich (VDMA 24186-1). ' +
        'Eine fachgerechte und fristgerechte Durchführung sichert Betriebssicherheit, hohe Luftqualität und einen effizienten Energieverbrauch. ' +
        'Empfohlene Intervalle: Filterprüfung / Filterwechsel halbjährlich, Gesamtwartung nach VDMA-Checkliste jährlich.';

      const TEMPLATE = {
        id: 'rlt-kwl',
        title: 'WARTUNGSPROTOKOLL • KWL & RLT',
        pages: [
          {
            title: 'Stammdaten & Auftrag',
            short: 'Stammdaten',
            header: true,
            fields: [
              {
                id: 'projekt',
                col: 'Projekt-Nr.',
                label: 'Projekt-Nr.',
                type: 'text',
                hint: 'Vorschlag kann überschrieben werden – wird auch der PDF-Dateiname',
                init: () =>
                  'KWL-' + today().replace(/-/g, '') + '-' + uid().slice(0, 4).toUpperCase(),
              },
              {
                id: 'kunde',
                col: 'Kunden-Nr.',
                label: 'Kunden-Nr.',
                type: 'text',
                ph: 'z. B. KD-98101',
              },
              {
                id: 'datum',
                col: 'Datum',
                label: 'Datum',
                type: 'date',
                notFuture: true,
                init: () => today(),
              },
              {
                id: 'monteur',
                col: 'Monteur',
                label: 'Monteur',
                pdf: 'Monteur / Prüfer',
                type: 'text',
                init: () => settings.techniker,
              },
              {
                id: 'standort',
                col: 'Standort / Zusatzangaben',
                label: 'Standort / Zusatzangaben',
                type: 'longtext',
                wide: true,
                hint: 'Aufstellort, Zugang, Hinweise …',
                ph: 'z. B. Technikzentrale OG 1',
              },
            ],
          },
          {
            title: 'Anlagendaten',
            pdfTitle: 'Anlagendaten (Lüftungs- & Klimaanlage)',
            short: 'Anlage',
            fields: [
              {
                id: 'anlage',
                col: 'Anlagenbezeichnung',
                label: 'Anlagenbezeichnung',
                type: 'text',
                ph: 'z. B. Lüftungsanlage RLT-01 Büro',
              },
              {
                id: 'herst',
                col: 'Hersteller',
                label: 'Hersteller',
                type: 'text',
                ph: 'z. B. Systemair',
              },
              {
                id: 'modell',
                col: 'Modell',
                label: 'Modell',
                type: 'text',
                ph: 'z. B. Topvex FR06',
              },
              { id: 'sn', col: 'Seriennummer', label: 'Seriennummer', type: 'text' },
              { id: 'baujahr', col: 'Baujahr', label: 'Baujahr', type: 'text', ph: 'z. B. 2023' },
              {
                id: 'typ',
                col: 'Anlagentyp',
                label: 'Anlagentyp',
                type: 'select',
                opts: ANLAGENTYP,
                other: true,
              },
              {
                id: 'wart',
                col: 'Wartungsart / Hinweise',
                label: 'Wartungsart / Hinweise',
                type: 'longtext',
                wide: true,
                ph: 'z. B. Jährliche Hauptwartung nach VDMA 24186-1',
              },
            ],
          },
          {
            title: 'Luftfördereinrichtung',
            pdfTitle: 'Luftfördereinrichtung / Ventilator (VDMA 24186-1)',
            short: 'Ventilator',
            kind: 'check',
            fields: [
              ok(
                'lfeVer',
                'LFE: Verschmutzung & Befestigung',
                'Verschmutzung, Beschädigung & Befestigung',
                'Verschmutzung, Beschädigung & Befestigung',
                '',
              ),
              ok(
                'lfeRein',
                'LFE: Reinigung',
                'Funktionserhaltendes Reinigen',
                'Funktionserhaltendes Reinigen',
                '',
              ),
              ok(
                'lfeLauf',
                'LFE: Laufrad & Drehrichtung',
                'Laufrad: Unwucht & Drehrichtung',
                'Laufrad: Unwucht & Drehrichtung',
                '',
              ),
              ok(
                'lfeSchau',

      {

        TEMPLATE.pages.forEach((pg) =>

          };
          if (f.group) {
            mangel.group = f.group;
          }
          return [f, mangel];
        });
      });
      const ALL_FIELDS = TEMPLATE.pages.flatMap((pg) => pg.fields);
      const FIELD = Object.fromEntries(ALL_FIELDS.map((f) => [f.id, f]));

      /* ---------- Speicher ---------- */
      /* LS steht in shared/core.js */
      LS.fullMsg += ' Übertragene Protokolle löschen.';
      const SETTINGS_FIELDS = [
        {
          id: 's_tech',

          label: 'Monteur (Vorbelegung)',

      let settings = Object.assign(
        { url: '', token: '', firma: '', techniker: '' },
