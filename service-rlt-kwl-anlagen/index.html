<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<script>(function(){try{var t=localStorage.getItem('muther-theme');var r=document.documentElement;if(t==='hell')r.setAttribute('data-theme','light');else if(t==='dunkel')r.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Service RLT- &amp; KWL-Anlagen</title>
<script src="lib/html2canvas.min.js" defer></script>
<script src="lib/jspdf.umd.min.js" defer></script>
<style>
/* Farben nach muther-heizung-sanitaer.de: Anthrazit (--pri) für Kopf und Auswahl, Gold (--gold) als Akzent.
   Gold nie als Schriftfarbe auf Hell (zu wenig Kontrast) – nur Flächen/Linien, darauf dunkle Schrift. */
:root{--t-fast:150ms;--t-med:260ms;--t-exit:180ms;--out:cubic-bezier(.2,.8,.2,1);--in:cubic-bezier(.4,0,1,1);--flash:rgba(220,204,75,.5);--gold-dark:#c4b53e;--gold-text:#8b7a1b;--hbg:#fff8d6;--hfg:#4a3f00;--ebd:#f1b5b5;--efg:#7a1414;--bg:#f8f7f4;--card:#fff;--ink:#1a1a1a;--muted:#706F6F;--line:#e4e1d8;--pri:#1a1a1a;--pri2:#c4b53e;--gold:#DCCC4B;--gold-soft:#faf6dc;
  --ok:#1e7a46;--bad:#b42318;--na:#8a8989;--warn:#8a5a00;--ctl:#fff;--bdg:#eceae3;--okbg:#e6f4ec;--okbd:#b6dcc4;--okfg:#14532d;--ebg:#fdecea;--wbg:#fdf3d6;--wbd:#e6d98a;--wfg:#4a3d00;--calc:#eef2f7;--sheet:#e9e7e1;--k1:#f4f3ef;--fwbd:#ecd28a;--fwfg:#5a3d00}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark;--bg:#121212;--card:#1e1e1e;--ink:#f0eee6;--muted:#a8a69d;--line:#3a3731;--pri:#0a0a0a;--gold-soft:#3a3516;--ok:#4cc27f;--bad:#ef7070;--na:#9a9a9a;--warn:#f0a53a;--ctl:#2a2a2a;--bdg:#33312d;--okbg:#16301f;--okbd:#2c6b43;--okfg:#b8e8c9;--ebg:#3a1818;--wbg:#3a3010;--wbd:#7a6a20;--wfg:#f3e6a0;--calc:#2b3340;--sheet:#0e0e0e;--k1:#262626;--fwbd:#7a6a20;--fwfg:#f3e6a0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#121212;--card:#1e1e1e;--ink:#f0eee6;--muted:#a8a69d;--line:#3a3731;--pri:#0a0a0a;--gold-soft:#3a3516;--ok:#4cc27f;--bad:#ef7070;--na:#9a9a9a;--warn:#f0a53a;--ctl:#2a2a2a;--bdg:#33312d;--okbg:#16301f;--okbd:#2c6b43;--okfg:#b8e8c9;--ebg:#3a1818;--wbg:#3a3010;--wbd:#7a6a20;--wfg:#f3e6a0;--calc:#2b3340;--sheet:#0e0e0e;--k1:#262626;--fwbd:#7a6a20;--fwfg:#f3e6a0}}
:root[data-theme=dark] .opts .btn.sel,:root[data-theme=dark] .seg .btn.sel.neutral{border-color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .opts .btn.sel,:root:not([data-theme=light]) .seg .btn.sel.neutral{border-color:var(--gold)}}
:root[data-theme=dark]{--flash:rgba(220,204,75,.32);--gold-text:#DCCC4B;--hbg:#3a3516;--hfg:#f3e9a8;--ebd:#7a2c2c;--efg:#ffc4c4}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--flash:rgba(220,204,75,.32);--gold-text:#DCCC4B;--hbg:#3a3516;--hfg:#f3e9a8;--ebd:#7a2c2c;--efg:#ffc4c4}}
.themebtn{font-size:18px;line-height:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;border-bottom:3px solid var(--gold);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--gold);color:#1a1a1a;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
header .tt{flex:1;min-width:0;line-height:1.2;cursor:pointer}header .tt h1{display:block;font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header .tt span{display:block;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{appearance:none;-webkit-appearance:none;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.12);border:0;display:grid;place-items:center;color:#fff;flex:none;padding:0;cursor:pointer;font:inherit}
.ib{transition:transform var(--t-fast) var(--out),background var(--t-fast)}.ib:active{transform:scale(.94);background:rgba(255,255,255,.22)}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.net{display:inline-flex;align-items:center;font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap;flex:none}
.net .nd{width:8px;height:8px;border-radius:50%;background:#4cc27f;margin-right:5px;flex:none}
.net.off{background:var(--bad)}.net.off .nd{background:#fff}
/* Seitenübergang: seitlich verschobene Seite darf keinen waagerechten Bildlauf erzeugen */
.stage{overflow-x:hidden;overflow-x:clip}
main{max-width:940px;margin:0 auto;padding:10px 16px calc(48px + env(safe-area-inset-bottom))}
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--ctl);color:var(--ink);border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn{position:relative;transition:transform var(--t-fast) var(--out),filter var(--t-fast)}
.btn:active{transform:scale(.97);filter:brightness(.96)}
.btn.primary{background:var(--gold);border-color:var(--pri2);color:#1a1a1a}
.btn.danger{color:var(--bad)}
.btn.small{min-height:38px;padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 6px}
label{display:block;font-size:15px;color:var(--ink);margin:0 0 6px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--ctl);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--bdg);color:var(--ink)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--ebg);color:var(--bad)}.badge.warn{background:var(--wbg);color:var(--warn)}
.muted{color:var(--muted)}
.warnbox{background:var(--gold-soft);border:1px solid var(--wbd);border-left:5px solid var(--gold);color:var(--wfg);padding:12px 14px;border-radius:12px;margin:12px 0}
.progress{height:8px;background:var(--bdg);border-radius:99px;overflow:hidden;margin:8px 0 10px}
.progress>div{height:100%;background:var(--gold);transition:width var(--t-med) var(--out)}
.info{display:flex;gap:8px;align-items:center;background:var(--hbg);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.3;color:var(--ink)}
.errbox{background:var(--ebg);border:1px solid var(--ebd);color:var(--efg);padding:12px 14px;border-radius:12px;margin:12px 0}
.okbox{background:var(--okbg);border:1px solid var(--okbd);color:var(--okfg);padding:12px 14px;border-radius:12px;margin:12px 0}
/* Schrittanzeige (Kopfbereich unter dem Header, bleibt beim Schrittwechsel stehen) */
#stepwrap{max-width:940px;margin:0 auto;padding:12px 16px 0}
#stepwrap[hidden]{display:none}
.steplab{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.steplab>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.steplab b{color:var(--ink)}
.steps{display:flex;gap:4px;margin:0 0 6px}
.steps>*{flex:1;min-width:0;text-align:center;font:inherit;font-size:13px;font-weight:600;padding:9px 0;min-height:38px;border-radius:10px;border:1px solid var(--line);color:var(--muted);background:var(--card);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;appearance:none;-webkit-appearance:none}
.steps button{transition:transform var(--t-fast) var(--out)}.steps button:active{transform:scale(.97)}
.steps .done{background:var(--okbg);border-color:var(--okbd);color:var(--ok)}
.steps .on{background:var(--pri);color:#fff;border-color:var(--pri)}
:root[data-theme=dark] .steps .on{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .steps .on{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}}
@media(max-width:700px){.steps .sl{display:none}}
.pagetitle{font-size:26px;font-weight:700;margin:2px 0 4px;line-height:1.2}
/* Felder */
.field{padding:14px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.ghead{font-size:15px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.05em;padding:18px 0 4px;border-bottom:2px solid var(--gold)}
.ghead:first-child{padding-top:2px}
.fhint{font-size:14px;color:var(--muted);margin:-3px 0 6px;font-weight:400}
.ferr{color:var(--bad);font-size:14px;font-weight:600;margin-top:6px}
.field.err input,.field.err textarea{border-color:var(--bad)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:14px}
.frow label{margin:0}
.seg{display:flex;gap:6px;flex-shrink:0}
.seg .btn{min-width:92px;min-height:52px}
.seg .btn.sel.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg .btn.sel.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.seg .btn.sel.na{background:var(--na);border-color:var(--na);color:#fff}
.seg .btn.sel.neutral{background:var(--pri);border-color:var(--pri);color:#fff}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.opts .btn{min-height:46px}
.opts .btn.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.inunit{display:flex;align-items:center;gap:10px}
.inunit input{max-width:260px;font-size:22px}
.inunit .unit{color:var(--muted);font-weight:600}
.soll{font-size:14px;margin-top:6px}
.calc{display:inline-block;padding:10px 14px;background:var(--calc);border-radius:10px;font-weight:700;min-width:120px}
.calcnote{font-size:13px;color:var(--muted);margin-left:8px}
@media(max-width:700px){.frow{flex-direction:column;align-items:stretch}.seg .btn{flex:1}}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sigwrap{border:2px dashed #c4ccd8;border-radius:12px;background:#fff;margin-bottom:8px}
canvas.sig{width:100%;height:170px;display:block;touch-action:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.err{color:var(--bad);font-weight:600;margin-top:10px;min-height:1.2em}
a.jump{color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--pri2);text-decoration-thickness:2px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--gold);outline-offset:0;border-color:var(--pri2)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(40px);opacity:0;background:var(--pri);color:#fff;padding:12px 18px;border-radius:12px;transition:opacity var(--t-med) var(--out),transform var(--t-med) var(--out);z-index:20;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Feste Leiste unten (Zurück / Weiter / Abschließen / PDF) */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.bar[hidden]{display:none}
.bar>div{max-width:940px;margin:0 auto;display:flex;gap:10px}
.bar .btn{flex:1;min-height:52px;border-radius:13px;font-weight:700;font-size:15px}
.bar .btn.primary{border-color:var(--gold-dark)}
body.hasbar main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
body.hasbar #toast{bottom:calc(90px + env(safe-area-inset-bottom))}
/* PDF-Knopf mit Fortschritt */
.bar .btn.pdfb{overflow:hidden}
.pdfb .fill{position:absolute;inset:0;background:rgba(0,0,0,.14);transform:scaleX(0);transform-origin:left;transition:transform 220ms linear;pointer-events:none}
.pdfb .l1,.pdfb .l2,.pdfb .lr{display:flex;align-items:center;gap:6px;position:relative;transition:opacity var(--t-fast),transform var(--t-fast) var(--out)}
.pdfb .l2,.pdfb .lr{position:absolute;opacity:0;transform:translateY(8px)}
.pdfb.run .l1,.pdfb.done .l1{opacity:0;transform:translateY(-8px)}
.pdfb.run .lr{opacity:1;transform:none}.pdfb.done .lr{opacity:0}
.pdfb.done .l2{opacity:1;transform:none}
.bar .btn.pdfb.done{background:#1e8e4e;border-color:#1e8e4e;color:#fff}
.pdfb.done .fill{opacity:0}
/* Wert wechselt: kurzes Aufleuchten */
.flash{animation:flash 900ms var(--out)}
@keyframes flash{from{background-color:var(--flash)}}
/* Seitenwechsel zwischen den Schritten */
.pg-out-fwd{animation:pgoutf var(--t-exit) var(--in) forwards}.pg-out-back{animation:pgoutb var(--t-exit) var(--in) forwards}
.pg-in-fwd{animation:pginf var(--t-med) var(--out) both}.pg-in-back{animation:pginb var(--t-med) var(--out) both}
@keyframes pgoutf{to{transform:translateX(-22%);opacity:0}}@keyframes pgoutb{to{transform:translateX(22%);opacity:0}}
@keyframes pginf{from{transform:translateX(100%);opacity:0}}@keyframes pginb{from{transform:translateX(-100%);opacity:0}}
/* Karten erscheinen gestaffelt (nur solange .entering am Container hängt) */
.entering .stag{opacity:0;transform:translateY(12px);animation:up var(--t-med) var(--out) forwards;animation-delay:calc(var(--i)*70ms + 120ms)}
@keyframes up{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.001ms!important;transition-delay:0ms!important;animation-duration:.001ms!important;animation-delay:0ms!important}.entering .stag{opacity:1;transform:none}}
/* ===== Handy-Layout ===== */
/* iPhone/iPad: Datumsfeld hat sonst eine feste Mindestbreite und ragt über den Rand */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;min-height:50px;height:50px;text-align:left;margin:0}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0;margin:0}
input[type=date]::-webkit-datetime-edit{padding:0;text-align:left}
/* Schmale Bildschirme (iPhone hochkant): Status kompakt, Tabellen als Karten */
@media(max-width:480px){
  .net:not(.off) .nt,.net:not(.off) .sep,.net .nl{display:none}
  .net:not(.off) .nd{margin-right:0}.net:not(.off) .np{margin-left:5px}
  .ib{width:40px;height:40px}header{gap:8px}header .tt h1{font-size:15px}
}
@media(max-width:600px){
  header{padding-left:12px;padding-right:12px}
  main,#stepwrap{padding-left:12px;padding-right:12px}
  .card{padding:12px 14px;border-radius:14px}
  .pagetitle{font-size:22px}
  .card>table thead{display:none}
  .card>table,.card>table tbody,.card>table tr,.card>table td{display:block;width:100%}
  .card>table tr{padding:10px 0;border-bottom:1px solid var(--line)}
  .card>table tr:last-child{border-bottom:0}
  .card>table td{border:0;padding:2px 0;text-align:left!important;white-space:normal!important}
  .card>table td:last-child{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px}
}
/* ===== Ende Handy-Layout ===== */
/* Bericht */
/* Schrift des Ausdrucks – lokal, damit das PDF auch offline gleich aussieht (SIL Open Font License) */
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400 700;font-display:swap;
  src:url(lib/fonts/plus-jakarta-sans-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400 700;font-display:swap;
  src:url(lib/fonts/plus-jakarta-sans-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
.sheetwrap{background:var(--sheet);border-radius:12px;padding:16px 0 1px;overflow:hidden}
/* ===== Bericht-CSS (identisch in google-apps-script/PdfDialog.html) ===== */
.report{--gold:#DCCC4B;--gold-soft:#faf6dc;--ink:#1a1a1a;--ink-2:#3a3a3a;--ink-3:#706F6F;--line:#dcd9cf;--line-soft:#eceae3;--zebra:#faf9f5;--head-bg:#f8f7f4;
  --ok:#1e7a46;--ok-bg:#e6f4ec;--bad:#b42318;--bad-bg:#fdecea;--warn:#8a5a00;--warn-bg:#fdf3d6;
  color:var(--ink);font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.report *{box-sizing:border-box}
.report .page{width:210mm;height:297mm;margin:0 auto 16px;background:#fff;box-shadow:0 2px 10px rgba(20,20,20,.15);padding:14mm 15mm 12mm;
  display:flex;flex-direction:column;font-size:8.3pt;line-height:1.4;text-align:left}
.report.flat .page{box-shadow:none;margin:0}
.report .page-body{flex:1;min-height:0;overflow:hidden}
.report .pfoot{display:flex;justify-content:space-between;gap:4mm;border-top:1px solid var(--line);padding-top:2.5mm;margin-top:4mm;font-size:7pt;color:var(--ink-3)}
.report .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8mm;padding-bottom:4mm;border-bottom:2.5px solid var(--gold)}
.report .firm b{display:block;font-size:10pt;color:var(--ink)}
.report .firm span{display:block;font-size:7.6pt;color:var(--ink-2)}
.report .doc{text-align:right;flex-shrink:0}
.report .doc .kicker{font-size:7pt;letter-spacing:.12em;color:var(--ink-3)}
.report .doc h1{margin:.5mm 0 1mm;font-size:17pt;line-height:1.1;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.report .doc .meta{font-size:7.8pt;color:var(--ink-2)}
.report .doc .meta b{color:var(--ink)}
.report .law{font-size:6.8pt;color:var(--ink-3);margin-top:2mm;line-height:1.35}
.report .head.small{padding-bottom:2.5mm}
.report .head.small .doc h1{font-size:11pt}
.report .status{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:3mm;margin:5mm 0 1mm}
.report .tile{border:1px solid var(--line);border-radius:2mm;padding:3mm 3.5mm}
.report .tile .lab{font-size:6.8pt;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.report .tile .val{font-size:14pt;font-weight:700;margin-top:.8mm;line-height:1.15}
.report .tile .sub{font-size:7.6pt;color:var(--ink-2);margin-top:1mm}
.report .tile.primary{border-color:var(--gold);border-left:1.2mm solid var(--gold);background:var(--gold-soft)}
.report .pill{display:inline-flex;align-items:center;gap:1.2mm;font-weight:600;font-size:7.6pt;padding:.5mm 2mm;border-radius:10mm;white-space:nowrap}
.report .pill svg{width:2.8mm;height:2.8mm;flex-shrink:0}

const $ = s => document.querySelector(s);

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); }
function today(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function fmtDate(s){ if(!s) return ''; const d = new Date(String(s).length === 10 ? s + 'T12:00:00' : s); return isNaN(d) ? String(s) : d.toLocaleDateString('de-DE'); }
function fmtDateTime(s){ if(!s) return ''; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleString('de-DE', {dateStyle:'short', timeStyle:'short'}); }
function num(v){ return typeof v === 'number' ? v : Number(String(v).trim().replace(',', '.')); }
function isN(v){ return v !== '' && v != null && !isNaN(num(v)); }
function round(n, d){ const f = Math.pow(10, d); return Math.round(n * f) / f; }
function fmtNum(n){ return String(n).replace('.', ','); }
function safeImg(src){ return typeof src === 'string' && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(src) ? src : ''; }
const isVis = (f, v) => !f.show || f.show(v);
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3500); }
/* Bewegung reduzieren (Systemeinstellung) und kurzes Aufleuchten eines geänderten Werts */
const RM = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function flash(el){ if(!el || RM()) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
let calcSeen = {};   // zuletzt angezeigte Rechenwerte -> Aufleuchten nur bei echter Änderung
function calcTouch(id, text, el){ const k = view.id + ':' + id; if(k in calcSeen && calcSeen[k] !== text) flash(el); calcSeen[k] = text; }

/* ---------- Werte, Prüfung, Bewertung ---------- */
function recompute(p){ ALL_FIELDS.forEach(f => { if(f.type === 'calc') p.values[f.id] = f.calc(p.values); }); }
function display(f, x){
  if(x === '' || x == null) return '';
  if(f.type === 'date') return fmtDate(x);
  if((f.type === 'number' || f.type === 'calc') && isN(x)) return fmtNum(String(x).trim()) + (f.unit ? ' ' + f.unit : '');
  return String(x);
}
function sollText(f){
  const u = f.unit ? ' ' + f.unit : '';
  if(f.sRanges) return 'Soll ' + f.sRanges.map(r => `${fmtNum(r[0])} – ${fmtNum(r[1])}`).join(' oder ') + u;
  if(f.sMin != null && f.sMax != null) return `Soll ${fmtNum(f.sMin)} – ${fmtNum(f.sMax)}${u}`;
  if(f.sMax != null) return `Soll ≤ ${fmtNum(f.sMax)}${u}`;
  if(f.sMin != null) return `Soll ≥ ${fmtNum(f.sMin)}${u}`;
  return '';
}
function evalField(f, v){
  const x = v[f.id];
  if(f.type === 'okfail') return x === 'i.O.' ? 'ok' : x === 'n.i.O.' ? 'bad' : x === 'entfällt' ? 'na' : 'none';
  if(f.bad && f.bad.includes(x)) return 'bad';
  if(f.good && f.good.includes(x)) return 'ok';
  if(f.type === 'number' && isN(x) && f.sRanges) return f.sRanges.some(r => num(x) >= r[0] && num(x) <= r[1]) ? 'ok' : 'warn';
  if(f.type === 'number' && isN(x) && (f.sMin != null || f.sMax != null)){
    const n = num(x);
    return (f.sMin != null && n < f.sMin) || (f.sMax != null && n > f.sMax) ? 'warn' : 'ok';
  }
  return 'none';
}
function defects(p){
  return ALL_FIELDS.filter(f => f.type !== 'calc' && isVis(f, p.values) && ['bad', 'warn'].includes(evalField(f, p.values)))
    .map(f => `${f.pdf || f.label}: ${display(f, p.values[f.id])}` + (evalField(f, p.values) === 'warn' ? ` (${sollText(f)})` : ''));
}
const PFLICHTFELDER = false;   // true = Pflichtfelder (req/reqIf) und Monteur-Unterschrift werden wieder erzwungen
function isRequired(f, p){ return PFLICHTFELDER && (!!f.req || (f.reqIf ? f.reqIf(p.values, p) : false)); }
function fieldError(f, p){
  if(f.type === 'calc' || !isVis(f, p.values)) return '';
  const x = p.values[f.id], empty = String(x ?? '').trim() === '';
  if(empty) return isRequired(f, p) ? (f.reqMsg || 'Pflichtfeld') : '';
  if(f.type === 'number'){
    if(!isN(x)) return 'Bitte eine gültige Zahl eingeben.';
    const n = num(x);
    if((f.min != null && n < f.min) || (f.max != null && n > f.max)) return `Unplausibler Wert (erlaubt ${fmtNum(f.min)} – ${fmtNum(f.max)} ${f.unit || ''})`;
  }
  if(f.type === 'date' && f.notFuture && x > today()) return 'Datum liegt in der Zukunft.';
  return '';
}
function pageErrors(p, i){ return TEMPLATE.pages[i].fields.map(f => [f, fieldError(f, p)]).filter(e => e[1]); }
function pageDone(p, i){
  const fs = TEMPLATE.pages[i].fields.filter(f => f.type !== 'calc' && isVis(f, p.values));
  return fs.every(f => !fieldError(f, p)) && fs.some(f => String(p.values[f.id] ?? '') !== '');
}

/* Bericht-Datenstruktur – identisch genutzt von App-PDF und Apps-Script-PDF */
function buildReport(p){
  const v = p.values;
  const row = f => ({label:f.pdf || f.label, value:display(f, v[f.id]), eval:evalField(f, v), wide:!!f.wide});
  const rowsOf = fs => fs.filter(f => isVis(f, v) && !(f.wide && !v[f.id])).map(row);
  const section = pg => {
    const inTab = new Set(pg.table ? pg.table.rows.flatMap(r => r.ids) : []);
    const rest = pg.fields.filter(f => !inTab.has(f.id));
    const body = pg.table ? pg.table.rows
      .filter(r => (!r.show || r.show(v)) && r.ids.some(id => String(v[id] ?? '') !== ''))
      .map(r => ({label:r.label, cells:r.ids.map(id => ({value:display(FIELD[id], v[id]), eval:evalField(FIELD[id], v)}))})) : [];
    return {title:pg.pdfTitle || pg.title, kind:pg.kind || 'grid',
      table: body.length ? {head:pg.table.head, body} : null,
      rows: rowsOf(rest.filter(f => f.type !== 'okfail')), checks: rowsOf(rest.filter(f => f.type === 'okfail'))};
  };
  return {
    title: TEMPLATE.title, firma: settings.firma || '',
    header: rowsOf(TEMPLATE.pages[0].fields),
    sections: TEMPLATE.pages.filter(pg => !pg.header && !pg.final).map(section),
    defects: defects(p), resultLabel: 'Wartung erfolgreich', success: v.erfolg || '',
    subline: [v.ftest && 'Funktionstest: ' + v.ftest, v.unterl && 'Unterlagen & Typenschild: ' + v.unterl].filter(Boolean).join(' · '),
    hinweis: HINWEIS, remark: v.bem || '', remarkLabel: 'Bemerkungen / Mängel',
    techniker: v.monteur || '', kundeName: p.kundeName || '', id: v.projekt || p.id, completedAt: p.completedAt || ''
  };
}
/* Spaltenwerte fürs Google Sheet (ausgeblendete Innengeräte werden geleert) */
function buildCols(p){
  return ALL_FIELDS.filter(f => f.col).map(f => {
    const x = isVis(f, p.values) ? p.values[f.id] : '';
    if(x === '' || x == null) return [f.col, '', ''];
    if(f.type === 'date') return [f.col, x, 'date'];
    if((f.type === 'number' || f.type === 'calc') && isN(x)) return [f.col, num(x), ''];
    return [f.col, String(x), ''];
  });
}

/* ---------- Navigation ---------- */
let view = {name:'home'};
let enterNext = false, enterT = null, navBusy = false, pdfBusy = null, pdfProg = 0, pdfTick = null, hsubAnim = null;

}
/* Schrittanzeige: bleibt beim Schrittwechsel im DOM stehen (Balken gleitet, Punkte wechseln nur die Klasse) */
function setSteps(){
  const w = $('#stepwrap'), p = view.name === 'wizard' ? cur() : null;
  if(!p){ w.hidden = true; w.dataset.pid = ''; return; }
  const pages = TEMPLATE.pages, n = pages.length, i = p.page, fresh = w.dataset.pid !== p.id;
  if(fresh){
    w.dataset.pid = p.id;
    w.innerHTML = `<div class="steplab"><span id="stlab"></span><button class="btn small" data-act="home">Pause</button></div>
      <div class="progress"><div id="stbar" style="width:0"></div></div>

  }

/* Schrittwechsel: alte Seite gleitet weg (0,18 s), Zustand ändern + neu zeichnen, neue Seite gleitet herein (0,26 s).
   Doppeltipp während des Übergangs wird ignoriert (navBusy). Transform/Animation-Klassen werden danach vollständig entfernt. */
function stepTo(dir, change){
  if(navBusy) return;
  const vid = view.id, after = () => { change(); render(); window.scrollTo(0, 0); };
  if(RM() || !app.animate){ after(); return; }
  navBusy = true;
  app.className = 'pg-out-' + dir;
  setTimeout(() => {
    let ok = false;
    try{
      if(view.name !== 'wizard' || view.id !== vid){ app.className = ''; return; }
      change(); render(); window.scrollTo(0, 0);
      const cls = 'pg-in-' + dir + ' entering';
      clearTimeout(enterT);
      app.className = cls;
      ok = true;
      setTimeout(() => { navBusy = false; }, 300);
      setTimeout(() => { if(app.className === cls) app.className = ''; }, 900);
    } finally {
      if(!ok){ navBusy = false; if(/pg-/.test(app.className)) app.className = ''; }   // Fehler oder Abbruch: App bleibt bedienbar
    }
  }, 180);
}

const RICON = {

function reportParts(r){

    smallHead:`<div class="head small"><div class="firm">${firm1}<span>${esc([kunde, anlage].filter(Boolean).join(' · '))}</span></div>
      <div class="doc"><h1>${esc(kicker ? nice(kicker) : h1)}</h1><div class="meta">Projekt-Nr. <b>${esc(r.id)}</b></div></div></div>`,

/* Verteilt die Blöcke auf A4-Seiten. host muss im Dokument hängen (Messung der Höhen). */
function layoutReport(r, host){
  const b = reportParts(r), pages = [];
  let body;
  const el = html => { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; };
  const newPage = () => {
    const pg = el(`<section class="page"><div class="page-body">${pages.length ? b.smallHead : b.head}</div><div class="pfoot"><span>${b.foot}</span><span class="pno"></span></div></section>`);
    host.appendChild(pg); pages.push(pg); body = pg.firstElementChild;
  };
  const fits = () => body.scrollHeight <= body.clientHeight + 1;
  host.innerHTML = '';
  newPage();
  b.blocks.forEach(blk => {
    const node = el(blk.html);
    body.appendChild(node);
    if(fits()) return;
    node.remove();
    if(!blk.split){ newPage(); body.appendChild(node); return; }
    // Tabelle zeilenweise verteilen; auf der Folgeseite Überschrift „(Fortsetzung)“ und Tabellenkopf wiederholen
    const rows = [...node.querySelectorAll('tbody > tr')];
    const shell = cont => { const s = node.cloneNode(true); s.querySelector('tbody').innerHTML = ''; if(cont) s.querySelector('.tt').textContent += ' (Fortsetzung)'; return s; };
    let part = shell(false), placed = 0;
    body.appendChild(part);
    rows.forEach(tr => {
      part.querySelector('tbody').appendChild(tr);
      if(fits()){ placed++; return; }
      tr.remove();
      if(!placed) part.remove();
      const cont = placed > 0;
      newPage(); part = shell(cont); body.appendChild(part);
      part.querySelector('tbody').appendChild(tr); placed = 1;
    });
  });
  pages.forEach((p, i) => { p.querySelector('.pno').innerHTML = `${b.id} · Seite ${i + 1} von ${pages.length}`; });
  return pages;
}
async function reportFontsReady(){

/* PDF: jede A4-Seite wird einzeln aufgenommen (Bild) und als eigene PDF-Seite eingefügt */
async function reportPdfBlob(r){
  await reportFontsReady();
  const box = document.createElement('div');
  box.className = 'report flat';
  box.style.cssText = 'position:fixed;left:-10000px;top:0;width:220mm;background:#fff';
  document.body.appendChild(box);
  try{
    const pages = layoutReport(r, box);
    await Promise.all([...box.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(res => { i.onload = i.onerror = res; })));
    const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
    for(let i = 0; i < pages.length; i++){
      const canvas = await html2canvas(pages[i], {scale:2, backgroundColor:'#ffffff', logging:false});
      if(i) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.88), 'JPEG', 0, 0, 210, 297);
    }
    return pdf.output('blob');
  } finally {
    box.remove();
  }
}

async function pdfBase64(p){

async function reportToPdf(src){
  const W = 760, scale = 2, mmW = 190, mmH = 277;   // A4 mit 10 mm Rand
  const box = document.createElement('div');
  box.style.cssText = `position:fixed;left:-10000px;top:0;width:${W}px;background:#fff`;
  const clone = src.cloneNode(true);
  clone.style.border = '0'; clone.style.padding = '0'; clone.style.borderRadius = '0';
  box.appendChild(clone); document.body.appendChild(box);
  try{
    await Promise.all([...clone.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(res => { i.onload = i.onerror = res; })));
    const canvas = await html2canvas(clone, {scale, backgroundColor:'#ffffff', windowWidth:W, logging:false});
    const top0 = clone.getBoundingClientRect().top;
    // Seitenumbrüche nur zwischen Zeilen/Abschnitten, nie direkt nach einer Abschnitts-Überschrift oder Tabellenkopf
    const breaks = [...clone.querySelectorAll('tr, .rsec, .box, .sigs, .rfoot')]
      .filter(e => !(e.tagName === 'TR' && !e.previousElementSibling && (e.parentElement.tagName === 'TBODY' || e.closest('table').previousElementSibling?.classList.contains('rsec'))))
      .map(e => e.getBoundingClientRect().top - top0).filter(y => y > 0).sort((a, b) => a - b);
    const H = canvas.height / scale, pagePx = mmH * W / mmW;
    const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
    let start = 0, first = true;
    while(start < H - 1){
      let end = start + pagePx;
      if(end < H){ const c = breaks.filter(y => y > start + 80 && y <= end); if(c.length) end = c[c.length - 1]; }
      else end = H;
      const sy = Math.round(start * scale), sh = Math.round((end - start) * scale);
      const part = document.createElement('canvas');
      part.width = canvas.width; part.height = sh;
      const ctx = part.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, part.width, sh);
      ctx.drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);
      if(!first) pdf.addPage();
      first = false;
      pdf.addImage(part.toDataURL('image/jpeg', 0.85), 'JPEG', 10, 10, mmW, (end - start) * mmW / W);
      start = end;
    }
    return pdf.output('blob');
  } finally {
    box.remove();
  }
}

function dbList(){

  const list = dbCache.list
    .filter(e => !q || [e.projekt, e.kunde, e.monteur, e.modell, e.datum, fmtDate(e.datum)].join(' ').toLowerCase().includes(q))
    .sort((a, b) => String(b.datum).localeCompare(String(a.datum)));
  if(!list.length) return `<p class="muted">${dbCache.list.length ? 'Keine Treffer.' : 'Keine Daten.'}</p>`;
  return `<div class="card"><table>
    <thead><tr><th>Datum</th><th>Protokoll / Kunde</th><th>Erfolgreich</th><th></th></tr></thead>
    <tbody>${list.map(e => `<tr>
      <td>${esc(fmtDate(e.datum))}</td>
      <td><b>${esc(e.projekt)}</b>${e.kunde ? ' · ' + esc(e.kunde) : ''}<br><span class="muted" style="font-size:14px">${esc([e.modell, e.monteur].filter(Boolean).join(' · '))}</span></td>
      <td>${e.erfolg ? `<span class="badge ${e.erfolg === 'Ja' ? 'ok' : 'bad'}">${esc(e.erfolg)}</span>` : ''}</td>
      <td style="text-align:right;white-space:nowrap">${e.pdfUrl
        ? `<a class="btn small primary" href="${esc(e.pdfUrl)}" target="_blank" rel="noopener">PDF</a>`
        : `<button class="btn small primary" data-act="dbreport" data-key="${esc(e.key)}">PDF</button>`}
        <button class="btn small" data-act="dbedit" data-key="${esc(e.key)}">Bearbeiten</button></td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- Unterschrift ---------- */
function initSig(canvas, p){
  const key = canvas.dataset.sig;
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ctx.fillStyle = '#0b1f3a';
  const src = safeImg(p.sig[key]);
  if(src){ const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height); img.src = src; }
  let drawing = false, last = null;
  const pt = e => { const b = canvas.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); drawing = true; last = pt(e); canvas.setPointerCapture(e.pointerId);
    ctx.beginPath(); ctx.arc(last[0], last[1], 1.1, 0, Math.PI * 2); ctx.fill();
  });
  canvas.addEventListener('pointermove', e => {
    if(!drawing) return;
    const q = pt(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); last = q;
  });
  const end = () => {
    if(!drawing) return; drawing = false;
    const out = document.createElement('canvas');
    out.width = Math.round(r.width); out.height = Math.round(r.height);
    out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
    p.sig[key] = out.toDataURL('image/png'); save();
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
}
const After = {
  wizard(){
    const p = cur();
    if(p && TEMPLATE.pages[p.page].final) document.querySelectorAll('canvas.sig').forEach(c => initSig(c, p));
    document.querySelectorAll('.calc').forEach(el => calcTouch(el.id.replace('calc-', ''), el.textContent, el));
  }
};

/* ---------- Google-Sheet-Schnittstelle ---------- */
async function api(action, data){
  if(!settings.url) throw new Error('Keine Web-App-URL in den Einstellungen.');
  const res = await fetch(settings.url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   // "simple request" → kein CORS-Preflight
    body: JSON.stringify(Object.assign({token:settings.token, action}, data || {}))
  });
  let j;
  try{ j = await res.json(); }catch(e){ throw new Error('Unerwartete Antwort – ist die Web-App für „Jeder“ freigegeben?'); }
  if(!j.ok) throw new Error(j.error || 'Unbekannter Fehler');
  return j;
}
let syncing = false;
async function syncAll(silent){
  if(syncing) return;
  const list = protocols.filter(p => p.status === 'done' && !p.synced);
  if(!list.length){ if(!silent) toast('Alles ist bereits im Google Sheet.'); return; }
  if(!settings.url){ if(!silent) toast('Bitte zuerst die Web-App-URL in den Einstellungen eintragen.'); return; }
  if(!navigator.onLine){ if(!silent) toast('Offline – wird automatisch übertragen, sobald Internet da ist.'); return; }
  syncing = true;
  let okCount = 0, err = null;
  for(const p of list){
    try{
      recompute(p);
      await api('upsert', {
        protocol: {id:p.id, templateId:TEMPLATE.id, values:p.values, kundeName:p.kundeName || '', completedAt:p.completedAt, sourceKey:p.sourceKey || '',
                   summary:{report:buildReport(p)}, pdf:await pdfBase64(p)},
        cols: buildCols(p)
      });
      p.synced = true; p.syncedAt = new Date().toISOString(); save(); okCount++;
    }catch(e){ err = e; break; }
  }
  syncing = false;
  if(err) toast(`Übertragung fehlgeschlagen: ${err.message}`);
  else if(okCount) toast(`${okCount} Protokoll(e) ins Google Sheet übertragen.`);
  if(view.name === 'home' || view.name === 'report') render(); else updateNet();
}

/* Wert aus einer alten Sheet-Zeile in das Eingabeformat der App bringen */
function fromSheet(f, x){
  if(x == null) return '';
  if(typeof x === 'boolean') x = x ? 'Ja' : 'Nein';
  if(typeof x === 'number' && f.type !== 'calc') return fmtNum(x);   // Eingabefelder erwarten Text mit Komma
  x = String(x);
  if(f.type === 'date'){ const m = x.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); if(m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  if(f.type === 'okfail') return x === 'Ja' ? 'i.O.' : x === 'Nein' ? 'n.i.O.' : x;   // ältere Zeilen: Ja/Nein
  return x;
}

/* ---------- Aktionen ---------- */
const Actions = {
  home(){ go('home'); },
  settings(){ go('settings'); },
  db(){ go('db', {q:view.q}); },
  sync(){ syncAll(false); },

  new(){
    const values = {};
    ALL_FIELDS.forEach(f => { values[f.id] = f.init != null ? (typeof f.init === 'function' ? f.init() : f.init) : ''; });
    const p = {id:uid(), templateId:TEMPLATE.id, values, sig:{}, kundeName:'', page:0, status:'draft', createdAt:new Date().toISOString(), synced:false};
    recompute(p);
    protocols.unshift(p); save();
    go('wizard', {id:p.id});
  },
  resume(d){ go('wizard', {id:d.id}); },
  report(d){ go('report', {id:d.id}); },
  reopen(d){
    const p = protocols.find(x => x.id === d.id);
    if(!confirm('Protokoll wieder öffnen und bearbeiten? Nach erneutem Abschließen wird die Zeile im Sheet aktualisiert.')) return;
    p.status = 'draft'; p.synced = false; p.page = TEMPLATE.pages.length - 1; save();
    go('wizard', {id:p.id});
  },
  del(d){
    const p = protocols.find(x => x.id === d.id);
    const msg = p.synced ? 'Protokoll aus der App entfernen? (Es bleibt im Google Sheet erhalten.)'
      : p.status === 'done' ? 'ACHTUNG: Dieses Protokoll ist noch NICHT im Google Sheet. Wirklich endgültig löschen?' : 'Entwurf löschen?';
    if(!confirm(msg)) return;
    protocols = protocols.filter(x => x.id !== d.id); save(); render();
  },

  set(d){
    const p = cur();
    p.values[d.f] = p.values[d.f] === d.v && !isRequired(FIELD[d.f], p) ? '' : d.v;   // erneutes Tippen wählt wieder ab
    recompute(p); save(); render();
  },
  allok(){
    const p = cur();
    TEMPLATE.pages[p.page].fields.forEach(f => { if(f.type === 'okfail' && isVis(f, p.values) && !p.values[f.id]) p.values[f.id] = 'i.O.'; });
    save(); render();
  },
  next(){
    const p = cur();
    if(pageErrors(p, p.page).length){
      view.tried = true; render();
      $('#pageerr').textContent = 'Bitte die markierten Felder prüfen.'; toast('Bitte die markierten Felder prüfen.');
      const first = document.querySelector('.field.err'); if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    stepTo('fwd', () => { p.page++; save(); view.tried = false; });
  },
  prev(){ const p = cur(); if(p.page > 0) stepTo('back', () => { p.page--; save(); view.tried = false; }); },
  jump(d){
    const p = cur(), t = Number(d.i);
    if(t === p.page){ view.tried = true; render(); window.scrollTo(0, 0); return; }
    stepTo(t > p.page ? 'fwd' : 'back', () => { p.page = t; save(); view.tried = true; });
  },
  sigclear(d){ const p = cur(); delete p.sig[d.sig]; save(); render(); },
  finish(){
    const p = cur();
    recompute(p);
    const bad = TEMPLATE.pages.findIndex((pg, k) => pageErrors(p, k).length);
    if(bad >= 0){
      p.page = bad; save(); view.tried = true; render(); window.scrollTo(0, 0);
      toast(`Bitte „${TEMPLATE.pages[bad].title}“ prüfen.`);
      return;
    }
    if(PFLICHTFELDER && !p.sig.tech){ $('#pageerr').textContent = 'Bitte als Monteur unterschreiben.'; toast('Bitte als Monteur unterschreiben.'); return; }
    p.status = 'done'; p.completedAt = new Date().toISOString(); p.synced = false;
    save();
    go('report', {id:p.id});
    syncAll(true);
  },

  async makepdf(d, btn){
    if(!window.jspdf || !window.html2canvas){ toast('PDF-Modul nicht geladen – App einmal online neu starten.'); return; }
    if(btn && btn.classList.contains('done')) return;   // Doppelstart verhindern
    const r = reportForView();
    if(!r) return;
    const name = pdfName(r.id) + '.pdf', key = viewKey();
    if(pdfBusy){ toast(pdfBusy !== key ? 'Es wird gerade ein anderes PDF erstellt …' : 'PDF wird noch erstellt …'); return; }   // gleicher Bericht: Doppelstart still verhindern
    const cb = () => $('#bar .pdfb');   // immer der aktuell im DOM befindliche Knopf (die Leiste wird bei Neuzeichnen neu gebaut)
    const setP = v => { pdfProg = v; const f = viewKey() === key ? $('#bar .pdfb .fill') : null; if(f) f.style.transform = 'scaleX(' + v + ')'; };
    pdfBusy = key; setP(.05); { const b = cb(); if(b) b.classList.add('run'); }
    // Fortschritt ist geschätzt (der gemeinsame PDF-Code meldet keinen): nähert sich 92 %, springt bei Fertigstellung auf 100 %
    pdfTick = setInterval(() => setP(pdfProg + (.92 - pdfProg) * .07), 250);
    try{
      const blob = await reportPdfBlob(reportForView());
      clearInterval(pdfTick); setP(1);
      await new Promise(res => setTimeout(res, RM() ? 0 : 240));
      if(lastPdf) URL.revokeObjectURL(lastPdf.url);
      lastPdf = {key, file:new File([blob], name, {type:'application/pdf'}), url:URL.createObjectURL(blob)};
      pdfBusy = null;
      if(view.name === 'report' && viewKey() === key){
        const bar = $('#pdfbar'); if(bar) bar.innerHTML = pdfBarHtml();
        setBar();   // baut Leiste neu auf (mit Teilen-Knopf) -> neuen Knopf in den Fertig-Zustand setzen
        const nb = cb();
        if(nb){ nb.classList.remove('run'); nb.classList.add('done'); setTimeout(() => nb.classList.remove('done'), 2600); }
      }
      toast('PDF fertig – jetzt „Teilen“ antippen.');
    }catch(e){ toast('PDF konnte nicht erstellt werden: ' + e.message); }
    finally{
      clearInterval(pdfTick); pdfBusy = null; pdfProg = 0;
      const b = cb(); if(b && !b.classList.contains('done')){ b.classList.remove('run'); setP(0); }
    }
  },
  async sharepdf(){
    if(!lastPdf) return;
    const files = [lastPdf.file];
    if(navigator.canShare && navigator.canShare({files})){
      try{ await navigator.share({files, title:lastPdf.file.name}); }
      catch(e){ if(e.name !== 'AbortError') toast('Teilen fehlgeschlagen: ' + e.message); }
    } else {
      window.open(lastPdf.url, '_blank');
    }
  },
  print(){
    const r = reportForView();
    const old = document.title;
    document.title = pdfName(r.id);
    window.print();
    setTimeout(() => { document.title = old; }, 1500);
  },

  async dbload(){
    if(!navigator.onLine){ toast('Offline – zeige gespeicherten Stand.'); return; }
    try{
      toast('Lade Daten …');
      const j = await api('list');
      dbCache = {at:new Date().toISOString(), list:j.list};
      LS.set('rlt.db', dbCache);
      toast(`${j.list.length} Einträge geladen.`);
      render();
    }catch(e){ toast('Laden fehlgeschlagen: ' + e.message); }
  },
  async dbreport(d){
    if(!navigator.onLine){ toast('Zum Öffnen eines Protokolls aus dem Sheet wird Internet benötigt.'); return; }
    try{ toast('Lade Protokoll …'); const j = await api('get', {key:d.key}); go('report', {db:true, rep:j.report, key:d.key, q:view.q}); }
    catch(e){ toast('Laden fehlgeschlagen: ' + e.message); }
  },
  async dbedit(d){
    if(!navigator.onLine){ toast('Zum Laden aus dem Sheet wird Internet benötigt.'); return; }
    try{
      toast('Lade Protokoll …');
      const j = await api('load', {key:d.key});
      const local = j.appId && protocols.find(x => x.id === j.appId);
      if(local && local.status === 'done' && !local.synced && !confirm('In der App gibt es zu diesem Protokoll noch nicht übertragene Änderungen. Durch die Version aus dem Sheet ersetzen?')) return;
      if(local && local.status === 'draft' && !confirm('Dieses Protokoll ist hier schon als Entwurf geöffnet. Durch die Version aus dem Sheet ersetzen?')) return;
      const values = {};
      ALL_FIELDS.forEach(f => {
        const x = j.values ? j.values[f.id] : (f.col ? j.cols[f.col] : '');
        values[f.id] = j.values ? (x == null ? '' : x) : fromSheet(f, x);
      });
      const p = {id:j.appId || uid(), templateId:TEMPLATE.id, values, sig:{}, kundeName:j.kundeName || '', sourceKey:d.key,
                 page:0, status:'draft', createdAt:new Date().toISOString(), synced:false};
      recompute(p);
      protocols = protocols.filter(x => x.id !== p.id);
      protocols.unshift(p); save();
      toast('Geladen – nach dem Bearbeiten neu unterschreiben und abschließen.');
      go('wizard', {id:p.id});
    }catch(e){ toast('Laden fehlgeschlagen: ' + e.message); }
  },
  async drivepdf(){
    try{
      toast('PDF wird in Google Drive erstellt …');
      const blob = await reportPdfBlob(reportForView());
      const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
      const j = await api('savepdf', {key:view.key, pdf:b64});
      const e = dbCache.list.find(x => x.key === view.key); if(e){ e.pdfUrl = j.url; LS.set('rlt.db', dbCache); }
      toast('PDF in Google Drive gespeichert.');
      window.open(j.url, '_blank');
    }catch(e){ toast('Fehler: ' + e.message); }
  },

  savesettings(d){
    settings.url = $('#s_url').value.trim();
    settings.token = $('#s_token').value.trim();
    settings.firma = $('#s_firma').value.trim();
    settings.techniker = $('#s_tech').value.trim();
    LS.set('rlt.settings', settings);
    if(d !== 'silent') toast('Gespeichert.');
  },
  async ping(){
    Actions.savesettings('silent');
    try{ await api('ping'); toast('Verbindung zum Google Sheet funktioniert ✓'); syncAll(true); }
    catch(e){ toast('Verbindung fehlgeschlagen: ' + e.message); }
  },
  backup(){
    const data = JSON.stringify({app:'rlt-kwl', exportedAt:new Date().toISOString(), protocols}, null, 1);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    a.download = `rlt-kwl-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
  }
};

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const fn = Actions[b.dataset.act];
  if(fn){ e.preventDefault(); if(navBusy) return; fn(b.dataset, b); }   // während eines Seitenübergangs Tipps ignorieren
});
app.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.f && view.name === 'wizard'){
    const p = cur(), f = FIELD[el.dataset.f];
    p.values[f.id] = el.value;
    recompute(p); save();
    if(f.id === 'projekt' || f.id === 'kunde') setHeader(false);   // Kopf-Unterzeile mitführen (kein Neuzeichnen)
    if(el.dataset.other) document.querySelectorAll(`[data-act=set][data-f="${f.id}"]`).forEach(b => b.classList.toggle('sel', b.dataset.v === el.value));
    if(f.type === 'number') $('#soll-' + f.id).innerHTML = sollHtml(f, p.values);
    TEMPLATE.pages[p.page].fields.filter(c => c.type === 'calc').forEach(c => {
      const ce = $('#calc-' + c.id), ne = $('#note-' + c.id);
      if(ce){ const t = display(c, p.values[c.id]) || '—'; ce.textContent = t; calcTouch(c.id, t, ce); }
      if(ne && c.note) ne.textContent = c.note(p.values);
    });
  } else if(el.dataset.kname){
    cur().kundeName = el.value; save();
  } else if(el.id === 'dbsearch'){
    view.q = el.value; $('#dblist').innerHTML = dbList();
  }
});
app.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 's_import' && el.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!Array.isArray(d.protocols)) throw new Error('Keine gültige Backup-Datei');
        const byId = new Map(protocols.map(p => [p.id, p]));
        d.protocols.forEach(p => byId.set(p.id, p));
        protocols = [...byId.values()]; save();
        toast(`Backup importiert: ${d.protocols.length} Protokolle.`);
      }catch(err){ toast('Import fehlgeschlagen: ' + err.message); }
    };
    r.readAsText(el.files[0]);
  }
});
window.addEventListener('online', () => { updateNet(); syncAll(true); });
window.addEventListener('offline', updateNet);
let lastW = window.innerWidth;
window.addEventListener('resize', () => {   // Drehen des iPads: Unterschriftsfelder neu aufbauen
  if(window.innerWidth !== lastW && view.name === 'wizard' && cur() && TEMPLATE.pages[cur().page].final) render();
  lastW = window.innerWidth;
});

/* ---------- Start ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
render();
syncAll(true);
