    <script>
      (function () {
        try {
          var t = localStorage.getItem('muther-theme');
          var r = document.documentElement;
          if (t === 'hell') r.setAttribute('data-theme', 'light');
          else if (t === 'dunkel') r.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>

    <style>
      .btn[hidden] {
        display: none;
      }
      /* Felder */
      .ferr {
        color: var(--bad);
        font-size: 14px;
        font-weight: 600;
        margin-top: 6px;
      }
      .mangel {
        margin-top: 4px;
      }
      .field.err input,
      .field.err textarea {
        border-color: var(--bad);
      }
      .inunit input {
        max-width: 260px;
        font-size: 22px;
      }
      .inunit .unit {
        color: var(--muted);
        font-weight: 600;
      }
      .soll {
        font-size: 14px;
        margin-top: 6px;
      }
      .calc {
        display: inline-block;
        padding: 10px 14px;
        background: var(--gold-soft);
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: 10px;
        font-weight: 700;
        min-width: 120px;
      }
      .calcnote {
        font-size: 13px;
        color: var(--muted);
        margin-left: 8px;
      }
      @media (max-width: 700px) {
        .frow {
          flex-direction: column;
          align-items: stretch;
        }
        .seg .btn {
          flex: 1;
        }
      }
      /* Verdampfer-Karten (aufklappbar, Stil wie die Raumzeilen der Daikin-App) */
      .card.vcard {
        padding: 6px 14px;
        transition: padding-bottom var(--t-med) var(--out);
      }
      .card.vcard.open {
        padding-bottom: 14px;
      }
      .vh {
        appearance: none;
        -webkit-appearance: none;
        background: none;
        border: 0;
        color: inherit;
        font: inherit;
        text-align: left;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 56px;
        padding: 0;
        cursor: pointer;
      }
      .vh .n {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--gold);
        color: #1a1a1a;
        font-weight: 700;
        display: grid;
        place-items: center;
        flex: none;
        font-size: 14px;
      }
      .vh .m {
        flex: 1;
        min-width: 0;
      }
      .vh .m b {
        display: block;
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .vh .m > span {
        display: block;
        margin-top: 2px;
      }
      .vh .ico {
        color: var(--muted);
        transition: transform var(--t-med) var(--out);
      }
      .vcard.open .vh .ico {
        transform: rotate(180deg);
      }
      .vh:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 2px;
        border-radius: 10px;
      }
      .vbw {
        display: grid;
        grid-template-rows: 0fr;
        visibility: hidden;
        transition:
          grid-template-rows var(--t-med) var(--out),
          visibility 0s var(--t-med);
      }
      .vcard.open > .vbw {
        grid-template-rows: 1fr;
        visibility: visible;
        transition:
          grid-template-rows var(--t-med) var(--out),
          visibility 0s;
      }
      .vbw > .vbody {
        overflow: hidden;
        min-height: 0;
      }
      .vin {
        padding: 6px 4px 4px;
        opacity: 0;
        transform: translateY(-4px);
        transition:
          opacity var(--t-med) var(--out),
          transform var(--t-med) var(--out);
      }
      .vcard.open .vin {
        opacity: 1;
        transform: none;
      }
      .sigwrap {
        border: 2px dashed var(--line);
        border-radius: 12px;
        background: #fff;
        margin-bottom: 8px;
      }
      canvas.sig {
        width: 100%;
        height: 170px;
        display: block;
        touch-action: none;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
      }
      @media (max-width: 640px) {
        .grid2 {
          grid-template-columns: 1fr;
        }
      }
      .err {
        color: var(--bad);
        font-weight: 600;
        margin-top: 10px;
        min-height: 1.2em;
      }
      a.jump {
        color: var(--ink);
        font-weight: 600;
        cursor: pointer;
        text-decoration: underline;
        text-decoration-color: var(--pri2);
        text-decoration-thickness: 2px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 3px solid var(--gold);
        outline-offset: 0;
        border-color: var(--pri2);
      }
      /* Meldung: Kapsel oben, Aussehen und Bewegung in shared/ios.css */
      #toast {
        position: fixed;
        left: 50%;
        opacity: 0;
        max-width: 90vw;
        text-align: center;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
      /* Feste Leiste unten (Zurück / Weiter / Abschließen / PDF) */
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
      }
      .warnbox .btn {
        margin-top: 10px;
      }
      .bar .btn {
        flex: 1;
        min-height: 52px;
        font-weight: 700;
        font-size: 15px;
      }
      .bar .btn.primary {
        border-color: var(--gold-dark);
      }
      body.hasbar main {
        padding-bottom: calc(110px + env(safe-area-inset-bottom));
      }
      /* PDF-Knopf mit Fortschritt */
      .bar .btn.pdfb {
        overflow: hidden;
      }
      .pdfb .fill {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.14);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 220ms linear;
        pointer-events: none;
      }
      .pdfb .l1,
      .pdfb .l2,
      .pdfb .lr {
        display: flex;
        align-items: center;
        gap: 6px;
        position: relative;
        transition:
          opacity var(--t-fast),
          transform var(--t-fast) var(--out);
      }
      .pdfb .l2,
      .pdfb .lr {
        position: absolute;
        opacity: 0;
        transform: translateY(8px);
      }
      .pdfb.run .l1,
      .pdfb.done .l1 {
        opacity: 0;
        transform: translateY(-8px);
      }
      .pdfb.run .lr {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .lr {
        opacity: 0;
      }
      .pdfb.done .l2 {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .fill {
        opacity: 0;
      }
      /* Wert wechselt: kurzes Aufleuchten */
      .flash {
        animation: flash 900ms var(--out);
      }
      @keyframes flash {
        from {
          background-color: var(--flash);
        }
      }
      /* Seitenwechsel zwischen den Schritten (.pg-*): shared/ios.css */
      /* Karten erscheinen gestaffelt (nur solange .entering am Container hängt) */
      .entering .stag {
        opacity: 0;
        transform: translateY(12px);
        animation: up var(--t-med) var(--out) forwards;
        animation-delay: calc(var(--i) * 70ms + 120ms);
      }
      @keyframes up {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          transition-duration: 0.001ms !important;
          transition-delay: 0ms !important;
          animation-duration: 0.001ms !important;
          animation-delay: 0ms !important;
        }
        .entering .stag {
          opacity: 1;
          transform: none;
        }
      }
      /* ===== Handy-Layout ===== */
      /* iPhone/iPad: Datumsfeld hat sonst eine feste Mindestbreite und ragt über den Rand */
      input[type='date'] {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        min-height: 50px;
        height: 50px;
        text-align: left;
        margin: 0;

      input[type='date']::-webkit-date-and-time-value {

        min-width: 0;
        margin: 0;
      }
      input[type='date']::-webkit-datetime-edit {
        padding: 0;
        text-align: left;

      /* Schmale Bildschirme (iPhone hochkant): Status kompakt, Tabellen als Karten */
      @media (max-width: 480px) {
        .net:not(.off) .nt,
        .net:not(.off) .sep,

          height: 40px;
        }
        header {

        }

      @media (max-width: 600px) {
        header {
          padding-left: 12px;
          padding-right: 12px;
        }
        main,
        #stepwrap {
          padding-left: 12px;
          padding-right: 12px;
        }
        .card {
          padding: 12px 14px;
        }
        .pagetitle {

        }
        .card > table thead {

        }
        .card > table,
        .card > table tbody,
        .card > table tr,

        }

        }
        .card > table tr:last-child {

        }
        .card > table td {
          border: 0;
          padding: 2px 0;
          text-align: left !important;
          white-space: normal !important;
        }
        .card > table td:last-child {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          padding-top: 8px;
        }
      }
      /* ===== Ende Handy-Layout ===== */
      /* ===== Design-Feinschliff (Stil der Startseite, Handy) ===== */
      html {
        overscroll-behavior-y: none;
      }
      button,
      a,
      [role='button'],

      .btn,
      .ib,

      header {

        padding-right: max(16px, env(safe-area-inset-right));
      }
      main,
      #stepwrap {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      .bar {
        padding-left: max(14px, env(safe-area-inset-left));
        padding-right: max(14px, env(safe-area-inset-right));
      }
      @media (max-width: 600px) {
        header {
          padding-left: max(12px, env(safe-area-inset-left));
          padding-right: max(12px, env(safe-area-inset-right));
        }
        main,
        #stepwrap {
          padding-left: max(12px, env(safe-area-inset-left));
          padding-right: max(12px, env(safe-area-inset-right));

      }
      input,
      select,
      textarea {

      }
      .card .row.between > div:first-child {

        overflow-wrap: anywhere;

      .badge {

      }
      .vh:active .m {

      .sect {

      .sect .n {

      }
      .emptybox {
        border: 1px dashed var(--line);

      /* ===== Ende Design-Feinschliff ===== */
      /* Bericht */
      /* Schrift des Ausdrucks – lokal, damit das PDF auch offline gleich aussieht (SIL Open Font License) */
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;

        font-display: swap;
        src: url(shared/lib/fonts/plus-jakarta-sans-latin.woff2) format('woff2');

        font-weight: 400 800;

        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF,

    <script>
      'use strict';

      /* =====================================================================
   Feld-Definition – entspricht dem Blatt "Datenbank_Wartung_VDMA" in "Datenbank_Kältewartung-Service".
   col = exakter Spaltenname im Google Sheet.
   group = Zwischenüberschrift in der App, show = nur anzeigen, wenn …
   Checklisten: i.O. / n.i.O. / entfällt – wie die Auswahllisten im Sheet (alter Wert „Mangel“ wird beim Laden zu „n.i.O.“).
   ===================================================================== */
      const OK3 = ['i.O.', 'n.i.O.', 'entfällt'];
      const MANGEL_SUFFIX = ' – Mangel';
      const BEWERTUNG = ['i.O.', 'n.i.O.'];
      const BEWERTUNG_KLASSEN = ['ok', 'bad'];
      const BEWERTUNG_ALT = new Map([
        ['Ja', 'ok'],
        ['Nein', 'bad'],
        ['Mangel', 'bad'],
      ]);
      function bewertungArt(x) {
        if (x === 'i.O.') {
          return 'ok';
        }
        if (x === 'n.i.O.') {
          return 'bad';
        }
        return BEWERTUNG_ALT.has(x) ? BEWERTUNG_ALT.get(x) : 'none';
      }
      function altwertHint(x) {
        if (!x || BEWERTUNG.includes(x) || bewertungArt(x) === 'none') {
          return '';
        }
        return `<div class="fhint">Altwert: ${esc(x)}</div>`;
      }
      const ok = (id, col, label, pdf, hint, extra) =>
        Object.assign({ id, col, label, pdf, hint, type: 'okfail' }, extra || {});
      const druck = (id, col, label, pdf, hint) => ({
        id,
        col,
        label,
        pdf,
        hint,
        group: 'Messwerte',
        type: 'number',
        unit: 'bar',
        min: -1,
        max: 150,
      });
      const temp = (id, col, label, pdf, hint) => ({
        id,
        col,
        label,
        pdf,
        hint,
        group: 'Messwerte',
        type: 'number',
        unit: '°C',
        min: -80,
        max: 180,
      });
      const kelvin = (id, col, label, pdf, hint) => ({
        id,
        col,
        label,
        pdf,
        hint,
        group: 'Messwerte',
        type: 'number',
        unit: 'K',
        min: -30,
        max: 80,
      });
      const luft = (id, col, label, pdf) => ({
        id,
        col,
        label,
        pdf,
        group: 'Messwerte',
        type: 'number',
        unit: '°C',
        min: -30,
        max: 70,
      });
      // Altfeld (nicht mehr in der Eingabe): wird nur angezeigt/übertragen, wenn ein alter Wert vorhanden ist – nichts wird gelöscht
      const legacy = (f) => Object.assign({ legacy: true }, f);
      const medium = (id, col, pdf) => ({
        id,
        col,
        label: 'Mediumstemperatur Ein- / Austritt (°C)',
        pdf,
        group: 'Messwerte',
        type: 'text',
        ph: 'z. B. 22,4 / 34,6',
      });
      // GWP-Werte (AR4, wie in der F-Gase-Verordnung) für das CO₂-Äquivalent
      const GWP = {
        R32: 675,
        R410A: 2088,
        R407C: 1774,
        R404A: 3922,
        R134A: 1430,
        R449A: 1397,
        R448A: 1387,
        R452A: 2140,
        R454B: 466,
        R454C: 148,
        R513A: 631,
        R1234YF: 4,
        R1234ZE: 7,
        R290: 3,
        R600A: 3,
        R744: 1,
        R717: 0,
        R22: 1810,
      };
      const gwpOf = (km) =>
        GWP[
          String(km || '')
            .toUpperCase()
            .replace(/[\s\-()]/g, '')
        ];
      const HINWEIS =
        'Wartung nach VDMA-Einheitsblatt 24186-3 (Leistungsprogramm für die Wartung von kältetechnischen Geräten und Anlagen). ' +
        'Anlagen mit fluorierten Treibhausgasen ab 5 t CO₂-Äquivalent unterliegen der Pflicht zur regelmäßigen Dichtheitskontrolle nach Verordnung (EU) 2024/573. ' +
        'Eine regelmäßige Wartung sichert Betriebssicherheit, Hygiene und einen effizienten Energieverbrauch.';

      /* Verdampfer / Innengeräte: bis zu VA_MAX Geräte. Gerät 1 behält die bisherigen Feld-IDs (vaZust …) und Spaltennamen
   („Verdampfer Zustand & Sauberkeit“ …); Gerät n ≥ 2 heißt va2Zust … bzw. „Verdampfer 2 Zustand & Sauberkeit“ … */
      const VA_MAX = 15;
      const vaCount = (v) => {
        const n = parseInt(String((v && v.vaAnz) ?? '').trim(), 10);
        return n >= 1 && n <= VA_MAX ? n : 1;
      };
      function verdFields(n) {
        const id = (s) => 'va' + (n > 1 ? n : '') + s,

      {
        const G = {
          'Anlagenteile & Dokumentation': [
            ['Kältekreislauf', ['rohr', 'arm']],
            ['Messung & Dokumentation', ['mess', 'doku']],
          ],
