<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Service Klima">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#1a1a1a">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a">
<meta name="color-scheme" content="light dark">
<script>(function(){try{var t=localStorage.getItem('muther-theme');var r=document.documentElement;if(t==='hell')r.setAttribute('data-theme','light');else if(t==='dunkel')r.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/png" href="icon-180.png">
<title>Service Klimaanlagenwartung</title>
<script src="shared/lib/html2canvas.min.js" defer></script>
<script src="shared/lib/jspdf.umd.min.js" defer></script>
<link rel="stylesheet" href="shared/base.css">
<style>
.btn[hidden]{display:none}
/* Felder */
.ghead{font-size:15px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.05em;padding:18px 0 4px;border-bottom:2px solid var(--gold)}
.ghead:first-child{padding-top:2px}
.ferr{color:var(--bad);font-size:14px;font-weight:600;margin-top:6px}
.field.err input,.field.err textarea{border-color:var(--bad)}
.seg .btn.sel.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg .btn.sel.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.seg .btn.sel.na{background:var(--na);border-color:var(--na);color:#fff}
.seg .btn.sel.neutral{background:var(--pri);border-color:var(--pri);color:#fff}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.opts .btn{min-height:46px}
.opts .btn.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.inunit input{max-width:260px;font-size:22px}
.inunit .unit{color:var(--muted);font-weight:600}
.soll{font-size:14px;margin-top:6px}
.calc{display:inline-block;padding:10px 14px;background:var(--calc);border-radius:10px;font-weight:700;min-width:120px}
.calcnote{font-size:13px;color:var(--muted);margin-left:8px}
@media(max-width:700px){.frow{flex-direction:column;align-items:stretch}.seg .btn{flex:1}}
/* Verdampfer-Karten (aufklappbar, Stil wie die Raumzeilen der Daikin-App) */
.card.vcard{padding:6px 14px;transition:padding-bottom var(--t-med) var(--out)}.card.vcard.open{padding-bottom:14px}
.vh{appearance:none;-webkit-appearance:none;background:none;border:0;color:inherit;font:inherit;text-align:left;width:100%;display:flex;align-items:center;gap:10px;min-height:56px;padding:0;cursor:pointer}
.vh .n{width:30px;height:30px;border-radius:9px;background:var(--gold);color:#1a1a1a;font-weight:700;display:grid;place-items:center;flex:none;font-size:14px}
.vh .m{flex:1;min-width:0}.vh .m b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vh .m>span{display:block;margin-top:2px}
.vh .ico{color:var(--muted);transition:transform var(--t-med) var(--out)}.vcard.open .vh .ico{transform:rotate(180deg)}
.vh:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
.vbw{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows var(--t-med) var(--out),visibility 0s var(--t-med)}
.vcard.open>.vbw{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows var(--t-med) var(--out),visibility 0s}
.vbw>.vbody{overflow:hidden;min-height:0}
.vin{padding:6px 4px 4px;opacity:0;transform:translateY(-4px);transition:opacity var(--t-med) var(--out),transform var(--t-med) var(--out)}
.vcard.open .vin{opacity:1;transform:none}
.sigwrap{border:2px dashed #c4ccd8;border-radius:12px;background:#fff;margin-bottom:8px}
canvas.sig{width:100%;height:170px;display:block;touch-action:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.err{color:var(--bad);font-weight:600;margin-top:10px;min-height:1.2em}
a.jump{color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--pri2);text-decoration-thickness:2px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--gold);outline-offset:0;border-color:var(--pri2)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(40px);opacity:0;background:var(--pri);color:#fff;padding:12px 18px;border-radius:12px;transition:opacity var(--t-med) var(--out),transform var(--t-med) var(--out);z-index:20;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Feste Leiste unten (Zurück / Weiter / Abschließen / PDF) */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.bar>div{max-width:940px;margin:0 auto;display:flex;gap:10px}
.bar .btn{flex:1;min-height:52px;border-radius:13px;font-weight:700;font-size:15px}
.bar .btn.primary{border-color:var(--gold-dark)}
body.hasbar main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
body.hasbar #toast{bottom:calc(90px + env(safe-area-inset-bottom))}
/* PDF-Knopf mit Fortschritt */
.bar .btn.pdfb{overflow:hidden}
.pdfb .fill{position:absolute;inset:0;background:rgba(0,0,0,.14);transform:scaleX(0);transform-origin:left;transition:transform 220ms linear;pointer-events:none}
.pdfb .l1,.pdfb .l2,.pdfb .lr{display:flex;align-items:center;gap:6px;position:relative;transition:opacity var(--t-fast),transform var(--t-fast) var(--out)}
.pdfb .l2,.pdfb .lr{position:absolute;opacity:0;transform:translateY(8px)}
.pdfb.run .l1,.pdfb.done .l1{opacity:0;transform:translateY(-8px)}
.pdfb.run .lr{opacity:1;transform:none}.pdfb.done .lr{opacity:0}
.pdfb.done .l2{opacity:1;transform:none}
.bar .btn.pdfb.done{background:#1e8e4e;border-color:#1e8e4e;color:#fff}
.pdfb.done .fill{opacity:0}
/* Wert wechselt: kurzes Aufleuchten */
.flash{animation:flash 900ms var(--out)}
@keyframes flash{from{background-color:var(--flash)}}
/* Seitenwechsel zwischen den Schritten */
.pg-out-fwd{animation:pgoutf var(--t-exit) var(--in) forwards}.pg-out-back{animation:pgoutb var(--t-exit) var(--in) forwards}
.pg-in-fwd{animation:pginf var(--t-med) var(--out) both}.pg-in-back{animation:pginb var(--t-med) var(--out) both}
@keyframes pgoutf{to{transform:translateX(-22%);opacity:0}}@keyframes pgoutb{to{transform:translateX(22%);opacity:0}}
@keyframes pginf{from{transform:translateX(100%);opacity:0}}@keyframes pginb{from{transform:translateX(-100%);opacity:0}}
/* Karten erscheinen gestaffelt (nur solange .entering am Container hängt) */
.entering .stag{opacity:0;transform:translateY(12px);animation:up var(--t-med) var(--out) forwards;animation-delay:calc(var(--i)*70ms + 120ms)}
@keyframes up{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.001ms!important;transition-delay:0ms!important;animation-duration:.001ms!important;animation-delay:0ms!important}.entering .stag{opacity:1;transform:none}}
/* ===== Handy-Layout ===== */
/* iPhone/iPad: Datumsfeld hat sonst eine feste Mindestbreite und ragt über den Rand */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;min-height:50px;height:50px;text-align:left;margin:0}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0;margin:0}
input[type=date]::-webkit-datetime-edit{padding:0;text-align:left}
/* Schmale Bildschirme (iPhone hochkant): Status kompakt, Tabellen als Karten */
@media(max-width:480px){
  .net:not(.off) .nt,.net:not(.off) .sep,.net .nl{display:none}
  .net:not(.off) .nd{margin-right:0}.net:not(.off) .np{margin-left:5px}
  .ib{width:40px;height:40px}header{gap:8px}header .tt h1{font-size:15px}
}
@media(max-width:600px){
  header{padding-left:12px;padding-right:12px}
  main,#stepwrap{padding-left:12px;padding-right:12px}
  .card{padding:12px 14px;border-radius:14px}
  .pagetitle{font-size:22px}
  .card>table thead{display:none}
  .card>table,.card>table tbody,.card>table tr,.card>table td{display:block;width:100%}
  .card>table tr{padding:10px 0;border-bottom:1px solid var(--line)}
  .card>table tr:last-child{border-bottom:0}
  .card>table td{border:0;padding:2px 0;text-align:left!important;white-space:normal!important}
  .card>table td:last-child{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px}
}
/* ===== Ende Handy-Layout ===== */
/* ===== Design-Feinschliff (Stil der Startseite, Handy) ===== */
html{overscroll-behavior-y:none}
button,a,[role=button],summary,.vh,label.btn{touch-action:manipulation}
.btn,.ib,.vh,.steps>*,.htile{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
header{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
main,#stepwrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.bar{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
@media(max-width:600px){
  header{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  main,#stepwrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
}
input,select,textarea{font-size:16px}
.card .row.between>div:first-child{min-width:0;overflow-wrap:anywhere}
.badge{white-space:normal}
/* Startseite: Kacheln wie in der Service-Apps-Übersicht */
.hometiles{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:4px}
.htile{appearance:none;-webkit-appearance:none;font:inherit;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:132px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--ink);cursor:pointer;position:relative;min-width:0;transition:transform 140ms var(--out),box-shadow 150ms,border-color 150ms}
.htile:active{transform:scale(.97)}
.htile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.htile .hi{width:46px;height:46px;border-radius:14px;background:var(--gold-soft);color:var(--gold-text);display:grid;place-items:center;flex:none}
.htile .hi .ico{width:24px;height:24px}
.htile strong{display:block;font-size:15px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.htile small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.3;overflow-wrap:anywhere}
.htile.main{grid-column:1/-1;flex-direction:row;align-items:center;min-height:84px;background:var(--gold);border-color:var(--pri2);color:#1a1a1a}
.htile.main .hi{background:rgba(26,26,26,.9);color:var(--gold)}
.htile.main small{color:#3a3a3a}
.htile.alert{border-color:var(--gold)}
.htile .cnt{position:absolute;top:10px;right:10px;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--gold);color:#1a1a1a;font-size:12.5px;font-weight:700;display:grid;place-items:center}
@media(hover:hover) and (pointer:fine){.htile:hover{border-color:var(--gold);box-shadow:0 6px 18px rgba(26,26,26,.10)}.htile.main:hover{filter:brightness(1.03)}.btn:hover{border-color:var(--pri2)}.vh:hover .ico{color:var(--ink)}}
@media(min-width:560px){.hometiles{grid-template-columns:repeat(3,minmax(0,1fr))}.htile.main{grid-column:1/-1}}
@media(max-width:559px){.htile:last-child{grid-column:1/-1;flex-direction:row;align-items:center;min-height:84px}}
@media(max-width:360px){.htile{padding:12px}.htile strong{font-size:14px}.hometiles{gap:10px}}
.vh:active .m{opacity:.7}
.sect{display:flex;align-items:center;gap:8px}
.sect .n{background:var(--gold-soft);color:var(--gold-text);border-radius:99px;padding:1px 8px;font-size:11.5px;letter-spacing:0}
.emptybox{border:1px dashed var(--line);border-radius:14px;padding:18px 14px;text-align:center;color:var(--muted);margin:8px 0;overflow-wrap:anywhere}
.entering .htile{opacity:0;transform:translateY(8px);animation:up 240ms var(--out) forwards;animation-delay:calc(var(--i,0)*40ms)}
/* ===== Ende Design-Feinschliff ===== */
/* Bericht */
/* Schrift des Ausdrucks – lokal, damit das PDF auch offline gleich aussieht (SIL Open Font License) */
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400 700;font-display:swap;
  src:url(shared/lib/fonts/plus-jakarta-sans-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400 700;font-display:swap;
  src:url(shared/lib/fonts/plus-jakarta-sans-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
.sheetwrap{background:var(--sheet);border-radius:12px;padding:16px 0 1px;overflow:hidden}
/* ===== Bericht-CSS (identisch in google-apps-script/PdfDialog.html) ===== */
.report{--gold:#DCCC4B;--gold-soft:#faf6dc;--ink:#1a1a1a;--ink-2:#3a3a3a;--ink-3:#706F6F;--line:#dcd9cf;--line-soft:#eceae3;--zebra:#faf9f5;--head-bg:#f8f7f4;
  --ok:#1e7a46;--ok-bg:#e6f4ec;--bad:#b42318;--bad-bg:#fdecea;--warn:#8a5a00;--warn-bg:#fdf3d6;
  color:var(--ink);font-family:Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.report *{box-sizing:border-box}
.report .page{width:210mm;height:297mm;margin:0 auto 16px;background:#fff;box-shadow:0 2px 10px rgba(20,20,20,.15);padding:14mm 15mm 12mm;
  display:flex;flex-direction:column;font-size:8.3pt;line-height:1.4;text-align:left}
.report.flat .page{box-shadow:none;margin:0}
.report .page-body{flex:1;min-height:0;overflow:hidden}
.report .pfoot{display:flex;justify-content:space-between;gap:4mm;border-top:1px solid var(--line);padding-top:2.5mm;margin-top:4mm;font-size:7pt;color:var(--ink-3)}
.report .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8mm;padding-bottom:4mm;border-bottom:2.5px solid var(--gold)}
.report .firm b{display:block;font-size:10pt;color:var(--ink)}
.report .firm span{display:block;font-size:7.6pt;color:var(--ink-2)}
.report .doc{text-align:right;flex-shrink:0}
.report .doc .kicker{font-size:7pt;letter-spacing:.12em;color:var(--ink-3)}
.report .doc h1{margin:.5mm 0 1mm;font-size:17pt;line-height:1.1;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.report .doc .meta{font-size:7.8pt;color:var(--ink-2)}
.report .doc .meta b{color:var(--ink)}
.report .law{font-size:6.8pt;color:var(--ink-3);margin-top:2mm;line-height:1.35}
.report .head.small{padding-bottom:2.5mm}
.report .head.small .doc h1{font-size:11pt}
.report .status{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:3mm;margin:5mm 0 1mm}
.report .tile{border:1px solid var(--line);border-radius:2mm;padding:3mm 3.5mm}
.report .tile .lab{font-size:6.8pt;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.report .tile .val{font-size:14pt;font-weight:700;margin-top:.8mm;line-height:1.15}
.report .tile .sub{font-size:7.6pt;color:var(--ink-2);margin-top:1mm}
.report .tile.primary{border-color:var(--gold);border-left:1.2mm solid var(--gold);background:var(--gold-soft)}
.report .pill{display:inline-flex;align-items:center;gap:1.2mm;font-weight:600;font-size:7.6pt;padding:.5mm 2mm;border-radius:10mm;white-space:nowrap}
.report .pill svg{width:2.8mm;height:2.8mm;flex-shrink:0}
.report .tile .pill{margin-left:-2mm;display:inline-block}
.report .tile .pill svg{display:inline-block;vertical-align:-.6mm;margin-right:1.2mm}
.report .pill.ok{color:var(--ok);background:var(--ok-bg)}.report .pill.bad{color:var(--bad);background:var(--bad-bg)}.report .pill.warn{color:var(--warn);background:var(--warn-bg)}
.report .sec{margin-top:4.5mm}
.report .sec h2{display:flex;align-items:baseline;gap:2.5mm;margin:0 0 2mm;font-size:9.6pt;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0;
  padding-bottom:1.2mm;border-bottom:1px solid var(--line)}
.report .sec h2 .no{display:inline-flex;align-items:center;justify-content:center;width:5mm;height:5mm;border-radius:1mm;background:var(--gold);color:var(--ink);font-size:7.4pt}
.report .sec h2 .ref{margin-left:auto;font-size:7pt;font-weight:500;color:var(--ink-3)}
.report .cols2{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.report .card{border:1px solid var(--line-soft);border-radius:1.5mm;padding:2.5mm 3mm;background:var(--zebra)}
.report .card h3{margin:0 0 1.5mm;font-size:7pt;letter-spacing:.09em;color:var(--ink-3)}
.report .addr{font-size:8.8pt;line-height:1.45}
.report .addr b{font-weight:600}
.report dl.kv{display:grid;grid-template-columns:repeat(4,1fr);margin:0;column-gap:4mm}
.report dl.kv div{padding:1.5mm 0;border-bottom:1px solid var(--line-soft);min-width:0}
.report dl.kv dt{font-size:6.8pt;color:var(--ink-3);letter-spacing:.06em}
.report dl.kv dd{margin:.3mm 0 0;font-size:8.8pt;font-weight:500;overflow-wrap:anywhere}
.report dl.kv dd.empty{color:#9a9999;font-weight:400}
.report .checks{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
.report .cgroup h4{margin:0 0 1mm;font-size:7pt;letter-spacing:.07em;color:var(--ink-2)}
.report .citem{display:flex;align-items:flex-start;gap:1.6mm;padding:.9mm 0;border-bottom:1px dotted var(--line)}
.report .citem svg{width:3.2mm;height:3.2mm;flex-shrink:0;margin-top:.3mm}
.report .citem .t{flex:1}
.report .citem .a{font-size:7.4pt;font-weight:600;color:var(--ink-2);text-align:right}
.report .signoff{display:flex;flex-wrap:wrap;gap:1mm 6mm;margin-top:2.5mm;font-size:7.8pt;color:var(--ink-2)}
.report .signoff b{color:var(--ink);font-weight:600}
.report table{width:100%;border-collapse:collapse;table-layout:fixed}
.report th{font-size:6.8pt;letter-spacing:.06em;color:var(--ink-2);text-align:left;font-weight:600;
  background:var(--head-bg);padding:1.6mm 2mm;border-bottom:1.5px solid var(--gold)}
.report td{padding:1.4mm 2mm;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:8.3pt;overflow-wrap:anywhere}
.report tbody tr:nth-child(even) td{background:var(--zebra)}
.report td.num,.report th.num{text-align:right}
.report td.date{white-space:nowrap;font-weight:600}
.report td .small{display:block;font-size:7pt;color:var(--ink-3)}
.report .none{font-size:7.8pt;color:var(--ink-3);font-style:italic;padding:.5mm 0}
.report .leak{margin-top:1.8mm;font-size:7.8pt;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:1mm 2mm}
.report .leak b{color:var(--ink)}
.report .note{border:1px solid var(--line);border-left:1mm solid var(--gold);border-radius:1mm;padding:2.5mm 3mm;margin-top:4.5mm;font-size:8.4pt}
.report .note b{display:block;font-size:7pt;letter-spacing:.08em;color:var(--ink-3);margin-bottom:.8mm}
.report .legal{margin-top:4mm;display:grid;grid-template-columns:1fr;gap:1.4mm;font-size:6.9pt;color:var(--ink-2);line-height:1.4}
.report .legal p{margin:0}
.report .legal b{color:var(--ink)}
.report .sign{display:grid;grid-template-columns:1fr 1fr;gap:12mm;margin-top:7mm}
.report .sign>div{display:flex;flex-direction:column}
.report .sign b{font-size:7pt;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.report .sign .space{display:block;height:30mm}
.report .sign .cap{border-top:1px solid var(--ink-2);padding-top:1.2mm;font-size:7pt;color:var(--ink-3)}
.report .tile.ok{border-color:var(--ok);border-left:1.2mm solid var(--ok);background:var(--ok-bg)}.report .tile.ok .val{color:var(--ok)}

<script>
'use strict';

/* =====================================================================
   Feld-Definition – entspricht dem Blatt "Datenbank_Wartung_VDMA" in "Datenbank_Kältewartung-Service".
   col = exakter Spaltenname im Google Sheet.
   group = Zwischenüberschrift in der App, show = nur anzeigen, wenn …
   Checklisten: i.O. / n.i.O. / entfällt – wie die Auswahllisten im Sheet (alter Wert „Mangel“ wird beim Laden zu „n.i.O.“).
   ===================================================================== */
const OK3 = ['i.O.', 'n.i.O.', 'entfällt'];
const ok = (id, col, label, pdf, hint, extra) => Object.assign({id, col, label, pdf, hint, type:'okfail'}, extra || {});
const druck = (id, col, label, pdf, hint) => ({id, col, label, pdf, hint, group:'Messwerte', type:'number', unit:'bar', min:-1, max:150});
const temp = (id, col, label, pdf, hint) => ({id, col, label, pdf, hint, group:'Messwerte', type:'number', unit:'°C', min:-80, max:180});
const kelvin = (id, col, label, pdf, hint) => ({id, col, label, pdf, hint, group:'Messwerte', type:'number', unit:'K', min:-30, max:80});
const luft = (id, col, label, pdf) => ({id, col, label, pdf, group:'Messwerte', type:'number', unit:'°C', min:-30, max:70});
// Altfeld (nicht mehr in der Eingabe): wird nur angezeigt/übertragen, wenn ein alter Wert vorhanden ist – nichts wird gelöscht
const legacy = f => Object.assign({legacy:true}, f);
const medium = (id, col, pdf) => ({id, col, label:'Mediumstemperatur Ein- / Austritt (°C)', pdf, group:'Messwerte', type:'text', ph:'z. B. 22,4 / 34,6'});
// GWP-Werte (AR4, wie in der F-Gase-Verordnung) für das CO₂-Äquivalent
const GWP = {R32:675, R410A:2088, R407C:1774, R404A:3922, R134A:1430, R449A:1397, R448A:1387, R452A:2140, R454B:466, R454C:148,
             R513A:631, R1234YF:4, R1234ZE:7, R290:3, R600A:3, R744:1, R717:0, R22:1810};
const gwpOf = km => GWP[String(km || '').toUpperCase().replace(/[\s\-()]/g, '')];
const HINWEIS = 'Wartung nach VDMA-Einheitsblatt 24186-3 (Leistungsprogramm für die Wartung von kältetechnischen Geräten und Anlagen). '
  + 'Anlagen mit fluorierten Treibhausgasen ab 5 t CO₂-Äquivalent unterliegen der Pflicht zur regelmäßigen Dichtheitskontrolle nach Verordnung (EU) 2024/573. '
  + 'Eine regelmäßige Wartung sichert Betriebssicherheit, Hygiene und einen effizienten Energieverbrauch.';

/* Verdampfer / Innengeräte: bis zu VA_MAX Geräte. Gerät 1 behält die bisherigen Feld-IDs (vaZust …) und Spaltennamen
   („Verdampfer Zustand & Sauberkeit“ …); Gerät n ≥ 2 heißt va2Zust … bzw. „Verdampfer 2 Zustand & Sauberkeit“ … */
const VA_MAX = 15;
const vaCount = v => { const n = parseInt(String((v && v.vaAnz) ?? '').trim(), 10); return n >= 1 && n <= VA_MAX ? n : 1; };
function verdFields(n){
  const id = s => 'va' + (n > 1 ? n : '') + s, col = s => 'Verdampfer ' + (n > 1 ? n + ' ' : '') + s;
  const dev = f => Object.assign({dev:n}, n > 1 ? {show:v => vaCount(v) >= n} : {}, f);
  const P = {group:'Prüfpunkte'};
  return [
    dev({id:id('Raum'), col:col('Raum'), label:'Raum / Bezeichnung', pdf:'Raum', type:'text', ph:'z. B. Büro', group:'Gerät', hdr:true, inTitle:true}),
    dev({id:id('Modell'), col:col('Modell'), label:'Modell', pdf:'Modell', type:'text', ph:'z. B. FTXM25R', group:'Gerät', hdr:true, inTitle:true}),
    dev({id:id('Sn'), col:col('Seriennummer'), label:'Seriennummer', pdf:'Seriennummer', type:'text', group:'Gerät', inTitle:true}),
    dev(ok(id('Zust'), col('Zustand & Sauberkeit'), 'Äußerlich auf Verschmutzung, Beschädigung und Korrosion geprüft', 'Zustand & Sauberkeit', '', P)),
    dev(ok(id('Rein'), col('Reinigung erfolgt'), 'Funktionserhaltendes Reinigen', 'Funktionserhaltendes Reinigen', '', P)),
    dev(ok(id('Vent'), col('Ventilator'), 'Ventilator auf Funktion geprüft', 'Ventilator', '', P)),
    dev(ok(id('Klap'), col('Klappenregelung'), 'Klappenregelung auf Funktion geprüft', 'Klappenregelung', 'Nicht vorhanden → „entfällt“', P)),
    dev(ok(id('KondF'), col('Kondensatablauf Funktion'), 'Kondensatablauf auf Funktion geprüft', 'Kondensatablauf Funktion', '', P)),
    dev(ok(id('KondR'), col('Kondensatablauf Reinigung'), 'Kondensatablauf gereinigt', 'Kondensatablauf gereinigt', '', P)),
    dev(ok(id('Filt'), col('Filter gereinigt / getauscht'), 'Filter gereinigt bzw. getauscht', 'Filter gereinigt / getauscht', '', P)),
    dev(ok(id('Dicht'), col('Dichtheit'), 'Kältemittelseitig auf Dichtheit geprüft', 'Dichtheit kältemittelseitig', '', P)),
    dev(ok(id('Hyg'), col('Hygienischer Zustand'), 'Hygienischer Zustand geprüft', 'Hygienischer Zustand', '', P)),
    dev(luft(id('Te'), col('Lufteintrittstemperatur (°C)'), 'Lufteintrittstemperatur', 'Lufteintrittstemperatur')),
    dev(luft(id('Ta'), col('Luftaustrittstemperatur (°C)'), 'Luftaustrittstemperatur', 'Luftaustrittstemperatur')),
    dev({id:id('Dt'), col:col('Luft-Spreizung (K)'), label:'Luft-Spreizung ΔT', pdf:'Luft-Spreizung ΔT', group:'Messwerte', type:'calc', unit:'K',
      calc:v => isN(v[id('Te')]) && isN(v[id('Ta')]) ? round(num(v[id('Te')]) - num(v[id('Ta')]), 1) : '',
      note:() => 'Eintritt − Austritt (Luft wird abgekühlt)'}),
    dev(legacy(druck(id('P'), col('Verdampfungsdruck (bar)'), 'Verdampfungsdruck', 'Verdampfungsdruck', ''))),
    dev(legacy(temp(id('T'), col('Verdampfungstemperatur (°C)'), 'Verdampfungstemperatur am Verdampferaustritt', 'Verdampfungstemperatur', ''))),
    dev(legacy(kelvin(id('Ueh'), col('Überhitzung (K)'), 'Überhitzung', 'Überhitzung', ''))),
    dev(legacy(medium(id('Med'), col('Mediumstemperatur Ein/Aus (°C)'), 'Mediumstemp. Ein / Aus (°C)'))),
    dev({id:id('Bem'), col:col('Bemerkung'), label:'Bemerkung zu diesem Gerät', pdf:'Bemerkung', type:'longtext', wide:true, group:'Bemerkung', ph:'Freitext'})
  ];
}

const TEMPLATE = {
  id: 'klima-wartung', title: 'WARTUNGSPROTOKOLL • KÄLTETECHNISCHE ANLAGEN',
  pages: [
    {title:'Anlagen- & Auftragsdaten', short:'Stammdaten', header:true, fields:[
      {id:'projekt', col:'Projektnummer', label:'Projektnummer', type:'text', hint:'Vorschlag kann überschrieben werden – wird auch der PDF-Dateiname',
        init:() => 'KLW-' + today().replace(/-/g, '') + '-' + uid().slice(0, 4).toUpperCase()},
      {id:'datum', col:'Datum', label:'Datum', type:'date', notFuture:true, init:() => today()},
      {id:'monteur', col:'Monteur', label:'Monteur', type:'text', init:() => settings.techniker},
      {id:'kunde', col:'Kunde / Betreiber', label:'Kunde / Betreiber', type:'text', ph:'z. B. Dr. med. Markus Weber'},
      {id:'anlage', col:'Anlagenbezeichnung', label:'Anlagenbezeichnung', type:'text', ph:'z. B. Split-Klimaanlage Praxis 2. OG'},
      {id:'herst', col:'Hersteller', label:'Hersteller', type:'text', ph:'z. B. Daikin'},
      {id:'sn', col:'Seriennummer (S/N)', label:'Seriennummer (S/N)', type:'text'},
      {id:'herstDat', col:'Herstellungsdatum', label:'Herstellungsdatum der Anlage', pdf:'Herstellungsdatum', type:'date', notFuture:true}
    ]},
    {title:'Verdichter', pdfTitle:'Verdrängungs- und Strömungsmaschinen • Verdichter', short:'Verdichter', kind:'check', fields:[
      ok('vdZust', 'Verdichter Zustand & Sauberkeit', 'Äußerlich auf Verschmutzung, Beschädigung und Korrosion geprüft', 'Zustand & Sauberkeit', '', {group:'Prüfpunkte'}),
      ok('vdRein', 'Verdichter Reinigung erfolgt', 'Funktionserhaltendes Reinigen', 'Funktionserhaltendes Reinigen', '', {group:'Prüfpunkte'}),
      ok('vdBef', 'Verdichter Befestigung & Laufgeräusche', 'Auf Befestigung und Laufgeräusche geprüft', 'Befestigung & Laufgeräusche', '', {group:'Prüfpunkte'}),
      ok('vdKwh', 'Verdichter Kurbelwannenheizung', 'Kurbelwannenheizung auf Funktion geprüft', 'Kurbelwannenheizung', 'Nicht vorhanden → „entfällt“', {group:'Prüfpunkte'}),
      ok('vdDicht', 'Verdichter Dichtheit', 'Kältemittelseitig auf Dichtheit geprüft', 'Dichtheit kältemittelseitig', '', {group:'Prüfpunkte'}),
      ok('vdLauf', 'Verdichter Laufgeräusche / Schwingungen', 'Laufgeräusche / Schwingungen', 'Laufgeräusche / Schwingungen', '', {group:'Prüfpunkte'}),
      druck('vdPs', 'Verdichter Saugdruck (bar)', 'Saugdruck', 'Saugdruck', ''),
      temp('vdTs', 'Verdichter Sauggastemperatur (°C)', 'Sauggastemperatur vor dem Verdichter', 'Sauggastemperatur', ''),
      druck('vdPd', 'Verdichter Verdichtungsdruck (bar)', 'Verdichtungsdruck', 'Verdichtungsdruck', ''),
      temp('vdTd', 'Verdichter Verdichtungsendtemperatur (°C)', 'Verdichtungsendtemperatur am Druckstutzen', 'Verdichtungsendtemperatur', '')
    ]},
    {title:'Verflüssiger', pdfTitle:'Wärmetauscher • Verflüssiger (Luft / Kältemittel)', short:'Verflüssiger', kind:'check', fields:[
      ok('vfZust', 'Verflüssiger Zustand & Sauberkeit', 'Äußerlich auf Verschmutzung, Beschädigung und Korrosion geprüft', 'Zustand & Sauberkeit', '', {group:'Prüfpunkte'}),
      ok('vfRein', 'Verflüssiger Reinigung erfolgt', 'Funktionserhaltendes Reinigen', 'Funktionserhaltendes Reinigen', '', {group:'Prüfpunkte'}),
      ok('vfVent', 'Verflüssiger Ventilator', 'Ventilator auf Befestigung und Funktion geprüft', 'Ventilator', '', {group:'Prüfpunkte'}),
      ok('vfDicht', 'Verflüssiger Dichtheit', 'Kältemittelseitig auf Dichtheit geprüft', 'Dichtheit kältemittelseitig', '', {group:'Prüfpunkte'}),
      ok('vfLam', 'Verflüssiger Lamellenpaket', 'Lamellenpaket frei von Verformungen', 'Lamellenpaket', '', {group:'Prüfpunkte'}),
      luft('vfTe', 'Verflüssiger Lufteintrittstemperatur (°C)', 'Lufteintrittstemperatur', 'Lufteintrittstemperatur'),
      luft('vfTa', 'Verflüssiger Luftaustrittstemperatur (°C)', 'Luftaustrittstemperatur', 'Luftaustrittstemperatur'),
      {id:'vfDt', col:'Verflüssiger Luft-Spreizung (K)', label:'Luft-Spreizung ΔT', pdf:'Luft-Spreizung ΔT', group:'Messwerte', type:'calc', unit:'K',
        calc:v => isN(v.vfTe) && isN(v.vfTa) ? round(num(v.vfTa) - num(v.vfTe), 1) : '',
        note:() => 'Austritt − Eintritt (Luft wird erwärmt)'},
      legacy(temp('vfTc', 'Verflüssiger Verflüssigungstemperatur (°C)', 'Verflüssigungstemperatur', 'Verflüssigungstemperatur', '')),
      legacy(kelvin('vfUk', 'Verflüssiger Unterkühlung (K)', 'Unterkühlung am Verflüssigeraustritt', 'Unterkühlung', '')),
      legacy(medium('vfMed', 'Verflüssiger Mediumstemperatur Ein/Aus (°C)', 'Mediumstemp. Ein / Aus (°C)'))
    ]},
    {title:'Verdampfer', pdfTitle:'Wärmetauscher • Verdampfer (Luft / Kältemittel)', short:'Verdampfer', kind:'check', evap:true, fields:[
      {id:'vaAnz', col:'Anzahl Verdampfer', label:'Anzahl Innengeräte (Verdampfer)', pdf:'Anzahl Verdampfer', type:'count', init:() => '1',
        hint:'Für jedes Innengerät gibt es unten eine eigene Karte (bis zu 15).'}
    ].concat(...Array.from({length:VA_MAX}, (_, k) => verdFields(k + 1)))},
    {title:'Anlagenteile & Dokumentation', pdfTitle:'Anlagenteile im Kältekreislauf & Dokumentation', short:'Anlagenteile', kind:'check', fields:[
      ok('rohr', 'Rohrleitungen Zustand, Isolierung & Befestigung', 'Rohrleitungen: Zustand, Isolierung & Befestigung', 'Rohrleitungen: Zustand, Isolierung & Befestigung', ''),
      ok('arm', 'Armaturen & Kompensatoren Dichtheit', 'Armaturen & Kompensatoren auf Dichtheit geprüft', 'Armaturen & Kompensatoren dicht', ''),
      ok('mess', 'Mess- & Anzeigegeräte Funktion', 'Mess- und Anzeigegeräte: Zustand & Funktion', 'Mess- & Anzeigegeräte', ''),
      ok('doku', 'Dokumentation & Typenschilder', 'Dokumentation & Typenschilder auf Vollständigkeit geprüft', 'Dokumentation & Typenschilder', '')
    ]},
    {title:'Zusatzmessungen & Anlagenbetrieb', short:'Zusatz', fields:[
      {id:'km', col:'Kältemitteltyp', label:'Kältemitteltyp', type:'text', group:'Kältemittel', ph:'z. B. R32'},
      {id:'fm', col:'Kältemittel-Füllmenge (kg)', label:'Gesamtfüllmenge', pdf:'Füllmenge', type:'number', unit:'kg', min:0, max:5000, group:'Kältemittel', ph:'z. B. 2,05'},
      {id:'co2', col:'CO₂-Äquivalent (t)', label:'CO₂-Äquivalent', type:'calc', unit:'t CO₂e', group:'Kältemittel',
        calc:v => isN(v.fm) && gwpOf(v.km) != null ? round(num(v.fm) * gwpOf(v.km) / 1000, 3) : '',
        note:v => v.km && gwpOf(v.km) == null ? 'GWP für dieses Kältemittel unbekannt' : isN(v.co2) ? (v.co2 >= 5 ? 'ab 5 t: Dichtheitskontrolle Pflicht' : 'unter 5 t: keine Prüfpflicht') : 'Füllmenge × GWP'},
      {id:'i1', col:'Stromaufnahme Verdichter L1 (A)', label:'Stromaufnahme L1', type:'number', unit:'A', min:0, max:100, group:'Elektrik'},
      {id:'i2', col:'Stromaufnahme Verdichter L2 (A)', label:'Stromaufnahme L2', type:'number', unit:'A', min:0, max:100, group:'Elektrik', hint:'0 A oder leer bei 1-phasiger Versorgung'},
      {id:'i3', col:'Stromaufnahme Verdichter L3 (A)', label:'Stromaufnahme L3', type:'number', unit:'A', min:0, max:100, group:'Elektrik', hint:'0 A oder leer bei 1-phasiger Versorgung'},
      legacy({id:'strom', col:'Stromaufnahme Verdichter (A)', label:'Stromaufnahme Verdichter (A)', pdf:'Stromaufnahme Verdichter', type:'text', group:'Elektrik'}),
      ok('elek', 'Elektrische Anschlüsse & Schutzleiter', 'Elektrische Anschlüsse & Schutzleiter', 'Elektr. Anschlüsse & Schutzleiter', '', {group:'Elektrik'}),
      ok('fgas', 'Dichtheitsprüfung EU-F-Gase-VO', 'Dichtheitsprüfung gem. EU-F-Gase-VO', 'Dichtheitsprüfung F-Gase-VO', 'Nicht prüfpflichtig → „entfällt“', {group:'Prüfungen'}),
      ok('vdi', 'Hygieneinspektion (VDI 6022)', 'Hygieneinspektion (VDI 6022)', 'Hygieneinspektion (VDI 6022)', '', {group:'Prüfungen'}),
      ok('kpump', 'Kondensatförderpumpe & Ablauf', 'Kondensatförderpumpe & Ablauf', 'Kondensatförderpumpe & Ablauf', 'Keine Pumpe vorhanden → „entfällt“', {group:'Prüfungen'})
    ]},
    {title:'Abschlussbeurteilung & Abnahme', short:'Abschluss', final:true, fields:[
      ok('ftest', 'Funktionstest Gesamtanlage', 'Gesamtanlage auf korrekte Funktion im Betriebszyklus geprüft', 'Funktionstest Gesamtanlage', ''),
      {id:'erg', col:'Wartungsstatus Gesamtergebnis', label:'Wartungsstatus Gesamtergebnis', type:'select', opts:['i.O.', 'n.i.O.'], good:['i.O.'], bad:['n.i.O.', 'Mangel']},
      {id:'next', col:'Nächste Wartung fällig', label:'Nächste Wartung fällig', type:'text', ph:'z. B. Oktober 2027'},
      {id:'bem', col:'Festgestellte Mängel & Bemerkungen', label:'Festgestellte Mängel & Bemerkungen', type:'longtext', wide:true, hint:'Mängel, Nacharbeiten, ersetzte Teile, Hinweise für den Betreiber'}
    ]}
  ]
};
const ALL_FIELDS = TEMPLATE.pages.flatMap(pg => pg.fields);
const FIELD = Object.fromEntries(ALL_FIELDS.map(f => [f.id, f]));
// Auffälligkeiten: Bauteil voranstellen (Dichtheit gibt es bei Verdichter, Verflüssiger und Verdampfer)
const CHECK_PAGE = Object.fromEntries(TEMPLATE.pages.filter(pg => pg.kind === 'check').flatMap(pg => pg.fields.map(f => [f.id, pg.short])));
const DEV_FIELDS = {};   // Verdampfer-Felder je Gerätenummer
ALL_FIELDS.forEach(f => { if(f.dev) (DEV_FIELDS[f.dev] = DEV_FIELDS[f.dev] || []).push(f); });
const devRoom = (v, n) => String(v['va' + (n > 1 ? n : '') + 'Raum'] ?? '').trim();
const devModel = (v, n) => String(v['va' + (n > 1 ? n : '') + 'Modell'] ?? '').trim();
const devSn = (v, n) => String(v['va' + (n > 1 ? n : '') + 'Sn'] ?? '').trim();
/* Bauteilname in den Auffälligkeiten, z. B. „Verdampfer 2 (Büro)“ */
function devLabel(v, n){ const r = devRoom(v, n); return 'Verdampfer' + (vaCount(v) > 1 || n > 1 ? ' ' + n : '') + (r ? ` (${r})` : ''); }
/* Abschnittstitel im Bericht, z. B. „Wärmetauscher • Verdampfer 2 – Büro (FTXM25R, SN 123)“ */
function devTitle(v, n){
  const cnt = vaCount(v), r = devRoom(v, n), m = devModel(v, n), sn = devSn(v, n);
  const det = [m, sn && 'SN ' + sn].filter(Boolean).join(', ');
  if(cnt === 1 && !r && !det) return 'Wärmetauscher • Verdampfer (Luft / Kältemittel)';
  return 'Wärmetauscher • Verdampfer' + (cnt > 1 ? ' ' + n : '') + (r ? ' – ' + r : '') + (det ? ` (${det})` : '');
}
/* Alte Werte umsetzen: „Mangel“ → „n.i.O.“ (App-Speicher, Backups, Sheet-Zeilen); fehlende Anzahl Verdampfer ableiten. true = etwas geändert */
function normVals(v){
  let ch = false;
  ALL_FIELDS.forEach(f => { if((f.type === 'okfail' || f.type === 'select') && v[f.id] === 'Mangel'){ v[f.id] = 'n.i.O.'; ch = true; } });
  const n = parseInt(String(v.vaAnz ?? '').trim(), 10);
  if(!(n >= 1 && n <= VA_MAX)){
    let m = 1;
    for(let k = 2; k <= VA_MAX; k++) if(DEV_FIELDS[k].some(f => String(v[f.id] ?? '') !== '')) m = k;
    v.vaAnz = String(m); ch = true;
  }
  return ch;
}

const nio = x => x === 'Mangel' ? 'n.i.O.' : x;   // alte Anzeige „Mangel“ → „n.i.O.“
function fmtDate(s){ if(!s) return ''; const d = new Date(String(s).length === 10 ? s + 'T12:00:00' : s); return isNaN(d) ? String(s) : d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'}); }
function num(v){ return typeof v === 'number' ? v : Number(String(v).trim().replace(',', '.')); }
function safeImg(src){ return typeof src === 'string' && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(src) ? src : ''; }
const isVis = (f, v) => (!f.legacy || String(v[f.id] ?? '') !== '') && (!f.show || f.show(v));   // Altfelder nur mit vorhandenem Wert
let calcSeen = {};   // zuletzt angezeigte Rechenwerte -> Aufleuchten nur bei echter Änderung

/* ---------- Werte, Prüfung, Bewertung ---------- */
/* „Nächste Wartung fällig“ vorbelegen (Datum + 12 Monate; Dichtheitsprüfung ab 5 t: 12/6/3 Monate). Nur solange das Feld leer ist oder noch den letzten Vorschlag enthält. */
function nextDueOf(v){   // Datum, '' (kein Datum) oder null (Dichtheitsprüfung, aber CO₂-Äquivalent fehlt → kein Vorschlag möglich)
  const m = String(v.datum || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return '';
  const fg = String(v.fgas || '').trim();
  if(!isN(v.co2) && (fg === 'i.O.' || fg === 'n.i.O.')) return null;
  const co2 = isN(v.co2) ? num(v.co2) : 0, months = co2 >= 500 ? 3 : co2 >= 50 ? 6 : 12;
  const t = +m[2] - 1 + months, y = +m[1] + Math.floor(t / 12), mo = t % 12;
  const d = Math.min(+m[3], new Date(y, mo + 1, 0).getDate()), p2 = x => String(x).padStart(2, '0');
  return `${p2(d)}.${p2(mo + 1)}.${y}`;
}
/* p.nextAuto: letzter Vorschlag; null = Nutzer hat das Feld selbst geleert (dann nicht mehr vorbelegen). Eigene Werte bleiben immer unberührt. */
function autoNext(p){
  const v = p.values, cur = String(v.next || '');
  if(cur === '' ? p.nextAuto === null : cur !== p.nextAuto) return;
  const n = nextDueOf(v);
  if(n){ v.next = n; p.nextAuto = n; }
  else if(cur !== ''){ v.next = ''; p.nextAuto = ''; }   // Vorschlag veraltet und nicht mehr berechenbar → entfernen
}
function recompute(p){ ALL_FIELDS.forEach(f => { if(f.type === 'calc') p.values[f.id] = f.calc(p.values); }); }
function display(f, x){
  if(x === '' || x == null) return '';
  if(f.type === 'date') return fmtDate(x);
  if((f.type === 'number' || f.type === 'calc') && isN(x)) return fmtNum(String(x).trim()) + (f.unit ? ' ' + f.unit : '');
  return String(x);
}
function sollText(f){
  const u = f.unit ? ' ' + f.unit : '';
  if(f.sRanges) return 'Soll ' + f.sRanges.map(r => `${fmtNum(r[0])} – ${fmtNum(r[1])}`).join(' oder ') + u;
  if(f.sMin != null && f.sMax != null) return `Soll ${fmtNum(f.sMin)} – ${fmtNum(f.sMax)}${u}`;
  if(f.sMax != null) return `Soll ≤ ${fmtNum(f.sMax)}${u}`;
  if(f.sMin != null) return `Soll ≥ ${fmtNum(f.sMin)}${u}`;
  return '';
}
function evalField(f, v){
  const x = v[f.id];
  if(f.type === 'okfail') return x === 'i.O.' ? 'ok' : x === 'Mangel' || x === 'n.i.O.' ? 'bad' : x === 'entfällt' ? 'na' : 'none';
  if(f.bad && f.bad.includes(x)) return 'bad';
  if(f.good && f.good.includes(x)) return 'ok';
  if(f.type === 'number' && isN(x) && f.sRanges) return f.sRanges.some(r => num(x) >= r[0] && num(x) <= r[1]) ? 'ok' : 'warn';
  if(f.type === 'number' && isN(x) && (f.sMin != null || f.sMax != null)){
    const n = num(x);
    return (f.sMin != null && n < f.sMin) || (f.sMax != null && n > f.sMax) ? 'warn' : 'ok';
  }
  return 'none';
}
function defects(p){
  return ALL_FIELDS.filter(f => f.type !== 'calc' && isVis(f, p.values) && ['bad', 'warn'].includes(evalField(f, p.values)))
    .map(f => `${f.dev ? devLabel(p.values, f.dev) + ' – ' : CHECK_PAGE[f.id] ? CHECK_PAGE[f.id] + ' – ' : ''}${f.pdf || f.label}: ${nio(display(f, p.values[f.id]))}` + (evalField(f, p.values) === 'warn' ? ` (${sollText(f)})` : ''));
}
const PFLICHTFELDER = false;   // true = Pflichtfelder (req/reqIf) und Monteur-Unterschrift werden wieder erzwungen
function isRequired(f, p){ return PFLICHTFELDER && (!!f.req || (f.reqIf ? f.reqIf(p.values, p) : false)); }
function fieldError(f, p){
  if(f.type === 'calc' || f.legacy || !isVis(f, p.values)) return '';
  const x = p.values[f.id], empty = String(x ?? '').trim() === '';
  if(empty) return isRequired(f, p) ? (f.reqMsg || 'Pflichtfeld') : '';
  if(f.type === 'number'){
    if(!isN(x)) return 'Bitte eine gültige Zahl eingeben.';
    const n = num(x);
    if((f.min != null && n < f.min) || (f.max != null && n > f.max)) return `Unplausibler Wert (erlaubt ${fmtNum(f.min)} – ${fmtNum(f.max)} ${f.unit || ''})`;
  }
  if(f.type === 'date' && f.notFuture && x > today()) return 'Datum liegt in der Zukunft.';
  return '';
}
function pageErrors(p, i){ return TEMPLATE.pages[i].fields.map(f => [f, fieldError(f, p)]).filter(e => e[1]); }
function pageDone(p, i){
  const fs = TEMPLATE.pages[i].fields.filter(f => f.type !== 'calc' && !f.legacy && isVis(f, p.values));
  return fs.every(f => !fieldError(f, p)) && fs.some(f => String(p.values[f.id] ?? '') !== '');
}

/* Bericht-Datenstruktur – identisch genutzt von App-PDF und Apps-Script-PDF */
function buildReport(p){
  const v = p.values;
  const row = f => ({label:f.pdf || f.label, value:display(f, v[f.id]), eval:evalField(f, v), wide:!!f.wide});
  const rowsOf = fs => fs.filter(f => isVis(f, v) && !(f.wide && !v[f.id])).map(row);
  const section = (pg, fs, title) => {
    fs = fs || pg.fields;
    const inTab = new Set(pg.table ? pg.table.rows.flatMap(r => r.ids) : []);
    const rest = fs.filter(f => !inTab.has(f.id) && !f.inTitle);
    const body = pg.table ? pg.table.rows
      .filter(r => (!r.show || r.show(v)) && r.ids.some(id => String(v[id] ?? '') !== ''))
      .map(r => ({label:r.label, cells:r.ids.map(id => ({value:display(FIELD[id], v[id]), eval:evalField(FIELD[id], v)}))})) : [];
    return {title:title || pg.pdfTitle || pg.title, kind:pg.kind || 'grid',
      table: body.length ? {head:pg.table.head, body} : null,
      rows: rowsOf(rest.filter(f => f.type !== 'okfail')), checks: rowsOf(rest.filter(f => f.type === 'okfail'))};
  };
  return {
    title: TEMPLATE.title, firma: settings.firma || '',
    header: rowsOf(TEMPLATE.pages[0].fields),
    sections: TEMPLATE.pages.filter(pg => !pg.header && !pg.final).flatMap(pg => pg.evap
      ? Array.from({length:vaCount(v)}, (_, k) => section(pg, DEV_FIELDS[k + 1], devTitle(v, k + 1))) : [section(pg)]),
    defects: defects(p), co2: isN(v.co2) ? num(v.co2) : '', fgas: v.fgas || '', resultLabel: 'Gesamtergebnis Wartung', success: v.erg || '',
    subline: [v.ftest && 'Funktionstest: ' + v.ftest, v.next && 'Nächste Wartung: ' + v.next].filter(Boolean).join(' · '),
    hinweis: HINWEIS, remark: v.bem || '', remarkLabel: 'Festgestellte Mängel & Bemerkungen',
    techniker: v.monteur || '', kundeName: p.kundeName || '', id: v.projekt || p.id, completedAt: p.completedAt || ''
  };
}
/* Spaltenwerte fürs Google Sheet (ausgeblendete Innengeräte werden geleert) */
function buildCols(p){
  // Altfelder ohne Wert werden gar nicht gesendet (vorhandene Sheet-Werte bleiben unberührt)
  return ALL_FIELDS.filter(f => f.col && !(f.legacy && String(p.values[f.id] ?? '') === '')).map(f => {
    const x = f.id === 'vaAnz' ? vaCount(p.values) : isVis(f, p.values) ? p.values[f.id] : '';
    if(x === '' || x == null) return [f.col, '', ''];
    if(f.type === 'date') return [f.col, x, 'date'];
    if((f.type === 'number' || f.type === 'calc' || f.type === 'count') && isN(x)) return [f.col, num(x), ''];
    return [f.col, String(x), ''];
  });
}

function initSig(canvas, p){
  const key = canvas.dataset.sig;
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ctx.fillStyle = '#0b1f3a';
  const src = safeImg(p.sig[key]);
  if(src){ const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height); img.src = src; }
  let drawing = false, last = null;
  const pt = e => { const b = canvas.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); drawing = true; last = pt(e); canvas.setPointerCapture(e.pointerId);
    ctx.beginPath(); ctx.arc(last[0], last[1], 1.1, 0, Math.PI * 2); ctx.fill();
  });
  canvas.addEventListener('pointermove', e => {
    if(!drawing) return;
    const q = pt(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); last = q;
  });
  const end = () => {
    if(!drawing) return; drawing = false;
    const out = document.createElement('canvas');
    out.width = Math.round(r.width); out.height = Math.round(r.height);
    out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
    p.sig[key] = out.toDataURL('image/png'); save();
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
}

/* ---------- Google-Sheet-Schnittstelle ---------- */
/* api, syncing, syncCanStart, syncEnd, netRender stehen in shared/sync.js */
/* Werte fürs Sheet-JSON: nur sichtbare, ausgefüllte Felder (ausgeblendete Verdampfer werden geleert, Zelle bleibt klein) */
function sheetValues(p){
  const out = {};
  ALL_FIELDS.forEach(f => { const x = p.values[f.id]; if(isVis(f, p.values) && x !== '' && x != null) out[f.id] = x; });
  out.vaAnz = String(vaCount(p.values));
  return out;
}
async function syncAll(silent){
  const list = protocols.filter(p => p.status === 'done' && !p.synced);
  if(!syncCanStart(list.length > 0, silent)) return;
  let okCount = 0, err = null;
  for(const p of list){
    try{
      recompute(p);
      await api('upsert', {
        protocol: {id:p.id, templateId:TEMPLATE.id, values:sheetValues(p), kundeName:p.kundeName || '', completedAt:p.completedAt, sourceKey:p.sourceKey || '',
                   summary:{report:buildReport(p)}, pdf:await pdfBase64(p, reportOf(p), PDF_OPTS)},
        cols: buildCols(p)
      });
      p.synced = true; p.syncedAt = new Date().toISOString(); save(); okCount++;
    }catch(e){ err = e; break; }
  }
  syncEnd();
  if(err) toast(`Übertragung fehlgeschlagen: ${err.message}`);
  else if(okCount) toast(`${okCount} Protokoll(e) ins Google Sheet übertragen.`);
  if(view.name === 'home' || view.name === 'report') render(); else updateNet();
}

/* Wert aus einer alten Sheet-Zeile in das Eingabeformat der App bringen */
function fromSheet(f, x){
  if(x == null) return '';
  if(typeof x === 'boolean') x = x ? 'Ja' : 'Nein';
  if(typeof x === 'number' && f.type !== 'calc') return fmtNum(x);   // Eingabefelder erwarten Text mit Komma
  x = String(x);
  if(f.type === 'date'){ const m = x.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); if(m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  if(f.type === 'okfail') return x === 'Ja' ? 'i.O.' : x === 'Nein' || x === 'Mangel' ? 'n.i.O.' : x;   // ältere Zeilen: Ja/Nein/Mangel
  return x;
}

/* ---------- Aktionen ---------- */
const Actions = {
  home(){ go('home'); },
  settings(){ go('settings'); },
  db(){ go('db', {q:view.q}); },
  sync(){ syncAll(false); },

  new(){
    const values = {};
    ALL_FIELDS.forEach(f => { values[f.id] = f.init != null ? (typeof f.init === 'function' ? f.init() : f.init) : ''; });
    const p = {id:uid(), templateId:TEMPLATE.id, values, sig:{}, kundeName:'', page:0, status:'draft', createdAt:new Date().toISOString(), synced:false};
    recompute(p); autoNext(p);
    protocols.unshift(p); save();
    go('wizard', {id:p.id});
  },
  resume(d){ go('wizard', {id:d.id}); },
  report(d){ go('report', {id:d.id}); },
  reopen(d){
    const p = protocols.find(x => x.id === d.id);
    if(!confirm('Protokoll wieder öffnen und bearbeiten? Nach erneutem Abschließen wird die Zeile im Sheet aktualisiert.')) return;
    p.status = 'draft'; p.synced = false; p.page = TEMPLATE.pages.length - 1; save();
    go('wizard', {id:p.id});
  },
  del(d){
    const p = protocols.find(x => x.id === d.id);
    const msg = p.synced ? 'Protokoll aus der App entfernen? (Es bleibt im Google Sheet erhalten.)'
      : p.status === 'done' ? 'ACHTUNG: Dieses Protokoll ist noch NICHT im Google Sheet. Wirklich endgültig löschen?' : 'Entwurf löschen?';
    if(!confirm(msg)) return;
    protocols = protocols.filter(x => x.id !== d.id); save(); render();
  },

  set(d){
    const p = cur(), f = FIELD[d.f];
    p.values[d.f] = p.values[d.f] === d.v && !isRequired(f, p) ? '' : d.v;   // erneutes Tippen wählt wieder ab
    recompute(p); if(f.id !== 'next') autoNext(p); save();
    if(f.dev) vSync(p, f.dev); else render();   // Verdampfer-Karten: nur Knöpfe und Statusmarke ändern
  },
  togglev(d, el){   // Karte auf-/zuklappen: nur Klasse umschalten (keine Neuzeichnung, Eingaben behalten den Fokus)
    const n = +d.n, card = el.closest('.vcard'), s = openSet();
    const open = !s.has(n); if(open) s.add(n); else s.delete(n);
    card.classList.toggle('open', open); el.setAttribute('aria-expanded', open);
  },
  allokv(d){   // „Offene Punkte auf i.O.“ gilt nur für dieses eine Gerät
    const p = cur(), n = +d.n;
    DEV_FIELDS[n].forEach(f => { if(f.type === 'okfail' && isVis(f, p.values) && !p.values[f.id]) p.values[f.id] = 'i.O.'; });
    save(); vSync(p, n);
  },
  allok(){
    const p = cur();
    TEMPLATE.pages[p.page].fields.forEach(f => { if(f.type === 'okfail' && isVis(f, p.values) && !p.values[f.id]) p.values[f.id] = 'i.O.'; });
    autoNext(p); save(); render();
  },
  next(){
    const p = cur();
    if(pageErrors(p, p.page).length){
      view.tried = true; render();
      $('#pageerr').textContent = 'Bitte die markierten Felder prüfen.'; toast('Bitte die markierten Felder prüfen.');
      const first = document.querySelector('.field.err'); if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    stepTo('fwd', () => { p.page++; save(); view.tried = false; });
  },
  prev(){ const p = cur(); if(p.page > 0) stepTo('back', () => { p.page--; save(); view.tried = false; }); },
  jump(d){
    const p = cur(), t = Number(d.i);
    if(t === p.page){ view.tried = true; render(); window.scrollTo(0, 0); return; }
    stepTo(t > p.page ? 'fwd' : 'back', () => { p.page = t; save(); view.tried = true; });
  },
  sigclear(d){ const p = cur(); delete p.sig[d.sig]; save(); render(); },
  finish(){
    const p = cur();
    recompute(p);
    const bad = TEMPLATE.pages.findIndex((pg, k) => pageErrors(p, k).length);
    if(bad >= 0){
      p.page = bad; save(); view.tried = true; render(); window.scrollTo(0, 0);
      toast(`Bitte „${TEMPLATE.pages[bad].title}“ prüfen.`);
      return;
    }
    if(PFLICHTFELDER && !p.sig.tech){ $('#pageerr').textContent = 'Bitte als Monteur unterschreiben.'; toast('Bitte als Monteur unterschreiben.'); return; }
    p.status = 'done'; p.completedAt = new Date().toISOString(); p.synced = false;
    save();
    go('report', {id:p.id});
    syncAll(true);
  },

  async makepdf(d, btn){
    if(!window.jspdf || !window.html2canvas){ toast('PDF-Modul nicht geladen – App einmal online neu starten.'); return; }
    if(btn && btn.classList.contains('done')) return;   // Doppelstart verhindern
    const r = reportForView();
    if(!r) return;
    const name = pdfName(r.id, 'ohne-Protokollnummer') + '.pdf', key = viewKey();
    if(pdfBusy){ toast(pdfBusy !== key ? 'Es wird gerade ein anderes PDF erstellt …' : 'PDF wird noch erstellt …'); return; }   // gleicher Bericht: Doppelstart still verhindern
    const cb = () => $('#bar .pdfb');   // immer der aktuell im DOM befindliche Knopf (die Leiste wird bei Neuzeichnen neu gebaut)
    const setP = v => { pdfProg = v; const f = viewKey() === key ? $('#bar .pdfb .fill') : null; if(f) f.style.transform = 'scaleX(' + v + ')'; };
    pdfBusy = key; setP(.05); { const b = cb(); if(b) b.classList.add('run'); }
    // Fortschritt ist geschätzt (der gemeinsame PDF-Code meldet keinen): nähert sich 92 %, springt bei Fertigstellung auf 100 %
    pdfTick = setInterval(() => setP(pdfProg + (.92 - pdfProg) * .07), 250);
    try{
      const blob = await reportPdfBlob(reportForView(), PDF_OPTS);
      clearInterval(pdfTick); setP(1);
      await new Promise(res => setTimeout(res, RM() ? 0 : 240));
      if(lastPdf) URL.revokeObjectURL(lastPdf.url);
      lastPdf = {key, file:new File([blob], name, {type:'application/pdf'}), url:URL.createObjectURL(blob)};
      pdfBusy = null;
      if(view.name === 'report' && viewKey() === key){
        const bar = $('#pdfbar'); if(bar) bar.innerHTML = pdfBarHtml();
        setBar();   // baut Leiste neu auf (mit Teilen-Knopf) -> neuen Knopf in den Fertig-Zustand setzen
        const nb = cb();
        if(nb){ nb.classList.remove('run'); nb.classList.add('done'); setTimeout(() => nb.classList.remove('done'), 2600); }
      }
      toast('PDF fertig – jetzt „Teilen“ antippen.');
    }catch(e){ toast('PDF konnte nicht erstellt werden: ' + e.message); }
    finally{
      clearInterval(pdfTick); pdfBusy = null; pdfProg = 0;
      const b = cb(); if(b && !b.classList.contains('done')){ b.classList.remove('run'); setP(0); }
    }
  },
  async sharepdf(){
    if(!lastPdf) return;
    const files = [lastPdf.file];
    if(navigator.canShare && navigator.canShare({files})){
      try{ await navigator.share({files, title:lastPdf.file.name}); }
      catch(e){ if(e.name !== 'AbortError') toast('Teilen fehlgeschlagen: ' + e.message); }
    } else {
      window.open(lastPdf.url, '_blank');
    }
  },
  print(){
    const r = reportForView();
    const old = document.title;
    document.title = pdfName(r.id, 'ohne-Protokollnummer');
    window.print();
    setTimeout(() => { document.title = old; }, 1500);
  },

  async dbload(){
    if(!navigator.onLine){ toast('Offline – zeige gespeicherten Stand.'); return; }
    try{
      toast('Lade Daten …');
      const j = await api('list');
      dbCache = {at:new Date().toISOString(), list:j.list};
      LS.set('klw.db', dbCache);
      toast(`${j.list.length} Einträge geladen.`);
      render();
    }catch(e){ toast('Laden fehlgeschlagen: ' + e.message); }
  },
  async dbreport(d){
    if(!navigator.onLine){ toast('Zum Öffnen eines Protokolls aus dem Sheet wird Internet benötigt.'); return; }
    try{ toast('Lade Protokoll …'); const j = await api('get', {key:d.key}); go('report', {db:true, rep:j.report, key:d.key, q:view.q}); }
    catch(e){ toast('Laden fehlgeschlagen: ' + e.message); }
  },
  async dbedit(d){
    if(!navigator.onLine){ toast('Zum Laden aus dem Sheet wird Internet benötigt.'); return; }
    try{
      toast('Lade Protokoll …');
      const j = await api('load', {key:d.key});
      const local = j.appId && protocols.find(x => x.id === j.appId);
      if(local && local.status === 'done' && !local.synced && !confirm('In der App gibt es zu diesem Protokoll noch nicht übertragene Änderungen. Durch die Version aus dem Sheet ersetzen?')) return;
      if(local && local.status === 'draft' && !confirm('Dieses Protokoll ist hier schon als Entwurf geöffnet. Durch die Version aus dem Sheet ersetzen?')) return;
      const values = {};
      ALL_FIELDS.forEach(f => {
        const x = j.values ? j.values[f.id] : (f.col ? j.cols[f.col] : '');
        values[f.id] = j.values ? (x == null ? '' : x) : fromSheet(f, x);
      });
      const p = {id:j.appId || uid(), templateId:TEMPLATE.id, values, sig:{}, kundeName:j.kundeName || '', sourceKey:d.key,
                 page:0, status:'draft', createdAt:new Date().toISOString(), synced:false};
      normVals(values);
      recompute(p);
      protocols = protocols.filter(x => x.id !== p.id);
      protocols.unshift(p); save();
      toast('Geladen – nach dem Bearbeiten neu unterschreiben und abschließen.');
      go('wizard', {id:p.id});
    }catch(e){ toast('Laden fehlgeschlagen: ' + e.message); }
  },
  async drivepdf(){
    try{
      toast('PDF wird in Google Drive erstellt …');
      const blob = await reportPdfBlob(reportForView(), PDF_OPTS);
      const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
      const j = await api('savepdf', {key:view.key, pdf:b64});
      const e = dbCache.list.find(x => x.key === view.key); if(e){ e.pdfUrl = j.url; LS.set('klw.db', dbCache); }
      toast('PDF in Google Drive gespeichert.');
      window.open(j.url, '_blank');
    }catch(e){ toast('Fehler: ' + e.message); }
  },

  savesettings(d){
    settingsSave(SETTINGS_FIELDS, 'klw.settings');
    if(d !== 'silent') toast('Gespeichert.');
  },
  async ping(){
    Actions.savesettings('silent');
    try{ await api('ping'); toast('Verbindung zum Google Sheet funktioniert ✓'); syncAll(true); }
    catch(e){ toast('Verbindung fehlgeschlagen: ' + e.message); }
  },
  backup(){
    backupDownload({app:'klima-wartung', exportedAt:new Date().toISOString(), protocols}, `klima-wartung-backup-${today()}.json`);
  }
};

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const fn = Actions[b.dataset.act];
  if(fn){ e.preventDefault(); if(navBusy) return; fn(b.dataset, b); }   // während eines Seitenübergangs Tipps ignorieren
});
app.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.f && view.name === 'wizard'){
    const p = cur(), f = FIELD[el.dataset.f];
    p.values[f.id] = el.value;
    if(f.id === 'next' && el.value === '') p.nextAuto = null;   // Nutzer leert das Feld bewusst → nicht wieder vorbelegen
    recompute(p); if(f.id !== 'next') autoNext(p); save();
    if(f.id === 'projekt' || f.id === 'kunde') setHeader(false);   // Kopf-Unterzeile mitführen (kein Neuzeichnen)
    if(f.hdr){ const t = document.getElementById('vt-' + f.dev); if(t) t.textContent = vTitle(p.values, f.dev); }   // Kartenkopf: Raum · Modell
    if(el.dataset.other) document.querySelectorAll(`[data-act=set][data-f="${f.id}"]`).forEach(b => b.classList.toggle('sel', b.dataset.v === el.value));
    if(f.type === 'number' && $('#soll-' + f.id)) $('#soll-' + f.id).innerHTML = sollHtml(f, p.values);
    (TEMPLATE.pages[p.page].evap ? (f.dev ? DEV_FIELDS[f.dev] : []) : TEMPLATE.pages[p.page].fields).filter(c => c.type === 'calc').forEach(c => {
      const ce = $('#calc-' + c.id), ne = $('#note-' + c.id);
      if(ce){ const t = display(c, p.values[c.id]) || '—'; ce.textContent = t; calcTouch(c.id, t, ce); }
      if(ne && c.note) ne.textContent = c.note(p.values);
    });
  } else if(el.id === 'dbsearch'){
    view.q = el.value; $('#dblist').innerHTML = dbList();
  }
});
app.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.cnt && view.name === 'wizard'){
    const p = cur(), old = vaCount(p.values), nw = Math.min(VA_MAX, Math.max(1, parseInt(el.value, 10) || 1));
    if(nw < old){
      const used = []; for(let k = nw + 1; k <= old; k++) if(DEV_FIELDS[k].some(f => String(p.values[f.id] ?? '') !== '')) used.push(k);
      if(used.length && !confirm(`Verdampfer ${used.join(', ')} enthalten schon Eingaben. Beim nächsten Übertragen werden die Daten dieser Geräte im Google Sheet GELÖSCHT (in der App bleiben sie lokal erhalten, bis du das Protokoll löschst). Anzahl trotzdem verringern?`)){ el.value = old; return; }
    }
    p.values.vaAnz = String(nw); if(nw > old) openSet().add(old + 1);
    recompute(p); save(); render();
    return;
  }
  if(el.id === 's_import' && el.files[0]){
    // Altwert „Mangel“ → „n.i.O.“ auch für importierte Protokolle
    backupImport(el.files[0], 'protocols', protocols, 'Protokolle', list => { list.forEach(p => { if(p && p.values) normVals(p.values); }); protocols = list; save(); });
  }
});
window.addEventListener('online', () => { updateNet(); syncAll(true); });
window.addEventListener('offline', updateNet);
let lastW = window.innerWidth;
window.addEventListener('resize', () => {   // Drehen des iPads: Unterschriftsfelder neu aufbauen
  if(window.innerWidth !== lastW && view.name === 'wizard' && cur() && TEMPLATE.pages[cur().page].final) render();
  lastW = window.innerWidth;
});

/* ---------- Start ---------- */
// Gespeicherte Protokolle (auch ältere): „Mangel“ → „n.i.O.“, fehlende Anzahl Verdampfer ergänzen – sonst bleibt alles unverändert
{ let ch = false; protocols.forEach(p => { if(p && p.values && normVals(p.values)) ch = true; }); if(ch) save(); }
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
render();
syncAll(true);
</script>
