    <script>
      (function () {
        try {
          var t = localStorage.getItem('muther-theme');
          var r = document.documentElement;
          if (t === 'hell') r.setAttribute('data-theme', 'light');
          else if (t === 'dunkel') r.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();

    <style>

      }
      .soll {

      }
      .calc {
        display: inline-block;

      @media (max-width: 700px) {
        .frow {

        }
        .seg .btn {
          flex: 1;
        }
      }
      .sigwrap {
        border: 2px dashed var(--line);

      }
      canvas.sig {
        width: 100%;

      a.jump {

        font-weight: 600;
        cursor: pointer;
        text-decoration: underline;
        text-decoration-color: var(--pri2);
        text-decoration-thickness: 2px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 3px solid var(--gold);
        outline-offset: 0;
        border-color: var(--pri2);
      }
      /* Meldung: Kapsel oben, Aussehen und Bewegung in shared/ios.css */
      #toast {
        position: fixed;
        left: 50%;
        opacity: 0;
        max-width: 90vw;
        text-align: center;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
      /* Feste Leiste unten (Zurück / Weiter / Abschließen / PDF) */
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
      }
      .bar .btn {
        flex: 1;
        min-height: 52px;
        font-weight: 700;
        font-size: 15px;
      }
      .bar .btn.primary {
        border-color: var(--gold-dark);
      }
      body.hasbar main {
        padding-bottom: calc(110px + env(safe-area-inset-bottom));
      }
      /* PDF-Knopf mit Fortschritt */
      .bar .btn.pdfb {
        overflow: hidden;
      }
      .pdfb .fill {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.14);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 220ms linear;
        pointer-events: none;
      }
      .pdfb .l1,
      .pdfb .l2,
      .pdfb .lr {
        display: flex;
        align-items: center;
        gap: 6px;
        position: relative;
        transition:
          opacity var(--t-fast),
          transform var(--t-fast) var(--out);
      }
      .pdfb .l2,
      .pdfb .lr {
        position: absolute;
        opacity: 0;
        transform: translateY(8px);
      }
      .pdfb.run .l1,
      .pdfb.done .l1 {
        opacity: 0;
        transform: translateY(-8px);
      }
      .pdfb.run .lr {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .lr {
        opacity: 0;
      }
      .pdfb.done .l2 {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .fill {
        opacity: 0;
      }
      /* Wert wechselt: kurzes Aufleuchten */
      .flash {
        animation: flash 900ms var(--out);
      }
      @keyframes flash {
        from {
          background-color: var(--flash);
        }
      }
      /* Seitenwechsel zwischen den Schritten (.pg-*): shared/ios.css */
      /* Karten erscheinen gestaffelt (nur solange .entering am Container hängt) */
      .entering .stag {
        opacity: 0;
        transform: translateY(12px);
        animation: up var(--t-med) var(--out) forwards;
        animation-delay: calc(var(--i) * 70ms + 120ms);
      }
      @keyframes up {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          transition-duration: 0.001ms !important;
          transition-delay: 0ms !important;
          animation-duration: 0.001ms !important;
          animation-delay: 0ms !important;
        }
        .entering .stag {
          opacity: 1;
          transform: none;
        }

      /* Schrift des Ausdrucks – lokal, damit das PDF auch offline gleich aussieht (SIL Open Font License) */

      :root {

        animation: mat-pulse var(--mat-dur-pulse) var(--mat-ease);

      @keyframes mat-in {
        from {
          opacity: 0;
          transform: translateY(var(--mat-in-shift));

        to {
          opacity: 1;

      @keyframes mat-pulse {

      @media (prefers-reduced-motion: reduce) {

        <svg class="ico" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"

    <script>
      'use strict';

      const OK3 = ['i.O.', 'n.i.O.', 'entfällt'];
      const TYP_NAME = { gas: 'Gasheizung', oel: 'Ölheizung' };
      const TYP_KURZ = { gas: 'Gas', oel: 'Öl' };
      const BAUART_OPTS = {
        gas: ['Brennwert', 'Heizwert'],
        oel: ['Brennwert', 'Niedertemperatur'],
      };
      const BRENNER_OPTS = ['Gelbbrenner', 'Blaubrenner'];
      const SPRUEHMUSTER = ['S', 'H', 'B', 'W'];
      const BEWERTUNG = ['i.O.', 'n.i.O.'];
      const BEWERTUNG_KLASSEN = ['ok', 'bad'];
      const BEWERTUNG_STUFEN = ['ok', 'warn', 'bad'];
      const BEWERTUNG_KURZ = ['i.O.', 'Folgeauftrag nötig', 'n.i.O.'];
      const BEWERTUNG_ALT = new Map([
        ['Betriebssicher / ohne Mängel', 0],
        ['Wartungsempfehlung / Folgeauftrag nötig', 1],
        ['Bedenkliche Mängel / gesperrt', 2],
      ]);
      function bewertungStufe(x) {
        if (x === 'i.O.') {
          return 0;
        }
        if (x === 'n.i.O.') {
          return 2;
        }
        return BEWERTUNG_ALT.has(x) ? BEWERTUNG_ALT.get(x) : -1;
      }
      const MANGEL_SUFFIX = ' – Mangel';
      const KEEP_SYNCED_DAYS = 7;
      const SPEICHER = {
        settings: 'hz1.settings',
        protocols: 'hz1.protocols',
        db: 'hz1.db',
      };
      const PFLICHTFELDER = false;

      function pruefpunkt(id, label, hint, nurBei) {
        return [
          { id, col: label, label, hint, type: 'okfail', nurBei },
          {
            id: id + 'M',
            col: label + MANGEL_SUFFIX,
            label: 'Mangel / Maßnahme',
            type: 'text',
            parent: id,
            nurBei,
            ph: 'Was ist festzustellen, was ist zu tun?',
          },
        ];
      }
      function messwert(id, label, extra) {
        const m = MESSWERTE[id];
        return Object.assign(
          {
            id,
            regel: id,
            col: m.unit ? `${label} (${m.unit})` : label,
            label,
            type: 'number',
            unit: m.unit,
          },
          extra,
        );
      }

      const TEMPLATE = {
        id: 'heizung-wartung',
        title: 'WARTUNGSPROTOKOLL • GAS-/ÖLHEIZUNG',
        pages: [
          {
            title: 'Kopf & Gerät',
            short: 'Gerät',
            header: true,
            fields: [
              {
                id: 'projekt',
                col: 'Protokoll-Nr.',
                label: 'Protokoll-Nr.',
                type: 'text',

          .map((m) => ({ teil: String(m.teil).trim(), menge: String(m.menge ?? '').trim() }));

          .map((m) => (m.menge ? `${m.teil} ×${m.menge}` : m.teil))

      const app = $('#app');
      function fmtDate(s) {
        if (!s) {
          return '';
        }
        const d = new Date(String(s).length === 10 ? s + 'T12:00:00' : s);
        return isNaN(d) ? String(s) : d.toLocaleDateString('de-DE');
      }
      function num(v) {
        return typeof v === 'number' ? v : Number(String(v).trim().replace(',', '.'));

      function safeImg(src) {
        const erlaubt = /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/;
        return typeof src === 'string' && erlaubt.test(src) ? src : '';
      }

      function display(f, x) {
        if (x === '' || x == null) {
          return '';
        }
        if (f.type === 'date') {
          return fmtDate(x);
        }
        if (f.type === 'number' && isN(x)) {
          return fmtNum(String(x).trim()) + (f.unit ? ' ' + f.unit : '');
        }
        if (f.anz) {
          return f.anz[x] || String(x);
        }
        return String(x);
      }
      function sollText(f, v) {
        return f.regel ? sollMesswert(f.regel, kontext(v)) : '';
      }
      function evalField(f, v) {
        const x = wert(f, v);
        if (f.type === 'okfail') {
          if (x === 'i.O.') {
            return 'ok';
          }
          if (x === 'n.i.O.') {
            return 'bad';
          }
          return x === 'entfällt' ? 'na' : 'none';
        }
        if (f.type === 'bewertung') {
          const k = bewertungStufe(x);
          return k < 0 ? 'none' : BEWERTUNG_STUFEN[k];
        }
        if (f.regel) {
          return bewerteMesswert(f.regel, x, kontext(v));
        }
        return 'none';
      }
      function defects(p) {
        const v = p.values;
        return ALL_FIELDS.filter(
          (f) => aktiv(f, v) && f.type !== 'bewertung' && ['bad', 'warn'].includes(evalField(f, v)),
        ).map((f) => {
          const ev = evalField(f, v);
          let text = `${f.label}: ${display(f, wert(f, v))}`;
          if (ev === 'warn' && sollText(f, v)) {
            text += ` (${sollText(f, v)})`;
          }
          const mangel = String(v[f.id + 'M'] ?? '').trim();
          if (f.type === 'okfail' && mangel) {
            text += ` – ${mangel}`;
          }
          return text;
        });
      }
      function isRequired(f) {
        return PFLICHTFELDER && !!f.req;
      }
      function fieldError(f, p) {
        const v = p.values;
        if (!aktiv(f, v) || f.type === 'material') {
          return '';
        }
        const x = v[f.id];
        if (String(x ?? '').trim() === '') {
          return isRequired(f) ? f.reqMsg || 'Pflichtfeld' : '';
        }
        if (f.type === 'number') {
          if (f.regel) {
            return plausibilitaetFehler(f.regel, x);
          }
          if (!isN(x)) {
            return 'Bitte eine gültige Zahl eingeben.';
          }
          const n = num(x);
          if (f.ganz && !Number.isInteger(n)) {
            return 'Bitte eine ganze Zahl eingeben.';
          }
          if ((f.min != null && n < f.min) || (f.max != null && n > f.max)) {
            return `Unplausibler Wert (erlaubt ${fmtNum(f.min)} – ${fmtNum(f.max)} ${f.unit || ''})`.trim();

        if (f.type === 'date' && f.notFuture && x > today()) {
          return 'Datum liegt in der Zukunft.';

        return '';

            let rows = felder.filter((f) => f.type !== 'okfail' && !f.parent).map(rowOf);
            if (pg.kind === 'check') {
              rows = rows.filter((x) => x.value);

            return { title: titleOf(pg), kind: pg.kind || 'werte', checks, rows };

      function bewertungBadge(text) {

      function protoCard(p) {

      function playFx(el, cls) {

          if (fx.art === 'neu') {
            playFx(zeile, 'fx-in');

        }
        toast(fx.art === 'plus' ? `${teil} hinzugefügt (×${fx.menge})` : `${teil} hinzugefügt`);

      function materialHtml(p) {

        const zeilen = liste
          .map(

        <span class="mt">${esc(m.teil)}</span>
        <input data-mat="menge" data-i="${i}" inputmode="decimal" maxlength="12" value="${esc(m.menge)}" placeholder="Menge" aria-label="Menge ${esc(m.teil)}" autocomplete="off">

          )
          .join('');
        return `<div class="fhint">Benötigtes Material eintragen.</div>
      <div>${zeilen || '<div class="emptybox">Noch kein Material eingetragen.</div>'}</div>
      <div class="matadd"><input id="matfree" placeholder="Eigenes Material …" autocomplete="off"><button type="button" class="btn" data-act="matfree">Hinzufügen</button></div>`;
      }

      function altwertHint(x) {
        if (!x || BEWERTUNG.includes(x) || bewertungStufe(x) < 0) {
          return '';
        }
        return `<div class="fhint">Altwert: ${esc(x)}</div>`;
      }
      function fieldHtml(f, p) {
        const v = p.values;
        const x = wert(f, v);
        const err = view.tried ? fieldError(f, p) : '';
        const req = isRequired(f) ? ' *' : '';
        const lab = `<label for="in-${f.id}">${esc(f.label)}${req}</label>${f.hint ? `<div class="fhint">${esc(f.hint)}</div>` : ''}`;
        const errHtml = err ? `<div class="ferr">${esc(err)}</div>` : '';
        const buttons = (vals, cls, act, labels) =>
          vals
            .map(
              (o, k) =>
                `<button class="btn ${cls[k] || ''} ${x === o ? 'sel' : ''}" data-act="${act}" data-f="${f.id}" data-v="${esc(o)}">${esc(labels ? labels[k] : o)}</button>`,
            )
            .join('');
        const seg = (vals, cls, act, labels) =>
          `<div class="seg">${buttons(vals, cls, act || 'set', labels)}</div>`;
        let body;
        switch (f.type) {
          case 'okfail':
            return `<div class="field"><div class="frow"><div>${lab}</div>${seg(OK3, ['ok', 'bad', 'na'])}</div></div>`;
          case 'typ':
            return `<div class="field"><div class="frow"><div>${lab}</div><span class="typinfo">${esc(TYP_NAME[x] || '')}</span></div></div>`;
          case 'yesno':
            return `<div class="field"><div class="frow"><div>${lab}</div>${iosSwitch(f, x, f.warn)}</div></div>`;
          case 'bewertung':
            return `<div class="field"><div class="frow"><div>${lab}</div>${seg(BEWERTUNG, BEWERTUNG_KLASSEN)}</div>${altwertHint(x)}</div>`;
          case 'material':
            return `<div class="field">${materialHtml(p)}</div>`;
          case 'select': {
            const opts = optsOf(f, v);
            const custom = f.other && x && !opts.includes(x);
            const auswahl = f.seg
              ? seg(opts, [])
              : `<div class="opts">${buttons(opts, [], 'set')}</div>`;
            body = `${auswahl}
        ${f.other ? `<input id="in-${f.id}" data-f="${f.id}" data-other="1" placeholder="oder anderer Wert …" value="${custom ? esc(x) : ''}" autocomplete="off">` : ''}`;
            break;
          }
          case 'number': {
            const m = f.regel ? MESSWERTE[f.regel] : null;
            const modus = m && m.min < 0 ? 'text' : m && m.ganz ? 'numeric' : 'decimal';
            const ph = esc(f.ph || '');
            body = `<div class="inunit"><input id="in-${f.id}" data-f="${f.id}" inputmode="${modus}" autocomplete="off" value="${esc(x)}" placeholder="${ph}"><span class="unit">${esc(f.unit || '')}</span></div>
        <div class="soll" id="soll-${f.id}">${sollHtml(f, v)}</div>`;
            break;
          }
          case 'date':
            body = `<input id="in-${f.id}" type="date" data-f="${f.id}" value="${esc(x)}" style="max-width:260px">`;
            break;
          case 'longtext':
            body = `<textarea id="in-${f.id}" data-f="${f.id}" placeholder="${esc(f.ph || '')}">${esc(x)}</textarea>`;
            break;
          default:
            body = `<input id="in-${f.id}" data-f="${f.id}" value="${esc(x)}" placeholder="${esc(f.ph || '')}" autocomplete="off">`;

        return `<div class="field ${err ? 'err' : ''}${f.parent ? ' mangel' : ''}">${lab}${body}${errHtml}</div>`;

      function sollHtml(f, v) {

        }
        if (ev === 'ok') {

        }
        return s ? `<span class="muted">${esc(s)}</span>` : '';
      }

      function finalHtml(p) {
        const d = defects(p);
        const missing = TEMPLATE.pages

              )

        const auffaellig = d.length

        const name = p.values.techniker ? ' (' + esc(p.values.techniker) + ')' : '';
        return `
    ${unvollstaendig}
    <div class="card stag" style="--i:3"><b>Auffälligkeiten:</b> ${auffaellig}</div>
    <div class="card stag" style="--i:4">

        </div>

      /* @@quelle:reportParts */
      function reportParts(r) {
        const B = pdfBausteine();
        const { esc, pill } = B;
        const TYP_H1 = { gas: 'Gasheizung', oel: 'Ölheizung' };
        const KURZ = ['i.O.', 'Folgeauftrag nötig', 'n.i.O.'];
        const ARTEN = ['ok', 'warn', 'bad'];
        const PILLS = ['in Ordnung', 'Folgeauftrag', 'nicht in Ordnung'];
        const firma = r.firma || '';
        const kopfzeile = String(r.title || 'WARTUNGSPROTOKOLL').split(' • ')[0];
        const kicker = kopfzeile;
        const kickerKlein = kopfzeile.charAt(0) + kopfzeile.slice(1).toLowerCase();
        const h1 = TYP_H1[r.typ] || 'Gas-/Ölheizung';
        const header = r.header || [];
        const hv = (re) => {
          const treffer = header.find(
            (x) => re.test(x.label) && !/nummer|nr\.?$/i.test(x.label) && x.value,
          );
          return treffer ? treffer.value : '';
        };
        const datum = hv(/^datum/i);
        const stand =
          datum ||
          (r.completedAt
            ? new Date(r.completedAt).toLocaleDateString('de-DE', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
              })
            : '');
        const blocks = [];

        const p2 = (x) => String(x).padStart(2, '0');
        const dm =
          String(stand || '').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/) ||
          String(stand || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
        const y0 = dm ? +(dm[1].length === 4 ? dm[1] : dm[3]) : 0;
        const mo0 = dm ? +dm[2] - 1 : 0;
        const d0 = dm ? +(dm[1].length === 4 ? dm[3] : dm[1]) : 0;
        const tileDate = dm ? `${p2(d0)}.${p2(mo0 + 1)}.${y0}` : stand || '';
        const naechste = (() => {
          if (!dm) {
            return '';
          }
          const t = mo0 + 12;
          const y = y0 + Math.floor(t / 12);
          const mo = t % 12;
          const d = Math.min(d0, new Date(y, mo + 1, 0).getDate());
          return `${p2(d)}.${p2(mo + 1)}.${y}`;
        })();

        const stufe = ARTEN[r.bewertungStufe] ? r.bewertungStufe : -1;
        const art = stufe < 0 ? '' : ARTEN[stufe];
        blocks.push({
          html: B.kacheln(
            [
              {
                art,
                lab: 'Ergebnis',
                val: stufe < 0 ? '' : KURZ[stufe],
                subHtml:
                  stufe < 0
                    ? ''
                    : `${pill(art, PILLS[stufe], art === 'warn' ? 'clock' : undefined)}<div>${esc(r.bewertungMangel || (['i.O.', 'n.i.O.'].includes(r.bewertung) ? '' : r.bewertung || ''))}</div>`,
              },
              { lab: 'Nächste Wartung', val: naechste, sub: naechste ? 'jährliche Wartung' : '' },
              {
                art: 'primary',
                lab: 'Wartungsdatum',
                val: tileDate,
                sub: r.techniker ? 'Techniker: ' + r.techniker : '',
              },
            ],
            { links: true },
          ),
        });

        if (header.length) {
          blocks.push({ html: B.abschnitt('Auftrags- & Anlagendaten', B.kv(header)) });
        }

        (r.sections || []).forEach((s) => {
          const items = (s.checks || []).map((x) => ({
            label: x.label + (x.mangel ? ' – Mangel: ' + x.mangel : ''),
            value: x.value,
            eval: ['ok', 'bad', 'na'].includes(x.eval) ? x.eval : '',
          }));
          const rows = s.rows || [];
          const body =
            B.checkliste(items) +
            (rows.length
              ? (items.length ? B.zwischenTitel('Messwerte & Angaben') : '') + B.kv(rows)
              : '');
          blocks.push({
            html: B.abschnitt(s.title, body || '<div class="none">Keine Angaben</div>'),
          });
        });

        const material = r.material || [];
        if (material.length) {
          blocks.push(
            B.tabelle({
              titel: 'Verwendetes Material',
              head: [{ t: 'Pos.', w: '10%' }, 'Bezeichnung', { t: 'Menge', w: '20%' }],
              rows: material.map((m, i) => [
                { t: String(i + 1) },
                { t: m.teil, cls: 'lbl' },
                { t: m.menge || '—' },
              ]),
            }),
          );
        }

        const defects = r.defects || [];
        if (defects.length) {
          blocks.push({ html: B.notiz({ titel: 'Auffälligkeiten', liste: defects, art: 'def' }) });
        }
        blocks.push({
          html: B.notiz({
            titel: 'Festgestellte Mängel / Noch auszuführende Arbeiten (Folgeauftrag)',
            text: r.remark,
          }),
        });
        if (r.absprachen) {
          blocks.push({
            html: B.notiz({ titel: 'Absprachen & Abweichungen', text: r.absprachen }),
          });
        }
        if (r.hinweis) {
          blocks.push({ html: B.notiz({ titel: 'Hinweise für den Betreiber', text: r.hinweis }) });
        }
        const sig = r.sig || {};
        blocks.push({
          html: B.unterschrift({
            tech: { bild: sig.tech, name: [r.techniker, stand].filter(Boolean).join(' · ') },
            kunde: { bild: sig.kunde, name: r.kundeName },
            labels: { tech: 'Techniker', kunde: 'Kunde / Betreiber' },
          }),
        });

        const kunde = hv(/kunde|objekt/i);

      function initSig(canvas, p) {
        const key = canvas.dataset.sig;
        const r = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(r.width * dpr);
        canvas.height = Math.round(r.height * dpr);
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = ctx.fillStyle = '#0b1f3a';
        const src = safeImg(p.sig[key]);
        if (src) {
          const img = new Image();
          img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height);
          img.src = src;
        }
        let drawing = false;
        let last = null;
        const pt = (e) => {
          const b = canvas.getBoundingClientRect();
          return [e.clientX - b.left, e.clientY - b.top];
        };
        canvas.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          drawing = true;
          last = pt(e);
          canvas.setPointerCapture(e.pointerId);
          ctx.beginPath();
          ctx.arc(last[0], last[1], 1.1, 0, Math.PI * 2);
          ctx.fill();
        });
        canvas.addEventListener('pointermove', (e) => {
          if (!drawing) {
            return;
          }
          const q = pt(e);
          ctx.beginPath();
          ctx.moveTo(last[0], last[1]);
          ctx.lineTo(q[0], q[1]);
          ctx.stroke();
          last = q;
        });
        const end = () => {
          if (!drawing) {
            return;
          }
          drawing = false;
          const out = document.createElement('canvas');
          out.width = Math.round(r.width);
          out.height = Math.round(r.height);
          out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
          p.sig[key] = out.toDataURL('image/png');
          save();
        };
        canvas.addEventListener('pointerup', end);
        canvas.addEventListener('pointercancel', end);
      }

          if (p && TEMPLATE.pages[p.page].final) {

      function pruneSynced() {
        const now = Date.now();
        const maxAge = KEEP_SYNCED_DAYS * 864e5;
        let changed = false;
        protocols.forEach((p) => {
          if (p.status === 'done' && p.synced === true && !p.syncedAt) {
            p.syncedAt = new Date().toISOString();
            changed = true;
          }
        });
        const keep = protocols.filter(
          (p) =>
            !(
              p.status === 'done' &&
              p.synced === true &&
              p.syncedAt &&
              p.id !== view.id &&
              now - new Date(p.syncedAt).getTime() > maxAge
            ),
        );
        if (keep.length !== protocols.length) {
          protocols = keep;
          changed = true;
        }
        if (changed) {
          save();
        }
      }
      async function syncAll(silent) {
        const list = protocols.filter((p) => p.status === 'done' && !p.synced);
        if (!syncCanStart(list.length > 0, silent)) {
          return;
        }
        let okCount = 0;
        let err = null;
        for (const p of list) {
          try {
            await api('upsert', {
              protocol: {
                id: p.id,
                templateId: TEMPLATE.id,
                values: p.values,
                kundeName: p.kundeName || '',
                completedAt: p.completedAt,
                sig: p.sig,
                sourceKey: p.sourceKey || '',
                summary: { report: buildReport(p) },
                pdf: await pdfBase64(p, reportOf(p), PDF_OPTS),
              },
              cols: buildCols(p),
            });
            p.synced = true;
            p.syncedAt = new Date().toISOString();
            save();
            okCount++;
          } catch (e) {
            err = e;
            break;
          }
        }
        syncEnd();
        pruneSynced();
        if (err) {
          toast(`Übertragung fehlgeschlagen: ${err.message}`);
        } else if (okCount) {
          toast(`${okCount} Protokoll(e) in die Datenbank übertragen.`);
        }
        if (view.name === 'home' || view.name === 'report') {
          render();
        } else {
          updateNet();
        }
      }

        async makepdf(d, btn) {
          if (!window.jspdf || !window.html2canvas) {
            toast('PDF-Modul nicht geladen – App einmal online neu starten.');
            return;
          }
          if (btn && btn.classList.contains('done')) {
            return;
          }
          const r = reportForView();
          if (!r) {
            return;
          }
          const name = pdfName(r.id) + '.pdf';
          const key = viewKey();
          if (pdfBusy) {
            toast(
              pdfBusy !== key
                ? 'Es wird gerade ein anderes PDF erstellt …'
                : 'PDF wird noch erstellt …',
            );
            return;
          }
          const cb = () => $('#bar .pdfb');
          const setP = (v) => {
            pdfProg = v;
            const f = viewKey() === key ? $('#bar .pdfb .fill') : null;
            if (f) {
              f.style.transform = 'scaleX(' + v + ')';
            }
          };
          pdfBusy = key;
          setP(0.05);
          const startKnopf = cb();
          if (startKnopf) {
            startKnopf.classList.add('run');
          }
          pdfTick = setInterval(() => setP(pdfProg + (0.92 - pdfProg) * 0.07), 250);
          try {
            const blob = await reportPdfBlob(reportForView(), PDF_OPTS);
            clearInterval(pdfTick);
            setP(1);
            await new Promise((res) => setTimeout(res, RM() ? 0 : 240));
            if (lastPdf) {
              URL.revokeObjectURL(lastPdf.url);
            }
            lastPdf = {
              key,
              file: new File([blob], name, { type: 'application/pdf' }),
              url: URL.createObjectURL(blob),
            };
            pdfBusy = null;
            if (view.name === 'report' && viewKey() === key) {
              const bar = $('#pdfbar');
              if (bar) {
                bar.innerHTML = pdfBarHtml();
              }
              setBar();
              const nb = cb();
              if (nb) {
                nb.classList.remove('run');
                nb.classList.add('done');
                setTimeout(() => nb.classList.remove('done'), 2600);
              }
            }
            toast('PDF fertig – jetzt „Teilen“ antippen.');
          } catch (e) {
            toast('PDF konnte nicht erstellt werden: ' + e.message);
          } finally {
            clearInterval(pdfTick);
            pdfBusy = null;
            pdfProg = 0;
            const b = cb();
            if (b && !b.classList.contains('done')) {
              b.classList.remove('run');
              setP(0);
            }
          }
        },

              if (typeof x === 'number') {

              html: Views.home(),
              go() {
                Actions.home();
              },
            };
          }
          return null;
        },
      });
      window.addEventListener('online', () => {
        updateNet();
        syncAll(true);
      });
      window.addEventListener('offline', updateNet);
      let lastW = window.innerWidth;
      window.addEventListener('resize', () => {
        if (
          window.innerWidth !== lastW &&
          view.name === 'wizard' &&
          cur() &&
          TEMPLATE.pages[cur().page].final
        ) {
          render();
        }
        lastW = window.innerWidth;
      });

      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(() => {});
      }
      pruneSynced();
      render();
      syncAll(true);
    </script>
    <script src="shared/theme.js"></script>
  </body>
</html>
