<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Daikin-Tool" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1a1a1a" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('muther-theme');
          var r = document.documentElement;
          if (t === 'hell') r.setAttribute('data-theme', 'light');
          else if (t === 'dunkel') r.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/png" href="icon-180.png" />
    <title>Auslegungstool Daikin Split-Klimaanlage</title>
    <link rel="preload" as="font" type="font/woff2" href="shared/lib/fonts/material-symbols-rounded.woff2" crossorigin />
    <script src="shared/lib/html2canvas.min.js" defer></script>
    <script src="shared/lib/jspdf.umd.min.js" defer></script>
    <link rel="stylesheet" href="shared/pdf.css" />
    <script src="daten.js"></script>
    <script src="engine.js"></script>
    <script src="shared/pdf-bausteine.js"></script>
    <script src="shared/pdf.js"></script>
    <script src="shared/ios.js"></script>
    <style>
      :root {
        --sh: none;
        --tile: var(--surface-field);
        --cream: var(--surface-field);
        --selbg: var(--surface-field);
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior-y: none;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.45 'Plus Jakarta Sans',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      button,
      [role='button'],
      summary,
      .oduline {
        touch-action: manipulation;
      }
      button,
      [role='button'],
      summary,
      .steps > * {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      :root[data-theme='dark'] :focus-visible {
        outline-color: var(--gold);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) :focus-visible {
          outline-color: var(--gold);
        }
      }
      header :focus-visible {
        outline-color: var(--gold);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--pri);
        color: #fff;
        border-bottom: 3px solid var(--gold);
        padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px
          calc(16px + env(safe-area-inset-left));
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--gold);
        color: #1a1a1a;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 18px;
        flex: none;
      }
      header .tt {
        flex: 1;
        min-width: 0;
        line-height: 1.2;
        cursor: pointer;
      }
      header .tt h1 {
        display: block;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      header .tt span {
        display: block;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.75);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ib {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.14);
        border: 0;
        display: grid;
        place-items: center;
        color: #fff;
        flex: none;
        padding: 0;
        cursor: pointer;
      }
      .ico {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .net {
        font-size: 12px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.14);
        white-space: nowrap;
      }
      .net:not(.off) {
        display: none;
      } /* online = Normalzustand, nur „offline“ anzeigen */
      .net.off {
        background: var(--bad);
      }
      /* Seitenübergang: seitlich verschobene Seite darf keinen waagerechten Bildlauf erzeugen */
      .stage {
        overflow-x: hidden;
        overflow-x: clip;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 6px calc(16px + env(safe-area-inset-right))
          calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
      }
      .btn {
        appearance: none;
        -webkit-appearance: none;
        border: 1px solid var(--line);
        background: var(--ctl);
        color: var(--ink);
        border-radius: 12px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 700;
        min-height: 48px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-decoration: none;
      }
      .btn {
        position: relative;
        transition:
          transform var(--t-fast) var(--out),
          filter var(--t-fast);
      }
      .btn:active {
        transform: scale(0.97);
        filter: brightness(0.96);
      }
      .ib {
        transition:
          transform var(--t-fast) var(--out),
          background var(--t-fast);
      }
      .ib:active {
        transform: scale(0.94);
        background: rgba(255, 255, 255, 0.22);
      }
      .steps button {
        transition: transform var(--t-fast) var(--out);
      }
      .steps button:active {
        transform: scale(0.97);
      }
      .btn.primary {
        background: var(--gold);
        border-color: var(--gold);
        color: #1a1a1a;
      }
      .btn.primary:focus-visible {
        outline-color: var(--ink);
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn.small {
        min-height: 38px;
        padding: 6px 12px;
        font-size: 15px;
      }
      .btn:disabled {
        opacity: 0.45;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .between {
        justify-content: space-between;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        margin: 12px 0;
      }
      h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 24px 2px 10px;
      }
      h2 .n {
        background: var(--tile);
        color: var(--gold-text);
        border-radius: 99px;
        padding: 1px 8px;
        font-size: 11.5px;
      }
      label {
        display: block;
        font-size: 15px;
        color: var(--ink);
        margin: 0 0 6px;
        font-weight: 600;
      }
      input,
      select,
      textarea {
        width: 100%;
        font: inherit;
        font-size: 16px;
        padding: 12px;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--ctl);
        color: var(--ink);
        transition:
          border-color var(--t-fast),
          box-shadow var(--t-fast);
      }
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 0;
        border-color: var(--gold-dark);
        box-shadow: 0 0 0 3px var(--flash);
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      .badge {
        display: inline-block;
        font-size: 13px;
        font-weight: 700;
        padding: 2px 9px;
        border-radius: 99px;
        background: var(--bdg);
        color: var(--muted);
      }
      .badge.ok {
        background: var(--okbg);
        color: var(--ok);
      }
      .badge.bad {
        background: var(--ebg);
        color: var(--bad);
      }
      .badge.warn {
        background: var(--wbg);
        color: var(--warn);
      }
      .muted {
        color: var(--muted);
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 12px calc(16px + env(safe-area-inset-right)) 0
          calc(16px + env(safe-area-inset-left));
      }
      .info {
        display: flex;
        gap: 8px;
        align-items: center;
        background: var(--hbg);
        border: 1px solid var(--line);
        border-left: 4px solid var(--gold);
        border-radius: 12px;
        padding: 8px 12px;
        font-size: 12.5px;
        line-height: 1.3;
        color: var(--ink);
      }
      .info .ag-icon {
        color: var(--gold-text);
      }
      .steps {
        display: flex;
        gap: 6px;
        margin: 0 0 6px;
      }
      .steps > * {
        flex: 1;
        display: grid;
        place-items: center;
        text-align: center;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 9px 0;
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid var(--line);
        color: var(--muted);
        background: var(--card);
      }
      .steps .on {
        background: var(--pri);
        color: #fff;
        border-color: var(--pri);
      }
      :root[data-theme='dark'] .steps .on {
        background: var(--gold);
        color: #1a1a1a;
        border-color: var(--gold);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .steps .on {
          background: var(--gold);
          color: #1a1a1a;
          border-color: var(--gold);
        }
      }
      .card h3 {
        margin: 0 0 10px;
        font-size: 12px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .g2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        min-width: 0;
      }
      .g2 > * {
        min-width: 0;
      }
      .fld {
        margin: 0 0 10px;
      }
      .acc {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 52px;
        cursor: pointer;
      }
      .acc .n {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--tile);
        color: var(--gold-text);
        font-weight: 700;
        display: grid;
        place-items: center;
        flex: none;
        font-size: 14px;
      }
      .acc .m {
        flex: 1;
        min-width: 0;
      }
      .acc .m b {
        display: block;
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .acc .m span {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .acc .ico {
        transition: transform var(--t-med) var(--out);
      }
      .roomcard.open .acc .ico {
        transform: rotate(180deg);
      }
      .roomcard {
        padding: 6px 14px;
        transition: padding-bottom var(--t-med) var(--out);
      }
      .roomcard.open {
        padding-bottom: 14px;
      }
      .body-w {
        display: grid;
        grid-template-rows: 0fr;
        visibility: hidden;
        transition:
          grid-template-rows var(--t-med) var(--out),
          visibility 0s var(--t-med);
      }
      .roomcard.open > .body-w {
        grid-template-rows: 1fr;
        visibility: visible;
        transition:
          grid-template-rows var(--t-med) var(--out),
          visibility 0s;
      }
      .body-w > .roombody {
        overflow: hidden;
        min-height: 0;
      }
      .body-in {
        padding-top: 8px;
        opacity: 0;
        transform: translateY(-4px);
        transition:
          opacity var(--t-med) var(--out),
          transform var(--t-med) var(--out);
      }
      .roomcard.open .body-in {
        opacity: 1;
        transform: none;
      }
      /* Wert wechselt: kurzes Aufleuchten */
      .flash {
        animation: flash 900ms var(--out);
      }
      .acc .m span.flash {
        border-radius: 6px;
      }
      @keyframes flash {
        from {
          background-color: var(--flash);
        }
      }
      /* Seitenwechsel Eingabe <-> Ergebnis */
      .pg-out-fwd {
        animation: pgoutf var(--t-exit) var(--in) forwards;
      }
      .pg-out-back {
        animation: pgoutb var(--t-exit) var(--in) forwards;
      }
      .pg-in-fwd {
        animation: pginf var(--t-med) var(--out) both;
      }
      .pg-in-back {
        animation: pginb var(--t-med) var(--out) both;
      }
      @keyframes pgoutf {
        to {
          transform: translateX(-22%);
          opacity: 0;
        }
      }
      @keyframes pgoutb {
        to {
          transform: translateX(22%);
          opacity: 0;
        }
      }
      @keyframes pginf {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
      }
      @keyframes pginb {
        from {
          transform: translateX(-100%);
          opacity: 0;
        }
      }
      /* Ergebnis erscheint gestaffelt (nur solange .entering am Container hängt) */
      .entering .stag {
        opacity: 0;
        transform: translateY(12px);
        animation: up var(--t-med) var(--out) forwards;
        animation-delay: calc(var(--i) * 70ms + 120ms);
      }
      @keyframes up {
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* PDF-Knopf mit Fortschritt */
      .bar .btn.pdfb {
        overflow: hidden;
      }
      .pdfb .fill {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.14);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 220ms linear;
        pointer-events: none;
      }
      .pdfb .l1,
      .pdfb .l2,
      .pdfb .lr {
        display: flex;
        align-items: center;
        gap: 6px;
        position: relative;
        transition:
          opacity var(--t-fast),
          transform var(--t-fast) var(--out);
      }
      .pdfb .l2,
      .pdfb .lr {
        position: absolute;
        opacity: 0;
        transform: translateY(8px);
      }
      .pdfb.run .l1,
      .pdfb.done .l1 {
        opacity: 0;
        transform: translateY(-8px);
      }
      .pdfb.run .lr {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .lr {
        opacity: 0;
      }
      .pdfb.done .l2 {
        opacity: 1;
        transform: none;
      }
      .bar .btn.pdfb.done {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      :root[data-theme='dark'] .bar .btn.pdfb.done {
        color: #0f2a1a;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .bar .btn.pdfb.done {
          color: #0f2a1a;
        }
      }
      .pdfb.done .fill {
        opacity: 0;
      }
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        background: var(--bg);
        border-top: 1px solid var(--line);
        padding: 10px calc(14px + env(safe-area-inset-right))
          calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
      }
      .bar[hidden] {
        display: none;
      }
      .bar > div {
        max-width: 960px;
        margin: 0 auto;
        display: flex;
        gap: 10px;
      }
      .bar .btn {
        flex: 1;
        min-height: 52px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 15px;
      }
      .bar .btn.primary {
        border-color: var(--gold-dark);
      }
      /* Wie shared/base.css: Scrollleiste immer reserviert (kein seitliches Springen); ab 700px kurze Knöpfe in der Leiste, Zurück/Ändern links, Rest rechts */
      html {
        scrollbar-gutter: stable;
      }
      @media (min-width: 700px) {
        .bar > div {
          justify-content: space-between;
        }
        .bar .btn {
          flex: 0 0 auto !important;
          min-width: 200px;
          padding-left: 28px;
          padding-right: 28px;
        }
        .bar .btn:nth-child(2):not(:last-child) {
          margin-left: auto;
        }
      }
      body.hasbar main {
        padding-bottom: calc(120px + env(safe-area-inset-bottom));
      }
      .hero {
        background: var(--card);
        border: 1px solid var(--line);
        border-top: 4px solid var(--ok);
        border-radius: 18px;
        padding: 16px;
        margin: 12px 0;
      }
      .hero.warn {
        border-top-color: var(--warn);
      }
      .hero.bad {
        border-top-color: var(--bad);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 700;
        font-size: 13px;
        padding: 4px 11px;
        border-radius: 99px;
        background: var(--okbg);
        color: var(--ok);
        margin: 0 4px 4px 0;
      }
      .pill.g {
        background: var(--gold);
        color: #1a1a1a;
      }
      .pill.w {
        background: var(--wbg);
        color: var(--warn);
      }
      .pill.b {
        background: var(--ebg);
        color: var(--bad);
      }
      .big {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.1;
        margin: 6px 0 2px;
        overflow-wrap: anywhere;
      }
      .why {
        font-size: 13.5px;
        color: var(--muted);
      }
      .hero ul.why {
        margin: 4px 0 0;
        padding-left: 18px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 12px;
      }
      .kpi {
        background: var(--bg);
        border-radius: 12px;
        font-variant-numeric: tabular-nums;
        padding: 9px 10px;
        min-width: 0;
      }
      .kpi small {
        display: block;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .kpi b {
        font-size: 16px;
      }
      .kpi i {
        display: block;
        font-style: normal;
        font-size: 12px;
        color: var(--muted);
      }
      .rr {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 10px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .rr.first {
        border-top: 0;
      }
      .rr b {
        font-size: 14.5px;
        overflow-wrap: anywhere;
      }
      .rr .l {
        font-size: 12.5px;
        color: var(--muted);
      }
      .rr .v {
        text-align: right;
        font-size: 12.5px;
        color: var(--muted);
      }
      .rr .v b {
        display: block;
        font-size: 15px;
        color: var(--ink);
      }
      .proj {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 12px 12px 14px;
        cursor: pointer;
        transition:
          transform var(--t-fast) var(--out),
          border-color var(--t-fast),
          box-shadow var(--t-fast);
      }
      .proj:active {
        transform: scale(0.985);
      }
      .proj .pi {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: var(--tile);
        color: var(--gold-text);
        display: grid;
        place-items: center;
        flex: none;
      }
      .proj .pt {
        flex: 1;
        min-width: 0;
      }
      .proj .pt b {
        display: block;
        font-size: 15px;
        overflow-wrap: anywhere;
      }
      .proj .pk {
        display: block;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .proj .pt small {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .ib.del {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
      }
      .ib.del:active {
        background: var(--ebg);
        color: var(--bad);
      }
      .card.empty {
        text-align: center;
        padding: 28px 16px;
      }
      .card.empty .muted {
        font-size: 14px;
        margin-top: 2px;
      }
      details.card > summary {
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 36px;
        font-weight: 600;
        cursor: pointer;
      }
      details.card > summary::-webkit-details-marker {
        display: none;
      }
      details.card > summary small {
        color: var(--muted);
        font-weight: 400;
      }
      details.card[open] > summary .ico {
        transform: rotate(180deg);
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .warnbox {
        background: var(--wbg);
        border: 1px solid var(--wbd);
        color: var(--wfg);
        padding: 12px 14px;
        border-radius: 12px;
        margin: 12px 0;
      }
      .errbox {
        background: var(--ebg);
        border: 1px solid var(--ebd);
        color: var(--efg);
        padding: 12px 14px;
        border-radius: 12px;
        margin: 12px 0;
      }
      .okbox {
        background: var(--okbg);
        border: 1px solid var(--okbd);
        color: var(--okfg);
        padding: 12px 14px;
        border-radius: 12px;
        margin: 12px 0;
      }
      .warnbox ul,
      .errbox ul {
        margin: 4px 0 0;
        padding-left: 20px;
      }
      .pagetitle {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 6px 0 6px;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 16px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px 16px;
      }
      @media (max-width: 700px) {
        .grid2,
        .grid3 {
          grid-template-columns: 1fr;
        }
      }
      .grid2 > *,
      .grid3 > * {
        min-width: 0;
      }
      /* iPhone/iPad: Datumsfeld hat sonst eine feste Mindestbreite und ragt über den Rand. Bewusst ohne @supports, gilt überall. */
      input[type='date'] {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        min-height: 50px;
        height: 50px;
        text-align: left;
        margin: 0;
      }
      input[type='date']::-webkit-date-and-time-value {
        text-align: left;
        min-width: 0;
        margin: 0;
      }
      input[type='date']::-webkit-datetime-edit {
        padding: 0;
        text-align: left;
      }
      .fhint {
        font-size: 13px;
        color: var(--muted);
        margin-top: 4px;
      }
      .roomhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .roomhead b {
        font-size: 18px;
      }
      .pick {
        margin-top: 10px;
        padding: 10px 12px;
        background: var(--cream);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 15px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td,
      th {
        border-bottom: 1px solid var(--line);
        padding: 9px 6px;
        text-align: left;
        vertical-align: top;
      }
      th {
        font-size: 13px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .oduline {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 12px;
        border: 2px solid var(--line);
        border-radius: 12px;
        margin: 8px 0;
        cursor: pointer;
        background: var(--ctl);
        transition:
          transform var(--t-fast) var(--out),
          border-color var(--t-fast);
      }
      .oduline:active {
        transform: scale(0.985);
      }
      .oduline.sel {
        border-color: var(--gold);
        background: var(--selbg);
      }
      .oduline .why {
        font-size: 14px;
        color: var(--bad);
        margin-top: 4px;
      }
      .oduline b {
        font-size: 18px;
      }
      /* sehr schmale Handys (320 px) und große Schrift/Zoom */
      @media (max-width: 360px) {
        header {
          gap: 8px;
        }
        .logo {
          width: 34px;
          height: 34px;
          font-size: 16px;
        }
        header .tt h1 {
          font-size: 16px;
        }
        .ib {
          width: 40px;
          height: 40px;
        }
        input,
        select,
        textarea {
          padding: 12px 10px;
        }
        .bar > div {
          gap: 8px;
        }
        .bar .btn {
          padding: 10px 8px;
          font-size: 14px;
          gap: 4px;
        }
        .kpis {
          gap: 6px;
        }
        .kpi {
          padding: 9px 8px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          transition-duration: 0.001ms !important;
          transition-delay: 0ms !important;
          animation-duration: 0.001ms !important;
          animation-delay: 0ms !important;
        }
        .entering .stag {
          opacity: 1;
          transform: none;
        }
      }
      /* App-Schrift (shared/lib/fonts). PDF-CSS: shared/pdf.css, PDF-Schrift: Helvetica/Arial (Systemschrift) */
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(shared/lib/fonts/plus-jakarta-sans-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF,
          U+FFFD;
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(shared/lib/fonts/plus-jakarta-sans-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF,
          U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }
    </style>
    <link rel="stylesheet" href="shared/ios.css" />
  </head>
  <body>
    <header>
      <div class="logo">D</div>
      <div class="tt" id="ttl">
        <h1>Daikin-Auslegung</h1>
        <span id="hsub">Split / Multisplit R32</span>
      </div>
      <span class="net" id="net">online</span>
      <button class="ib" id="btntheme" type="button">
        <span class="ag-icon ag-icon--sm" id="themeico" aria-hidden="true">contrast</span>
      </button>
      <button class="ib" id="btnset" type="button" aria-label="Einstellungen">
        <span class="ag-icon ag-icon--sm" aria-hidden="true">settings</span>
      </button>
    </header>
    <div class="wrap">
      <div class="info">
        <span class="ag-icon ag-icon--sm" aria-hidden="true">info</span>
        <span>
          <b>Kombinationshilfe zur ersten Prüfung.</b>
          Endgültige Kalkulation vor Angebot prüfen.
        </span>
      </div>
    </div>
    <div class="stage"><main id="app"></main></div>
    <div class="bar" id="bar" hidden></div>
    <div id="toast"></div>
    <script>
      'use strict';
      /* ====== Konfiguration ====== */
      const KEY = { settings: 'dk.settings', projects: 'dk.projects', data: 'dk.data' };

      /* ====== Hilfen ====== */
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s == null ? '' : s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      const LS = {
        get(k, d) {
          try {
            const v = localStorage.getItem(k);
            return v ? JSON.parse(v) : d;
          } catch (e) {
            return d;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, JSON.stringify(v));
          } catch (e) {}
        },
      };
      const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const fmt = (n, d = 1) =>
        n == null
          ? '—'
          : Number(n).toLocaleString('de-DE', {
              minimumFractionDigits: 0,
              maximumFractionDigits: d,
            });
      const fmtDate = (s) => {
        if (!s) return '';
        const m = String(s).match(/^(\d{4})-(\d\d)-(\d\d)/);
        return m ? `${m[3]}.${m[2]}.${m[1]}` : s;
      };
      const today = () => new Date().toISOString().slice(0, 10);
      function toast(t) {
        const e = $('#toast');
        e.textContent = t;
        e.classList.add('show');
        clearTimeout(toast.t);
        toast.t = setTimeout(() => e.classList.remove('show'), 3800);
      }
      const E = window.Engine;
      const RM = () =>
        !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); // Bewegung reduzieren
      function flash(el) {
        if (!el || RM()) return;
        el.classList.remove('flash');
        void el.offsetWidth;
        el.classList.add('flash');
      }

      /* ====== Zustand ====== */
      let settings = Object.assign({ firma: '', bearbeiter: '' }, LS.get(KEY.settings, {}));
      delete settings.sheetId;
      try {
        const g = localStorage.getItem('muther-theme');
        if (g) settings.theme = g;
      } catch (e) {} // Darstellung gilt für alle Apps gemeinsam
      function applyTheme() {
        try {
          localStorage.setItem('muther-theme', settings.theme || 'auto');
        } catch (e) {}
        const t = settings.theme === 'hell' ? 'light' : settings.theme === 'dunkel' ? 'dark' : '';
        if (t) document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.removeAttribute('data-theme');
      }
      applyTheme();
      const TH = {
        auto: ['Auto', 'contrast'],
        hell: ['Hell', 'light_mode'],
        dunkel: ['Dunkel', 'dark_mode'],
      };
      function themeBtn() {
        const k = settings.theme || 'auto',
          b = $('#btntheme');
        if (!b) return;
        const ico = $('#themeico');
        if (ico) ico.textContent = TH[k][1];
        b.setAttribute('aria-label', 'Darstellung: ' + TH[k][0] + ' (tippen zum Wechseln)');
        b.title = 'Darstellung: ' + TH[k][0];
      }
      let projects = LS.get(KEY.projects, []);
      let view = { name: 'list' };
      let DB = null,
        dataInfo = '';
      let lastPdf = null;
      let pdfBusy = null,
        pdfProg = 0; // pdfBusy = Id der Auslegung, deren PDF gerade erstellt wird
      let prevKpi = null,
        navBusy = false,
        hsubOut = null; // prevKpi: zuletzt angezeigte Werte (für Aufleuchten bei Änderung)

      function newRoom() {
        return {
          id: uid(),
          name: '',
          raumtyp: DB.raumtypen[0] ? DB.raumtypen[0].name : '',
          zuschlag: DB.zuschlaege[0] ? DB.zuschlaege[0].name : '',
          flaeche: '',
          bedarf: '',
          typ: 'Wandgerät',
          serie: DB.ig.some((x) => x.serie === 'Perfera' && x.typ === 'Wandgerät') ? 'Perfera' : '',
          modell: '',
          rohr: '',
          hoehe: '',
        };
      }
      function newProject() {
        return {
          id: uid(),
          nr: '',
          datum: today(),
          kunde: '',
          bearbeiter: settings.bearbeiter || '',
          bemerkung: '',
          odu: '',
          rooms: [newRoom(), newRoom()],
        };
      }
      const cur = () => projects.find((p) => p.id === view.id);
      const saveProjects = () => LS.set(KEY.projects, projects);

      /* ====== Daten laden ======
   Alle Daikin-Werte stecken in daten.js (erzeugt aus daten/*.csv). Kein Google Sheet: neue Daikin-Werte kommen per App-Update. */
      function loadData() {
        try {
          localStorage.removeItem(KEY.data);
        } catch (e) {} // Zwischenspeicher aus der früheren Google-Sheet-Anbindung
        DB = E.normalize(window.DATEN_SEED);
        dataInfo = DB.ein.datenstand || 'Daikin-Daten in der App';
      }

      /* ====== Ansicht ====== */
      let openRooms = new Set(),
        uiOpen = {};
      const roomEmpty = (r) => !r.name && !r.flaeche && !r.bedarf && !r.modell && !r.rohr;
      function go(name, extra) {
        view = Object.assign({ name }, extra);
        if (name === 'edit') {
          const p = cur();
          openRooms = new Set(p ? p.rooms.filter(roomEmpty).map((r) => r.id) : []);
          uiOpen = {};
        }
        prevKpi = null;
        render();
        window.scrollTo(0, 0);
      }
      const isRes = () => view.name === 'edit' && view.step === 'res';
      function setHeader() {
        const p = isRes() ? cur() : null;
        const hs = $('#hsub'),
          t = p
            ? (p.nr || 'ohne Projektnummer') + (p.kunde ? ' · ' + p.kunde : '')
            : 'Split / Multisplit R32';
        if (hsubOut) {
          hsubOut.cancel();
          hsubOut = null;
        }
        const changed = hs.textContent !== t;
        hs.textContent = t;
        if (changed && !RM() && hs.animate)
          hs.animate(
            [
              { opacity: 0, transform: 'translateY(6px)' },
              { opacity: 0.75, transform: 'none' },
            ],
            { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' },
          );
      }
      function barHtml() {
        if (view.name !== 'edit') return '';
        const p = cur();
        if (!isRes())
          return `<div><button class="btn" style="flex:.55" data-act="addroom"${p.rooms.length >= 5 ? ' disabled' : ''}><span class="ag-icon ag-icon--sm" aria-hidden="true">add</span>Raum</button><button class="btn primary" data-act="toresult">Ergebnis ansehen</button></div>`;
        const sel = EV ? selected() : null;
        return `<div><button class="btn" data-act="toinput">Ändern</button><button class="btn primary pdfb${pdfBusy === p.id ? ' run' : ''}" data-act="makepdf"${sel && sel.ok ? '' : ' disabled'}><span class="fill"${pdfBusy === p.id ? ` style="transform:scaleX(${pdfProg})"` : ''}></span><span class="l1"><span class="ag-icon ag-icon--sm" aria-hidden="true">download</span>PDF erstellen</span><span class="lr">PDF wird erstellt …</span><span class="l2"><span class="ag-icon ag-icon--sm" aria-hidden="true">check</span>PDF fertig</span></button>${lastPdf && lastPdf.id === p.id && sel && sel.ok ? '<button class="btn" style="flex:.7" data-act="sharepdf">Teilen</button>' : ''}</div>`;
      }
      function setBar() {
        const b = $('#bar'),
          h = barHtml();
        b.innerHTML = h;
        b.hidden = !h;
        document.body.classList.toggle('hasbar', !!h);
      }
      function render() {
        const y = window.scrollY;
        if (view.name === 'edit' && !cur()) {
          view = { name: 'list' };
        }
        setHeader();
        $('#app').innerHTML =
          view.name === 'list' ? vList() : view.name === 'edit' ? vEdit() : vSettings();
        if (view.name === 'edit') refreshResults();
        else setBar();
        if (window.iosAfterRender) iosAfterRender(view.name + (view.step ? '-' + view.step : ''));
        window.scrollTo(0, y);
      }
      function vList() {
        return `<div class="pagetitle">Auslegungen</div>
  <p class="muted">Multisplit-Kombinationen (R32) prüfen – nur Kombinationen, die Daikin freigibt, werden als „freigegeben“ angezeigt.</p>
  <div class="row"><button class="btn primary" data-act="new"><span class="ag-icon ag-icon--sm" aria-hidden="true">add</span>Neue Auslegung</button></div>
  <h2>Gespeichert auf diesem Gerät <span class="n" aria-hidden="true">${projects.length}</span></h2>
  ${
    projects.length
      ? projects
          .map(
            (
              p,
            ) => `<div class="card proj" data-act="open" data-id="${p.id}" role="button" tabindex="0">
    <span class="pi"><span class="ag-icon ag-icon--sm" aria-hidden="true">description</span></span>
    <span class="pt"><b>${esc(p.nr || 'ohne Projektnummer')}</b>${p.kunde ? `<span class="pk">${esc(p.kunde)}</span>` : ''}<small>${esc(fmtDate(p.datum))} · ${p.rooms.length} ${p.rooms.length === 1 ? 'Raum' : 'Räume'}</small></span>
    <button class="ib del" type="button" data-act="del" data-id="${p.id}" aria-label="Auslegung ${esc(p.nr || 'ohne Projektnummer')} löschen"><span class="ag-icon ag-icon--sm" aria-hidden="true">delete</span></button></div>`,
          )
          .join('')
      : '<div class="card empty"><b>Noch keine Auslegung</b><div class="muted">Mit „Neue Auslegung“ startest du die erste.</div></div>'
  }
  <p class="muted" style="font-size:14px;margin-top:24px">Datenstand: ${esc(dataInfo)}</p>`;
      }
      function vSettings() {
        return `<div class="pagetitle">Einstellungen</div>
  <div class="card">
    <div><label>Firmenname (für das PDF)</label><input id="s_firma" value="${esc(settings.firma)}"></div><br>
    <div><label>Bearbeiter (vorbelegt bei neuer Auslegung)</label><input id="s_bear" value="${esc(settings.bearbeiter)}"></div>
  </div>
  <div class="card"><label>Darstellung</label><select id="s_theme">${[
    ['auto', 'Automatisch (wie Gerät)'],
    ['hell', 'Hell'],
    ['dunkel', 'Dunkel'],
  ]
    .map((o) => opt(o[0], settings.theme || 'auto', o[1]))
    .join('')}</select>
    <div class="fhint">Das PDF bleibt immer hell.</div></div>
  <p class="muted">Datenstand: ${esc(dataInfo)}</p>
  <div class="row"><button class="btn primary" data-act="saveset">Speichern</button><button class="btn" data-act="back">Zurück</button></div>`;
      }

      function opt(v, sel, label) {
        return `<option value="${esc(v)}"${String(sel) === String(v) ? ' selected' : ''}>${esc(label == null ? v : label)}</option>`;
      }
      const CHEV = '<span class="ag-icon ag-icon--sm" aria-hidden="true">expand_more</span>';
      function roomSummary(r) {
        let u = null;
        try {
          u = E.pickUnit(r, DB);
        } catch (e) {}
        const a = [];
        if (E.num(r.flaeche) != null) a.push(fmt(E.num(r.flaeche)) + ' m²');
        if (u) a.push(u.modell);
        if (E.num(r.rohr) != null) a.push(fmt(E.num(r.rohr)) + ' m Rohr');
        return a.length ? a.join(' · ') : 'Raum bearbeiten';
      }
      function roomCard(r, i) {
        const typen = [...new Set(DB.ig.map((x) => x.typ))];
        const serien = [...new Set(DB.ig.filter((x) => x.typ === r.typ).map((x) => x.serie))];
        const modelle = DB.ig
          .filter((x) => x.typ === r.typ && (!r.serie || x.serie === r.serie))
          .sort((a, b) => a.klasse - b.klasse);
        const p = cur(),
          open = openRooms.has(r.id);
        const head = `<div class="acc" data-act="toggleroom" data-i="${i}" role="button" tabindex="0" aria-expanded="${open}"><div class="n">${i + 1}</div><div class="m"><b id="rt${i}">${esc(r.name || 'Raum ' + (i + 1))}</b><span id="sum${i}">${esc(roomSummary(r))}</span></div>${CHEV}</div>`;
        return `<div class="card roomcard${open ? ' open' : ''}" data-room="${i}">${head}<div class="body-w"><div class="roombody"><div class="body-in">
    <div class="grid3">
      <div><label>Raumname</label><input data-f="name" value="${esc(r.name)}" placeholder="z. B. Wohnzimmer"></div>
      <div><label>Raumtyp</label><select data-f="raumtyp">${DB.raumtypen.map((x) => opt(x.name, r.raumtyp)).join('')}</select></div>
      <div><label>Lage / Zuschlag</label><select data-f="zuschlag">${DB.zuschlaege.map((x) => opt(x.name, r.zuschlag)).join('')}</select></div>
      <div><label>Fläche (m²)</label><input data-f="flaeche" inputmode="decimal" value="${esc(r.flaeche)}" placeholder="z. B. 25"></div>
      <div><label>Kühlbedarf (kW)</label><input data-f="bedarf" inputmode="decimal" value="${esc(r.bedarf)}" placeholder="automatisch"><div class="fhint" id="bh${i}"></div></div>
      <div><label>Gerätetyp</label><select data-f="typ">${typen.map((x) => opt(x, r.typ)).join('')}</select></div>
      <div><label>Serie</label><select data-f="serie"><option value="">beliebig</option>${serien.map((x) => opt(x, r.serie)).join('')}</select></div>
      <div><label>Modell</label><select data-f="modell"><option value="">Automatisch (passend zum Bedarf)</option>${modelle.map((x) => opt(x.modell, r.modell, `${x.modell} · ${fmt(x.kw)} kW`)).join('')}</select></div>
      <div></div>
      <div><label>Rohrlänge zum Außengerät (m)</label><input data-f="rohr" inputmode="decimal" value="${esc(r.rohr)}" placeholder="einfache Länge"></div>
      <div><label>Höhe Innengerät zum Außengerät (m)</label><div class="row" style="flex-wrap:nowrap"><input data-f="hoehe" inputmode="decimal" value="${esc(r.hoehe)}" placeholder="0 = gleiche Ebene"><button type="button" class="btn" data-act="sign" style="flex:none;min-width:64px" aria-label="Vorzeichen wechseln">+ / −</button></div><div class="fhint">+ = Innengerät höher, − = tiefer als Außengerät</div></div>
    </div>
    <div class="pick" id="pick${i}"></div>
    ${p.rooms.length > 1 ? `<div style="margin-top:10px"><button class="btn small danger" data-act="delroom" data-i="${i}">Raum ${i + 1} entfernen</button></div>` : ''}
  </div></div></div></div>`;
      }
      function vEdit() {
        const p = cur();
        const steps = `<div class="steps"><button type="button" class="${isRes() ? '' : 'on'}" data-act="toinput">1 Eingabe</button><button type="button" class="${isRes() && !(lastPdf && lastPdf.id === p.id) ? 'on' : ''}" data-act="toresult">2 Ergebnis</button><div class="${isRes() && lastPdf && lastPdf.id === p.id ? 'on' : ''}">3 PDF</div></div>`;
        if (isRes()) return steps + `<div id="results"></div>`;
        return (
          steps +
          `<div class="row between" style="margin:6px 0"><button class="btn small" data-act="back">‹ Übersicht</button></div>
  <div class="card"><h3>Projekt</h3>
    <div class="g2" style="margin-bottom:10px">
      <div><label>Projektnummer</label><input data-p="nr" value="${esc(p.nr)}" placeholder="z. B. 2026-0123"></div>
      <div><label>Datum</label><input type="date" data-p="datum" value="${esc(p.datum)}"></div>
    </div>
    <div class="grid2">
      <div><label>Kunde / Objekt</label><input data-p="kunde" value="${esc(p.kunde)}"></div>
      <div><label>Bearbeiter</label><input data-p="bearbeiter" value="${esc(p.bearbeiter)}"></div>
    </div></div>
  <h2>Räume &amp; Innengeräte</h2>
  ${p.rooms.map(roomCard).join('')}
  <div class="card"><label>Bemerkungen (kommen ins PDF)</label><textarea data-p="bemerkung">${esc(p.bemerkung)}</textarea></div>`
        );
      }

      /* ====== Ergebnis ====== */
      let EV = null;
      function evaluate() {
        const p = cur();

      function odulineHtml(x, sel) {

      /* ====== PDF ====== */

      function gasDia(r) {

          return u.klasse <= 35 || (u.klasse === 42 && u.k42) ? 9.5 : u.klasse <= 60 ? 12.7 : 15.9;

      /* Bericht-Daten für das PDF (Auslegung p, gewähltes Außengerät x) – reportParts baut daraus die Seitenteile */

      /* Wechsel Eingabe <-> Ergebnis: alte Seite gleitet weg (schnell), neue gleitet herein; erst dann wird neu gezeichnet */
      function swapStep(step) {
        const to = step === 'res';
        if (isRes() === to || RM() || navBusy) {
          if (navBusy) return;
          view.step = step;
          prevKpi = null;
          render();
          window.scrollTo(0, 0);
          return;
        }
        navBusy = true;
        const app = $('#app'),
          dir = to ? 'fwd' : 'back',
          hs = $('#hsub');
        app.className = 'pg-out-' + dir;
        if (hs.animate)
          hsubOut = hs.animate(
            [
              { opacity: 0.75, transform: 'none' },
              { opacity: 0, transform: 'translateY(-6px)' },
            ],
            { duration: 180, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' },
          );
        const vid = view.id;
        setTimeout(() => {
          if (view.name !== 'edit' || view.id !== vid) {
            app.className = '';
            navBusy = false;
            return;
          } // Ansicht wurde inzwischen gewechselt
          view.step = step;
          prevKpi = null;
          render();
          window.scrollTo(0, 0);
          app.className = 'pg-in-' + dir + (to ? ' entering' : '');
          setTimeout(
            () => {
              app.className = '';
              navBusy = false;
            },
            to ? 800 : 300,
          );
        }, 180);
      }
      /* ====== Aktionen ====== */
      const Act = {
        new() {
          const p = newProject();
          projects.unshift(p);
          saveProjects();
          go('edit', { id: p.id });
        },
        open(d) {
          go('edit', { id: d.id });
        },
        del(d) {
          const p = projects.find((x) => x.id === d.id);
          if (p && confirm('Auslegung „' + (p.nr || 'ohne Projektnummer') + '“ löschen?')) {
            projects = projects.filter((x) => x.id !== d.id);
            saveProjects();
            render();
          }
        },
        back() {
          go('list');
        },
        toresult() {
          swapStep('res');
        },
        toinput() {
          swapStep('in');
        },
        /* Nur Klasse umschalten (kein Neuzeichnen): so läuft die Animation nur beim Antippen und Eingabefelder behalten den Fokus */
        toggleroom(d, el) {
          const r = cur().rooms[+d.i],
            card = el.closest('.roomcard');
          if (!r || !card) return;
          const open = !openRooms.has(r.id);
          if (open) openRooms.add(r.id);
          else openRooms.delete(r.id);
          card.classList.toggle('open', open);
          el.setAttribute('aria-expanded', open);
        },
        addroom() {
          const p = cur();
          if (p.rooms.length < 5) {
            const r = newRoom();
            p.rooms.push(r);
            openRooms.add(r.id);
            saveProjects();
            render();
          }
        },
        sign(d, btn) {
          const inp = btn.parentElement.querySelector('input'),
            card = btn.closest('[data-room]'),
            p = cur();
          if (!inp || !card || !p) return;
          let v = inp.value.trim().replace('−', '-');
          v = v.startsWith('-') ? v.slice(1) : v === '' ? '-' : '-' + v.replace(/^\+/, '');
          inp.value = v;
          p.rooms[+card.dataset.room].hoehe = v;
          lastPdf = null;
          saveProjects();
          refreshResults();
          inp.focus();
        },
        delroom(d) {
          const p = cur();
          p.rooms.splice(+d.i, 1);
          saveProjects();
          render();
        },
        pickodu(d) {
          const p = cur();
          p.odu = p.odu === d.id ? '' : d.id;
          saveProjects();
          lastPdf = null;
          refreshResults();
        },
        async makepdf(d, btn) {
          if (!window.jspdf || !window.html2canvas) {
            toast('PDF-Modul nicht geladen – App einmal online neu starten.');
            return;
          }
          if (pdfBusy) return;
          const p = cur(),
            x = selected();
          if (!x || !x.ok) return;
          if (btn.classList.contains('done')) return;
          const snap = () =>
            JSON.stringify([
              p.rooms,
              p.odu,
              p.nr,
              p.datum,
              p.kunde,
              p.bearbeiter,
              p.bemerkung,
              settings.firma,
            ]);
          const s0 = snap();
          const cb = () => $('#bar .pdfb'); // immer der aktuell im DOM befindliche Knopf (die Leiste wird bei Änderungen neu gebaut)
          const setP = (v) => {
            pdfProg = v;
            const f = $('#bar .pdfb .fill');
            if (f) f.style.transform = 'scaleX(' + v + ')';
          };
          pdfBusy = p.id;
          pdfProg = 0;
          {
            const b = cb();
            if (b) b.classList.add('run');
          }
          setP(0.05);
          try {
            const blob = await reportPdfBlob(buildReport(p, x), { onProgress: setP });
            setP(1);
            await new Promise((res) => setTimeout(res, RM() ? 0 : 240));
            if (!projects.includes(p) || snap() !== s0) {
              toast('Daten geändert – PDF bitte neu erstellen');
              return;
            }
            if (lastPdf) URL.revokeObjectURL(lastPdf.url);
            lastPdf = {
              id: p.id,
              file: new File([blob], pdfName(p.nr) + '.pdf', { type: 'application/pdf' }),
              url: URL.createObjectURL(blob),
            };
            pdfBusy = null;
            if (view.name === 'edit' && view.id === p.id) {
              refreshResults(); // baut Leiste neu auf -> neuen Knopf in den Fertig-Zustand setzen
              const nb = cb();
              if (nb) {
                nb.classList.remove('run');
                nb.classList.add('done');
                setTimeout(() => nb.classList.remove('done'), 2600);
              }
              toast(
                'PDF „' + (p.nr || 'ohne Projektnummer') + '“ ist fertig. Jetzt „Teilen“ antippen.',
              );
            } else toast('PDF „' + (p.nr || 'ohne Projektnummer') + '“ ist fertig.');
          } catch (e) {
            toast('PDF konnte nicht erstellt werden: ' + e.message);
          } finally {
            pdfBusy = null;
            pdfProg = 0;
            const b = cb();
            if (b && !b.classList.contains('done')) {
              b.classList.remove('run');
              setP(0);
            }
          }
        },
        async sharepdf() {
          if (!lastPdf) return;
          const files = [lastPdf.file];
          if (navigator.canShare && navigator.canShare({ files })) {
            try {
              await navigator.share({ files, title: lastPdf.file.name });
            } catch (e) {
              if (e.name !== 'AbortError') toast('Teilen fehlgeschlagen: ' + e.message);
            }
          } else if (isStandalone()) window.open(lastPdf.url, '_blank');
          else {
            const a = document.createElement('a');
            a.href = lastPdf.url;
            a.download = lastPdf.file.name;
            document.body.appendChild(a);
            a.click();
            a.remove();
          }
        },
        saveset() {
          settings.theme = $('#s_theme').value;
          applyTheme();
          themeBtn();
          settings.firma = $('#s_firma').value.trim();
          settings.bearbeiter = $('#s_bear').value.trim();
          LS.set(KEY.settings, settings);
          toast('Einstellungen gespeichert.');
          go('list');
        },
      };
      document.addEventListener('keydown', (e) => {
        if (
          (e.key === 'Enter' || e.key === ' ') &&
          e.target.getAttribute &&
          e.target.getAttribute('role') === 'button' &&
          e.target.tagName !== 'BUTTON'
        ) {
          e.preventDefault();
          e.target.click();
        }
      });
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-act]');
        if (!el || !Act[el.dataset.act]) return;
        Act[el.dataset.act](el.dataset, el);
      });
      $('#btnset').onclick = () => go('settings');
      $('#btntheme').onclick = () => {
        settings.theme = { auto: 'hell', hell: 'dunkel', dunkel: 'auto' }[settings.theme || 'auto'];
        LS.set(KEY.settings, settings);
        applyTheme();
        themeBtn();
        const s = $('#s_theme');
        if (s) s.value = settings.theme;
      };
      $('#ttl').onclick = () => go('list');
      document.addEventListener(
        'toggle',
        (e) => {
          const k = e.target.dataset && e.target.dataset.k;
          if (k) uiOpen[k] = e.target.open;
        },
        true,
      );

      /* Eingaben: Texte/Zahlen aktualisieren nur das Ergebnis, Auswahlfelder zeichnen neu */
      document.addEventListener('input', (e) => {
        const t = e.target,
          p = view.name === 'edit' ? cur() : null;
        if (!p) return;
        if (t.dataset.p) {
          p[t.dataset.p] = t.value;
          lastPdf = null;
          saveProjects();
          return;
        }
        const card = t.closest('[data-room]');
        if (!card || !t.dataset.f || t.tagName === 'SELECT') return;
        p.rooms[+card.dataset.room][t.dataset.f] = t.value;
        lastPdf = null;
        saveProjects();
        refreshResults();
      });
      document.addEventListener('change', (e) => {
        if (e.target.id === 's_theme') {
          settings.theme = e.target.value;
          LS.set(KEY.settings, settings);
          applyTheme();
          themeBtn();
          return;
        }
        const t = e.target,
          p = view.name === 'edit' ? cur() : null;
        if (!p) return;
        const card = t.closest('[data-room]');
        if (!card || !t.dataset.f || t.tagName !== 'SELECT') return;
        const r = p.rooms[+card.dataset.room],
          f = t.dataset.f;
        r[f] = t.value;
        lastPdf = null;
        if (f === 'typ') {
          const s = [...new Set(DB.ig.filter((x) => x.typ === r.typ).map((x) => x.serie))];
          r.serie = s.includes('Perfera') ? 'Perfera' : s[0] || '';
          r.modell = '';
        }
        if (f === 'serie') r.modell = '';
        saveProjects();
        render();
      });
      window.addEventListener('online', () => {
        $('#net').textContent = 'online';
        $('#net').classList.remove('off');
      });
      window.addEventListener('offline', () => {
        $('#net').textContent = 'offline';
        $('#net').classList.add('off');
      });
      if (!navigator.onLine) {
        $('#net').textContent = 'offline';
        $('#net').classList.add('off');
      }

      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
      /* Wischen vom linken Rand zurück: Ergebnis -> Eingabe, Eingabe -> Liste (sonst null). Elternansicht wird nur lesend gerendert. */
      if (window.iosSwipe)
        iosSwipe.init({
          back() {
            if (view.name !== 'edit' || !cur()) return null;
            if (isRes()) {
              const keep = view.step;
              let html;
              try {
                view.step = 'in';
                html = vEdit();
              } finally {
                view.step = keep;
              }
              return {
                html,
                go() {
                  view.step = 'in';
                  prevKpi = null;
                  render();
                  window.scrollTo(0, 0);
                },
              };
            }
            return {
              html: vList(),
              go() {
                go('list');
              },
            };
          },
        });
      loadData();
      themeBtn();
      render();
    </script>
  </body>
</html>
