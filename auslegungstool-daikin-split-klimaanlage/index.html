<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--flash:rgba(220,204,75,.32);--pri:#0a0a0a;--tile:#3a3516;--sh:0 6px 18px rgba(0,0,0,.5);color-scheme:dark;--bg:#121212;--card:#1e1e1e;--ink:#f0eee6;--muted:#a8a69d;--line:#383530;--cream:#26241c;--gold-text:#DCCC4B;--ok:#4cc27f;--bad:#ef7070;--warn:#f0a53a;--ctl:#2a2a2a;--selbg:#3a3516;--bdg:#2f3338;--okbg:#16301f;--okbd:#2c6b43;--okfg:#b8e8c9;--wbg:#3a2a10;--wbd:#7a5518;--wfg:#ffd9a0;--ebg:#3a1818;--ebd:#7a2c2c;--efg:#ffc4c4;--hbg:#3a3516;--hfg:#f3e9a8}}

.card h3{margin:0 0 10px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.acc .m{flex:1;min-width:0}.acc .m b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acc .m span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url(lib/fonts/plus-jakarta-sans-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
.a4{width:794px;height:1123px;background:#fff;color:#1a1a1a;padding:46px 52px 34px;display:flex;flex-direction:column;font:11.2px/1.42 Helvetica,Arial,sans-serif;overflow:hidden;box-sizing:border-box;
  --gold:#DCCC4B;--ink2:#3a3a3a;--ink3:#6a6967;--line:#dcd9cf;--ls:#eceae3;--z:#faf9f5;--hb:#f8f7f4;--ok:#1e7a46;--okbg:#e6f4ec;--warn:#8a5a00;--warnbg:#fdf3d6}
.a4 *{box-sizing:border-box;text-transform:none}
.a4 .pb{flex:1;min-height:0;overflow:hidden}
.a4 .hd2{display:flex;justify-content:space-between;gap:24px;padding-bottom:14px;border-bottom:3px solid var(--gold)}
.a4 .lg{width:60px;height:60px;border:1.5px dashed #bdbab0;border-radius:8px;display:grid;place-items:center;font-size:9px;color:var(--ink3);text-align:center;flex:none}
.a4 .fm{display:flex;gap:14px;align-items:center}.a4 .fm b{font-size:14px;display:block}.a4 .fm span{color:var(--ink2);font-size:10.5px}
.a4 .dc{text-align:right}.a4 .dc .k{font-size:9px;letter-spacing:.14em;color:var(--ink3)}.a4 .dc h1{margin:2px 0 4px;font-size:22px;line-height:1.1;letter-spacing:-.01em;color:#1a1a1a}.a4 .dc .mt{color:var(--ink2);font-size:10.5px}.a4 .dc .mt b{color:#1a1a1a}
.a4 .hd2.small{padding-bottom:8px}.a4 .hd2.small .lg{display:none}.a4 .hd2.small .dc h1{font-size:15px;margin:0 0 2px}.a4 .hd2.small .dc .k{display:none}
.a4 .tiles{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;margin:14px 0 4px}
.a4 .tile{border:1px solid var(--line);border-radius:7px;padding:9px 11px}.a4 .tile .lab{font-size:8.5px;letter-spacing:.1em;color:var(--ink3);font-weight:600}.a4 .tile .val{font-size:17px;font-weight:700;margin-top:3px;line-height:1.15}.a4 .tile .sb{font-size:10px;color:var(--ink2);margin-top:3px}
.a4 .tile.ok{border-color:var(--ok);border-left:4px solid var(--ok);background:var(--okbg)}.a4 .tile.ok .val{color:var(--ok)}
.a4 .tile.pr{border-color:var(--gold);border-left:4px solid var(--gold);background:#faf6dc}
.a4 .sec{margin-top:14px}.a4 .sec h2{display:flex;align-items:center;gap:9px;margin:0 0 6px;font-size:12px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--line);color:#1a1a1a}
.a4 .sec h2 i{font-style:normal;width:18px;height:18px;border-radius:4px;background:var(--gold);display:grid;place-items:center;font-size:10px;flex:none}
.a4 table{width:100%;border-collapse:collapse}.a4 th{background:var(--hb);font-size:8.6px;font-weight:700;letter-spacing:.06em;color:var(--ink2);text-align:left;padding:5px 6px;border-bottom:1.5px solid var(--gold)}
.a4 td{padding:5px 6px;border-bottom:1px solid var(--ls);vertical-align:top;color:#1a1a1a}.a4 tbody tr:nth-child(even) td{background:var(--z)}
.a4 td.n,.a4 th.n{text-align:right}.a4 .mb{font-weight:700}.a4 td small{display:block;color:var(--ink3);font-size:9px}
.a4 .kv{display:grid;grid-template-columns:repeat(4,1fr);column-gap:14px;margin:0}.a4 .kv div{padding:4px 0;border-bottom:1px solid var(--ls)}.a4 .kv dt{font-size:8.6px;letter-spacing:.06em;color:var(--ink3)}.a4 .kv dd{margin:1px 0 0;font-weight:600;font-size:11.5px}
.a4 .kv .w2{grid-column:span 2}
.a4 .note{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:4px;padding:8px 11px;margin-top:12px}.a4 .note b.t{display:block;font-size:8.6px;letter-spacing:.09em;color:var(--ink3);margin-bottom:2px}
.a4 .note.warn{border-left-color:#b26a00;background:var(--warnbg)}.a4 .note ul{margin:3px 0 0;padding-left:16px}
.a4 .fn{font-size:9.5px;color:var(--ink3);margin-top:3px}
.a4 .ft{border-top:1px solid var(--line);padding-top:7px;margin-top:8px;display:flex;justify-content:space-between;gap:16px;font-size:8.6px;color:var(--ink3);flex:none}
.a4{overflow-wrap:anywhere}.a4 td{word-break:break-word}.a4 .sec h2{letter-spacing:0}
.a4 .ft .pno{white-space:nowrap;font-weight:600;color:var(--ink2)}
</style>
</head>
<body>
<header><div class="logo">D</div><div class="tt" id="ttl"><h1>Daikin-Auslegung</h1><span id="hsub">Split / Multisplit R32</span></div><span class="net" id="net">online</span>
<button class="ib" id="btntheme" type="button"><svg class="ico" id="themeico" viewBox="0 0 24 24" aria-hidden="true"></svg></button>
<button class="ib" id="btnset" type="button" aria-label="Einstellungen"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></header>
<div class="wrap"><div class="info"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg><span><b>Kombinationshilfe zur ersten Prüfung.</b> Endgültige Kalkulation vor Angebot prüfen.</span></div></div>
<div class="stage"><main id="app"></main></div>
<div class="bar" id="bar" hidden></div>
<div id="toast"></div>
<script>
'use strict';
/* ====== Konfiguration ====== */
const KEY = { settings: 'dk.settings', projects: 'dk.projects', data: 'dk.data' };

/* ====== Hilfen ====== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmt = (n, d = 1) => n == null ? '—' : Number(n).toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: d });
const fmtDate = s => { if (!s) return ''; const m = String(s).match(/^(\d{4})-(\d\d)-(\d\d)/); return m ? `${m[3]}.${m[2]}.${m[1]}` : s; };
const today = () => new Date().toISOString().slice(0, 10);
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 3800); }
const E = window.Engine;
const RM = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);   // Bewegung reduzieren
function flash(el){ if (!el || RM()) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

/* ====== Zustand ====== */
let settings = Object.assign({ firma: '', bearbeiter: '' }, LS.get(KEY.settings, {}));
delete settings.sheetId;
try{ const g = localStorage.getItem('muther-theme'); if (g) settings.theme = g; }catch(e){}   // Darstellung gilt für alle Apps gemeinsam
function applyTheme(){
  try{ localStorage.setItem('muther-theme', settings.theme || 'auto'); }catch(e){}
  const t = settings.theme === 'hell' ? 'light' : settings.theme === 'dunkel' ? 'dark' : '';
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
}
applyTheme();
const TH = { auto: ['Auto', '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>'], hell: ['Hell', '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'], dunkel: ['Dunkel', '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>'] };
function themeBtn(){ const k = settings.theme || 'auto', b = $('#btntheme'); if (!b) return; $('#themeico').innerHTML = TH[k][1]; b.setAttribute('aria-label', 'Darstellung: ' + TH[k][0] + ' (tippen zum Wechseln)'); b.title = 'Darstellung: ' + TH[k][0]; }
let projects = LS.get(KEY.projects, []);
let view = { name: 'list' };
let DB = null, dataInfo = '';
let lastPdf = null;
let pdfBusy = null, pdfProg = 0;   // pdfBusy = Id der Auslegung, deren PDF gerade erstellt wird
let prevKpi = null, navBusy = false, hsubOut = null;   // prevKpi: zuletzt angezeigte Werte (für Aufleuchten bei Änderung)

function newRoom(){ return { id: uid(), name: '', raumtyp: DB.raumtypen[0] ? DB.raumtypen[0].name : '', zuschlag: DB.zuschlaege[0] ? DB.zuschlaege[0].name : '',
  flaeche: '', bedarf: '', typ: 'Wandgerät', serie: DB.ig.some(x => x.serie === 'Perfera' && x.typ === 'Wandgerät') ? 'Perfera' : '', modell: '', rohr: '', hoehe: '' }; }
function newProject(){ return { id: uid(), nr: '', datum: today(), kunde: '', bearbeiter: settings.bearbeiter || '', bemerkung: '', odu: '', rooms: [newRoom(), newRoom()] }; }
const cur = () => projects.find(p => p.id === view.id);
const saveProjects = () => LS.set(KEY.projects, projects);

/* ====== Daten laden ======
   Alle Daikin-Werte stecken in daten.js (erzeugt aus daten/*.csv). Kein Google Sheet: neue Daikin-Werte kommen per App-Update. */
function loadData(){
  try{ localStorage.removeItem(KEY.data); }catch(e){}   // Zwischenspeicher aus der früheren Google-Sheet-Anbindung
  DB = E.normalize(window.DATEN_SEED);
  dataInfo = DB.ein.datenstand || 'Daikin-Daten in der App';
}

/* ====== Ansicht ====== */
let openRooms = new Set(), uiOpen = {};
const roomEmpty = r => !r.name && !r.flaeche && !r.bedarf && !r.modell && !r.rohr;
function go(name, extra){
  view = Object.assign({ name }, extra);
  if (name === 'edit'){ const p = cur(); openRooms = new Set(p ? p.rooms.filter(roomEmpty).map(r => r.id) : []); uiOpen = {}; }
  prevKpi = null; render(); window.scrollTo(0, 0);
}
const isRes = () => view.name === 'edit' && view.step === 'res';
function setHeader(){
  const p = isRes() ? cur() : null;
  const hs = $('#hsub'), t = p ? (p.nr || 'ohne Projektnummer') + (p.kunde ? ' · ' + p.kunde : '') : 'Split / Multisplit R32';
  if (hsubOut){ hsubOut.cancel(); hsubOut = null; }
  const changed = hs.textContent !== t;
  hs.textContent = t;
  if (changed && !RM() && hs.animate) hs.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: .75, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });
}
function barHtml(){
  if (view.name !== 'edit') return '';
  const p = cur();
  if (!isRes()) return `<div><button class="btn" style="flex:.55" data-act="addroom"${p.rooms.length >= 5 ? ' disabled' : ''}><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Raum</button><button class="btn primary" data-act="toresult">Ergebnis ansehen</button></div>`;
  const sel = EV ? selected() : null;
  return `<div><button class="btn" data-act="toinput">Ändern</button><button class="btn primary pdfb${pdfBusy === p.id ? ' run' : ''}" data-act="makepdf"${sel && sel.ok ? '' : ' disabled'}><span class="fill"${pdfBusy === p.id ? ` style="transform:scaleX(${pdfProg})"` : ''}></span><span class="l1"><svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>PDF erstellen</span><span class="lr">PDF wird erstellt …</span><span class="l2">✓ PDF fertig</span></button></div>`;
}
function setBar(){
  const b = $('#bar'), h = barHtml();
  b.innerHTML = h; b.hidden = !h; document.body.classList.toggle('hasbar', !!h);
}
function render(){
  const y = window.scrollY;
  if (view.name === 'edit' && !cur()){ view = { name: 'list' }; }
  setHeader();
  $('#app').innerHTML = view.name === 'list' ? vList() : view.name === 'edit' ? vEdit() : vSettings();
  if (view.name === 'edit') refreshResults(); else setBar();
  window.scrollTo(0, y);
}
function vList(){
  return `<div class="pagetitle">Auslegungen</div>
  <p class="muted">Multisplit-Kombinationen (R32) prüfen – nur Kombinationen, die Daikin freigibt, werden als „freigegeben“ angezeigt.</p>
  <div class="row"><button class="btn primary" data-act="new"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Neue Auslegung</button></div>
  <h2>Gespeichert auf diesem Gerät <span class="n" aria-hidden="true">${projects.length}</span></h2>
  ${projects.length ? projects.map(p => `<div class="card proj" data-act="open" data-id="${p.id}" role="button" tabindex="0">
    <span class="pi"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></span>
    <span class="pt"><b>${esc(p.nr || 'ohne Projektnummer')}</b>${p.kunde ? `<span class="pk">${esc(p.kunde)}</span>` : ''}<small>${esc(fmtDate(p.datum))} · ${p.rooms.length} ${p.rooms.length === 1 ? 'Raum' : 'Räume'}</small></span>
    <button class="ib del" type="button" data-act="del" data-id="${p.id}" aria-label="Auslegung ${esc(p.nr || 'ohne Projektnummer')} löschen"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button></div>`).join('') : '<div class="card empty"><b>Noch keine Auslegung</b><div class="muted">Mit „Neue Auslegung“ startest du die erste.</div></div>'}
  <p class="muted" style="font-size:14px;margin-top:24px">Datenstand: ${esc(dataInfo)}</p>`;
}
function vSettings(){
  return `<div class="pagetitle">Einstellungen</div>
  <div class="card">
    <div><label>Firmenname (für das PDF)</label><input id="s_firma" value="${esc(settings.firma)}"></div><br>
    <div><label>Bearbeiter (vorbelegt bei neuer Auslegung)</label><input id="s_bear" value="${esc(settings.bearbeiter)}"></div>
  </div>
  <div class="card"><label>Darstellung</label><select id="s_theme">${[['auto', 'Automatisch (wie Gerät)'], ['hell', 'Hell'], ['dunkel', 'Dunkel']].map(o => opt(o[0], settings.theme || 'auto', o[1])).join('')}</select>
    <div class="fhint">Das PDF bleibt immer hell.</div></div>
  <p class="muted">Datenstand: ${esc(dataInfo)}</p>
  <div class="row"><button class="btn primary" data-act="saveset">Speichern</button><button class="btn" data-act="back">Zurück</button></div>`;
}

function opt(v, sel, label){ return `<option value="${esc(v)}"${String(sel) === String(v) ? ' selected' : ''}>${esc(label == null ? v : label)}</option>`; }
const CHEV = '<svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
function roomSummary(r){
  let u = null; try{ u = E.pickUnit(r, DB); }catch(e){}
  const a = [];
  if (E.num(r.flaeche) != null) a.push(fmt(E.num(r.flaeche)) + ' m²');
  if (u) a.push(u.modell);
  if (E.num(r.rohr) != null) a.push(fmt(E.num(r.rohr)) + ' m Rohr');
  return a.length ? a.join(' · ') : 'Raum bearbeiten';
}
function roomCard(r, i){
  const typen = [...new Set(DB.ig.map(x => x.typ))];
  const serien = [...new Set(DB.ig.filter(x => x.typ === r.typ).map(x => x.serie))];
  const modelle = DB.ig.filter(x => x.typ === r.typ && (!r.serie || x.serie === r.serie)).sort((a, b) => a.klasse - b.klasse);
  const p = cur(), open = openRooms.has(r.id);
  const head = `<div class="acc" data-act="toggleroom" data-i="${i}" role="button" tabindex="0" aria-expanded="${open}"><div class="n">${i + 1}</div><div class="m"><b id="rt${i}">${esc(r.name || 'Raum ' + (i + 1))}</b><span id="sum${i}">${esc(roomSummary(r))}</span></div>${CHEV}</div>`;
  return `<div class="card roomcard${open ? ' open' : ''}" data-room="${i}">${head}<div class="body-w"><div class="roombody"><div class="body-in">
    <div class="grid3">
      <div><label>Raumname</label><input data-f="name" value="${esc(r.name)}" placeholder="z. B. Wohnzimmer"></div>
      <div><label>Raumtyp</label><select data-f="raumtyp">${DB.raumtypen.map(x => opt(x.name, r.raumtyp)).join('')}</select></div>
      <div><label>Lage / Zuschlag</label><select data-f="zuschlag">${DB.zuschlaege.map(x => opt(x.name, r.zuschlag)).join('')}</select></div>
      <div><label>Fläche (m²)</label><input data-f="flaeche" inputmode="decimal" value="${esc(r.flaeche)}" placeholder="z. B. 25"></div>
      <div><label>Kühlbedarf (kW)</label><input data-f="bedarf" inputmode="decimal" value="${esc(r.bedarf)}" placeholder="automatisch"><div class="fhint" id="bh${i}"></div></div>
      <div><label>Gerätetyp</label><select data-f="typ">${typen.map(x => opt(x, r.typ)).join('')}</select></div>
      <div><label>Serie</label><select data-f="serie"><option value="">beliebig</option>${serien.map(x => opt(x, r.serie)).join('')}</select></div>
      <div><label>Modell</label><select data-f="modell"><option value="">Automatisch (passend zum Bedarf)</option>${modelle.map(x => opt(x.modell, r.modell, `${x.modell} · ${fmt(x.kw)} kW`)).join('')}</select></div>
      <div></div>
      <div><label>Rohrlänge zum Außengerät (m)</label><input data-f="rohr" inputmode="decimal" value="${esc(r.rohr)}" placeholder="einfache Länge"></div>
      <div><label>Höhe Innengerät zum Außengerät (m)</label><div class="row" style="flex-wrap:nowrap"><input data-f="hoehe" inputmode="decimal" value="${esc(r.hoehe)}" placeholder="0 = gleiche Ebene"><button type="button" class="btn" data-act="sign" style="flex:none;min-width:64px" aria-label="Vorzeichen wechseln">+ / −</button></div><div class="fhint">+ = Innengerät höher, − = tiefer als Außengerät</div></div>
    </div>
    <div class="pick" id="pick${i}"></div>
    ${p.rooms.length > 1 ? `<div style="margin-top:10px"><button class="btn small danger" data-act="delroom" data-i="${i}">Raum ${i + 1} entfernen</button></div>` : ''}
  </div></div></div></div>`;
}
function vEdit(){
  const p = cur();
  const steps = `<div class="steps"><button type="button" class="${isRes() ? '' : 'on'}" data-act="toinput">1 Eingabe</button><button type="button" class="${isRes() && !(lastPdf && lastPdf.id === p.id) ? 'on' : ''}" data-act="toresult">2 Ergebnis</button><div class="${isRes() && lastPdf && lastPdf.id === p.id ? 'on' : ''}">3 PDF</div></div>`;
  if (isRes()) return steps + `<div id="results"></div>`;
  return steps + `<div class="row between" style="margin:6px 0"><button class="btn small" data-act="back">‹ Übersicht</button></div>
  <div class="card"><h3>Projekt</h3>
    <div class="g2" style="margin-bottom:10px">
      <div><label>Projektnummer</label><input data-p="nr" value="${esc(p.nr)}" placeholder="z. B. 2026-0123"></div>
      <div><label>Datum</label><input type="date" data-p="datum" value="${esc(p.datum)}"></div>
    </div>
    <div class="grid2">
      <div><label>Kunde / Objekt</label><input data-p="kunde" value="${esc(p.kunde)}"></div>
      <div><label>Bearbeiter</label><input data-p="bearbeiter" value="${esc(p.bearbeiter)}"></div>
    </div></div>
  <h2>Räume &amp; Innengeräte</h2>
  ${p.rooms.map(roomCard).join('')}
  <div class="card"><label>Bemerkungen (kommen ins PDF)</label><textarea data-p="bemerkung">${esc(p.bemerkung)}</textarea></div>`;
}

/* ====== Ergebnis ====== */
let EV = null;
function evaluate(){ const p = cur(); EV = E.evaluateAll(p.rooms, DB); return EV; }
function selected(){
  const p = cur(); if (!EV) evaluate();
  return (p.odu && EV.all.find(x => x.odu.id === p.odu)) || EV.best || null;
}
function refreshHints(){
  const p = cur();
  p.rooms.forEach((r, i) => {
    const rt = $('#rt' + i); if (rt) rt.textContent = r.name || 'Raum ' + (i + 1);
    const sm = $('#sum' + i); if (sm){ const t = roomSummary(r); if (sm.textContent !== t){ sm.textContent = t; flash(sm); } }

/* Verteilt die Blöcke auf A4-Seiten (Tabellen zeilenweise mit wiederholtem Kopf, Abschnitte nie mitten durch). host muss im Dokument hängen. */
function layoutReport(rep, host){
  const pages = []; let body;
  const el = html => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
  const newPage = () => {
    const pg = el(`<section class="a4"><div class="pb">${pages.length ? rep.smallHead : rep.head}</div><div class="ft"><span>${rep.foot}</span><span class="pno"></span></div></section>`);
    host.appendChild(pg); pages.push(pg); body = pg.firstElementChild;
  };
  const fits = () => body.scrollHeight <= body.clientHeight + 1;
  const MAXP = 30, CUT = '<b>… (gekürzt, vollständiger Text in der App)</b> ';
  const truncated = () => { const ft = pages[pages.length - 1].querySelector('.ft span'); if (!ft.dataset.cut){ ft.dataset.cut = '1'; ft.insertAdjacentHTML('afterbegin', CUT); } };
  const hasContent = () => body.children.length > 1;   // Kind 0 ist der Seitenkopf
  host.innerHTML = ''; newPage();
  rep.blocks.forEach(blk => {
    if (blk.noteSplit){
      // Langer Text: wortweise (zu lange Wörter in Stücken) auf Folgeseiten verteilen; Binärsuche je Seite
      const tokens = blk.text.split(/(\s+)/).flatMap(t => t.length > 100 ? t.match(/[\s\S]{1,100}/g) : [t]).filter(t => t !== '');
      let pos = 0, cont = false;
      while (pos < tokens.length){
        if (cont) while (pos < tokens.length && !tokens[pos].trim()) pos++;
        if (pos >= tokens.length) break;
        const node = el(`<div class="note"><b class="t">${blk.t}${cont ? ' (FORTSETZUNG)' : ''}</b><span class="tx"></span></div>`), tx = node.querySelector('.tx');
        const setK = k => { tx.innerHTML = esc(tokens.slice(pos, pos + k).join('')).replace(/\n/g, '<br>'); };
        body.appendChild(node);
        const rest = tokens.length - pos;
        setK(rest);
        let k = rest;
        if (!fits()){
          let lo = 0, hi = rest - 1;   // größtes k, das noch passt
          while (lo < hi){ const mid = (lo + hi + 1) >> 1; setK(mid); if (fits()) lo = mid; else hi = mid - 1; }
          k = lo;
          if (k < 1){   // nicht einmal ein Stück passt
            if (hasContent() && body.children.length > 2){ node.remove(); if (pages.length >= MAXP){ truncated(); return; } newPage(); continue; }
            k = 1;   // leere Seite: mindestens ein Stück, damit es weitergeht
          }
          setK(k);
        }
        pos += k; cont = true;
        if (pos < tokens.length){ if (pages.length >= MAXP){ truncated(); return; } newPage(); }
      }
      return;
    }
    if (!blk.split){
      const node = el(blk.html); body.appendChild(node);
      if (!fits()){
        if (body.children.length > 2){ node.remove(); newPage(); body.appendChild(node); if (!fits()) truncated(); }
        else truncated();
      }
      return;
    }
    const shell = cont => el(`<div class="sec"><h2><i>${blk.num}</i>${esc(blk.title)}${cont ? ' (Fortsetzung)' : ''}</h2><table><thead>${blk.head}</thead><tbody></tbody></table></div>`);
    const tmp = document.createElement('tbody'); tmp.innerHTML = blk.rows;
    const rows = [...tmp.children];
    let part = shell(false), placed = 0; body.appendChild(part);
    rows.forEach(tr => {
      part.querySelector('tbody').appendChild(tr);
      if (fits()){ placed++; return; }
      if (!placed && body.children.length <= 2){ placed++; truncated(); return; }   // einzelne Zeile füllt schon eine leere Seite nicht
      tr.remove();
      if (!placed) part.remove();
      const cont = placed > 0; newPage(); part = shell(cont); body.appendChild(part);
      part.querySelector('tbody').appendChild(tr); placed = 1;
    });
    if (blk.note){ const nt = el(blk.note); part.appendChild(nt); if (!fits()){ nt.remove(); newPage(); body.appendChild(nt); } }
  });
  pages.forEach((p, i) => { p.querySelector('.pno').textContent = `Seite ${i + 1} von ${pages.length}`; });
  return pages;
}
async function reportToPdf(rep, onProgress){
  const prog = v => { try{ if (onProgress) onProgress(v); }catch(e){} };
  try{ await document.fonts.ready; }catch(e){}
  prog(.12);
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;background:#fff;color-scheme:light';
  document.body.appendChild(box);
  try{
    const pages = layoutReport(rep, box);
    prog(.2);
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    for (let i = 0; i < pages.length; i++){
      const canvas = await html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', logging: false, windowWidth: 794 });
      if (i) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.88), 'JPEG', 0, 0, 210, 297);
      prog(.2 + .78 * (i + 1) / pages.length);
    }
    return pdf.output('blob');
  } finally { box.remove(); }
}

/* Wechsel Eingabe <-> Ergebnis: alte Seite gleitet weg (schnell), neue gleitet herein; erst dann wird neu gezeichnet */
function swapStep(step){
  const to = step === 'res';
  if (isRes() === to || RM() || navBusy){ if (navBusy) return; view.step = step; prevKpi = null; render(); window.scrollTo(0, 0); return; }
  navBusy = true;
  const app = $('#app'), dir = to ? 'fwd' : 'back', hs = $('#hsub');
  app.className = 'pg-out-' + dir;
  if (hs.animate) hsubOut = hs.animate([{ opacity: .75, transform: 'none' }, { opacity: 0, transform: 'translateY(-6px)' }], { duration: 180, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' });
  const vid = view.id;
  setTimeout(() => {
    if (view.name !== 'edit' || view.id !== vid){ app.className = ''; navBusy = false; return; }   // Ansicht wurde inzwischen gewechselt
    view.step = step; prevKpi = null; render(); window.scrollTo(0, 0);
    app.className = 'pg-in-' + dir + (to ? ' entering' : '');
    setTimeout(() => { app.className = ''; navBusy = false; }, to ? 800 : 300);
  }, 180);
}
/* ====== Aktionen ====== */
const Act = {
  new(){ const p = newProject(); projects.unshift(p); saveProjects(); go('edit', { id: p.id }); },
  open(d){ go('edit', { id: d.id }); },
  del(d){ const p = projects.find(x => x.id === d.id); if (p && confirm('Auslegung „' + (p.nr || 'ohne Projektnummer') + '“ löschen?')){ projects = projects.filter(x => x.id !== d.id); saveProjects(); render(); } },
  back(){ go('list'); },
  toresult(){ swapStep('res'); },
  toinput(){ swapStep('in'); },
  /* Nur Klasse umschalten (kein Neuzeichnen): so läuft die Animation nur beim Antippen und Eingabefelder behalten den Fokus */
  toggleroom(d, el){ const r = cur().rooms[+d.i], card = el.closest('.roomcard'); if (!r || !card) return;
    const open = !openRooms.has(r.id); if (open) openRooms.add(r.id); else openRooms.delete(r.id);
    card.classList.toggle('open', open); el.setAttribute('aria-expanded', open); },
  addroom(){ const p = cur(); if (p.rooms.length < 5){ const r = newRoom(); p.rooms.push(r); openRooms.add(r.id); saveProjects(); render(); } },
  sign(d, btn){
    const inp = btn.parentElement.querySelector('input'), card = btn.closest('[data-room]'), p = cur(); if (!inp || !card || !p) return;
    let v = inp.value.trim().replace('−', '-');
    v = v.startsWith('-') ? v.slice(1) : (v === '' ? '-' : '-' + v.replace(/^\+/, ''));
    inp.value = v; p.rooms[+card.dataset.room].hoehe = v; lastPdf = null; saveProjects(); refreshResults(); inp.focus();
  },
  delroom(d){ const p = cur(); p.rooms.splice(+d.i, 1); saveProjects(); render(); },
  pickodu(d){ const p = cur(); p.odu = (p.odu === d.id ? '' : d.id); saveProjects(); lastPdf = null; refreshResults(); },
  async makepdf(d, btn){
    if (!window.jspdf || !window.html2canvas){ toast('PDF-Modul nicht geladen – App einmal online neu starten.'); return; }
    if (pdfBusy) return;
    const p = cur(), x = selected(); if (!x || !x.ok) return;
    if (btn.classList.contains('done')) return;
    const snap = () => JSON.stringify([p.rooms, p.odu, p.nr, p.datum, p.kunde, p.bearbeiter, p.bemerkung, settings.firma]);
    const s0 = snap();
    const cb = () => $('#bar .pdfb');   // immer der aktuell im DOM befindliche Knopf (die Leiste wird bei Änderungen neu gebaut)
    const setP = v => { pdfProg = v; const f = $('#bar .pdfb .fill'); if (f) f.style.transform = 'scaleX(' + v + ')'; };
    pdfBusy = p.id; pdfProg = 0; { const b = cb(); if (b) b.classList.add('run'); } setP(.05);
    try{
      const blob = await reportToPdf(reportHtml(p, x), setP);
      setP(1);
      await new Promise(res => setTimeout(res, RM() ? 0 : 240));
      if (!projects.includes(p) || snap() !== s0){ toast('Daten geändert – PDF bitte neu erstellen'); return; }
      if (lastPdf) URL.revokeObjectURL(lastPdf.url);
      lastPdf = { id: p.id, file: new File([blob], pdfName(p.nr) + '.pdf', { type: 'application/pdf' }), url: URL.createObjectURL(blob) };
      pdfBusy = null;
      if (view.name === 'edit' && view.id === p.id){
        refreshResults();   // baut Leiste neu auf -> neuen Knopf in den Fertig-Zustand setzen
        const nb = cb();
        if (nb){ nb.classList.remove('run'); nb.classList.add('done'); setTimeout(() => nb.classList.remove('done'), 2600); }
        toast('PDF „' + (p.nr || 'ohne Projektnummer') + '“ ist fertig. Teilen oder drucken.');
      } else toast('PDF „' + (p.nr || 'ohne Projektnummer') + '“ ist fertig.');
    }catch(e){ toast('PDF konnte nicht erstellt werden: ' + e.message); }
    finally {
      pdfBusy = null; pdfProg = 0;
      const b = cb(); if (b && !b.classList.contains('done')){ b.classList.remove('run'); setP(0); }
    }
  },
  async sharepdf(){
    if (!lastPdf) return; const files = [lastPdf.file];
    if (navigator.canShare && navigator.canShare({ files })){
      try{ await navigator.share({ files, title: lastPdf.file.name }); } catch (e){ if (e.name !== 'AbortError') toast('Teilen fehlgeschlagen: ' + e.message); }
    } else window.open(lastPdf.url, '_blank');
  },
  saveset(){
    settings.theme = $('#s_theme').value; applyTheme(); themeBtn(); settings.firma = $('#s_firma').value.trim(); settings.bearbeiter = $('#s_bear').value.trim();
    LS.set(KEY.settings, settings); toast('Einstellungen gespeichert.'); go('list');
  }
};
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.tagName !== 'BUTTON'){ e.preventDefault(); e.target.click(); } });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !Act[el.dataset.act]) return;
  Act[el.dataset.act](el.dataset, el);
});
$('#btnset').onclick = () => go('settings');
$('#btntheme').onclick = () => { settings.theme = { auto: 'hell', hell: 'dunkel', dunkel: 'auto' }[settings.theme || 'auto']; LS.set(KEY.settings, settings); applyTheme(); themeBtn(); const s = $('#s_theme'); if (s) s.value = settings.theme; };
$('#ttl').onclick = () => go('list');
document.addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.k; if (k) uiOpen[k] = e.target.open; }, true);

/* Eingaben: Texte/Zahlen aktualisieren nur das Ergebnis, Auswahlfelder zeichnen neu */
document.addEventListener('input', e => {
  const t = e.target, p = view.name === 'edit' ? cur() : null; if (!p) return;
  if (t.dataset.p){ p[t.dataset.p] = t.value; lastPdf = null; saveProjects(); return; }
  const card = t.closest('[data-room]'); if (!card || !t.dataset.f || t.tagName === 'SELECT') return;
  p.rooms[+card.dataset.room][t.dataset.f] = t.value; lastPdf = null; saveProjects(); refreshResults();
});
document.addEventListener('change', e => {
  if (e.target.id === 's_theme'){ settings.theme = e.target.value; LS.set(KEY.settings, settings); applyTheme(); themeBtn(); return; }
  const t = e.target, p = view.name === 'edit' ? cur() : null; if (!p) return;
  const card = t.closest('[data-room]'); if (!card || !t.dataset.f || t.tagName !== 'SELECT') return;
  const r = p.rooms[+card.dataset.room], f = t.dataset.f; r[f] = t.value; lastPdf = null;
  if (f === 'typ'){ const s = [...new Set(DB.ig.filter(x => x.typ === r.typ).map(x => x.serie))]; r.serie = s.includes('Perfera') ? 'Perfera' : (s[0] || ''); r.modell = ''; }
  if (f === 'serie') r.modell = '';
  saveProjects(); render();
});
window.addEventListener('online', () => { $('#net').textContent = 'online'; $('#net').classList.remove('off'); });
window.addEventListener('offline', () => { $('#net').textContent = 'offline'; $('#net').classList.add('off'); });
if (!navigator.onLine){ $('#net').textContent = 'offline'; $('#net').classList.add('off'); }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
loadData(); themeBtn(); render();
