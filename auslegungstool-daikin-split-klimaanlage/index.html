<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daikin-Tool" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <title>Auslegungstool Daikin Split-Klimaanlage</title>

    <script>
      (function () {
        var root = document.documentElement,
          saved = null;
        try {
          saved = localStorage.getItem('ag-theme');
        } catch (e) {}
        var light = window.matchMedia('(prefers-color-scheme: light)').matches;
        root.setAttribute(
          'data-theme',
          saved === 'light' || saved === 'dark' ? saved : light ? 'light' : 'dark',
        );
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="agFonts"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0..200&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0..200&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      (function () {
        var root = document.documentElement,
          link = document.getElementById('agFonts');
        if (!link || !document.fonts || !document.fonts.load) return;
        var done = function () {
          root.classList.remove('icons-pending');
        };
        root.classList.add('icons-pending');
        setTimeout(done, 4000);
        link.addEventListener('load', function () {
          setTimeout(function () {
            document.fonts.load('24px "Material Symbols Rounded"').then(done, done);
          }, 0);
        });
        link.addEventListener('error', done);
      })();
    </script>

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/png" href="icon-180.png" />
    <script src="shared/lib/html2canvas.min.js" defer></script>
    <script src="shared/lib/jspdf.umd.min.js" defer></script>
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="shared/lib/fonts/material-symbols-rounded.woff2"
      crossorigin
    />
    <link rel="stylesheet" href="shared/global.css" />
    <link rel="stylesheet" href="shared/pdf.css" />
    <script src="daten.js"></script>
    <script src="engine.js"></script>
    <script src="shared/pdf-bausteine.js"></script>
    <script src="shared/pdf.js"></script>
    <style>
      /* ===== Rahmen: Kopf, Liste, untere Leiste ===== */
      html {
        overscroll-behavior-y: none;
      }
      .brand-title {
        font-size: 1.65rem;
        hyphens: none;
      }
      button.row,
      .proto-open,
      .back-btn,
      .pick-row {
        font: inherit;
        color: inherit;
        text-align: left;
        background: transparent;
        border: 0;
        cursor: pointer;
        touch-action: manipulation;
      }
      .back-btn {
        color: var(--accent);
        margin-bottom: 0.5rem;
      }
      a.btn-secondary {
        text-decoration: none;
      }
      .btn-secondary:disabled,
      .btn-primary:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .net {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        min-height: 20px;
        margin-top: 0.25rem;
        color: var(--system-orange);
        font-size: var(--text-caption);
        font-weight: 600;
      }
      .net .nd {
        width: 6px;
        height: 6px;
        flex: none;
        border-radius: 50%;
        background: var(--system-orange);
      }
      .settings-update-dot[hidden] {
        display: none;
      }
      .lead-note {
        margin: 0 0 1.25rem;
        color: var(--text-secondary);
        font-size: var(--text-sub);
      }
      .empty-note {
        margin: 0 0 2.25rem;
        color: var(--text-secondary);
        font-size: var(--text-sub);
      }
      .btn-wide {
        margin-bottom: 1.75rem;
      }
      /* Auslegungs-Zeile: antippbarer Hauptteil, rechts Löschen ohne Fläche */
      .proto-row {
        padding-right: 0.25rem;
      }
      .proto-open {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 0.875rem;
        min-width: 0;
        min-height: 44px;
        padding: 0;
      }
      .proto-open .row-text {
        overflow-wrap: anywhere;
      }
      .proto-act.is-danger {
        color: var(--system-red);
      }
      /* Untere Leiste (Ändern / PDF erstellen / Teilen) */
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        padding: 0.625rem max(1rem, env(safe-area-inset-right))
          calc(0.75rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background: var(--bg-canvas);
        border-top: 1px solid var(--border-separator);
      }
      .bar > div {
        display: flex;
        gap: 0.625rem;
        max-width: 1080px;
        margin: 0 auto;
      }
      .bar > div > * {
        flex: 1;
        min-width: 0;
      }
      .bar .btn-primary,
      .bar .btn-secondary {
        min-height: 52px;
        padding: 0 0.75rem;
      }
      .bar .bar-side {
        flex: 0.65;
      }
      .bar .bar-main {
        flex: 1.4;
      }
      body.hasbar #app {
        padding-bottom: calc(96px + env(safe-area-inset-bottom));
      }
      /* PDF-Knopf mit Fortschritt */
      .pdfb {
        position: relative;
        overflow: hidden;
      }
      .pdfb .fill {
        position: absolute;
        inset: 0;
        background: var(--on-accent);
        opacity: 0.22;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 220ms linear;
        pointer-events: none;
      }
      .pdfb .l1,
      .pdfb .l2,
      .pdfb .lr {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        position: relative;
        white-space: nowrap;
        transition:
          opacity 0.2s ease,
          transform 0.2s var(--ease-spring);
      }
      .pdfb .l2,
      .pdfb .lr {
        position: absolute;
        inset: 0;
        justify-content: center;
        opacity: 0;
        transform: translateY(8px);
      }
      .pdfb.run .l1,
      .pdfb.done .l1 {
        opacity: 0;
        transform: translateY(-8px);
      }
      .pdfb.run .lr {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .lr {
        opacity: 0;
      }
      .pdfb.done .l2 {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .fill {
        opacity: 0;
      }
      /* Einstellungen und Rückfrage: Inhalt der Modal-Karte */
      .panel {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .panel[hidden] {
        display: none;
      }
      .field-box {
        display: flex;
        align-items: center;
        min-height: 50px;
        padding: 0 0.875rem;
      }
      .field-box textarea.text-input {
        min-height: 88px;
        padding: 0.625rem 0;
        resize: none;
      }
      .info-row-value.wrap {
        white-space: normal;
        text-align: right;
        font-family: var(--font-sans);
        font-size: var(--text-sub);
        overflow-wrap: anywhere;
      }
      .toast-pill .material-symbols-rounded {
        color: var(--accent);
      }

      /* ===== Eingabe ===== */
      .steps {
        margin-bottom: 1.25rem;
      }
      .acc-body {
        visibility: hidden;
        transition:
          grid-template-rows 0.4s var(--ease-spring),
          visibility 0s 0.4s;
      }
      .acc.is-open .acc-body {
        visibility: visible;
        transition:
          grid-template-rows 0.4s var(--ease-spring),
          visibility 0s;
      }
      .acc-name .row-title,
      .acc-name .row-sub {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .acc-inner {
        padding: 0.25rem 0 0.75rem;
      }
      .acc-inner > .field + .field {
        border-top: 1px solid var(--border-separator);
      }
      .acc-inner > .pick-line,
      .acc-inner > .btn-danger {
        margin-top: 0.75rem;
      }
      .group--form > .field + .field {
        border-top: 1px solid var(--border-separator);
      }
      textarea.text-input {
        resize: none;
      }
      .field-hint {
        display: block;
        margin-top: 0.25rem;
        color: var(--text-tertiary);
        font-size: var(--text-caption);
      }
      .field .input-wrapper {
        margin: 0.375rem 0 0.25rem;
      }
      .field .glass-input {
        font-size: 1rem;
      }
      .field .field-box {
        margin: 0.5rem 0 0.25rem;
      }
      .field .tab-strip {
        margin-inline: 0;
        padding-inline: 0;
        margin-top: 0.375rem;
        margin-bottom: 0.5rem;
      }
      .field .choice-select {
        margin: 0.375rem 0 0.5rem;
      }
      .num-line {
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }
      .num-line .input-wrapper {
        flex: 1;
      }
      .pick-line {
        color: var(--text-secondary);
        font-size: var(--text-sub);
      }
      .pick-line b {
        color: var(--text-primary);
      }
      .pick-line .status-pill {
        margin-top: 0.375rem;
      }
      /* iPhone/iPad: Datumsfeld hat sonst eine feste Mindestbreite und ragt über den Rand */
      input[type='date'] {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        text-align: left;
        margin: 0;
      }
      input[type='date']::-webkit-date-and-time-value {
        text-align: left;
        min-width: 0;
        margin: 0;
      }
      input[type='date']::-webkit-datetime-edit {
        padding: 0;
        text-align: left;
      }

      /* ===== Ergebnis ===== */
      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
        margin-top: 0.5rem;
      }
      .pill-row .status-pill {
        margin-top: 0;
      }
      .why {
        color: var(--text-secondary);
        font-size: var(--text-sub);
      }
      .why-list {
        margin: 0.5rem 0 0;
        padding-left: 1.125rem;
        color: var(--text-secondary);
        font-size: var(--text-sub);
      }
      .results-block {
        margin-bottom: 1.5rem;
      }
      .results-block .info-row-label .row-sub {
        margin-top: 0;
      }
      .note-box {
        margin: 0 0 1.5rem;
        padding: 0.75rem 1rem;
        border: 1px solid var(--system-red-border);
        border-radius: var(--radius-control);
        background: var(--system-red-tint);
        color: var(--text-primary);
        font-size: var(--text-sub);
      }
      .note-box strong {
        color: var(--system-red);
      }
      .note-box--orange {
        border-color: var(--system-orange-border);
        background: var(--system-orange-tint);
      }
      .note-box--orange strong {
        color: var(--system-orange);
      }
      .note-box ul {
        margin: 0.25rem 0 0;
        padding-left: 1.125rem;
      }
      .rr {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.75rem 0.25rem;
      }
      .rr + .rr {
        border-top: 1px solid var(--border-separator);
      }
      .rr-main {
        flex: 1;
        min-width: 0;
      }
      .rr-main b {
        display: block;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .rr-main .row-sub {
        margin-top: 0;
      }
      .rr-val {
        flex: none;
        text-align: right;
      }
      .rr-val b {
        display: block;
        font-size: 1.0625rem;
        font-weight: 600;
      }
      .rr-val span {
        color: var(--text-secondary);
        font-size: var(--text-caption);
      }
      .info-row--stack {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.125rem;
      }
      .info-row--stack .info-row-value {
        white-space: normal;
        font-family: var(--font-sans);
        font-size: var(--text-sub);
        font-weight: 400;
      }
      .info-row--stack .info-row-value b {
        font-weight: 600;
      }
      .pick-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        width: 100%;
        min-height: 64px;
        padding: 0.5rem 0.25rem;
        border-radius: var(--radius-icon);
      }
      .pick-row + .pick-row {
        border-top: 1px solid var(--border-separator);
        border-top-left-radius: 0;
        border-top-right-radius: 0;
      }
      .pick-row:active {
        background: var(--surface-inner-bg);
      }
      .pick-row .row-text {
        overflow-wrap: anywhere;
      }
      .pick-row .why-bad {
        color: var(--system-red);
      }
      .pick-pills {
        display: flex;
        flex: none;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.25rem;
      }
      .acc-head .section-count {
        flex: none;
      }
      .empty-line {
        margin: 0;
        padding: 0.5rem 0.25rem 0.25rem;
        color: var(--text-secondary);
        font-size: var(--text-sub);
      }
      .flash {
        animation: flash 900ms var(--ease-spring);
      }
      @keyframes flash {
        from {
          background-color: var(--surface-inner-bg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flash {
          animation: none;
        }
      }
      /* Bericht (PDF): Tabellen wie vor dem Wechsel auf global.css */
      :where(.report) th,
      :where(.report) td {
        vertical-align: top;
      }
      .report table {
        font-feature-settings: 'tnum' 1;
      }
      /* App-Schrift (shared/lib/fonts). PDF-CSS: shared/pdf.css, PDF-Schrift: Helvetica/Arial (Systemschrift) */
      @font-face {
        font-family: var(--font-sans);
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(shared/lib/fonts/plus-jakarta-sans-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF,
          U+FFFD;
      }
      @font-face {
        font-family: var(--font-sans);
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(shared/lib/fonts/plus-jakarta-sans-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF,
          U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }
    </style>
  </head>
  <body>
    <div class="ambient-canvas" aria-hidden="true"></div>

    <div class="app-shell" id="appShell">
      <header class="app-header">
        <div class="app-header-text">
          <h1 class="brand-title">Daikin-Auslegung</h1>
          <p class="brand-subtitle" id="hsub">Split / Multisplit R32</p>
          <div id="net" class="net" hidden></div>
        </div>
        <button
          type="button"
          class="icon-btn"
          id="themeToggleBtn"
          aria-label="Darstellung wechseln"
        ></button>
        <button type="button" class="icon-btn" id="btnset" aria-label="Einstellungen">
          <span class="material-symbols-rounded" aria-hidden="true">settings</span>
          <span class="status-dot settings-update-dot" id="app-update-dot" hidden></span>
        </button>
      </header>
      <main id="app"></main>
    </div>
    <div class="bar" id="bar" hidden></div>

    <!-- Einstellungen und Rückfragen: mittige Karte, einzige Glasfläche der Seite -->
    <div
      class="modal-overlay"
      id="modalHost"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >
      <div class="liquid-glass modal-card">
        <div class="panel" id="panelSettings">
          <div class="modal-head">
            <h2 class="modal-title" id="settingsTitle">Einstellungen</h2>
            <button class="icon-btn" id="modalCloseBtn" type="button" aria-label="Schließen">
              <span class="material-symbols-rounded" aria-hidden="true">close</span>
            </button>
          </div>

          <div class="form-group">
            <div class="card-title">Darstellung</div>
            <div class="segmented-control" id="themeSegment" role="group" aria-label="Darstellung">
              <button
                type="button"
                class="segmented-option"
                data-theme-choice="light"
                aria-pressed="false"
              >
                Hell
              </button>
              <button
                type="button"
                class="segmented-option"
                data-theme-choice="dark"
                aria-pressed="false"
              >
                Dunkel
              </button>
              <button
                type="button"
                class="segmented-option"
                data-theme-choice="system"
                aria-pressed="false"
              >
                System
              </button>
            </div>
            <p class="hint">Das PDF bleibt immer hell.</p>
          </div>

          <div class="form-group">
            <div class="card-title">Allgemein</div>
            <label class="form-label" for="s_firma">Firmenname (für das PDF)</label>
            <div class="liquid-surface-inner field-box">
              <input class="text-input" id="s_firma" type="text" autocomplete="off" />
            </div>
            <label class="form-label" for="s_bear">
              Bearbeiter (vorbelegt bei neuer Auslegung)
            </label>
            <div class="liquid-surface-inner field-box">
              <input class="text-input" id="s_bear" type="text" autocomplete="off" />
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-primary" data-act="saveset">
              <span class="material-symbols-rounded" aria-hidden="true">check_circle</span>
              <span>Einstellungen speichern</span>
            </button>
          </div>

          <div>
            <div class="card-title">App-Info und Updates</div>
            <div class="info-list">
              <div class="info-row">
                <span class="info-row-label">Datenstand</span>
                <span class="info-row-value wrap" id="dataInfoLabel"></span>
              </div>
              <div class="info-row">
                <span class="info-row-label">Installierte Version</span>
                <span class="info-row-value numeric">
                  <span class="status-pill status-pill--green" id="app-version-label"></span>
                </span>
              </div>
              <div class="info-row">
                <span class="info-row-label">Build-Datum</span>
                <span class="info-row-value numeric" id="appBuildDateLabel"></span>
              </div>
              <div class="info-row" id="updateRow" hidden>
                <span class="info-row-label">Neue Version</span>
                <span class="info-row-value numeric" id="updateRemote"></span>
              </div>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-primary" data-act="checkupdate">
              <span class="material-symbols-rounded" aria-hidden="true">sync</span>
              <span>Nach Updates suchen</span>
            </button>
            <button type="button" class="btn-secondary" data-act="forcereload">
              <span class="material-symbols-rounded" aria-hidden="true">cleaning_services</span>
              <span>Cache leeren und neu laden</span>
            </button>
          </div>
        </div>

        <div class="panel" id="panelConfirm" hidden>
          <h2 class="modal-title" id="cfTitle"></h2>
          <p class="modal-text" id="cfText"></p>
          <div class="modal-actions modal-actions--row">
            <button type="button" class="btn-secondary" id="cfCancel">Abbrechen</button>
            <button type="button" class="btn-primary" id="cfOk">Bestätigen</button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast-pill" id="toast" role="status" aria-live="polite">
      <span class="material-symbols-rounded" aria-hidden="true">info</span>
      <span id="toastText"></span>
    </div>

    <script>
      'use strict';
      /* ====== Konfiguration ====== */
      const KEY = { settings: 'dk.settings', projects: 'dk.projects', data: 'dk.data' };

      /* ====== Hilfen ====== */
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s == null ? '' : s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      const LS = {
        get(k, d) {
          try {
            const v = localStorage.getItem(k);
            return v ? JSON.parse(v) : d;
          } catch (e) {
            return d;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, JSON.stringify(v));
          } catch (e) {}
        },
      };
      const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const fmt = (n, d = 1) =>
        n == null
          ? '—'
          : Number(n).toLocaleString('de-DE', {
              minimumFractionDigits: 0,
              maximumFractionDigits: d,
            });
      const fmtDate = (s) => {
        if (!s) return '';
        const m = String(s).match(/^(\d{4})-(\d\d)-(\d\d)/);
        return m ? `${m[3]}.${m[2]}.${m[1]}` : s;
      };
      const today = () => new Date().toISOString().slice(0, 10);
      const app = $('#app');
      const MSR = (n) => `<span class="material-symbols-rounded" aria-hidden="true">${n}</span>`;
      let toastTimer;
      function toast(msg) {
        const t = $('#toast');
        if (!t) return;
        $('#toastText').textContent = msg;
        t.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('is-visible'), 3800);
      }
      const E = window.Engine;
      const RM = () =>
        !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); // Bewegung reduzieren
      function flash(el) {
        if (!el || RM()) return;
        el.classList.remove('flash');
        void el.offsetWidth;
        el.classList.add('flash');
      }

      /* ====== Zustand ====== */
      let settings = Object.assign({ firma: '', bearbeiter: '' }, LS.get(KEY.settings, {}));
      delete settings.sheetId;
      const APP_VERSION = '2.1.1';
      const BUILD_DATE = '2026-11-17';

      /* Zahlenfelder: beim Antippen alles markieren */
      document.addEventListener('focusin', (e) => {
        const el = e.target;
        if (
          el &&
          el.tagName === 'INPUT' &&
          (el.type === 'number' ||
            el.inputMode === 'decimal' ||
            el.inputMode === 'numeric' ||
            el.classList.contains('glass-input'))
        ) {
          try {
            el.select();
          } catch (err) {}
        }
      });

      /* ====== Rahmen: Modal-Karte, Darstellung, Update ====== */
      /* Mittige Karte (Einstellungen und Rückfragen): Rest der Seite inaktiv, Escape schließt */
      let modalFocus = null;
      let modalPanel = null;
      let confirmDone = null;
      function modalOpen(panel) {
        const host = $('#modalHost');
        modalPanel = panel;
        $('#panelSettings').hidden = panel !== 'settings';
        $('#panelConfirm').hidden = panel !== 'confirm';
        host.setAttribute('aria-labelledby', panel === 'settings' ? 'settingsTitle' : 'cfTitle');
        $('#appShell').inert = true;
        $('#bar').inert = true;
        modalFocus = document.activeElement;
        host.classList.add('is-open');
        const first = host.querySelector(
          `#${panel === 'settings' ? 'panelSettings' : 'panelConfirm'} button`,
        );
        if (first) first.focus();
      }
      function modalClose() {
        if (!modalPanel) return;
        const war = modalPanel;
        modalPanel = null;
        $('#modalHost').classList.remove('is-open');
        $('#appShell').inert = false;
        $('#bar').inert = false;
        if (modalFocus && modalFocus.focus) modalFocus.focus();
        if (war === 'confirm' && confirmDone) {
          const fertig = confirmDone;
          confirmDone = null;
          fertig(false);
        }
      }
      /* Rückfrage (ersetzt den Browser-Dialog) */
      function confirmModal(title, message, confirmLabel = 'Bestätigen', danger = false) {
        return new Promise((resolve) => {
          $('#cfTitle').textContent = title;
          $('#cfText').textContent = message;
          const ok = $('#cfOk');
          ok.textContent = confirmLabel;
          ok.className = danger ? 'btn-danger' : 'btn-primary';
          confirmDone = resolve;
          modalOpen('confirm');
        });
      }
      function openSettings() {
        $('#s_firma').value = settings.firma || '';
        $('#s_bear').value = settings.bearbeiter || '';
        $('#dataInfoLabel').textContent = dataInfo;
        $('#app-version-label').textContent = 'v' + APP_VERSION;
        $('#appBuildDateLabel').textContent = BUILD_DATE;
        syncThemeUi();
        modalOpen('settings');
      }
      document.addEventListener('click', (e) => {
        if (e.target.closest('#modalCloseBtn') || e.target === $('#modalHost')) {
          modalClose();
        } else if (e.target.closest('#cfCancel')) {
          modalClose();
        } else if (e.target.closest('#cfOk')) {
          const fertig = confirmDone;
          confirmDone = null;
          modalPanel = null;
          $('#modalHost').classList.remove('is-open');
          $('#appShell').inert = false;
          $('#bar').inert = false;
          if (modalFocus && modalFocus.focus) modalFocus.focus();
          if (fertig) fertig(true);
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') modalClose();
      });

      /* Darstellung: Segment in den Einstellungen kennt zusätzlich „System“, der Kopf-Knopf schaltet Hell und Dunkel */
      const systemHell = window.matchMedia('(prefers-color-scheme: light)');
      function gespeicherteDarstellung() {
        try {
          const v = localStorage.getItem('ag-theme');
          return v === 'light' || v === 'dark' ? v : null;
        } catch (e) {
          return null;
        }
      }
      function syncThemeUi() {
        const wahl = gespeicherteDarstellung() || 'system';
        document
          .querySelectorAll('[data-theme-choice]')
          .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeChoice === wahl)));
        const btn = $('#themeToggleBtn');
        if (btn) {
          const dunkel = document.documentElement.getAttribute('data-theme') !== 'light';
          btn.innerHTML = MSR(dunkel ? 'light_mode' : 'dark_mode');
          btn.setAttribute(
            'aria-label',
            dunkel ? 'Hellmodus aktivieren' : 'Dunkelmodus aktivieren',
          );
        }
      }
      function setzeDarstellung(wahl) {
        try {
          if (wahl === 'system') localStorage.removeItem('ag-theme');
          else localStorage.setItem('ag-theme', wahl);
        } catch (e) {}
        document.documentElement.setAttribute(
          'data-theme',
          wahl === 'system' ? (systemHell.matches ? 'light' : 'dark') : wahl,
        );
        syncThemeUi();
      }
      document
        .querySelectorAll('[data-theme-choice]')
        .forEach((b) => b.addEventListener('click', () => setzeDarstellung(b.dataset.themeChoice)));
      $('#themeToggleBtn').addEventListener('click', () => {
        const hell = document.documentElement.getAttribute('data-theme') === 'light';
        setzeDarstellung(hell ? 'dark' : 'light');
      });
      new MutationObserver(syncThemeUi).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme'],
      });

      /* Update-Prüfung über version.json. Offline: nur Meldung, Caches und localStorage bleiben erhalten. */
      async function clearCachesAndReload() {
        try {
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
          if ('serviceWorker' in navigator) {
            const reg = await navigator.serviceWorker.getRegistration();
            if (reg) await reg.update().catch(() => {});
          }
        } catch (e) {}
        window.location.reload();
      }
      async function pruefeUpdate(manuell) {
        const knopf = $('[data-act="checkupdate"]');
        if (manuell && knopf) knopf.disabled = true;
        try {
          const res = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) throw new Error('version.json nicht erreichbar');
          const data = await res.json();
          const remote = String(data.version || '').trim();
          const neu = !!remote && remote !== APP_VERSION;
          $('#app-update-dot').hidden = !neu;
          $('#updateRow').hidden = !neu;
          $('#updateRemote').textContent = neu ? 'v' + remote : '';
          $('#app-version-label').className =
            'status-pill ' + (neu ? 'status-pill--orange' : 'status-pill--green');
          if (manuell) {
            if (neu) {
              toast('Update auf v' + remote + ' wird geladen.');
              setTimeout(clearCachesAndReload, 900);
            } else {
              toast('Aktuellste Version v' + APP_VERSION + ' ist installiert.');
            }
          }
        } catch (e) {
          if (manuell)
            toast('Update-Prüfung nicht möglich. Internetverbindung prüfen und erneut versuchen.');
        } finally {
          if (knopf) knopf.disabled = false;
        }
      }
      function updateNet() {
        const el = $('#net');
        const on = navigator.onLine;
        el.hidden = on;
        el.innerHTML = on ? '' : '<i class="nd"></i><span>Offline</span>';
      }

      /* Auswahl-Dropdowns und mittige Zahlenfelder (shared/choice-dropdown.js, Modul unten) */
      function nachRender() {
        if (window.agUiInit) window.agUiInit();
      }

      let projects = LS.get(KEY.projects, []);
      let view = { name: 'list' };
      let DB = null,
        dataInfo = '';
      let lastPdf = null;
      let pdfBusy = null,
        pdfProg = 0; // pdfBusy = Id der Auslegung, deren PDF gerade erstellt wird
      let prevKpi = null,
        navBusy = false,
        hsubOut = null; // prevKpi: zuletzt angezeigte Werte (für Aufleuchten bei Änderung)

      function newRoom() {
        return {
          id: uid(),
          name: '',
          raumtyp: DB.raumtypen[0] ? DB.raumtypen[0].name : '',
          zuschlag: DB.zuschlaege[0] ? DB.zuschlaege[0].name : '',
          flaeche: '',
          bedarf: '',
          typ: 'Wandgerät',
          serie: DB.ig.some((x) => x.serie === 'Perfera' && x.typ === 'Wandgerät') ? 'Perfera' : '',
          modell: '',
          rohr: '',
          hoehe: '',
        };
      }
      function newProject() {
        return {
          id: uid(),
          nr: '',
          datum: today(),
          kunde: '',
          bearbeiter: settings.bearbeiter || '',
          bemerkung: '',
          odu: '',
          rooms: [newRoom(), newRoom()],
        };
      }
      const cur = () => projects.find((p) => p.id === view.id);
      const saveProjects = () => LS.set(KEY.projects, projects);

      /* ====== Daten laden ======
   Alle Daikin-Werte stecken in daten.js (erzeugt aus daten/*.csv). Kein Google Sheet: neue Daikin-Werte kommen per App-Update. */
      function loadData() {
        try {
          localStorage.removeItem(KEY.data);
        } catch (e) {} // Zwischenspeicher aus der früheren Google-Sheet-Anbindung
        DB = E.normalize(window.DATEN_SEED);
        dataInfo = DB.ein.datenstand || 'Daikin-Daten in der App';
      }

      /* ====== Ansicht ====== */
      let openRooms = new Set(),
        uiOpen = {};
      const roomEmpty = (r) => !r.name && !r.flaeche && !r.bedarf && !r.modell && !r.rohr;
      /* Überblenden beim Wechsel der Ansicht: alte Fläche 90 ms aus, neue 220 ms ein */
      let fadenNr = 0;
      function fadeThrough(change) {
        if (RM() || !app.animate) {
          change();
          return;
        }
        const nr = ++fadenNr;
        /* Laufende Animationen beenden, sonst bleibt eine alte Ausblendung (fill: forwards) stehen */
        app.getAnimations().forEach((a) => a.cancel());
        /* Aus: bleibt bis zum Tausch auf 0 (fill: forwards), damit die alte Seite nicht kurz wieder aufblitzt */
        const aus = app.animate([{ opacity: 1 }, { opacity: 0 }], {
          duration: 90,
          easing: 'ease-out',
          fill: 'forwards',
        });
        aus.finished
          .then(() => {
            if (nr !== fadenNr) {
              return;
            }
            change();
            aus.cancel();
            app.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' });
          })
          .catch(() => {});
      }
      function go(name, extra) {
        view = Object.assign({ name }, extra);
        if (name === 'edit') {
          const p = cur();
          openRooms = new Set(p ? p.rooms.filter(roomEmpty).map((r) => r.id) : []);
          uiOpen = {};
        }
        prevKpi = null;
        fadeThrough(() => {
          render();
          window.scrollTo(0, 0);
        });
      }
      const isRes = () => view.name === 'edit' && view.step === 'res';
      function setHeader() {
        const p = isRes() ? cur() : null;
        $('#hsub').textContent = p
          ? (p.nr || 'ohne Projektnummer') + (p.kunde ? ', ' + p.kunde : '')
          : 'Split / Multisplit R32';
      }
      function barHtml() {
        if (view.name !== 'edit') return '';
        const p = cur();
        if (!isRes())
          return `<div><button type="button" class="btn-secondary bar-side" data-act="addroom" aria-label="Raum hinzufügen"${p.rooms.length >= 5 ? ' disabled' : ''}>${MSR('add')}<span>Raum</span></button><button type="button" class="btn-primary bar-main" data-act="toresult">Ergebnis ansehen</button></div>`;
        const sel = EV ? selected() : null;
        const fertig = lastPdf && lastPdf.id === p.id && sel && sel.ok;
        return `<div><button type="button" class="btn-secondary bar-side" data-act="toinput">Ändern</button><button type="button" class="btn-primary bar-main pdfb${pdfBusy === p.id ? ' run' : ''}" data-act="makepdf"${sel && sel.ok ? '' : ' disabled'}><span class="fill"${pdfBusy === p.id ? ` style="transform:scaleX(${pdfProg})"` : ''}></span><span class="l1">${MSR('download')}PDF erstellen</span><span class="lr">PDF wird erstellt</span><span class="l2">${MSR('check')}PDF fertig</span></button>${fertig ? '<button type="button" class="btn-secondary bar-side" data-act="sharepdf">Teilen</button>' : ''}</div>`;
      }
      function setBar() {
        const b = $('#bar'),
          h = barHtml();
        if (b._lastHtml !== h) {
          b._lastHtml = h;
          b.innerHTML = h;
        }
        b.hidden = !h;
        document.body.classList.toggle('hasbar', !!h);
      }
      function render() {
        const y = window.scrollY;
        if (view.name === 'edit' && !cur()) {
          view = { name: 'list' };
        }
        setHeader();
        app.innerHTML = view.name === 'list' ? vList() : vEdit();
        if (view.name === 'edit') refreshResults();
        else setBar();
        updateNet();
        nachRender();
        window.scrollTo(0, y);
      }
      const HINWEIS =
        'Kombinationshilfe zur ersten Prüfung. Endgültige Kalkulation vor Angebot prüfen.';
      function vList() {
        return `<p class="lead-note">Multisplit-Kombinationen (R32) prüfen. Als „freigegeben“ erscheinen nur Kombinationen, die Daikin freigibt.</p>
  <button type="button" class="btn-primary btn-wide" data-act="new">${MSR('add')}<span>Neue Auslegung</span></button>
  <h2 class="section-title">Gespeichert auf diesem Gerät <span class="section-count">${projects.length}</span></h2>
  ${
    projects.length
      ? `<div class="group">${projects
          .map(
            (p) => `<div class="row proto-row">
    <button type="button" class="proto-open" data-act="open" data-id="${p.id}"><span class="row-icon row-icon--blue">${MSR('description')}</span><span class="row-text"><span class="row-title">${esc(p.nr || 'ohne Projektnummer')}</span>${p.kunde ? `<span class="row-sub">${esc(p.kunde)}</span>` : ''}<span class="row-sub">${esc(fmtDate(p.datum))}, ${p.rooms.length} ${p.rooms.length === 1 ? 'Raum' : 'Räume'}</span></span><span class="material-symbols-rounded row-chevron" aria-hidden="true">chevron_right</span></button>
    <button type="button" class="icon-btn proto-act is-danger" data-act="del" data-id="${p.id}" aria-label="Auslegung ${esc(p.nr || 'ohne Projektnummer')} löschen">${MSR('delete')}</button></div>`,
          )
          .join('')}</div>`
      : '<p class="empty-note">Noch keine Auslegung. Mit „Neue Auslegung“ startest du die erste.</p>'
  }
  <p class="hint">${HINWEIS}</p>
  <p class="hint">Datenstand: ${esc(dataInfo)}</p>`;
      }

      /* ====== Eingabe ====== */
      function roomSummary(r) {
        let u = null;
        try {
          u = E.pickUnit(r, DB);
        } catch (e) {}
        const a = [];
        if (E.num(r.flaeche) != null) a.push(fmt(E.num(r.flaeche)) + ' m²');
        if (u) a.push(u.modell);
        if (E.num(r.rohr) != null) a.push(fmt(E.num(r.rohr)) + ' m Rohr');
        return a.length ? a.join(', ') : 'Raum bearbeiten';
      }
      const CHEV = MSR('expand_more').replace(
        'material-symbols-rounded',
        'material-symbols-rounded acc-chevron',
      );
      /* Feldbausteine: Beschriftung oben, Eingabe darunter */
      function fText(label, attr, value, ph, mode) {
        return `<label class="field"><span class="field-label">${esc(label)}</span><input class="text-input" ${attr} value="${esc(value)}" placeholder="${esc(ph || '')}" autocomplete="off"${mode ? ` inputmode="${mode}"` : ''}></label>`;
      }
      function fNum(label, attr, value, ph, unit, hint, hintId) {
        return `<label class="field"><span class="field-label">${esc(label)}</span><span class="input-wrapper liquid-surface-inner"><input class="glass-input" ${attr} inputmode="decimal" value="${esc(value)}" placeholder="${esc(ph || '')}" autocomplete="off"><span class="input-unit-addon">${esc(unit)}</span></span>${hint || hintId ? `<span class="field-hint"${hintId ? ` id="${hintId}"` : ''}>${esc(hint || '')}</span>` : ''}</label>`;
      }
      /* Auswahl: Pills, ab mehr als 3 Optionen macht initChoiceDropdowns() ein Dropdown daraus */
      function fSel(label, f, opts, current) {
        return `<div class="field" role="group" aria-label="${esc(label)}"><span class="field-label">${esc(label)}</span><div class="tab-strip" aria-label="${esc(label)}">${opts
          .map(
            (o) =>
              `<button type="button" class="tab-pill" data-act="setf" data-f="${f}" data-v="${esc(o.v)}" aria-selected="${String(current) === String(o.v)}">${esc(o.l)}</button>`,
          )
          .join('')}</div></div>`;
      }
      function roomCard(r, i) {
        const typen = [...new Set(DB.ig.map((x) => x.typ))];
        const serien = [...new Set(DB.ig.filter((x) => x.typ === r.typ).map((x) => x.serie))];
        const modelle = DB.ig
          .filter((x) => x.typ === r.typ && (!r.serie || x.serie === r.serie))
          .sort((a, b) => a.klasse - b.klasse);
        const p = cur(),
          open = openRooms.has(r.id);
        const head = `<button type="button" class="acc-head" data-act="toggleroom" data-i="${i}" aria-expanded="${open}"><span class="acc-badge">${i + 1}</span><span class="acc-name"><span class="row-title" id="rt${i}">${esc(r.name || 'Raum ' + (i + 1))}</span><span class="row-sub" id="sum${i}">${esc(roomSummary(r))}</span></span>${CHEV}</button>`;
        return `<div class="acc${open ? ' is-open' : ''}" data-room="${i}">${head}<div class="acc-body"><div><div class="acc-inner">
    ${fText('Raumname', 'data-f="name"', r.name, 'z. B. Wohnzimmer')}
    ${fSel(
      'Raumtyp',
      'raumtyp',
      DB.raumtypen.map((x) => ({ v: x.name, l: x.name })),
      r.raumtyp,
    )}
    ${fSel(
      'Lage / Zuschlag',
      'zuschlag',
      DB.zuschlaege.map((x) => ({ v: x.name, l: x.name })),
      r.zuschlag,
    )}
    ${fNum('Fläche', 'data-f="flaeche"', r.flaeche, 'z. B. 25', 'm²')}
    ${fNum('Kühlbedarf', 'data-f="bedarf"', r.bedarf, 'automatisch', 'kW', '', 'bh' + i)}
    ${fSel(
      'Gerätetyp',
      'typ',
      typen.map((x) => ({ v: x, l: x })),
      r.typ,
    )}
    ${fSel('Serie', 'serie', [{ v: '', l: 'beliebig' }].concat(serien.map((x) => ({ v: x, l: x }))), r.serie)}
    ${fSel('Modell', 'modell', [{ v: '', l: 'Automatisch (passend zum Bedarf)' }].concat(modelle.map((x) => ({ v: x.modell, l: `${x.modell}, ${fmt(x.kw)} kW` }))), r.modell)}
    ${fNum('Rohrlänge zum Außengerät', 'data-f="rohr"', r.rohr, 'einfache Länge', 'm')}
    <div class="field"><label class="field-label" for="hoehe${i}">Höhe Innengerät zum Außengerät</label><div class="num-line"><span class="input-wrapper liquid-surface-inner"><input class="glass-input" id="hoehe${i}" data-f="hoehe" inputmode="text" value="${esc(r.hoehe)}" placeholder="0 = gleiche Ebene" autocomplete="off"><span class="input-unit-addon">m</span></span><button type="button" class="btn-tonal" data-act="sign" aria-label="Vorzeichen wechseln">+ / −</button></div><span class="field-hint">+ = Innengerät höher, − = tiefer als Außengerät</span></div>
    <div class="pick-line" id="pick${i}"></div>
    ${p.rooms.length > 1 ? `<button type="button" class="btn-danger" data-act="delroom" data-i="${i}">Raum ${i + 1} entfernen</button>` : ''}
  </div></div></div></div>`;
      }
      function vEdit() {
        const p = cur();
        const steps = `<div class="segmented-control steps" role="group" aria-label="Schritt"><button type="button" class="segmented-option" data-act="toinput" aria-pressed="${!isRes()}">Eingabe</button><button type="button" class="segmented-option" data-act="toresult" aria-pressed="${isRes()}">Ergebnis</button></div>`;
        if (isRes()) return steps + `<div id="results"></div>`;
        return `${steps}
  <button type="button" class="back-btn" data-act="back">${MSR('chevron_left')}Übersicht</button>
  <h2 class="section-title">Projekt</h2>
  <div class="group group--form">
    ${fText('Projektnummer', 'data-p="nr"', p.nr, 'z. B. 2026-0123')}
    <label class="field"><span class="field-label">Datum</span><input class="text-input" type="date" data-p="datum" value="${esc(p.datum)}"></label>
    ${fText('Kunde / Objekt', 'data-p="kunde"', p.kunde)}
    ${fText('Bearbeiter', 'data-p="bearbeiter"', p.bearbeiter)}
  </div>
  <h2 class="section-title">Räume und Innengeräte <span class="section-count">${p.rooms.length}</span></h2>
  <div class="group">${p.rooms.map(roomCard).join('')}</div>
  <h2 class="section-title">Bemerkungen</h2>
  <div class="group"><div class="field"><label class="field-label" for="bemerkung">Kommen ins PDF</label><div class="liquid-surface-inner field-box"><textarea class="text-input" id="bemerkung" data-p="bemerkung">${esc(p.bemerkung)}</textarea></div></div></div>
  <p class="hint">${HINWEIS}</p>`;
      }

      /* ====== Ergebnis ====== */
      let EV = null;
      function evaluate() {
        const p = cur();
        EV = E.evaluateAll(p.rooms, DB);
        return EV;
      }
      function selected() {
        const p = cur();
        if (!EV) evaluate();
        return (p.odu && EV.all.find((x) => x.odu.id === p.odu)) || EV.best || null;
      }
      function refreshHints() {
        const p = cur();
        p.rooms.forEach((r, i) => {
          const rt = $('#rt' + i);
          if (rt) rt.textContent = r.name || 'Raum ' + (i + 1);
          const sm = $('#sum' + i);
          if (sm) {
            const t = roomSummary(r);
            if (sm.textContent !== t) {
              sm.textContent = t;
              flash(sm);
            }
          }
          const b = E.bedarfKw(r, DB),
            bh = $('#bh' + i);
          if (bh)
            bh.textContent =
              b == null
                ? 'Fläche eintragen oder Bedarf selbst angeben'
                : E.num(r.bedarf) != null
                  ? 'manuell'
                  : `berechnet aus Fläche, ${fmt(b)} kW`;
          const u = E.pickUnit(r, DB),
            pk = $('#pick' + i);
          if (pk)
            pk.innerHTML = u

      /* Wechsel Eingabe und Ergebnis: Überblenden, erst dann neu zeichnen */
      function swapStep(step) {
        if (isRes() === (step === 'res')) return;
        view.step = step;
        prevKpi = null;
        fadeThrough(() => {
          render();
          window.scrollTo(0, 0);
        });
      }
      /* ====== Aktionen ====== */
      const Act = {
        new() {
          const p = newProject();
          projects.unshift(p);
          saveProjects();
          go('edit', { id: p.id });
        },
        open(d) {
          go('edit', { id: d.id });
        },
        async del(d) {
          const p = projects.find((x) => x.id === d.id);
          if (
            p &&
            (await confirmModal(
              'Auslegung löschen',
              'Auslegung „' + (p.nr || 'ohne Projektnummer') + '“ löschen?',
              'Löschen',
              true,
            ))
          ) {
            projects = projects.filter((x) => x.id !== d.id);
            saveProjects();
            render();
          }
        },
        back() {
          go('list');
        },
        toresult() {
          swapStep('res');
        },
        toinput() {
          swapStep('in');
        },
        /* Nur Klasse umschalten (kein Neuzeichnen): Eingabefelder behalten den Fokus */
        toggleroom(d, el) {
          const r = cur().rooms[+d.i],
            card = el.closest('.acc');
          if (!r || !card) return;
          const open = !openRooms.has(r.id);
          if (open) openRooms.add(r.id);
          else openRooms.delete(r.id);
          card.classList.toggle('is-open', open);
          el.setAttribute('aria-expanded', open);
        },
        toggleacc(d, el) {
          const card = el.closest('.acc');
          if (!card) return;
          const open = !card.classList.contains('is-open');
          card.classList.toggle('is-open', open);
          el.setAttribute('aria-expanded', open);
          uiOpen[d.k] = open;
        },
        setf(d, el) {
          const p = cur(),
            card = el.closest('[data-room]');
          if (!p || !card) return;
          const r = p.rooms[+card.dataset.room],
            f = d.f;
          r[f] = d.v;
          lastPdf = null;
          if (f === 'typ') {
            const s = [...new Set(DB.ig.filter((x) => x.typ === r.typ).map((x) => x.serie))];
            r.serie = s.includes('Perfera') ? 'Perfera' : s[0] || '';
            r.modell = '';
          }
          if (f === 'serie') r.modell = '';
          saveProjects();
          render();
        },
        addroom() {
          const p = cur();
          if (p.rooms.length < 5) {
            const r = newRoom();
            p.rooms.push(r);
            openRooms.add(r.id);
            saveProjects();
            render();
          }
        },
        sign(d, btn) {
          const inp = btn.parentElement.querySelector('input'),
            card = btn.closest('[data-room]'),
            p = cur();
          if (!inp || !card || !p) return;
          let v = inp.value.trim().replace('−', '-');
          v = v.startsWith('-') ? v.slice(1) : v === '' ? '-' : '-' + v.replace(/^\+/, '');
          inp.value = v;
          p.rooms[+card.dataset.room].hoehe = v;
          lastPdf = null;
          saveProjects();
          refreshResults();
          inp.focus();
        },
        delroom(d) {
          const p = cur();
          p.rooms.splice(+d.i, 1);
          saveProjects();
          render();
        },
        pickodu(d) {
          const p = cur();
          p.odu = p.odu === d.id ? '' : d.id;
          saveProjects();
          lastPdf = null;
          refreshResults();
        },
        async makepdf(d, btn) {
          if (!window.jspdf || !window.html2canvas) {
            toast('PDF-Modul nicht geladen – App einmal online neu starten.');
            return;
          }
          if (pdfBusy) return;
          const p = cur(),
            x = selected();
          if (!x || !x.ok) return;
          if (btn.classList.contains('done')) return;
          const snap = () =>
            JSON.stringify([
              p.rooms,
              p.odu,
              p.nr,
              p.datum,
              p.kunde,
              p.bearbeiter,
              p.bemerkung,
              settings.firma,
            ]);
          const s0 = snap();
          const cb = () => $('#bar .pdfb'); // immer der aktuell im DOM befindliche Knopf (die Leiste wird bei Änderungen neu gebaut)
          const setP = (v) => {
            pdfProg = v;
            const f = $('#bar .pdfb .fill');
            if (f) f.style.transform = 'scaleX(' + v + ')';
          };
          pdfBusy = p.id;
          pdfProg = 0;
          {
            const b = cb();
            if (b) b.classList.add('run');
          }
          setP(0.05);
          try {
            const blob = await reportPdfBlob(buildReport(p, x), { onProgress: setP });
            setP(1);
            await new Promise((res) => setTimeout(res, RM() ? 0 : 240));
            if (!projects.includes(p) || snap() !== s0) {
              toast('Daten geändert – PDF bitte neu erstellen');
              return;
            }
            if (lastPdf) URL.revokeObjectURL(lastPdf.url);
            lastPdf = {
              id: p.id,
              file: new File([blob], pdfName(p.nr) + '.pdf', { type: 'application/pdf' }),
              url: URL.createObjectURL(blob),
            };
            pdfBusy = null;
            if (view.name === 'edit' && view.id === p.id) {
              refreshResults(); // baut Leiste neu auf -> neuen Knopf in den Fertig-Zustand setzen
              const nb = cb();
              if (nb) {
                nb.classList.remove('run');
                nb.classList.add('done');
                setTimeout(() => nb.classList.remove('done'), 2600);
              }
              toast(
                'PDF „' + (p.nr || 'ohne Projektnummer') + '“ ist fertig. Jetzt „Teilen“ antippen.',
              );
            } else toast('PDF „' + (p.nr || 'ohne Projektnummer') + '“ ist fertig.');
          } catch (e) {
            toast('PDF konnte nicht erstellt werden: ' + e.message);
          } finally {
            pdfBusy = null;
            pdfProg = 0;
            const b = cb();
            if (b && !b.classList.contains('done')) {
              b.classList.remove('run');
              setP(0);
            }
          }
        },
        async sharepdf() {
          if (!lastPdf) return;
          const files = [lastPdf.file];
          if (navigator.canShare && navigator.canShare({ files })) {
            try {
              await navigator.share({ files, title: lastPdf.file.name });
            } catch (e) {
              if (e.name !== 'AbortError') toast('Teilen fehlgeschlagen: ' + e.message);
            }
          } else if (isStandalone()) window.open(lastPdf.url, '_blank');
          else {
            const a = document.createElement('a');
            a.href = lastPdf.url;
            a.download = lastPdf.file.name;
            document.body.appendChild(a);
            a.click();
            a.remove();
          }
        },
        checkupdate() {
          pruefeUpdate(true);
        },
        forcereload() {
          clearCachesAndReload();
        },
        saveset() {
          settings.firma = $('#s_firma').value.trim();
          settings.bearbeiter = $('#s_bear').value.trim();
          LS.set(KEY.settings, settings);
          modalClose();
          toast('Gespeichert.');
        },
      };
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-act]');
        if (!el || !Act[el.dataset.act]) return;
        Act[el.dataset.act](el.dataset, el);
      });
      $('#btnset').onclick = () => openSettings();

      /* Eingaben: Texte und Zahlen aktualisieren nur das Ergebnis, Auswahlfelder zeichnen neu */
      document.addEventListener('input', (e) => {
        const t = e.target,
          p = view.name === 'edit' ? cur() : null;
        if (!p) return;
        if (t.dataset.p) {
          p[t.dataset.p] = t.value;
          lastPdf = null;
          saveProjects();
          return;
        }
        const card = t.closest('[data-room]');
        if (!card || !t.dataset.f) return;
        p.rooms[+card.dataset.room][t.dataset.f] = t.value;
        lastPdf = null;
        saveProjects();
        refreshResults();
      });
      window.addEventListener('online', updateNet);
      window.addEventListener('offline', updateNet);

      if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
        navigator.serviceWorker.register('sw.js').catch(() => {});
      loadData();
      syncThemeUi();
      render();
      if (navigator.onLine) pruefeUpdate(false);
    </script>
    <script type="module">
      import { initChoiceDropdowns, initUnitPadding } from './shared/choice-dropdown.js';
      let bereit = false;
      window.agUiInit = () => {
        if (bereit) return;
        bereit = true;
        initChoiceDropdowns();
        initUnitPadding();
      };
      window.agUiInit();
    </script>
  </body>
</html>
