<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f8f7f4"
      data-orig="#f8f7f4"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#121212"
      data-orig="#121212"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Elektro &amp; MSR" />
    <title>Elektrotechnik &amp; MSR – Vorschau</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('muther-theme');
          var r = document.documentElement;
          if (t === 'hell') r.setAttribute('data-theme', 'light');
          else if (t === 'dunkel') r.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(../../shared/lib/fonts/plus-jakarta-sans-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF,
          U+FFFD;
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(../../shared/lib/fonts/plus-jakarta-sans-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      :root {
        --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;

        --gold: #dccc4b;
        --gold-dark: #c4b53e;
        --gold-text: #6f6112;
        --gold-soft: #faf6dc;
        --on-gold: #1a1a1a;

        --bg: #f8f7f4;
        --card: #ffffff;
        --ink: #1a1a1a;
        --ink-2: #3a3a3a;
        --muted: #6b6a66;
        --line: #eceae3;
        --line-strong: #d6d3c9;
        --ctl: #ffffff;
        --track: #e6e3da;
        --seg-track: #ecebe5;
        --seg-on: #ffffff;
        --seg-shadow: 0 1px 3px rgba(26, 26, 26, 0.14), 0 0 0 0.5px rgba(26, 26, 26, 0.06);
        --glass: rgba(248, 247, 244, 0.74);
        --glass-edge: rgba(26, 26, 26, 0.08);
        --hero-bg: var(--card);
        --hero-edge: var(--line);
        --hero-ink: var(--ink);
        --hero-muted: var(--muted);
        --bad: #b42318;
        --bad-bg: #fdecea;
        --warn: #7a4e00;
        --warn-bg: #fdf3d6;
        --ok: #1e7a46;
        --ok-bg: #e3f4ea;

        --r-card: 16px;
        --r-ctl: 12px;
        --r-small: 8px;
        --r-pill: 999px;

        --s1: 4px;
        --s2: 8px;
        --s3: 12px;
        --s4: 16px;
        --s5: 24px;
        --s6: 32px;
        --s7: 48px;

        --touch: 44px;
        --shadow-hero: 0 4px 16px rgba(0, 0, 0, 0.08);
        --shadow-thumb: 0 2px 6px rgba(0, 0, 0, 0.25);
        --shadow-toast: 0 8px 24px rgba(0, 0, 0, 0.3);
        --ctl-h: 48px;
        --r-seg-inner: 10px;
        --r-logo: 9px;
        --thumb: 28px;
        --einheit-w: 48px;
        --glass-blur: blur(20px) saturate(180%);
        --toast-bg: #111111;
        --toast-ink: #ffffff;
        --btn-shine: inset 0 1px 0 rgba(255, 255, 255, 0.45);
        --track-display: -0.03em;
        --track-title: -0.02em;
        --track-small: 0.01em;
        --press: 0.98;
        --press-icon: 0.94;
        --pruefstand-platz: 144px;
        --fs-hero: clamp(32px, 11vw, 44px);
        --press-in: var(--duration-quick);
        --press-out: var(--duration-fast);

        --duration-micro: 80ms;
        --duration-quick: 150ms;
        --duration-fast: 250ms;
        --duration-medium: 350ms;
        --duration-slow: 400ms;
        --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1);
        --distance-micro: 4px;
        --distance-small: 6px;
        --distance-base: 8px;
        --blur-small: 2px;
        --scale-medium: 0.97;
        --acc-expand: var(--duration-fast);
        --acc-collapse: var(--duration-fast);
        --acc-chevron: var(--duration-fast);
        --acc-ease: var(--ease-smooth-out);
        --seg-dur: var(--duration-fast);
        --seg-ease: var(--ease-smooth-out);
        --subtle-dur: var(--duration-fast);
        --subtle-ease: var(--ease-smooth-out);
        --subtle-distance: var(--distance-micro);
        --shake-dur-a: var(--duration-micro);
        --shake-dur-b: 60ms;
        --shake-distance: var(--distance-base);
        --shake-overshoot: 2px;
        --shake-ease: var(--ease-smooth-out);
        --toast-open: var(--duration-slow);
        --toast-close: var(--duration-medium);
        --check-laenge: 22;

        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
        --gutter: 16px;
        --max-breite: 1040px;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --gold-text: #dccc4b;
          --gold-soft: #3a3516;
          --bg: #121212;
          --card: #1e1e1e;
          --ink: #ffffff;
          --ink-2: #ece9e0;
          --muted: #c2c0b6;
          --line: #3a3833;
          --line-strong: #5e5b52;
          --ctl: #262522;
          --track: #46443e;
          --seg-track: #2a2926;
          --seg-on: #4c4a43;
          --seg-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
          --glass: rgba(18, 18, 18, 0.74);
          --glass-edge: rgba(255, 255, 255, 0.14);
          --bad: #ff8a80;
          --bad-bg: #3f1d1a;
          --warn: #ffc65c;
          --warn-bg: #3d3010;
          --ok: #62d994;
          --ok-bg: #14301f;
        }
      }

      :root[data-theme='dark'] {
        --gold-text: #dccc4b;
        --gold-soft: #3a3516;
        --bg: #121212;
        --card: #1e1e1e;
        --ink: #ffffff;
        --ink-2: #ece9e0;
        --muted: #c2c0b6;
        --line: #3a3833;
        --line-strong: #5e5b52;
        --ctl: #262522;
        --track: #46443e;
        --seg-track: #2a2926;
        --seg-on: #4c4a43;
        --seg-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        --glass: rgba(18, 18, 18, 0.74);
        --glass-edge: rgba(255, 255, 255, 0.14);
        --bad: #ff8a80;
        --bad-bg: #3f1d1a;
        --warn: #ffc65c;
        --warn-bg: #3d3010;
        --ok: #62d994;
        --ok-bg: #14301f;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html {
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
        scrollbar-gutter: stable;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select {
        font-family: inherit;
      }

      button {
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        cursor: pointer;
      }

      input {
        font-size: 16px;
      }

      :focus-visible {
        outline: 2px solid var(--gold-dark);
        outline-offset: 2px;
      }

      .kopf {
        position: sticky;
        top: 0;
        z-index: 30;
        padding-top: var(--safe-t);
        padding-left: var(--safe-l);
        padding-right: var(--safe-r);
        background: var(--glass);
        -webkit-backdrop-filter: var(--glass-blur);
        backdrop-filter: var(--glass-blur);
        border-bottom: 1px solid var(--glass-edge);
      }

      .kopf-innen {
        height: 56px;
        display: flex;
        align-items: center;
        gap: var(--s3);
        padding: 0 var(--gutter);
        max-width: var(--max-breite);
        margin: 0 auto;
      }

      .logo {
        width: 32px;
        height: 32px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: var(--r-logo);
        background: var(--gold);
        color: var(--on-gold);
        font-weight: 800;
        font-size: 17px;
      }

      .kopf-titel {
        flex: 1;
        min-width: 0;
      }

      .kopf-titel strong {
        display: block;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: var(--track-title);
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .kopf-titel span {
        display: block;
        letter-spacing: var(--track-small);
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        line-height: 1.2;
      }

      .icon-knopf {
        width: var(--touch);
        height: var(--touch);
        flex: none;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: var(--r-pill);
        background: transparent;
        color: var(--ink);
        transition:
          transform var(--press-out) var(--ease-smooth-out),
          background var(--press-out) var(--ease-smooth-out);
      }

      .icon-knopf:active {
        transition-duration: var(--press-in);
        transform: scale(var(--press-icon));
        background: var(--seg-track);
      }

      svg.ico {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }

      main {
        max-width: var(--max-breite);
        margin: 0 auto;
        padding: var(--s4) calc(var(--gutter) + var(--safe-l)) calc(var(--pruefstand-platz) + var(--safe-b))
          calc(var(--gutter) + var(--safe-l));
        outline: none;
      }

      h1 {
        margin: var(--s2) 0 var(--s4);
        font-size: 26px;
        font-weight: 800;
        letter-spacing: var(--track-title);
        line-height: 1.2;
      }

      h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.3;
      }

      .modul-wahl {
        margin-bottom: var(--s4);
      }

      .raster {
        display: grid;
        gap: var(--s4);
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }

      .spalte {
        display: grid;
        gap: var(--s4);
        align-content: start;
        min-width: 0;
      }

      .karte {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        padding: var(--s4);
      }

      .karte-kopf {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--s3);
        margin-bottom: var(--s3);
      }

      .karte-kopf small {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }

      .ergebnis {
        background: var(--hero-bg);
        color: var(--hero-ink);
        border: 1px solid var(--hero-edge);
        border-radius: var(--r-card);
        padding: var(--s4);
        box-shadow: var(--shadow-hero);
      }

      .ergebnis-label {
        margin: 0;
        letter-spacing: var(--track-small);
        font-size: 13px;
        font-weight: 600;
        color: var(--hero-muted);
      }

      .ergebnis-zeile {
        display: flex;
        align-items: baseline;
        gap: var(--s2);
        flex-wrap: wrap;
      }

      .ergebnis-zahl {
        font-size: var(--fs-hero);
        font-weight: 800;
        letter-spacing: var(--track-display);
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }

      .ergebnis-zahl.leer {
        color: var(--hero-muted);
      }

      .ergebnis-einheit {
        font-size: 22px;
        font-weight: 700;
        color: var(--gold-text);
      }

      .ergebnis-neben {
        margin: var(--s1) 0 0;
        font-size: 17px;
        font-weight: 700;
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
      }

      .meldungen {
        display: grid;
        gap: var(--s2);
        margin-top: var(--s3);
      }

      .meldungen:empty {
        display: none;
      }

      .meldung span,
      .ampel li span,
      .karte-kopf h2,
      .karte-kopf small,
      .feld-label,
      .feld-hinweis,
      .feld-fehler,
      .chip small,
      .seg button {
        overflow-wrap: anywhere;
      }

      .meldung {
        display: flex;
        gap: var(--s2);
        align-items: flex-start;
        margin: 0;
        padding: var(--s2) var(--s3);
        border-radius: var(--r-ctl);
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
      }

      .meldung svg.ico {
        width: 20px;
        height: 20px;
        margin-top: 1px;
      }

      .meldung.fehler {
        background: var(--bad-bg);
        color: var(--bad);
      }

      .meldung.hinweis {
        background: var(--warn-bg);
        color: var(--warn);
      }

      .meldung.ok {
        background: var(--ok-bg);
        color: var(--ok);
      }

      .meldung.info {
        background: var(--gold-soft);
        color: var(--ink-2);
        border-left: 4px solid var(--gold);
        border-radius: var(--r-small);
      }

      .seg {
        position: relative;
        display: flex;
        gap: 2px;
        padding: 2px;
        border-radius: var(--r-ctl);
        background: var(--seg-track);
      }

      .seg button {
        flex: 1;
        min-width: 0;
        min-height: var(--touch);
        position: relative;
        z-index: 1;
        padding: 0 var(--s2);
        border: 0;
        border-radius: var(--r-seg-inner);
        background: transparent;
        color: var(--muted);
        font-size: 15px;
        font-weight: 600;
        line-height: 1.2;
        transition:
          color var(--press-out) var(--ease-smooth-out),
          transform var(--press-out) var(--ease-smooth-out);
      }

      .seg button:active {
        transition-duration: var(--press-in);
        transform: scale(var(--press));
      }

      .seg button[aria-checked='true'] {
        color: var(--ink);
      }

      .seg-pille {
        position: absolute;
        top: 2px;
        bottom: 2px;
        left: 0;
        width: 0;
        border-radius: var(--r-seg-inner);
        background: var(--seg-on);
        box-shadow: var(--seg-shadow);
        opacity: 0;
        transform: translateX(0);
        transition:
          transform var(--seg-dur) var(--seg-ease),
          width var(--seg-dur) var(--seg-ease);
        pointer-events: none;
        z-index: 0;
      }

      .seg-pille.ohne-bewegung {
        transition: none;
      }

      .seg.klein {
        width: max-content;
        max-width: 100%;
      }

      .seg.klein button {
        flex: none;
        min-width: 64px;
        font-size: 14px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
      }

      .chip {
        min-height: var(--touch);
        min-width: var(--touch);
        padding: var(--s1) var(--s4);
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line-strong);
        border-radius: var(--r-pill);
        background: var(--ctl);
        color: var(--ink);
        font-size: 15px;
        font-weight: 600;
        line-height: 1.25;
        font-variant-numeric: tabular-nums;
        transition:
          transform var(--press-out) var(--ease-smooth-out),
          background var(--press-out) var(--ease-smooth-out),
          border-color var(--press-out) var(--ease-smooth-out),
          box-shadow var(--press-out) var(--ease-smooth-out);
      }

      .chip:active {
        transition-duration: var(--press-in);
        transform: scale(var(--press));
      }

      .chip[aria-checked='true'] {
        background: var(--gold-soft);
        border-color: var(--gold-dark);
        box-shadow: inset 0 0 0 1px var(--gold-dark);
      }

      .chip small {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }

      .chip.empf::after {
        content: 'Empfehlung';
        font-size: 11px;
        font-weight: 700;
        color: var(--gold-text);
        line-height: 1.1;
      }

      .chip.lang {
        align-items: flex-start;
        border-radius: var(--r-ctl);
        text-align: left;
      }

      .chips.spalten {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
      }

      .feld {
        padding: var(--s3) 0;
        border-top: 1px solid var(--line);
      }

      .feld.erstes {
        border-top: 0;
        padding-top: 0;
      }

      .feld.letztes {
        padding-bottom: 0;
      }

      .feld-label {
        display: block;
        margin-bottom: var(--s2);
        font-size: 14px;
        font-weight: 700;
        color: var(--ink-2);
      }

      .feld-hinweis {
        margin: var(--s2) 0 0;
        letter-spacing: var(--track-small);
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
      }

      .feld-reihe {
        display: flex;
        align-items: center;
        gap: var(--s2);
      }

      .eingabe-huelle {
        position: relative;
        flex: 1;
        min-width: 0;
      }

      .eingabe-huelle input {
        width: 100%;
        height: var(--ctl-h);
        padding: 0 calc(var(--s3) + var(--einheit-w) + var(--s2)) 0 var(--s3);
        border: 1px solid var(--line-strong);
        border-radius: var(--r-ctl);
        background: var(--ctl);
        color: var(--ink);
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: right;
        transition:
          border-color var(--duration-quick) var(--ease-smooth-out),
          box-shadow var(--duration-quick) var(--ease-smooth-out);
        -webkit-appearance: none;
        appearance: none;
      }

      .eingabe-huelle input:focus {
        outline: none;
        border-color: var(--gold-dark);
        box-shadow: 0 0 0 3px var(--gold-soft);
      }

      .eingabe-huelle input[aria-invalid='true'] {
        border-color: var(--bad);
      }

      .einheit {
        position: absolute;
        right: var(--s3);
        top: 0;
        bottom: 0;
        width: var(--einheit-w);
        display: flex;
        align-items: center;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
        pointer-events: none;
        white-space: nowrap;
      }

      .feld-fehler {
        animation: t-meldung-ein var(--duration-fast) var(--ease-smooth-out) both;
        margin: var(--s2) 0 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--bad);
      }

      .feld-fehler:empty {
        display: none;
      }

      input[type='range'] {
        width: 100%;
        height: var(--touch);
        margin: var(--s1) 0 0;
        padding: 0;
        background: transparent;
        -webkit-appearance: none;
        appearance: none;
        touch-action: pan-y;
      }

      input[type='range']::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(
          to right,
          var(--ink) 0 var(--fill, 0%),
          var(--track) var(--fill, 0%) 100%
        );
      }

      input[type='range']::-moz-range-track {
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(
          to right,
          var(--ink) 0 var(--fill, 0%),
          var(--track) var(--fill, 0%) 100%
        );
      }

      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: var(--thumb);
        height: var(--thumb);
        margin-top: -12px;
        border-radius: 50%;
        border: 0.5px solid var(--line-strong);
        background: var(--seg-on);
        box-shadow: var(--shadow-thumb);
        transition: transform var(--duration-quick) var(--ease-smooth-out);
      }

      input[type='range']::-moz-range-thumb {
        width: var(--thumb);
        height: var(--thumb);
        border-radius: 50%;
        border: 0.5px solid var(--line-strong);
        background: var(--seg-on);
        box-shadow: var(--shadow-thumb);
      }

      input[type='range']:active::-webkit-slider-thumb {
        transform: scale(1.08);
      }

      .kacheln {
        display: grid;
        gap: var(--s2);

        }

        }

        .toast.sichtbar {
          transition:
            opacity var(--duration-quick) linear,
            visibility 0s linear 0s;

        .t-subtle-number.is-animating .t-subtle-old {

        .t-success-check[data-state='in'] {

          background: var(--seg-track);
        }

        .chip[aria-checked='true']:hover {
          background: var(--gold-soft);
        }
      }

      const fmtDe = {};

      function zahlFormat(stellenMin, stellenMax, gruppiert) {
        const key = stellenMin + '/' + stellenMax + '/' + gruppiert;
        if (!fmtDe[key]) {
          fmtDe[key] = new Intl.NumberFormat('de-DE', {
            minimumFractionDigits: stellenMin,
            maximumFractionDigits: stellenMax,
            useGrouping: gruppiert,
          });
        }
        return fmtDe[key];

      function formatZahl(x, stellen, gruppiert) {
        if (typeof x !== 'number' || !Number.isFinite(x)) {
          return '–';
        }
        const wert = Math.abs(x) < 0.5 * Math.pow(10, -stellen) ? 0 : x;
        return zahlFormat(stellen, stellen, gruppiert !== false).format(wert);

      function formatMin(x, stellen) {
        if (typeof x === 'number' && x > 0 && Math.abs(x) < 0.5 * Math.pow(10, -stellen)) {
          return '< ' + formatZahl(Math.pow(10, -stellen), stellen);
        }
        return formatZahl(x, stellen);
      }

      function formatVorzeichen(x, stellen) {
        const text = formatZahl(x, stellen, true);
        if (text === '–') {
          return text;
        }
        return x > 0 && Number(text.replace(/\./g, '').replace(',', '.')) !== 0 ? '+' + text : text;

      function formatOhm(r) {
        if (!Number.isFinite(r)) {
          return '–';
        }
        const stellen = r >= 10000 ? 0 : r >= 1000 ? 1 : 2;
        return formatZahl(r, stellen, true);

      function formatKiloOhm(r) {
        if (!Number.isFinite(r)) {
          return '–';
        }
        return formatZahl(r / 1000, 3, true);

        if (typeof x !== 'number' || !Number.isFinite(x)) {
          return '';
        }
        return zahlFormat(0, 3, false).format(Math.round(x * 1000) / 1000);
      }

      function istUnendlich(text) {
        return WORTE_UNENDLICH.indexOf(String(text).trim().toLowerCase()) >= 0;
      }

      function parseZahl(text, tausenderPunkt) {
        if (text === null || text === undefined) {
          return null;
        }
        let s = String(text).trim().replace(/\s+/g, '').replace(/[−–]/g, '-');
        if (s === '') {
          return null;
        }
        const punkte = (s.match(/\./g) || []).length;
        const kommas = (s.match(/,/g) || []).length;
        if (kommas > 1) {
          return NaN;
        }
        if (kommas === 1) {
          s = s.replace(/\./g, '').replace(',', '.');
        } else if (punkte > 1) {
          s = s.replace(/\./g, '');
        } else if (tausenderPunkt === true && punkte === 1 && /^[+-]?[1-9]\d{0,2}\.\d{3}$/.test(s)) {
          s = s.replace('.', '');
        }
        if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(s)) {
          return NaN;
        }
        const wert = Number(s);
        return Number.isFinite(wert) ? wert : NaN;
      }

      function ptWiderstand(r0, t) {
        const grundteil = 1 + PT_A * t + PT_B * t * t;
        if (t >= 0) {
          return r0 * grundteil;
        }
        return r0 * (grundteil + PT_C * (t - 100) * t * t * t);
      }

      function ptAbleitung(r0, t) {
        if (t >= 0) {
          return r0 * (PT_A + 2 * PT_B * t);
        }
        return r0 * (PT_A + 2 * PT_B * t + 4 * PT_C * t * t * t - 300 * PT_C * t * t);
      }

      function ptTemperatur(r0, r) {
        const verhaeltnis = r / r0;
        if (verhaeltnis >= 1) {
          const diskriminante = PT_A * PT_A - 4 * PT_B * (1 - verhaeltnis);
          return (-PT_A + Math.sqrt(diskriminante)) / (2 * PT_B);
        }
        let t = (verhaeltnis - 1) / PT_A;
        for (let i = 0; i < NEWTON_MAX; i += 1) {
          const abweichung = ptWiderstand(r0, t) - r;
          const schritt = abweichung / ptAbleitung(r0, t);
          t -= schritt;
          if (Math.abs(schritt) < NEWTON_TOL) {
            break;
          }
        }
        return t;
      }

      function ntcWiderstand(r25, b, t) {
        return r25 * Math.exp(b * (1 / (t + K_NULL) - 1 / T_REF_K));
      }

      function ntcTemperatur(r25, b, r) {
        return 1 / (1 / T_REF_K + Math.log(r / r25) / b) - K_NULL;
      }

      function sensorSuchen(id) {
        return SENSOREN.find(function (s) {
          return s.id === id;
        });
      }

      function widerstandVonTemperatur(sensor, b, t) {
        if (sensor.typ === 'pt') {
          return ptWiderstand(sensor.r0, t);
        }
        return ntcWiderstand(sensor.r25, b, t);
      }

      function temperaturVonWiderstand(sensor, b, r) {
        if (sensor.typ === 'pt') {
          return ptTemperatur(sensor.r0, r);
        }
        return ntcTemperatur(sensor.r25, b, r);
      }

      function widerstandBewerten(sensor, b, r) {
        const rKurz = widerstandVonTemperatur(sensor, b, sensor.typ === 'pt' ? PT_MIN_C : HLK_MAX_C);
        const rOffen = widerstandVonTemperatur(sensor, b, sensor.typ === 'pt' ? PT_MAX_C : HLK_MIN_C);
        const rSicher = KURZSCHLUSS_ANTEIL * (sensor.typ === 'pt' ? sensor.r0 : rKurz);
        if (r < rSicher) {
          return {
            status: 'kurzschluss',
            meldung: {
              typ: 'fehler',
              text: 'Kurzschluss: Widerstand praktisch 0 Ω. Fühler oder Leitung kurzgeschlossen?',
            },
          };
        }
        if (r > rOffen) {
          return {
            status: 'kabelbruch',
            meldung: {
              typ: 'fehler',
              text:
                'Leitungsunterbrechung / Kabelbruch? Widerstand liegt über dem Wert bei ' +
                (sensor.typ === 'pt' ? PT_MAX_C : HLK_MIN_C) +
                ' °C (' +
                formatOhm(rOffen) +
                ' Ω).',
            },
          };
        }
        if (r < rKurz) {
          if (sensor.typ === 'pt') {
            return {
              status: 'kurzschluss',
              meldung: {
                typ: 'hinweis',
                text:
                  'Kurzschluss? Widerstand liegt unter dem Messbereich des PT-Fühlers (' +
                  PT_MIN_C +
                  ' °C = ' +
                  formatOhm(rKurz) +
                  ' Ω).',
              },
            };
          }
          return {
            status: 'warnung',
            meldung: {
              typ: 'hinweis',
              text:
                'Kurzschluss? Der Widerstand entspricht über ' +
                HLK_MAX_C +
                ' °C und liegt außerhalb des üblichen HLK-Bereichs.',
            },
          };
        }
        return { status: 'ok', meldung: null };
      }

      function offsetBewerten(delta, sensor) {
        const betrag = Math.abs(delta);
        let ergebnis;
        if (betrag <= TOL_GRUEN_K) {
          ergebnis = { stufe: 'ok', text: 'in Toleranz' };
        } else if (betrag <= TOL_ORANGE_K) {
          ergebnis = {
            stufe: 'warn',
            text: 'driftet – prüfen (Leitungswiderstand, Übergang, Kalibrierung)',
          };
        } else {
          ergebnis = { stufe: 'fehler', text: 'defekt oder falscher Fühlertyp?' };
        }
        ergebnis.delta = delta;
        ergebnis.leitungshinweis = null;
        if (sensor.id === 'PT100' && betrag > TOL_GRUEN_K) {
          ergebnis.leitungshinweis =
            'PT100 im 2-Leiter-Anschluss: Leitungswiderstand wirkt doppelt, ca. ' +
            formatZahl(PT100_OHM_PRO_K, 2) +
            ' Ω je K. ' +
            formatZahl(betrag, 1) +
            ' K entsprechen etwa ' +
            formatZahl(betrag * PT100_OHM_PRO_K, 2) +
            ' Ω Schleifenwiderstand.';
        }
        return ergebnis;
      }

      function stuetzstellen(sensor, b) {
        const zeilen = [];
        for (let t = TABELLE_VON_C; t <= TABELLE_BIS_C; t += TABELLE_SCHRITT_K) {
          zeilen.push({ t: t, r: widerstandVonTemperatur(sensor, b, t) });
        }
        return zeilen;
      }

      function fuehlerAuswerten(e) {
        const sensor = sensorSuchen(e.sensor);
        const ergebnis = {
          gueltig: false,
          fehler: {},
          meldungen: [],
          sensor: sensor,
          b: null,
          modus: e.modus,
          t: null,
          r: null,
          offset: null,
          tabelle: [],
          eingabeText: '',
          gelesen: '',
        };
        if (!sensor) {
          ergebnis.fehler.sensor = 'Unbekannter Fühlertyp.';
          return ergebnis;
        }
        if (sensor.typ === 'ntc') {
          if (e.bWahl === 'eigen') {
            const bEigen = parseZahl(e.bEigen);
            if (bEigen === null || Number.isNaN(bEigen) || bEigen < B_WERT_MIN || bEigen > B_WERT_MAX) {
              ergebnis.fehler.bEigen =
                'Bitte B-Wert zwischen ' + B_WERT_MIN + ' und ' + B_WERT_MAX + ' K eingeben.';
              return ergebnis;
            }
            ergebnis.b = bEigen;
          } else {
            ergebnis.b = Number(e.bWahl) || B_WERT_STANDARD;
          }
        }
        ergebnis.tabelle = stuetzstellen(sensor, ergebnis.b);
        if (e.modus === 'tr') {
          return temperaturZuWiderstand(e, sensor, ergebnis);
        }
        return widerstandZuTemperatur(e, sensor, ergebnis);
      }

      function temperaturZuWiderstand(e, sensor, ergebnis) {
        const t = parseZahl(e.tText);
        if (t === null) {
          ergebnis.fehler.tText = 'Bitte Temperatur in °C eingeben.';
          return ergebnis;
        }
        if (Number.isNaN(t)) {
          ergebnis.fehler.tText = 'Das ist keine gültige Zahl. Beispiel: 21,5';
          return ergebnis;
        }
        if (sensor.typ === 'pt' && (t < PT_MIN_C || t > PT_MAX_C)) {
          ergebnis.fehler.tText =
            'Außerhalb des Messbereichs (' + PT_MIN_C + ' bis +' + PT_MAX_C + ' °C).';
          return ergebnis;
        }
        if (sensor.typ === 'ntc' && (t < -100 || t > 250)) {
          ergebnis.fehler.tText = 'Außerhalb des plausiblen Bereichs (−100 bis +250 °C).';
          return ergebnis;
        }
        const r = widerstandVonTemperatur(sensor, ergebnis.b, t);
        if (!Number.isFinite(r) || r <= 0) {
          ergebnis.fehler.tText = 'Für diese Temperatur lässt sich kein Widerstand berechnen.';
          return ergebnis;
        }
        if (sensor.typ === 'ntc' && (t < HLK_MIN_C || t > HLK_MAX_C)) {
          ergebnis.meldungen.push({
            typ: 'hinweis',
            text: 'Temperatur außerhalb des üblichen HLK-Bereichs (−50 bis +150 °C).',
          });
        }
        ergebnis.gueltig = true;
        ergebnis.t = t;
        ergebnis.r = r;
        ergebnis.eingabeText = formatZahl(t, 1) + ' °C';
        return ergebnis;
      }

      function widerstandZuTemperatur(e, sensor, ergebnis) {
        const einheitFaktor = e.einheit === 'kohm' ? 1000 : 1;
        const einheitText = e.einheit === 'kohm' ? 'kΩ' : 'Ω';
        if (istUnendlich(e.rText)) {
          ergebnis.meldungen.push({
            typ: 'fehler',
            text: 'Leitungsunterbrechung / Kabelbruch? Messgerät zeigt „OL“ (offene Schleife).',
          });
          ergebnis.eingabeText = 'OL';
          ergebnis.status = 'kabelbruch';
          ergebnis.gueltig = true;
          return ergebnis;
        }
        const eingabe = parseZahl(e.rText, e.einheit !== 'kohm');
        if (eingabe === null) {
          ergebnis.fehler.rText = 'Bitte Widerstand in ' + einheitText + ' eingeben.';
          return ergebnis;
        }
        if (Number.isNaN(eingabe)) {
          ergebnis.fehler.rText = 'Das ist keine gültige Zahl. Beispiel: 1385,06 oder 1.385,06';
          return ergebnis;
        }
        if (eingabe < 0) {
          ergebnis.fehler.rText = 'Widerstand darf nicht negativ sein.';
          return ergebnis;
        }
        const r = eingabe * einheitFaktor;
        ergebnis.r = r;
        if (/\./.test(String(e.rText)) && !/,/.test(String(e.rText))) {
          ergebnis.gelesen = 'gelesen als ' + formatOhm(r) + ' Ω';
        }
        ergebnis.eingabeText = formatOhm(r) + ' Ω';
        ergebnis.gueltig = true;
        const bewertung = widerstandBewerten(sensor, ergebnis.b, r);
        ergebnis.status = bewertung.status;
        if (bewertung.meldung) {
          ergebnis.meldungen.push(bewertung.meldung);
        }
        if (bewertung.status === 'kurzschluss' || bewertung.status === 'kabelbruch') {
          return ergebnis;
        }
        const t = temperaturVonWiderstand(sensor, ergebnis.b, r);
        if (!Number.isFinite(t)) {
          ergebnis.meldungen.push({
            typ: 'fehler',
            text: 'Für diesen Widerstand lässt sich keine Temperatur berechnen.',
          });
          return ergebnis;
        }
        ergebnis.t = t;
        offsetPruefen(e, sensor, ergebnis);
        return ergebnis;
      }

      function offsetPruefen(e, sensor, ergebnis) {
        const angezeigt = parseZahl(e.angezeigtText);
        if (angezeigt === null) {
          return;
        }
        if (Number.isNaN(angezeigt)) {
          ergebnis.fehler.angezeigtText = 'Das ist keine gültige Zahl. Beispiel: 21,5';
          return;
        }
        ergebnis.angezeigt = angezeigt;
        ergebnis.offset = offsetBewerten(angezeigt - ergebnis.t, sensor);
      }

      function fuehlerBewertungText(ergebnis) {
        if (ergebnis.meldungen.length > 0) {
          return ergebnis.meldungen[0].text;
        }
        if (ergebnis.offset) {
          return 'Abweichung ' + formatVorzeichen(ergebnis.offset.delta, 1) + ' K – ' + ergebnis.offset.text;
        }
        return 'Keine Auffälligkeit.';
      }

      function fuehlerMarkdown(e, ergebnis, datum) {
        const zeilen = ['### Fühler-Check ' + ergebnis.sensor.id, '', 'Datum: ' + datum, ''];
        zeilen.push('**Eingaben**');
        zeilen.push('- Fühlertyp: ' + ergebnis.sensor.id);
        if (ergebnis.sensor.typ === 'ntc') {
          zeilen.push('- B-Wert: ' + formatZahl(ergebnis.b, 0, false) + ' K');
        }
        zeilen.push('- Richtung: ' + (ergebnis.modus === 'tr' ? 'Temperatur → Widerstand' : 'Widerstand → Temperatur'));
        zeilen.push('- Eingabe: ' + ergebnis.eingabeText);
        if (ergebnis.angezeigt !== undefined && ergebnis.angezeigt !== null && ergebnis.modus !== 'tr') {
          zeilen.push('- Angezeigt in der Regelung: ' + formatZahl(ergebnis.angezeigt, 1) + ' °C');
        }
        zeilen.push('');
        zeilen.push('**Ergebnis**');
        if (ergebnis.modus === 'tr') {
          zeilen.push('- Widerstand: ' + formatOhm(ergebnis.r) + ' Ω (' + formatKiloOhm(ergebnis.r) + ' kΩ)');
        } else if (ergebnis.t !== null) {
          zeilen.push('- Berechnete Temperatur: ' + formatZahl(ergebnis.t, 1) + ' °C');
        } else {
          zeilen.push('- Berechnete Temperatur: nicht möglich');
        }
        if (ergebnis.offset) {
          zeilen.push('- Abweichung (angezeigt − berechnet): ' + formatVorzeichen(ergebnis.offset.delta, 1) + ' K');
        }
        zeilen.push('');
        zeilen.push('**Bewertung:** ' + fuehlerBewertungText(ergebnis));
        return zeilen.join('\n');
      }

      function lastStrom(netz, leistungKw, cosPhi) {
        const nenner = netz.id === '3' ? Math.sqrt(3) * netz.u * cosPhi : netz.u * cosPhi;
        return (leistungKw * 1000) / nenner;
      }

      function izBasis(verlegung, adern, index) {
        return IZ_TABELLE[verlegung][adern][index];
      }

      function izEffektiv(e, netz, index) {
        const art = VERLEGEARTEN[e.verlegung];
        const material = MATERIALIEN[e.material];
        const basis = izBasis(e.verlegung, netz.adern, index);
        const fTemp = TEMP_FAKTOREN[e.temperatur];
        const fHaeufung = HAEUFUNG_FAKTOREN[art.haeufung][e.haeufung];
        return basis * fTemp * fHaeufung * material.izFaktor;
      }

      function spannungsfall(netz, laenge, strom, cosPhi, kappa, querschnitt) {
        return (netz.b * laenge * strom * cosPhi) / (kappa * querschnitt);
      }

      function lsWaehlen(ib, charakteristik) {
        const nenn = LS_REIHE.find(function (n) {
          return n >= ib;
        });
        if (nenn === undefined) {
          return null;
        }
        return { nenn: nenn, label: charakteristik + nenn + 'A' };
      }

      function kabelEingabePruefen(e) {
        const fehler = {};
        const werte = {};
        const cos = parseZahl(e.cosText);
        if (cos === null) {
          fehler.cosText = 'Bitte cos φ eingeben (z. B. 0,90).';
        } else if (Number.isNaN(cos) || cos < COS_MIN || cos > COS_MAX) {
          fehler.cosText = 'cos φ muss zwischen ' + formatZahl(COS_MIN, 1) + ' und 1,00 liegen.';
        } else {
          werte.cos = cos;
        }
        const laenge = parseZahl(e.laengeText);
        if (laenge === null) {
          fehler.laengeText = 'Bitte Leitungslänge in m eingeben.';
        } else if (Number.isNaN(laenge) || laenge < KABEL_LAENGE_MIN || laenge > KABEL_LAENGE_MAX) {
          fehler.laengeText =
            'Länge muss zwischen ' + KABEL_LAENGE_MIN + ' und ' + KABEL_LAENGE_MAX + ' m liegen.';
        } else {
          werte.laenge = laenge;
        }
        if (e.last === 'P') {
          const p = parseZahl(e.pText);
          if (p === null) {
            fehler.pText = 'Bitte Leistung in kW eingeben.';
          } else if (Number.isNaN(p) || p <= 0 || p > KABEL_LEISTUNG_MAX) {
            fehler.pText = 'Leistung muss größer 0 und höchstens ' + KABEL_LEISTUNG_MAX + ' kW sein.';
          } else {
            werte.p = p;
          }
        } else {
          const i = parseZahl(e.iText);
          if (i === null) {
            fehler.iText = 'Bitte Strom in A eingeben.';
          } else if (Number.isNaN(i) || i <= 0 || i > KABEL_STROM_MAX) {
            fehler.iText = 'Strom muss größer 0 und höchstens ' + KABEL_STROM_MAX + ' A sein.';
          } else {
            werte.i = i;
          }
        }
        return { fehler: fehler, werte: werte };
      }

      function querschnittBewerten(e, netz, ib, cos, laenge, ls, index) {
        const material = MATERIALIEN[e.material];
        const a = QUERSCHNITTE[index];
        const izEff = izEffektiv(e, netz, index);
        const du = spannungsfall(netz, laenge, ib, cos, material.kappa, a);
        const duProz = (du / netz.u) * 100;
        const alZulaessig = e.material !== 'al' || a >= AL_MIN_QUERSCHNITT;
        const okIz = ls !== null && ls.nenn <= izEff;
        const okDu = duProz <= e.duMax;
        return {
          a: a,
          izEff: izEff,
          du: du,
          duProz: duProz,
          okIz: okIz,
          okDu: okDu,
          alZulaessig: alZulaessig,
          ok: okIz && okDu && alZulaessig,
        };
      }

      function kabelAuswerten(e) {
        const netz = NETZE[e.netz];
        const art = LASTARTEN[e.lastart];
        const pruefung = kabelEingabePruefen(e);
        const ergebnis = {
          gueltig: false,
          fehler: pruefung.fehler,
          meldungen: [],
          netz: netz,
          zeilen: [],
          empfehlung: null,
          gewaehlt: null,
          manuell: false,
          ib: null,
          ls: null,
        };
        if (!netz || !art || !MATERIALIEN[e.material] || !VERLEGEARTEN[e.verlegung]) {
          ergebnis.fehler.auswahl = 'Ungültige Auswahl. Bitte Netz, Lastart, Material und Verlegeart neu wählen.';
          return ergebnis;
        }
        if (!TEMP_FAKTOREN[e.temperatur] || !HAEUFUNG_FAKTOREN.wand[e.haeufung] || !(e.duMax > 0)) {
          ergebnis.fehler.auswahl = 'Ungültige Auswahl bei Temperatur, Häufung oder Spannungsfall. Bitte neu wählen.';
          return ergebnis;
        }
        if (Object.keys(pruefung.fehler).length > 0) {
          return ergebnis;
        }
        const w = pruefung.werte;
        const ib = e.last === 'P' ? lastStrom(netz, w.p, w.cos) : w.i;
        ergebnis.ib = ib;
        ergebnis.cos = w.cos;
        ergebnis.laenge = w.laenge;
        ergebnis.ls = lsWaehlen(ib, art.charakteristik);
        ergebnis.zeilen = QUERSCHNITTE.map(function (_, index) {
          return querschnittBewerten(e, netz, ib, w.cos, w.laenge, ergebnis.ls, index);
        });
        ergebnis.empfehlung =
          ergebnis.zeilen.find(function (z) {
            return z.ok;
          }) || null;
        const manuelleZeile = ergebnis.zeilen.find(function (z) {
          return z.a === e.manuell;
        });
        if (manuelleZeile) {
          ergebnis.gewaehlt = manuelleZeile;
          ergebnis.manuell = true;
        } else {
          ergebnis.gewaehlt = ergebnis.empfehlung || ergebnis.zeilen[ergebnis.zeilen.length - 1];
        }
        ergebnis.gueltig = true;
        kabelMeldungen(e, ergebnis);
        return ergebnis;
      }

      function kabelMeldungen(e, ergebnis) {
        const meldungen = ergebnis.meldungen;
        if (ergebnis.ls === null) {
          meldungen.push({
            typ: 'fehler',
            text:
              'Betriebsstrom ' +
              formatZahl(ergebnis.ib, 1) +
              ' A liegt über dem größten Leitungsschutzschalter (63 A). Aufteilung oder Unterverteilung prüfen.',
          });
        }
        if (!ergebnis.empfehlung && ergebnis.ls !== null) {
          const nurDu = ergebnis.zeilen.some(function (z) {
            return z.okIz && z.alZulaessig;
          });
          const ursache = nurDu
            ? 'Der Spannungsfall ist selbst bei 25 mm² zu hoch (Leitung zu lang).'
            : 'Die Strombelastbarkeit reicht selbst bei 25 mm² nicht (Strom zu hoch).';
          meldungen.push({
            typ: 'fehler',
            text:
              'Kein Querschnitt bis 25 mm² passend. ' +
              ursache +
              ' Größerer Querschnitt, kürzere Leitung oder Unterverteilung nötig.',
          });
        }
        if (e.material === 'al') {
          meldungen.push({
            typ: 'info',
            text:
              'Aluminium: in der Praxis erst ab ' +
              AL_MIN_QUERSCHNITT +
              ' mm². Iz = Kupferwert × 0,78 (Näherung).',
          });
        }
        if (ergebnis.manuell && !ergebnis.gewaehlt.alZulaessig) {
          meldungen.push({
            typ: 'hinweis',
            text: 'Aluminium unter ' + AL_MIN_QUERSCHNITT + ' mm² ist in der Praxis nicht üblich.',
          });
        }
      }

      function kabelBewertungText(ergebnis) {
        const g = ergebnis.gewaehlt;
        if (!ergebnis.empfehlung && !ergebnis.manuell) {
          return 'Kein Querschnitt bis 25 mm² passend.';
        }
        if (g.ok) {
          return 'OK: ' + formatZahl(g.a, 1, false) + ' mm² erfüllt Strombelastbarkeit und Spannungsfall.';
        }
        const probleme = [];
        if (!g.okIz) {
          probleme.push('Strombelastbarkeit nicht erfüllt');
        }
        if (!g.okDu) {
          probleme.push('Spannungsfall zu hoch');
        }
        if (!g.alZulaessig) {
          probleme.push('Aluminium unter ' + AL_MIN_QUERSCHNITT + ' mm² unüblich');
        }
        return 'Nicht OK bei ' + formatZahl(g.a, 1, false) + ' mm²: ' + probleme.join(', ') + '.';

            haken.removeAttribute('data-state');
            beschriftungSetzen(KOPIER_TEXT);
          }, KOPIER_ERFOLG_MS);
        };
        knopf.addEventListener('click', beiKlick);
        return knopf;
      }

      function akkordeon(titel, inhalt, offen) {
        const titelEl = h('span', { class: 't-acc-titel' }, titel);
        const kopf = h(
          'button',
          { type: 'button', class: 't-acc-head', 'aria-expanded': String(offen) },
          titelEl,
          h('span', { class: 't-acc-chevron', 'aria-hidden': 'true' }, icon('chevron')),
        );
        const wurzel = h(
          'section',
          { class: 'karte t-acc', 'data-open': String(offen) },
          kopf,
          h('div', { class: 't-acc-panel' }, h('div', { class: 't-acc-panel-inner' }, inhalt)),
        );
        kopf.addEventListener('click', function () {
          const auf = wurzel.getAttribute('data-open') !== 'true';
          wurzel.setAttribute('data-open', String(auf));
          kopf.setAttribute('aria-expanded', String(auf));
        });
        return {
          el: wurzel,
          titelSetzen(text) {
            titelEl.textContent = text;
          },
        };
      }

      /* ===== Modul 1: Fühler-Check ===== */
      function fuehlerModul() {
        const z = zustandLaden('fuehler');
        const syncs = [];
        const felder = {};

        function speichern() {
          Speicher.schreiben('fuehler', z);
        }

        function setzen(key) {
          return function (wert) {
            z[key] = wert;
            speichern();
            aktualisieren();
          };
        }

        function registrieren(baustein) {
          syncs.push(baustein.sync);
          return baustein.el;
        }

        function istNtc() {
          const s = sensorSuchen(z.sensor);
          return Boolean(s) && s.typ === 'ntc';
        }

        const sensorChips = registrieren(
          chips(
            SENSOREN.map(function (s) {
              return { wert: s.id, text: s.id };
            }),
            function () {
              return z.sensor;
            },
            setzen('sensor'),
            'Fühlertyp',
          ),
        );

        const bChips = registrieren(
          chips(
            B_WERTE,
            function () {
              return z.bWahl;
            },
            setzen('bWahl'),
            'B-Wert',
          ),
        );

        felder.bEigen = zahlFeld({
          id: 'f-beigen',
          label: 'Eigener B-Wert',
          einheit: 'K',
          platzhalter: '3950',
          lesen: function () {
            return z.bEigen;
          },
          schreiben: setzen('bEigen'),
        });
        syncs.push(felder.bEigen.sync);

        const bBlock = h(
          'div',
          { class: 'feld' },
          h('span', { class: 'feld-label' }, 'B-Wert (NTC)'),
          bChips,
          felder.bEigen.el,
        );
        felder.bEigen.el.style.marginTop = 'var(--s3)';

        const modusSeg = registrieren(
          segment(
            [
              { wert: 'rt', text: 'Widerstand → Temperatur' },
              { wert: 'tr', text: 'Temperatur → Widerstand' },
            ],
            function () {
              return z.modus;
            },
            setzen('modus'),
            'Richtung',
          ),
        );

        const einheitSeg = registrieren(
          segment(
            [
              { wert: 'ohm', text: 'Ω' },
              { wert: 'kohm', text: 'kΩ' },
            ],
            function () {
              return z.einheit;
            },
            setzen('einheit'),
            'Einheit des Widerstands',
            { klein: true },
          ),
        );

        felder.rText = zahlFeld({
          id: 'f-r',
          label: 'Gemessener Widerstand',
          einheit: 'Ω',
          platzhalter: 'z. B. 1385,06 oder OL',
          lesen: function () {
            return z.rText;
          },
          schreiben: setzen('rText'),
        });
        felder.tText = zahlFeld({
          id: 'f-t',
          label: 'Temperatur',
          einheit: '°C',
          platzhalter: 'z. B. 21,5',
          lesen: function () {
            return z.tText;
          },
          schreiben: setzen('tText'),
        });
        felder.angezeigtText = zahlFeld({
          id: 'f-ang',
          label: 'Angezeigte Temperatur in der Regelung (optional)',
          einheit: '°C',
          platzhalter: 'z. B. 22,0',
          lesen: function () {
            return z.angezeigtText;
          },
          schreiben: setzen('angezeigtText'),
        });
        syncs.push(felder.rText.sync, felder.tText.sync, felder.angezeigtText.sync);

        const richtungBlock = h('div', { class: 'feld' }, h('span', { class: 'feld-label' }, 'Richtung'), modusSeg);
        const einheitBlock = h('div', { class: 'feld' }, h('span', { class: 'feld-label' }, 'Einheit'), einheitSeg);

        const ergebnisBox = h('div', { class: 'ergebnis', 'aria-live': 'polite' });
        const offsetBox = h('section', { class: 'karte' });
        const tabellenKoerper = h('tbody');
        const tabellenKopf = h('thead');
        const stuetzAkkordeon = akkordeon(
          'Stützstellen −20 … +100 °C',
          h('div', { class: 'tabelle-huelle' }, h('table', null, tabellenKopf, tabellenKoerper)),
          false,
        );
        const tabelleDetails = stuetzAkkordeon.el;

        let letztesErgebnis = null;
        const kopierenKnopfEl = kopierKnopf(function () {
          if (!letztesErgebnis || !letztesErgebnis.gueltig) {
            toast('Bitte zuerst gültige Werte eingeben.');
            return;
          }
          kopieren(fuehlerMarkdown(z, letztesErgebnis, datumJetzt()), kopierenKnopfEl);
        });

        const eingabeSpalte = h(
          'div',
          { class: 'spalte' },
          karte(
            'Fühler',
            null,
            h('div', { class: 'feld erstes letztes' }, h('span', { class: 'feld-label' }, 'Fühlertyp'), sensorChips),
            bBlock,
          ),
          karte(
            'Messung',
            null,
            richtungBlock,
            einheitBlock,
            felder.rText.el,
            felder.tText.el,
            felder.angezeigtText.el,
          ),
        );

        const ergebnisSpalte = h(
          'div',
          { class: 'spalte ergebnisse' },
          ergebnisBox,
          offsetBox,
          tabelleDetails,
          kopierenKnopfEl,
        );

        const wurzel = h('div', { class: 'raster' }, eingabeSpalte, ergebnisSpalte);

        function tabelleRendern(ergebnis) {
          const sensor = ergebnis.sensor;
          tabellenKopf.replaceChildren(
            h('tr', null, h('th', null, '°C'), h('th', null, 'R in Ω'), h('th', null, 'R in kΩ')),
          );
          const aktuellT = ergebnis.t;
          let naechste = null;
          if (aktuellT !== null && aktuellT >= TABELLE_VON_C - TABELLE_SCHRITT_K / 2 && aktuellT <= TABELLE_BIS_C + TABELLE_SCHRITT_K / 2) {
            naechste = Math.round(aktuellT / TABELLE_SCHRITT_K) * TABELLE_SCHRITT_K;
          }
          tabellenKoerper.replaceChildren(
            ...ergebnis.tabelle.map(function (zeile) {
              return h(
                'tr',
                { class: zeile.t === naechste ? 'treffer' : null },
                h('td', null, formatVorzeichen(zeile.t, 0)),
                h('td', null, formatOhm(zeile.r)),
                h('td', null, formatKiloOhm(zeile.r)),
              );
            }),
          );
          stuetzAkkordeon.titelSetzen(
            'Stützstellen −20 … +100 °C (' + sensor.id + (ergebnis.b ? ', B ' + formatZahl(ergebnis.b, 0, false) + ' K' : '') + ')',
          );
        }

        function ergebnisRendern(ergebnis) {
          const kinder = [];
          const inRt = z.modus !== 'tr';
          kinder.push(h('p', { class: 'ergebnis-label' }, inRt ? 'Berechnete Temperatur' : 'Berechneter Widerstand'));
          if (!ergebnis.gueltig && !ergebnis.sensor) {
            kinder.push(h('div', { class: 'ergebnis-zeile' }, h('span', { class: 'ergebnis-zahl leer' }, '–')));
          } else if (inRt && ergebnis.t !== null) {
            kinder.push(
              h(
                'div',
                { class: 'ergebnis-zeile' },
                h('span', { class: 'ergebnis-zahl' }, zahlMitUebergang('f-erg', formatZahl(ergebnis.t, 1))),
                h('span', { class: 'ergebnis-einheit' }, '°C'),
              ),
            );
          } else if (!inRt && ergebnis.r !== null) {
            kinder.push(
              h(
                'div',
                { class: 'ergebnis-zeile' },
                h('span', { class: 'ergebnis-zahl' }, zahlMitUebergang('f-erg', formatOhm(ergebnis.r))),
                h('span', { class: 'ergebnis-einheit' }, 'Ω'),
              ),
            );
            kinder.push(h('p', { class: 'ergebnis-neben' }, formatKiloOhm(ergebnis.r) + ' kΩ'));
          } else {
            kinder.push(h('div', { class: 'ergebnis-zeile' }, h('span', { class: 'ergebnis-zahl leer' }, '–')));
          }
          const meldungen = h('div', { class: 'meldungen' }, ergebnis.meldungen.map(meldungElement));
          const feldFehler = Object.keys(ergebnis.fehler);
          if (feldFehler.length > 0 && ergebnis.meldungen.length === 0) {
            const erster = ergebnis.fehler[feldFehler[0]];
            meldungen.append(meldungElement({ typ: 'info', text: erster }));
          }
          kinder.push(meldungen);
          ergebnisBox.replaceChildren(...kinder);
        }

        function offsetRendern(ergebnis) {
          const aktiv = z.modus !== 'tr' && ergebnis.offset;
          offsetBox.hidden = !aktiv;
          if (!aktiv) {
            return;
          }
          const o = ergebnis.offset;
          offsetBox.replaceChildren(
            h('div', { class: 'karte-kopf' }, h('h2', null, 'Abweichung zur Regelung')),
            h(
              'div',
              { class: 'kacheln' },
              kachel('Berechnet', formatZahl(ergebnis.t, 1) + ' °C'),
              kachel('Angezeigt', formatZahl(ergebnis.angezeigt, 1) + ' °C'),
              kachel('ΔT (angezeigt − berechnet)', formatVorzeichen(o.delta, 1) + ' K'),
            ),
            h('ul', { class: 'ampel' }, ampelZeile(o.stufe, '|ΔT| = ' + formatZahl(Math.abs(o.delta), 1) + ' K: ' + o.text)),
            ...(o.leitungshinweis ? [h('div', { class: 'meldungen' }, meldungElement({ typ: 'info', text: o.leitungshinweis }))] : []),
          );
        }

        function aktualisieren() {
          syncs.forEach(function (fn) {
            fn();
          });
          const ntc = istNtc();
          bBlock.hidden = !ntc;
          felder.bEigen.el.hidden = !(ntc && z.bWahl === 'eigen');
          const inRt = z.modus !== 'tr';
          einheitBlock.hidden = !inRt;
          felder.rText.el.hidden = !inRt;
          felder.angezeigtText.el.hidden = !inRt;
          felder.tText.el.hidden = inRt;
          felder.rText.einheitSetzen(z.einheit === 'kohm' ? 'kΩ' : 'Ω');
          feldGruppe(...[richtungBlock, einheitBlock, felder.rText.el, felder.tText.el, felder.angezeigtText.el].filter(function (el) {
            return !el.hidden;
          }));
          const ergebnis = fuehlerAuswerten(z);
          letztesErgebnis = ergebnis;
          Object.keys(felder).forEach(function (key) {
            felder[key].fehlerSetzen(ergebnis.fehler[key] || '');
          });
          felder.rText.gelesenSetzen(inRt ? ergebnis.gelesen : '');
          ergebnisRendern(ergebnis);
          offsetRendern(ergebnis);
          if (ergebnis.sensor) {
            tabelleRendern(ergebnis);
          }
          kopierenKnopfEl.disabled = !ergebnis.gueltig;
        }

        return { el: wurzel, aktualisieren: aktualisieren };
      }

      /* ===== Modul 2: Kabel & Spannungsfall ===== */
      function kabelModul() {
        const z = zustandLaden('kabel');
        const syncs = [];
        const felder = {};
        let letztesErgebnis = null;

        function speichern() {
          Speicher.schreiben('kabel', z);
        }

        function setzen(key, nachher) {
          return function (wert) {
            z[key] = wert;
            if (nachher) {
              nachher(wert);
            }
            speichern();
            aktualisieren();
          };
        }

        function registrieren(baustein) {
          syncs.push(baustein.sync);
          return baustein.el;
        }

        const netzSeg = registrieren(
          segment(
            Object.values(NETZE).map(function (n) {
              return { wert: n.id, text: n.text };
            }),
            function () {
              return z.netz;
            },
            setzen('netz'),
            'Netz',
          ),
        );

        const lastartChips = registrieren(
          chips(
            Object.values(LASTARTEN).map(function (l) {
              return { wert: l.id, text: l.text, sub: 'cos φ ' + formatZahl(l.cos, 2) + ' · LS ' + l.charakteristik };
            }),
            function () {
              return z.lastart;
            },
            setzen('lastart', function (wert) {
              z.cosText = formatZahl(LASTARTEN[wert].cos, 2);
            }),
            'Lastart',
          ),
        );

        const lastSeg = registrieren(
          segment(
            [
              { wert: 'I', text: 'Strom I (A)' },
              { wert: 'P', text: 'Leistung P (kW)' },
            ],
            function () {
              return z.last;
            },
            setzen('last'),
            'Lastangabe',
          ),
        );

        felder.iText = zahlFeld({
          id: 'k-i',
          label: 'Strom I',
          einheit: 'A',
          platzhalter: 'z. B. 16',
          lesen: function () {
            return z.iText;
          },
          schreiben: setzen('iText'),
        });
        felder.pText = zahlFeld({
          id: 'k-p',
          label: 'Leistung P',
          einheit: 'kW',
          platzhalter: 'z. B. 3,6',
          lesen: function () {
            return z.pText;
          },
          schreiben: setzen('pText'),
        });
        felder.cosText = zahlFeld({
          id: 'k-cos',
          label: 'cos φ',
          einheit: '',
          platzhalter: '0,90',
          lesen: function () {
            return z.cosText;
          },
          schreiben: setzen('cosText'),
        });
        felder.laengeText = zahlFeld({
          id: 'k-l',
          label: 'Leitungslänge l',
          einheit: 'm',
          platzhalter: '30',
          lesen: function () {
            return z.laengeText;
          },
          schreiben: setzen('laengeText'),
        });
        syncs.push(felder.iText.sync, felder.pText.sync, felder.cosText.sync, felder.laengeText.sync);

        const slider = h('input', {
          type: 'range',
          min: String(KABEL_LAENGE_MIN),
          max: '150',
          step: '1',
          'aria-label': 'Leitungslänge in Metern',
        });
        slider.addEventListener('input', function () {
          z.laengeText = String(slider.value);
          speichern();
          aktualisieren();
        });
        function sliderSync() {
          const wert = parseZahl(z.laengeText);
          const gueltig = wert !== null && !Number.isNaN(wert);
          const geklemmt = gueltig ? Math.min(Math.max(wert, KABEL_LAENGE_MIN), 150) : KABEL_LAENGE_MIN;
          slider.value = String(geklemmt);
          slider.style.setProperty('--fill', ((geklemmt - KABEL_LAENGE_MIN) / (150 - KABEL_LAENGE_MIN)) * 100 + '%');
        }
        syncs.push(sliderSync);

        const materialSeg = registrieren(
          segment(
            Object.values(MATERIALIEN).map(function (m) {
              return { wert: m.id, text: m.text + ' (κ ' + m.kappa + ')' };
            }),
            function () {
              return z.material;
            },
            setzen('material'),
            'Leitermaterial',
          ),
        );
        const materialHinweis = h(
          'p',
          { class: 'feld-hinweis' },
          'Aluminium in der Praxis erst ab 16 mm². Iz = Kupferwert × 0,78 (Näherung).',
        );

        const verlegeChips = registrieren(
          chips(
            Object.values(VERLEGEARTEN).map(function (v) {
              return { wert: v.id, text: v.text + ' – ' + v.info };
            }),
            function () {
              return z.verlegung;
            },
            setzen('verlegung'),
            'Verlegeart',
            { lang: true, spalten: true },
          ),
        );

        const tempChips = registrieren(
          chips(
            Object.keys(TEMP_FAKTOREN).map(function (t) {
              return { wert: t, text: t + ' °C', sub: Number(t) === 30 ? 'Referenz' : '' };
            }),
            function () {
              return z.temperatur;
            },
            function (wert) {
              z.temperatur = Number(wert);
              speichern();
              aktualisieren();
            },
            'Umgebungstemperatur',
          ),
        );

        const haeufungChips = registrieren(
          chips(
            [1, 2, 3, 4].map(function (n) {
              return { wert: n, text: String(n) };
            }),
            function () {
              return z.haeufung;
            },
            function (wert) {
              z.haeufung = Number(wert);
              speichern();
              aktualisieren();
            },
            'Anzahl belasteter Kabel',
          ),
        );

        const duChips = registrieren(
          chips(
            DU_GRENZEN,
            function () {
              return z.duMax;
            },
            function (wert) {
              z.duMax = Number(wert);
              speichern();
              aktualisieren();
            },
            'Maximaler Spannungsfall',
          ),
        );

        const testChips = registrieren(
          chips(
            QUERSCHNITTE.map(function (a) {
              return { wert: a, text: formatZahl(a, 1, false) + ' mm²' };
            }),
            function () {
              return letztesErgebnis && letztesErgebnis.gueltig ? letztesErgebnis.gewaehlt.a : '';
            },
            function (wert) {
              z.manuell = Number(wert);
              speichern();
              aktualisieren();
            },
            'Querschnitt testen',
            {
              empfohlen: function () {
                return letztesErgebnis && letztesErgebnis.empfehlung ? letztesErgebnis.empfehlung.a : null;
              },
            },
          ),
        );
        const testZuruecksetzen = h('button', { type: 'button', class: 'chip' }, 'Auto');
        testZuruecksetzen.addEventListener('click', function () {
          z.manuell = null;
          speichern();
          aktualisieren();
        });
        testChips.append(testZuruecksetzen);

        const ergebnisBox = h('div', { class: 'ergebnis', 'aria-live': 'polite' });
        const kachelBox = h('section', { class: 'karte' });
        const vergleichBox = h('section', { class: 'karte' });
        const tabellenKoerper = h('tbody');
        const tabelleDetails = akkordeon(
          'Vergleich aller Querschnitte',
          h(
            'div',
            { class: 'tabelle-huelle' },
            h(
              'table',
              null,
              h('thead', null, h('tr', null, h('th', null, 'mm²'), h('th', null, 'Iz eff. (A)'), h('th', null, 'Δu (%)'), h('th', null, 'Status'))),
              tabellenKoerper,
            ),
          ),
          true,
        ).el;

        const kopierenKnopfEl = kopierKnopf(function () {
          if (!letztesErgebnis || !letztesErgebnis.gueltig) {
            toast('Bitte zuerst gültige Werte eingeben.');
            return;

          kopieren(kabelMarkdown(z, letztesErgebnis, datumJetzt()), kopierenKnopfEl);

        const blockLast = h('div', { class: 'feld' }, h('span', { class: 'feld-label' }, 'Last'), lastSeg);
        const blockMaterial = h('div', { class: 'feld' }, h('span', { class: 'feld-label' }, 'Leitermaterial'), materialSeg, materialHinweis);
        const blockLaenge = h('div', { class: 'feld' });
        const laengeLabel = felder.laengeText.el.querySelector('.feld-label');
        const laengeReihe = felder.laengeText.el.querySelector('.feld-reihe');
        blockLaenge.append(laengeLabel, laengeReihe, slider, felder.laengeText.el.querySelector('.feld-fehler'));

        const eingabeSpalte = h(
          'div',
          { class: 'spalte' },
          karte(
            'Netz & Last',
            null,
            ...feldGruppe(
              labelBlock('Netz', netzSeg),
              labelBlock('Lastart', lastartChips),
              blockLast,
              felder.iText.el,
              felder.pText.el,
              felder.cosText.el,
            ),
          ),
          karte('Leitung', null, ...feldGruppe(blockLaenge, blockMaterial)),
          karte(
            'Verlegung & Umgebung',
            null,
            ...feldGruppe(
              labelBlock('Verlegeart', verlegeChips),
              labelBlock('Umgebungstemperatur', tempChips, 'Referenz 30 °C, PVC-Isolierung 70 °C'),
              labelBlock('Häufung (belastete Kabel)', haeufungChips, HAEUFUNG_HINWEIS),
              labelBlock('Spannungsfall Δu max', duChips),
            ),
          ),
        );

        vergleichBox.append(
          h('div', { class: 'karte-kopf' }, h('h2', null, 'Querschnitt testen')),

        const ergebnisSpalte = h(
          'div',
          { class: 'spalte ergebnisse' },
          ergebnisBox,
          kachelBox,
          vergleichBox,

          kopierenKnopfEl,
          h('p', { class: 'fussnote' }, FUSSNOTE_KABEL),
        );

        const wurzel = h('div', { class: 'raster' }, eingabeSpalte, ergebnisSpalte);

        function mm2(a) {
          return formatZahl(a, 1, false) + ' mm²';
        }

        function ergebnisRendern(ergebnis) {
          const kinder = [];
          kinder.push(h('p', { class: 'ergebnis-label' }, 'Empfohlener Querschnitt'));
          if (!ergebnis.gueltig) {
            kinder.push(h('div', { class: 'ergebnis-zeile' }, h('span', { class: 'ergebnis-zahl leer' }, '–')));
          } else if (ergebnis.empfehlung) {
            kinder.push(
              h(
                'div',
                { class: 'ergebnis-zeile' },
                h('span', { class: 'ergebnis-zahl' }, zahlMitUebergang('k-erg', formatZahl(ergebnis.empfehlung.a, 1, false))),
                h('span', { class: 'ergebnis-einheit' }, 'mm² ' + MATERIALIEN[z.material].text),
              ),
            );
            kinder.push(
              h('p', { class: 'ergebnis-neben' }, 'Leitungsschutz ' + (ergebnis.ls ? ergebnis.ls.label : '–')),
            );
          } else {
            kinder.push(h('div', { class: 'ergebnis-zeile' }, h('span', { class: 'ergebnis-zahl leer' }, 'keiner')));
          }
          const meldungen = h('div', { class: 'meldungen' }, ergebnis.meldungen.map(meldungElement));
          const feldFehler = Object.keys(ergebnis.fehler);
          if (feldFehler.length > 0) {
            meldungen.append(meldungElement({ typ: 'info', text: ergebnis.fehler[feldFehler[0]] }));
          }
          kinder.push(meldungen);
          ergebnisBox.replaceChildren(...kinder);
        }

        function kachelnRendern(ergebnis) {
          kachelBox.hidden = !ergebnis.gueltig;
          vergleichBox.hidden = !ergebnis.gueltig;
          tabelleDetails.hidden = !ergebnis.gueltig;
          if (!ergebnis.gueltig) {
            return;
          }
          const g = ergebnis.gewaehlt;
          const quelle = ergebnis.manuell ? 'manuell gewählt' : ergebnis.empfehlung ? 'Empfehlung' : 'größter Querschnitt';
          const material = MATERIALIEN[z.material];
          kachelBox.replaceChildren(
            h('div', { class: 'karte-kopf' }, h('h2', null, 'Ergebnis für ' + mm2(g.a)), h('small', null, quelle)),
            h(
              'div',
              { class: 'kacheln' },
              kachel('Betriebsstrom IB', formatMin(ergebnis.ib, 1) + ' A', 'cos φ ' + formatZahl(ergebnis.cos, 2)),
              kachel('Querschnitt', mm2(g.a), material.text),
              kachel('Leitungsschutz', ergebnis.ls ? ergebnis.ls.label : '> 63 A', z.lastart === 'ohm' ? 'Charakteristik B' : 'Charakteristik C'),
              kachel('Spannungsfall ΔU', formatMin(g.du, 2) + ' V', formatMin(g.duProz, 2) + ' % (max. ' + formatZahl(z.duMax, 1) + ' %)'),
              kachel('Iz effektiv', formatZahl(g.izEff, 1) + ' A', 'Basis ' + formatZahl(izBasis(z.verlegung, ergebnis.netz.adern, QUERSCHNITTE.indexOf(g.a)), 1) + ' A' + (z.material === 'al' ? ' · Näherung' : '')),
            ),
            h(
              'ul',
              { class: 'ampel' },
              ampelZeile(g.okIz ? 'ok' : 'fehler', 'Strombelastbarkeit: ' + (g.okIz ? 'erfüllt' : 'nicht erfüllt') + (ergebnis.ls ? ' (' + ergebnis.ls.label + ' ≤ Iz ' + formatZahl(g.izEff, 1) + ' A)' : '')),
              ampelZeile(g.okDu ? 'ok' : 'fehler', 'Spannungsfall: ' + (g.okDu ? 'erfüllt' : 'nicht erfüllt') + ' (' + formatMin(g.duProz, 2) + ' % ≤ ' + formatZahl(z.duMax, 1) + ' %)'),
            ),
          );
          tabellenKoerper.replaceChildren(
            ...ergebnis.zeilen.map(function (zeile) {
              const ok = zeile.ok;
              return h(
                'tr',
                { class: ergebnis.empfehlung && zeile.a === ergebnis.empfehlung.a ? 'treffer' : null },
                h('td', null, formatZahl(zeile.a, 1, false)),
                h('td', null, formatZahl(zeile.izEff, 1)),
                h('td', null, formatMin(zeile.duProz, 2)),
                h('td', { class: ok ? 'ok' : 'fehler' }, ok ? 'OK' : zeile.alZulaessig ? 'nicht OK' : 'Al ab 16 mm²'),
              );
            }),
          );
        }

        function aktualisieren() {
          syncs.forEach(function (fn) {
            fn();
          });
          const inP = z.last === 'P';
          felder.iText.el.hidden = inP;
          felder.pText.el.hidden = !inP;
          materialHinweis.hidden = z.material !== 'al';
          const ergebnis = kabelAuswerten(z);
          letztesErgebnis = ergebnis;
          syncs.forEach(function (fn) {
            fn();
          });
          Object.keys(felder).forEach(function (key) {
            felder[key].fehlerSetzen(ergebnis.fehler[key] || '');
          });
          ergebnisRendern(ergebnis);
          kachelnRendern(ergebnis);
          testZuruecksetzen.setAttribute('aria-pressed', String(z.manuell === null));
          kopierenKnopfEl.disabled = !ergebnis.gueltig;
        }

        return { el: wurzel, aktualisieren: aktualisieren };
      }

      /* ===== Seite ===== */
      const App = (function () {
        const BAUER = { fuehler: fuehlerModul, kabel: kabelModul };
        const MODUL_KEY = SPEICHER_PRAEFIX + 'modul';
        const instanzen = {};
        let aktiv = 'fuehler';

        function aktivLesen() {
          try {
            const gespeichert = localStorage.getItem(MODUL_KEY);
            if (BAUER[gespeichert]) {
              return gespeichert;
            }
          } catch (err) {
            return 'fuehler';
          }
          return 'fuehler';
        }

        function aktivSchreiben(id) {
          if (PRUEFSTAND.aktiv) {
            return;
          }
          try {
            localStorage.setItem(MODUL_KEY, id);
          } catch (err) {
            return;
          }
        }

        function anzeigen(id, animiert) {
          aktiv = id;
          aktivSchreiben(id);
          Object.keys(instanzen).forEach(function (key) {
            instanzen[key].el.hidden = key !== id;
          });
          document.getElementById('kopf-modul').textContent = MODULE.find(function (m) {
            return m.id === id;
          }).label;
          segment$.sync();
          instanzen[id].aktualisieren();
          if (animiert) {
            instanzen[id].el.classList.remove('modul-ein');
            void instanzen[id].el.offsetWidth;
            instanzen[id].el.classList.add('modul-ein');
          }
          if (window.pruefstandBeschriften) {
            window.pruefstandBeschriften();
          }
        }

        const segment$ = segment(
          MODULE.map(function (m) {
            return { wert: m.id, text: m.label };
          }),
          function () {
            return aktiv;
          },
          function (id) {
            anzeigen(id, true);
          },
          'Modul',
        );

        function aufbauen(startId) {
          const inhalt = document.getElementById('inhalt');
          Object.keys(instanzen).forEach(function (key) {
            instanzen[key].el.remove();
            delete instanzen[key];
          });
          MODULE.forEach(function (m) {
            try {
              instanzen[m.id] = BAUER[m.id]();
            } catch (err) {
              instanzen[m.id] = {
                el: h('p', { class: 'meldung fehler' }, 'Das Modul „' + m.label + '“ konnte nicht geladen werden.'),
                aktualisieren() {},
              };
            }
            inhalt.append(instanzen[m.id].el);
          });
          anzeigen(startId);
        }

        return {
          start() {
            const inhalt = document.getElementById('inhalt');
            inhalt.append(h('h1', null, 'Elektrotechnik & MSR'), h('div', { class: 'modul-wahl' }, segment$.el));
            aufbauen(aktivLesen());
          },
          neuBauen() {
            aufbauen(aktiv);
          },
          aktivesModul() {
            return aktiv;
          },
        };
      })();

      /* ===== Prototyp-Prüfstand (Demo data / Worst case) – nur Vorschau ===== */
      const Pruefstand = (function () {
        const URL_KEY = 'daten';
        const URL_WORST = 'worst';

        function urlSchreiben() {
          try {
            const url = new URL(window.location.href);
            if (PRUEFSTAND.aktiv) {
              url.searchParams.set(URL_KEY, URL_WORST);
              url.searchParams.set('fall', String(PRUEFSTAND.fall + 1));
            } else {
              url.searchParams.delete(URL_KEY);
              url.searchParams.delete('fall');
            }
            window.history.replaceState(null, '', url);
          } catch (err) {
            return;
          }
        }

        function urlLesen() {
          try {
            const p = new URLSearchParams(window.location.search);
            PRUEFSTAND.aktiv = p.get(URL_KEY) === URL_WORST;
            const fall = parseInt(p.get('fall'), 10);
            PRUEFSTAND.fall = Number.isFinite(fall) && fall > 0 ? fall - 1 : 0;
          } catch (err) {
            PRUEFSTAND.aktiv = false;
          }
        }

        return {
          vorStart: urlLesen,
          start() {
            const faelle = function () {
              return WORST_FAELLE[App.aktivesModul()];
            };
            const fallText = h('p', { class: 'pruefstand-fall', 'aria-live': 'polite' });
            const weiter = h('button', { type: 'button', class: 'pruefstand-weiter' });
            const umschalter = segment(
              [
                { wert: 'demo', text: 'Demo data' },
                { wert: 'worst', text: 'Worst case' },
              ],
              function () {
                return PRUEFSTAND.aktiv ? 'worst' : 'demo';
              },
              function (wert) {
                PRUEFSTAND.aktiv = wert === 'worst';
                anwenden();
              },
              'Datensatz (nur Prototyp)',
            );
            function beschriften() {
              umschalter.sync();
              weiter.hidden = !PRUEFSTAND.aktiv;
              fallText.hidden = !PRUEFSTAND.aktiv;
              if (PRUEFSTAND.aktiv) {
                const liste = faelle();
                const nr = PRUEFSTAND.fall % liste.length;
                weiter.textContent = 'Fall ' + (nr + 1) + '/' + liste.length + ' ›';
                fallText.textContent = liste[nr].name;
              }
            }
            function anwenden() {
              urlSchreiben();
              App.neuBauen();
              beschriften();
            }
            weiter.addEventListener('click', function () {
              PRUEFSTAND.fall = (PRUEFSTAND.fall + 1) % faelle().length;
              anwenden();
            });
            document.body.append(
              h(
                'div',
                { class: 'pruefstand', role: 'group', 'aria-label': 'Prototyp-Prüfstand' },
                h('p', { class: 'pruefstand-kopf' }, 'Nur Prototyp · Testdaten'),
                h('div', { class: 'pruefstand-reihe' }, umschalter.el, weiter),
                fallText,
              ),
            );
            window.pruefstandBeschriften = beschriften;
            beschriften();
          },
        };
      })();

      try {
        Pruefstand.vorStart();
        Darstellung.start();
        App.start();
        Pruefstand.start();
      } catch (err) {
        document.getElementById('inhalt').textContent =
          'Die Seite konnte nicht gestartet werden. Bitte neu laden.';
      }
    </script>
  </body>
</html>
