/* Feste Leiste unten (Zurück / Weiter / Speichern / PDF) */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}

/* PDF-Knopf mit Fortschritt */
.bar .btn.pdfb{overflow:hidden}
.pdfb .fill{position:absolute;inset:0;background:rgba(0,0,0,.14);transform:scaleX(0);transform-origin:left;transition:transform 220ms linear;pointer-events:none}
.pdfb .l1,.pdfb .l2,.pdfb .lr{display:flex;align-items:center;gap:6px;position:relative;transition:opacity var(--t-fast),transform var(--t-fast) var(--out)}
.pdfb .l2,.pdfb .lr{position:absolute;opacity:0;transform:translateY(8px)}
.pdfb.run .l1,.pdfb.done .l1{opacity:0;transform:translateY(-8px)}
.pdfb.run .lr{opacity:1;transform:none}
.pdfb.done .lr{opacity:0}
.pdfb.done .l2{opacity:1;transform:none}
.bar .btn.pdfb.done{background:#1e8e4e;border-color:#1e8e4e;color:#fff}
.pdfb.done .fill{opacity:0}
/* Wert wechselt: kurzes Aufleuchten */
.flash{animation:flash 900ms var(--out)}
@keyframes flash{from{background-color:var(--flash)}}
/* Seitenwechsel zwischen den Schritten */
.pg-out-fwd{animation:pgoutf var(--t-exit) var(--in) forwards}
.pg-out-back{animation:pgoutb var(--t-exit) var(--in) forwards}
.pg-in-fwd{animation:pginf var(--t-med) var(--out) both}
.pg-in-back{animation:pginb var(--t-med) var(--out) both}
@keyframes pgoutf{to{transform:translateX(-22%);opacity:0}}
@keyframes pgoutb{to{transform:translateX(22%);opacity:0}}
@keyframes pginf{from{transform:translateX(100%);opacity:0}}
@keyframes pginb{from{transform:translateX(-100%);opacity:0}}
/* Karten erscheinen gestaffelt (nur solange .entering am Container hängt) */

<script>
'use strict';
LS.fullMsg += ' Übertragene Logbücher aus der App entfernen.';

/* =====================================================================
   Feld-Definitionen – entsprechen den Blättern in "Datenbank_Anlagenlogbuch".
   col = exakter Spaltenname im Google Sheet.
   STAMM  → Blatt "Anlagen"  (eine Zeile pro Anlage / Logbuch)
   EINTRAG → Blatt "Einträge" (eine Zeile pro Termin, z. B. jährliche Dichtheitsprüfung)
   group = Zwischenüberschrift, prefix = wird im PDF vor dem Spaltennamen weggelassen.
   Feldtyp "auto": wird berechnet, kann aber überschrieben werden (Feld leeren = wieder automatisch).
   ===================================================================== */
const yn = (id, col, label, extra) => Object.assign({id, col, label, type:'yesno'}, extra || {});
// GWP-Werte (AR4, wie in der Klima-Wartungs-App) für das CO₂-Äquivalent
const GWP = {R32:675, R410A:2088, R407C:1774, R404A:3922, R134A:1430, R449A:1397, R448A:1387, R452A:2140, R454B:466, R454C:148,
             R513A:631, R1234YF:4, R1234ZE:7, R290:3, R600A:3, R744:1, R717:0, R22:1810};
const gwpOf = km => GWP[String(km || '').toUpperCase().replace(/[\s\-()]/g, '')];
/* Prüfintervall nach Art. 5 VO (EU) 2024/573 */
function intervalOf(v){
  if(!isN(v.co2)) return '';
  const t = num(v.co2), lds = v.lds === 'Ja';
  if(v.herm === 'Ja' && t < 10) return 'keine Prüfpflicht (hermetisch geschlossen, unter 10 t)';
  if(t < 5) return 'keine Prüfpflicht (unter 5 t CO₂-Äquivalent)';
  if(t < 50) return lds ? '24 Monate' : '12 Monate';
  if(t < 500) return lds ? '12 Monate' : '6 Monate';
  return lds ? '6 Monate' : '3 Monate';
}
const monthsOf = s => { const m = /(\d+)\s*Monat/.exec(String(s || '')); return m ? Number(m[1]) : 0; };
function addMonths(iso, n){
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m || !n) return '';
  const d = new Date(+m[1], +m[2] - 1 + n, 1), last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(+m[3], last));
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const TITLE = 'Logbuch für Kälteanlagen';
const SUBTITLE = 'gem. VO (EU) 2024/573 (F-Gase-Verordnung) · VO (EG) 1516/2007 (Dichtheitskontrolle) · DVO (EU) 2015/2067 (Sachkunde) · '
  + 'DIN EN 378 · VO (EU) 2024/590 (ozonschädigende Stoffe) · ChemKlimaschutzV';
const HINWEIS = [
  'Global Warming Potential (GWP): Maßzahl für den Beitrag eines Gases zum Treibhauseffekt im Vergleich zur gleichen Masse CO₂ (GWP = 1), '
  + 'bezogen auf einen Zeithorizont von 100 Jahren. CO₂-Äquivalent (t) = Füllmenge (kg) × GWP ÷ 1000.',

const app = $('#app');
function fmtDate(s){ if(!s) return ''; if(!/^\d{4}-\d{2}-\d{2}/.test(String(s))) return String(s); const d = new Date(String(s).slice(0, 10) + 'T12:00:00'); return isNaN(d) ? String(s) : d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'}); }
function num(v){ return typeof v === 'number' ? v : Number(String(v).trim().replace(',', '.')); }
const isVis = (f, v) => !f.show || f.show(v);
let calcSeen = {};   // zuletzt angezeigte Rechenwerte -> Aufleuchten nur bei echter Änderung
function calcTouch(id, text, el, quiet){ const k = view.id + ':' + (view.eid || '') + ':' + id; if(!quiet && k in calcSeen && calcSeen[k] !== text) flash(el); calcSeen[k] = text; }
const doneEntries = p => p.entries.filter(e => e.status === 'done').sort((a, b) => String(a.values.datum).localeCompare(String(b.values.datum)));

/* ---------- Bearbeitungs-Kontext: Stammdaten oder ein Eintrag eines Logbuchs ---------- */
function book(id){ return books.find(p => p.id === (id || view.id)); }
function ctx(){
  const p = book();
  if(!p) return null;
  if(view.eid){ const e = p.entries.find(x => x.id === view.eid); return e ? {p, obj:e, tpl:EINTRAG, L:p.values} : null; }
  return {p, obj:p, tpl:STAMM, L:p.values};
}

/* ---------- Werte, Prüfung, Bewertung ---------- */
function recompute(obj, tpl, L){
  const v = obj.values;
  tpl.all.forEach(f => { if(f.type === 'auto' && !v['_m_' + f.id]) v[f.id] = f.calc(v, L || v) || ''; });
}
function display(f, x){
  if(x === '' || x == null) return '';
  if(f.type === 'date' || f.input === 'date') return fmtDate(x);
  if((f.type === 'number' || f.type === 'auto') && f.unit && isN(x)) return fmtNum(String(x).trim()) + ' ' + f.unit;
  if(f.type === 'number' && isN(x)) return fmtNum(String(x).trim());
  return String(x);
}
function evalField(f, v){
  const x = v[f.id];
  if(f.bad && f.bad.includes(x)) return 'bad';
  if(f.good && f.good.includes(x)) return 'ok';
  return 'none';
}
const PFLICHTFELDER = false;   // true = Pflichtfelder (req) werden wieder erzwungen
function fieldError(f, obj){
  if(!isVis(f, obj.values)) return '';
  const x = obj.values[f.id], empty = String(x ?? '').trim() === '';
  if(empty) return PFLICHTFELDER && f.req ? 'Pflichtfeld' : '';
  if(f.type === 'number'){
    if(!isN(x)) return 'Bitte eine gültige Zahl eingeben.';
    const n = num(x);
    if((f.min != null && n < f.min) || (f.max != null && n > f.max)) return `Unplausibler Wert (erlaubt ${fmtNum(f.min)} – ${fmtNum(f.max)} ${f.unit || ''})`;
  }
  if(f.type === 'date' && f.notFuture && x > today()) return 'Datum liegt in der Zukunft.';
  return '';
}
function pageErrors(c, i){ return c.tpl.pages[i].fields.map(f => [f, fieldError(f, c.obj)]).filter(e => e[1]); }
function pageDone(c, i){
  const fs = c.tpl.pages[i].fields.filter(f => f.type !== 'auto' && isVis(f, c.obj.values));
  return fs.every(f => !fieldError(f, c.obj)) && fs.some(f => String(c.obj.values[f.id] ?? '') !== '');
}

/* Stand des Logbuchs: letzte Prüfung, nächste Fälligkeit */
function summary(p){
  const es = doneEntries(p), d = es.filter(e => e.values.dicht), ld = d[d.length - 1];
  const nopf = /keine/i.test(p.values.intv || '');
  return {n:es.length, last:es.length ? es[es.length - 1].values.datum : '', lastDicht:ld ? ld.values.datum : '', lastErg:ld ? ld.values.dicht : '',
          next:nopf ? 'keine Prüfpflicht' : ld ? ld.values.next || '' : ''};
}
/* Bericht-Datenstruktur – dieselbe Form liefert das Apps Script für alte Zeilen */
function entryCols(e){
  const out = {_iso:e.values.datum || ''};
  EINTRAG.all.forEach(f => {
    const x = e.values[f.id];
    out[f.col] = x === '' || x == null ? '' : f.type === 'date' || f.input === 'date' ? fmtDate(x) : f.type === 'number' && isN(x) ? fmtNum(String(x).trim()) : String(x);
  });
  return out;
}
const sigsOf = o => ({sk:safeImg((o.sig || {}).sk), betr:safeImg((o.sig || {}).betr)});
function buildReport(p){
  const v = p.values, s = summary(p);
  // Zahlen ohne Einheit – die Einheit steht schon in der Beschriftung, z. B. „Füllgewicht (kg)“
  const row = f => ({label:f.pdf, value:['number', 'auto'].includes(f.type) && f.input !== 'date' && isN(v[f.id]) ? fmtNum(String(v[f.id]).trim()) : display(f, v[f.id]),
                     eval:evalField(f, v), wide:!!f.wide});
  const iso =/^\d{4}-\d{2}-\d{2}$/.test(s.next);
  return {
    title:TITLE, subtitle:SUBTITLE, firma:settings.firma || '',
    status:{next:iso ? fmtDate(s.next) : s.next, nextIso:iso ? s.next : '', lastDicht:fmtDate(s.lastDicht), lastErg:s.lastErg,
            co2:isN(v.co2) ? fmtNum(v.co2) : '', intv:v.intv || '', km:v.km || '', fm:isN(v.fm) ? fmtNum(v.fm) + ' kg' : ''},
    short:{betreiber:betrText(v), anlage:[v.typ, v.herst, v.sn && 'S/N ' + v.sn].filter(Boolean).join(' · ')},
    sections:STAMM.pages.filter(pg => !pg.header && !pg.final).map(pg => ({
      title:pg.pdfTitle || pg.title, kind:pg.kind || 'grid',
      rows:pg.fields.filter(f => !(pg.kind === 'check' && f.type === 'yesno')).map(row),
      checks:pg.kind === 'check' ? pg.fields.filter(f => f.type === 'yesno').map(row) : [],
      sign:pg.sign ? sigsOf(p) : null})),
    entries:doneEntries(p).map(e => Object.assign(entryCols(e), {_sig:sigsOf(e)})), fg:v.fm || '',
    remark:v.bem || '', hinweis:HINWEIS, id:v.projekt || p.id, stand:new Date().toISOString()
  };
}
/* Spaltenwerte fürs Google Sheet */
function buildCols(tpl, v){
  return tpl.all.filter(f => f.col).map(f => {
    const x = isVis(f, v) ? v[f.id] : '';
    if(x === '' || x == null) return [f.col, '', ''];
    if(f.type === 'date' || (f.input === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(x))) return [f.col, x, 'date'];
    if((f.type === 'number' || f.type === 'auto') && isN(x)) return [f.col, num(x), ''];
    return [f.col, String(x), ''];
  });
}
function summaryCols(p){
  const s = summary(p), d = x => /^\d{4}-\d{2}-\d{2}$/.test(String(x)) ? 'date' : '';
  return [['Anzahl Einträge', s.n, ''], ['Letzter Eintrag', s.last, d(s.last)], ['Letzte Dichtheitsprüfung', s.lastDicht, d(s.lastDicht)],
          ['Ergebnis letzte Dichtheitsprüfung', s.lastErg, ''], ['Nächste Dichtheitsprüfung fällig', s.next, d(s.next)]];
}

let enterNext = false, enterT = null, navBusy = false, pdfBusy = null, pdfProg = 0, pdfTick = null, hsubAnim = null;
function go(name, params){
  const was = view.name;
  view = Object.assign({name}, params || {});
  if(name === 'wizard' && was !== 'wizard') calcSeen = {};
  enterNext = name === 'wizard';   // Karten beim Betreten gestaffelt einblenden

function render(){
  const enter = enterNext; enterNext = false;
  app.innerHTML = (Views[view.name] || Views.home)();

function safeImg(src){ return typeof src === 'string' && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(src) ? src : ''; }
const sigOwner = () => view.eid || 'book';

  const v = c.obj.values, sk = view.eid ? v.sk : v.iSk;

      <div class="sigwrap"><canvas class="sig" data-sig="sk"></canvas></div>
      <button class="btn small" data-act="sigclear" data-sig="sk">Unterschrift löschen</button></div>
  </div></div>`;
}
function initSig(canvas, obj){
  const key = canvas.dataset.sig;
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ctx.fillStyle = '#0b1f3a';
  const src = safeImg((obj.sig || {})[key]);
  if(src){ const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height); img.src = src; }
  let drawing = false, last = null;
  const pt = e => { const b = canvas.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); drawing = true; last = pt(e); canvas.setPointerCapture(e.pointerId);
    ctx.beginPath(); ctx.arc(last[0], last[1], 1.1, 0, Math.PI * 2); ctx.fill();
  });
  canvas.addEventListener('pointermove', e => {
    if(!drawing) return;
    const q = pt(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); last = q;
  });
  const end = () => {
    if(!drawing) return; drawing = false;
    const out = document.createElement('canvas');
    out.width = Math.round(r.width); out.height = Math.round(r.height);
    out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
    obj.sig = obj.sig || {}; obj.sig[key] = out.toDataURL('image/png');
    if(obj.sigF) delete obj.sigF[key];   // geändert → beim Übertragen neu hochladen
    save();
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
}
function initSigs(){
  const c = view.name === 'wizard' && ctx();
  if(c && c.tpl.pages[c.obj.page].sign) document.querySelectorAll('canvas.sig').forEach(cv => initSig(cv, c.obj));
}
/* Antwort vom Sheet: Datei-IDs merken, Bilder von anderen Geräten übernehmen (angefangene Einträge bleiben unberührt) */
function applySigs(p, files, data){
  const objs = {book:p};
  p.entries.filter(e => e.status !== 'draft').forEach(e => { objs[e.id] = e; });
  Object.values(objs).forEach(o => { o.sigF = {}; });
  Object.keys(files || {}).forEach(key => {
    const [owner, k] = key.split('.'), o = objs[owner];
    if(!o) return;
    o.sigF[k] = files[key];
    if(safeImg((data || {})[key])){ o.sig = o.sig || {}; o.sig[k] = data[key]; }
  });
}

function finalHtml(c){

  if(!view.eid) return warn;
  // Übersicht: in welche Tabellen des Logbuchs dieser Eintrag kommt
  const ec = entryCols(c.obj);

  return `${warn}<div class="card stag" style="--i:3"><b>Dieser Eintrag erscheint im Logbuch unter:</b>

}

/* Fälligkeit: grün = noch Zeit, gelb = in höchstens 60 Tagen, rot = überfällig */
function dueState(iso){
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return null;
  const t = new Date(); t.setHours(12, 0, 0, 0);
  const days = Math.round((new Date(+m[1], +m[2] - 1, +m[3], 12) - t) / 864e5), tg = n => n === 1 ? 'Tag' : 'Tagen';
  if(days < 0) return {cls:'bad', days, text:`überfällig seit ${-days} ${tg(-days)}`};
  if(days === 0) return {cls:'warn', days, text:'heute fällig'};
  return {cls:days <= 60 ? 'warn' : 'ok', days, text:`fällig in ${days} ${tg(days)}`};
}

/* ---------- Google-Sheet-Schnittstelle ---------- */
const plainEntry = e => ({id:e.id, values:e.values, completedAt:e.completedAt || ''});
async function syncAll(silent){
  if(!syncCanStart(books.some(p => p.status === 'done' && !p.synced), silent)) return;
  let okCount = 0, err = null;
  for(let pass = 0; pass < 2 && !err; pass++){
    for(const p of books.filter(x => x.status === 'done' && !x.synced)){
      try{
        recompute(p, STAMM);
        const es = doneEntries(p);
        es.forEach(e => recompute(e, EINTRAG, p.values));
        // Unterschriften: nur neue/geänderte Bilder hochladen; „have“ = Bilder, die dieses Gerät schon hat
        const sigs = {}, have = [];
        [['book', p], ...es.map(e => [e.id, e])].forEach(([owner, o]) => Object.keys(o.sig || {}).forEach(k => {
          if(!safeImg(o.sig[k])) return;
          have.push(owner + '.' + k);
          if(!(o.sigF || {})[k]) sigs[owner + '.' + k] = o.sig[k];
        }));
        const j = await api('upsert', {
          protocol:{id:p.id, templateId:STAMM.id, values:p.values, entries:es.map(plainEntry), deleted:p.deleted || [],
                    kundeName:betrText(p.values), completedAt:p.completedAt, sourceKey:p.sourceKey || '', pdf:await pdfBase64(p),
                    sigs, sigDel:p.sigDel || [], sigHave:have},
          cols:buildCols(STAMM, p.values).concat(summaryCols(p)),
          ecols:Object.fromEntries(es.map(e => [e.id, buildCols(EINTRAG, e.values)]))
        });
        p.synced = true; p.syncedAt = new Date().toISOString(); p.sourceKey = '';
        // Einträge, die inzwischen von einem anderen iPad dazugekommen sind, übernehmen → PDF & Sheet im 2. Durchgang aktualisieren
        const known = new Set(p.entries.map(e => e.id)), del = new Set(j.deleted || []);
        p.deleted = j.deleted || [];
        p.entries = p.entries.filter(e => e.status === 'draft' || !del.has(e.id));
        const extra = (j.entries || []).filter(e => !known.has(e.id) && !del.has(e.id));
        if(extra.length){ extra.forEach(e => p.entries.push(Object.assign({page:0, status:'done'}, e))); p.synced = false; }
        applySigs(p, j.sigFiles, j.sigData); p.sigDel = [];
        save(); okCount++;
      }catch(e){ err = e; break; }
    }
  }
  syncEnd();
  if(err) toast(`Übertragung fehlgeschlagen: ${err.message}`);
  else if(okCount) toast('Logbuch ins Google Sheet übertragen, PDF in Google Drive abgelegt.');
  if(['home', 'book', 'report'].includes(view.name)) render(); else updateNet();
}

/* Wert aus einer alten Sheet-Zeile in das Eingabeformat der App bringen */
function fromSheet(f, x){
  if(x == null) return '';
  if(typeof x === 'boolean') x = x ? 'Ja' : 'Nein';
  if(typeof x === 'number') return fmtNum(x);   // Eingabefelder erwarten Text mit Komma
  x = String(x);
  if(f.type === 'date' || f.input === 'date'){ const m = x.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); if(m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  return x;
}
/* Werte aus Sheet-Spalten übernehmen; abweichende Werte in Auto-Feldern gelten als „von Hand“ */
function valuesFromCols(tpl, cols, L){
  const v = {};
  tpl.all.forEach(f => { v[f.id] = fromSheet(f, cols[f.col]); });
  tpl.all.filter(f => f.type === 'auto').forEach(f => {
    const auto = f.calc(v, L || v) || '';
    if(v[f.id] !== '' && String(v[f.id]) !== String(auto)) v['_m_' + f.id] = true;
    else v[f.id] = auto;
  });
  return v;
}
function initValues(tpl){
  const v = {};
  tpl.all.forEach(f => { v[f.id] = f.init != null ? (typeof f.init === 'function' ? f.init() || '' : f.init) : ''; });
  return v;
}

  newentry(d){
    const p = book(d.id);
    if(p.status !== 'done'){ toast('Bitte zuerst die Anlagendaten abschließen.'); return; }
    const draft = p.entries.find(e => e.status === 'draft');
    if(draft && confirm('Es gibt schon einen angefangenen Eintrag. Diesen fortsetzen?')){ go('wizard', {id:p.id, eid:draft.id}); return; }
    const e = {id:uid(), values:initValues(EINTRAG), page:0, status:'draft', createdAt:new Date().toISOString()};
    e.values.km = p.values.km || '';
    recompute(e, EINTRAG, p.values);
    p.entries.push(e); save();
    go('wizard', {id:p.id, eid:e.id});
  },
  resume(d){ go('wizard', {id:d.id, eid:d.eid}); },
  report(d){ go('report', {id:d.id}); },
  editstamm(d){
    const p = book(d.id);
    p.status = 'draft'; p.synced = false; p.page = 0; save();
    go('wizard', {id:p.id});
  },
  editentry(d){
    const e = book(d.id).entries.find(x => x.id === d.eid);
    e.status = 'draft'; e.page = 0; save();
    go('wizard', {id:d.id, eid:d.eid});
  },
  delentry(d){
    const p = book(d.id), e = p.entries.find(x => x.id === d.eid);
    if(!confirm(e.status === 'draft' && !e.completedAt ? 'Angefangenen Eintrag verwerfen?' : 'Diesen Eintrag aus dem Logbuch löschen? Er wird beim Übertragen auch im Google Sheet entfernt.')) return;
    p.entries = p.entries.filter(x => x.id !== d.eid);
    if(e.completedAt){ p.deleted = (p.deleted || []).concat(e.id); p.synced = false; }
    save(); render();
    if(e.completedAt) syncAll(true);
  },
  delbook(d){
    const p = book(d.id);
    const msg = p.synced ? 'Logbuch aus der App entfernen? (Es bleibt im Google Sheet erhalten und kann jederzeit wieder geladen werden.)'
      : p.status === 'done' ? 'ACHTUNG: Änderungen an diesem Logbuch sind noch NICHT im Google Sheet. Wirklich aus der App entfernen?' : 'Angefangenes Logbuch verwerfen?';
    if(!confirm(msg)) return;
    books = books.filter(x => x.id !== d.id); save(); go('home');
  },

  set(d){
    const c = ctx();
    c.obj.values[d.f] = c.obj.values[d.f] === d.v ? '' : d.v;   // erneutes Tippen wählt wieder ab
    recompute(c.obj, c.tpl, c.L); save(); render();
  },
  sigclear(d){
    const c = ctx(), o = c.obj;
    if(o.sig) delete o.sig[d.sig];
    // schon in Google Drive → dort beim nächsten Übertragen löschen
    if(o.sigF && o.sigF[d.sig]){ c.p.sigDel = (c.p.sigDel || []).concat(sigOwner() + '.' + d.sig); delete o.sigF[d.sig]; }
    save(); render();
  },
  allyes(){
    const c = ctx();
    c.tpl.pages[c.obj.page].fields.forEach(f => { if(f.allYes && !c.obj.values[f.id]) c.obj.values[f.id] = 'Ja'; });
    save(); render();
  },
  copybetr(){
    const c = ctx(), v = c.obj.values;
    [['aFirma', 'bFirma'], ['aName', 'bName'], ['aStr', 'bStr'], ['aPlz', 'bPlz'], ['aOrt', 'bOrt']].forEach(([a, b]) => { v[a] = v[b] || ''; });
    save(); render();
  },
  next(){
    const c = ctx();
    if(pageErrors(c, c.obj.page).length){
      view.tried = true; render();
      $('#pageerr').textContent = 'Bitte die markierten Felder prüfen.'; toast('Bitte die markierten Felder prüfen.');
      const first = document.querySelector('.field.err'); if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    stepTo('fwd', () => { c.obj.page++; save(); view.tried = false; });
  },
  prev(){ const c = ctx(); if(c.obj.page > 0) stepTo('back', () => { c.obj.page--; save(); view.tried = false; }); },
  jump(d){
    const c = ctx(), t = Number(d.i);
    if(t === c.obj.page){ view.tried = true; render(); window.scrollTo(0, 0); return; }
    stepTo(t > c.obj.page ? 'fwd' : 'back', () => { c.obj.page = t; save(); view.tried = true; });
  },
  finish(){
    const c = ctx();
    recompute(c.obj, c.tpl, c.L);
    const bad = c.tpl.pages.findIndex((pg, k) => pageErrors(c, k).length);
    if(bad >= 0){
      c.obj.page = bad; save(); view.tried = true; render(); window.scrollTo(0, 0);
      toast(`Bitte „${c.tpl.pages[bad].title}“ prüfen.`);
      return;
    }
    c.obj.status = 'done'; c.obj.completedAt = new Date().toISOString();
    if(!view.eid) c.p.entries.forEach(e => { if(e.status === 'done') recompute(e, EINTRAG, c.p.values); });   // z. B. neues Prüfintervall
    c.p.synced = false;
    save();
    const wasEntry = !!view.eid;
    go('book', {id:c.p.id});
    toast(wasEntry ? 'Eintrag gespeichert.' : 'Logbuch gespeichert.');
    syncAll(true);
  },

  async makepdf(d, btn){
    if(!window.jspdf || !window.html2canvas){ toast('PDF-Modul nicht geladen – App einmal online neu starten.'); return; }
    if(btn && btn.classList.contains('done')) return;   // Doppelstart verhindern
    const r = reportForView();
    if(!r) return;
    const name = pdfName(r.id, 'ohne-Logbuchnummer') + '.pdf', key = viewKey();
    if(pdfBusy){ toast(pdfBusy !== key ? 'Es wird gerade ein anderes PDF erstellt …' : 'PDF wird noch erstellt …'); return; }   // gleicher Bericht: Doppelstart still verhindern
    const cb = () => $('#bar .pdfb');   // immer der aktuell im DOM befindliche Knopf (die Leiste wird bei Neuzeichnen neu gebaut)
    const setP = v => { pdfProg = v; const f = viewKey() === key ? $('#bar .pdfb .fill') : null; if(f) f.style.transform = 'scaleX(' + v + ')'; };
    pdfBusy = key; setP(.05); { const b = cb(); if(b) b.classList.add('run'); }
    // Fortschritt ist geschätzt (der gemeinsame PDF-Code meldet keinen): nähert sich 92 %, springt bei Fertigstellung auf 100 %
    pdfTick = setInterval(() => setP(pdfProg + (.92 - pdfProg) * .07), 250);
    try{
      const blob = await reportPdfBlob(r);
      clearInterval(pdfTick); setP(1);
      await new Promise(res => setTimeout(res, RM() ? 0 : 240));
      if(lastPdf) URL.revokeObjectURL(lastPdf.url);
      lastPdf = {key, file:new File([blob], name, {type:'application/pdf'}), url:URL.createObjectURL(blob)};
      pdfBusy = null;
      if(view.name === 'report' && viewKey() === key){
        const bar = $('#pdfbar'); if(bar) bar.innerHTML = pdfBarHtml();
        setBar();   // baut Leiste neu auf (mit Teilen-Knopf) -> neuen Knopf in den Fertig-Zustand setzen
        const nb = cb();
        if(nb){ nb.classList.remove('run'); nb.classList.add('done'); setTimeout(() => nb.classList.remove('done'), 2600); }
      }
      toast('PDF fertig – jetzt „Teilen“ antippen.');
    }catch(e){ toast('PDF konnte nicht erstellt werden: ' + e.message); }
    finally{
      clearInterval(pdfTick); pdfBusy = null; pdfProg = 0;
      const b = cb(); if(b && !b.classList.contains('done')){ b.classList.remove('run'); setP(0); }
    }
  },
  async sharepdf(){
    if(!lastPdf) return;
    const files = [lastPdf.file];
    if(navigator.canShare && navigator.canShare({files})){
      try{ await navigator.share({files, title:lastPdf.file.name}); }
      catch(e){ if(e.name !== 'AbortError') toast('Teilen fehlgeschlagen: ' + e.message); }
    } else {
      window.open(lastPdf.url, '_blank');
    }
  },
  print(){
    const r = reportForView();
    const old = document.title;
    document.title = pdfName(r.id, 'ohne-Logbuchnummer');
    window.print();
    setTimeout(() => { document.title = old; }, 1500);
  },

  async dbload(){
    if(!navigator.onLine){ toast('Offline – zeige gespeicherten Stand.'); return; }
    try{
      toast('Lade Daten …');
      const j = await api('list');
      dbCache = {at:new Date().toISOString(), list:j.list};
      LS.set('alb.db', dbCache);
      toast(`${j.list.length} Logbücher geladen.`);
      render();
    }catch(e){ toast('Laden fehlgeschlagen: ' + e.message); }
  },
  async dbreport(d){
    if(!navigator.onLine){ toast('Zum Öffnen eines Logbuchs aus dem Sheet wird Internet benötigt.'); return; }
    try{ toast('Lade Logbuch …'); const j = await api('get', {key:d.key}); go('report', {db:true, rep:j.report, key:d.key, q:view.q}); }
    catch(e){ toast('Laden fehlgeschlagen: ' + e.message); }
  },
  /* Logbuch aus dem Sheet aufs iPad holen (von jedem iPad aus), danach optional gleich neuen Eintrag beginnen */
  async dbopen(d){
    if(!navigator.onLine){ toast('Zum Laden aus dem Sheet wird Internet benötigt.'); return; }
    try{
      toast('Lade Logbuch …');
      const j = await api('load', {key:d.key});
      const local = j.appId && book(j.appId);
      if(local && !local.synced && !confirm('In der App gibt es zu diesem Logbuch noch nicht übertragene Änderungen. Durch die Version aus dem Sheet ersetzen?')) return;
      let p;
      if(j.values){
        p = {id:j.appId, templateId:STAMM.id, values:j.values, deleted:j.deleted || [], sourceKey:'',
             entries:(j.entries || []).map(e => Object.assign({page:0, status:'done'}, e))};
        applySigs(p, j.sigFiles, j.sigData);
      } else {
        // alte / von Hand angelegte Zeile ohne App-Daten
        const values = valuesFromCols(STAMM, j.cols);
        p = {id:uid(), templateId:STAMM.id, values, deleted:[], sourceKey:d.key,
             entries:(j.ecols || []).map(ec => ({id:uid(), values:valuesFromCols(EINTRAG, ec, values), page:0, status:'done', completedAt:new Date().toISOString()}))};
      }
      // angefangene Einträge dieses iPads behalten
      if(local) local.entries.filter(e => e.status === 'draft').forEach(e => p.entries.push(e));
      Object.assign(p, {page:0, status:'done', createdAt:new Date().toISOString(), completedAt:new Date().toISOString(), synced:!!j.values});
      books = books.filter(x => x.id !== p.id);
      books.unshift(p); save();
      toast('Logbuch geladen.');
      go('book', {id:p.id});
      if(d.then === 'entry') Actions.newentry({id:p.id});
    }catch(e){ toast('Laden fehlgeschlagen: ' + e.message); }
  },
  async drivepdf(){
    try{
      toast('PDF wird in Google Drive erstellt …');
      const b64 = await blobB64(await reportPdfBlob(reportForView()));
      const j = await api('savepdf', {key:view.key, pdf:b64});
      const e = dbCache.list.find(x => x.key === view.key); if(e){ e.pdfUrl = j.url; LS.set('alb.db', dbCache); }
      toast('PDF in Google Drive gespeichert.');
      window.open(j.url, '_blank');
    }catch(e){ toast('Fehler: ' + e.message); }
  },

  savesettings(d){
    settingsSave(SETTINGS_FIELDS, 'alb.settings');
    if(d !== 'silent') toast('Gespeichert.');
  },
  async ping(){
    Actions.savesettings('silent');
    try{ await api('ping'); toast('Verbindung zum Google Sheet funktioniert ✓'); syncAll(true); }
    catch(e){ toast('Verbindung fehlgeschlagen: ' + e.message); }
  },
  backup(){
    backupDownload({app:'anlagenlogbuch', exportedAt:new Date().toISOString(), books}, `anlagenlogbuch-backup-${today()}.json`);
  }
};

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const fn = Actions[b.dataset.act];
  if(fn){ e.preventDefault(); if(navBusy) return; fn(b.dataset, b); }   // während eines Seitenübergangs Tipps ignorieren
});
app.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.f && view.name === 'wizard'){
    const c = ctx(), f = c.tpl.F[el.dataset.f], v = c.obj.values;
    v[f.id] = el.value;
    if(f.type === 'auto') v['_m_' + f.id] = el.value !== '';
    recompute(c.obj, c.tpl, c.L); save();
    setHeader(false);   // Kopf-Unterzeile mitführen (kein Neuzeichnen)
    if(f.type === 'auto') calcTouch(f.id, el.value, el, true);
    // abhängige Auto-Felder dieser Seite live nachführen (nicht das Feld, in dem gerade getippt wird)
    c.tpl.pages[c.obj.page].fields.filter(a => a.type === 'auto').forEach(a => {
      const ie = $('#in-' + a.id), ne = $('#note-' + a.id);
      if(ie && ie !== el){ ie.value = v[a.id] || ''; calcTouch(a.id, ie.value, ie); }
      if(ne) ne.innerHTML = autoNote(a, c);
    });
  } else if(el.id === 'dbsearch'){
    view.q = el.value; $('#dblist').innerHTML = dbList();
  }
});
app.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.f && view.name === 'wizard'){
    const c = ctx(), f = c.tpl.F[el.dataset.f];
    if(f.type === 'auto' && el.value === ''){ el.value = c.obj.values[f.id] || ''; }   // geleert → automatischer Wert erscheint
  } else if(el.id === 's_import' && el.files[0]){
    backupImport(el.files[0], 'books', books, 'Logbücher', list => { books = list; save(); });
  }
});
let lastW = window.innerWidth;
window.addEventListener('resize', () => {   // Drehen des Geräts: Unterschriftsfelder neu aufbauen
  if(window.innerWidth !== lastW && document.querySelector('canvas.sig')) render();
  lastW = window.innerWidth;
});
window.addEventListener('online', () => { updateNet(); syncAll(true); });
window.addEventListener('offline', updateNet);

/* ---------- Start ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
render();
syncAll(true);
</script>
<script src="shared/theme.js"></script>
</body>
