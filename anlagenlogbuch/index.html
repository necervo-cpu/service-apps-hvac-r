          else if (t === 'dunkel') r.setAttribute('data-theme', 'dark');

    <style>
      .pagehint {
        color: var(--muted);
        margin: 0 0 6px;
      }
      .ferr {
        color: var(--bad);
        font-size: 14px;
        font-weight: 600;
        margin-top: 6px;
      }
      .field.err input,
      .field.err textarea {
        border-color: var(--bad);
      }
      .inunit input {
        max-width: 260px;
        font-size: 22px;
      }
      .inunit .unit {
        color: var(--muted);
        font-weight: 600;
      }
      .autonote {
        font-size: 13px;
        color: var(--muted);

      }
      .autonote.man {

      }
      @media (max-width: 700px) {
        .frow {
          flex-direction: column;
          align-items: stretch;
        }
        .seg .btn {
          flex: 1;
        }
      }
      .kv {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 16px;
      }
      .kv div {
        font-size: 15px;
      }
      .kv b {
        font-weight: 600;
        color: var(--muted);
        font-size: 13px;

      }

        .kv {
          grid-template-columns: 1fr;

      }
      .sigs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px 16px;
      }
      @media (max-width: 640px) {
        .sigs {
          grid-template-columns: 1fr;
        }
      }
      .sigwrap {
        border: 2px dashed var(--line);
        border-radius: 12px;
        background: #fff;
        margin-bottom: 8px;
      }
      canvas.sig {
        width: 100%;
        height: 170px;
        display: block;
        touch-action: none;
      }
      .err {
        color: var(--bad);
        font-weight: 600;
        margin-top: 10px;
        min-height: 1.2em;
      }
      a.jump {
        color: var(--ink);
        font-weight: 600;
        cursor: pointer;
        text-decoration: underline;
        text-decoration-color: var(--pri2);
        text-decoration-thickness: 2px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 3px solid var(--gold);
        outline-offset: 0;
        border-color: var(--pri2);
      }
      /* Meldung: Kapsel oben, Aussehen und Bewegung in shared/ios.css */
      #toast {
        position: fixed;
        left: 50%;
        opacity: 0;
        max-width: 90vw;
        text-align: center;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
      /* Feste Leiste unten (Zurück / Weiter / Speichern / PDF) */
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
      }
      .bar .btn {
        flex: 1;
        min-height: 52px;
        font-weight: 700;
        font-size: 15px;
      }
      .bar .btn.primary {
        border-color: var(--gold-dark);
      }
      body.hasbar main {
        padding-bottom: calc(110px + env(safe-area-inset-bottom));
      }
      /* PDF-Knopf mit Fortschritt */
      .bar .btn.pdfb {
        overflow: hidden;
      }
      .pdfb .fill {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.14);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 220ms linear;
        pointer-events: none;
      }
      .pdfb .l1,
      .pdfb .l2,
      .pdfb .lr {
        display: flex;
        align-items: center;
        gap: 6px;
        position: relative;
        transition:
          opacity var(--t-fast),
          transform var(--t-fast) var(--out);
      }
      .pdfb .l2,
      .pdfb .lr {
        position: absolute;
        opacity: 0;
        transform: translateY(8px);
      }
      .pdfb.run .l1,
      .pdfb.done .l1 {
        opacity: 0;
        transform: translateY(-8px);
      }
      .pdfb.run .lr {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .lr {
        opacity: 0;
      }
      .pdfb.done .l2 {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .fill {
        opacity: 0;
      }
      /* Wert wechselt: kurzes Aufleuchten */
      .flash {
        animation: flash 900ms var(--out);
      }
      @keyframes flash {
        from {
          background-color: var(--flash);
        }
      }
      /* Seitenwechsel zwischen den Schritten (.pg-*): shared/ios.css */
      /* Karten erscheinen gestaffelt (nur solange .entering am Container hängt) */
      .entering .stag {
        opacity: 0;
        transform: translateY(12px);
        animation: up var(--t-med) var(--out) forwards;
        animation-delay: calc(var(--i) * 70ms + 120ms);
      }
      @keyframes up {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          transition-duration: 0.001ms !important;
          transition-delay: 0ms !important;
          animation-duration: 0.001ms !important;
          animation-delay: 0ms !important;
        }
        .entering .stag {
          opacity: 1;
          transform: none;
        }
      }

    <script>
      'use strict';
      LS.fullMsg += ' Übertragene Logbücher aus der App entfernen.';

      /* =====================================================================
   Feld-Definitionen – entsprechen den Blättern in "Datenbank_Anlagenlogbuch".
   col = exakter Spaltenname im Google Sheet.
   STAMM  → Blatt "Anlagen"  (eine Zeile pro Anlage / Logbuch)
   EINTRAG → Blatt "Einträge" (eine Zeile pro Termin, z. B. jährliche Dichtheitsprüfung)
   group = Zwischenüberschrift, prefix = wird im PDF vor dem Spaltennamen weggelassen.
   Feldtyp "auto": wird berechnet, kann aber überschrieben werden (Feld leeren = wieder automatisch).
   ===================================================================== */
      const yn = (id, col, label, extra) =>
        Object.assign({ id, col, label, type: 'yesno' }, extra || {});
      // GWP-Werte (AR4, wie in der Klima-Wartungs-App) für das CO₂-Äquivalent
      const GWP = {
        R32: 675,
        R410A: 2088,
        R407C: 1774,
        R404A: 3922,
        R134A: 1430,
        R449A: 1397,
        R448A: 1387,
        R452A: 2140,
        R454B: 466,
        R454C: 148,
        R513A: 631,
        R1234YF: 4,
        R1234ZE: 7,
        R290: 3,
        R600A: 3,
        R744: 1,
        R717: 0,
        R22: 1810,
      };
      const gwpOf = (km) =>
        GWP[
          String(km || '')
            .toUpperCase()
            .replace(/[\s\-()]/g, '')
        ];
      /* Prüfintervall nach Art. 5 VO (EU) 2024/573 */
      function intervalOf(v) {
        if (!isN(v.co2)) return '';
        const t = num(v.co2),
          lds = v.lds === 'Ja';
        if (v.herm === 'Ja' && t < 10)
          return 'keine Prüfpflicht (hermetisch geschlossen, unter 10 t)';
        if (t < 5) return 'keine Prüfpflicht (unter 5 t CO₂-Äquivalent)';
        if (t < 50) return lds ? '24 Monate' : '12 Monate';
        if (t < 500) return lds ? '12 Monate' : '6 Monate';
        return lds ? '6 Monate' : '3 Monate';
      }
      const monthsOf = (s) => {
        const m = /(\d+)\s*Monat/.exec(String(s || ''));
        return m ? Number(m[1]) : 0;
      };
      function addMonths(iso, n) {
        const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!m || !n) return '';
        const d = new Date(+m[1], +m[2] - 1 + n, 1),
          last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        d.setDate(Math.min(+m[3], last));
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }
      const TITLE = 'Logbuch für Kälteanlagen';
      const SUBTITLE =

        const k = view.id + ':' + (view.eid || '') + ':' + id;
        if (!quiet && k in calcSeen && calcSeen[k] !== text) flash(el);
        calcSeen[k] = text;
      }
      const doneEntries = (p) =>
        p.entries
          .filter((e) => e.status === 'done')
          .sort((a, b) => String(a.values.datum).localeCompare(String(b.values.datum)));

      /* ---------- Bearbeitungs-Kontext: Stammdaten oder ein Eintrag eines Logbuchs ---------- */
      function book(id) {
        return books.find((p) => p.id === (id || view.id));
      }
      function ctx() {
        const p = book();
        if (!p) return null;
        if (view.eid) {
          const e = p.entries.find((x) => x.id === view.eid);
          return e ? { p, obj: e, tpl: EINTRAG, L: p.values } : null;
        }
        return { p, obj: p, tpl: STAMM, L: p.values };
      }

      /* ---------- Werte, Prüfung, Bewertung ---------- */
      function recompute(obj, tpl, L) {
        const v = obj.values;
        tpl.all.forEach((f) => {
          if (f.type === 'auto' && !v['_m_' + f.id]) v[f.id] = f.calc(v, L || v) || '';
        });
      }
      function display(f, x) {
        if (x === '' || x == null) return '';
        if (f.type === 'date' || f.input === 'date') return fmtDate(x);
        if ((f.type === 'number' || f.type === 'auto') && f.unit && isN(x))
          return fmtNum(String(x).trim()) + ' ' + f.unit;
        if (f.type === 'number' && isN(x)) return fmtNum(String(x).trim());
        return String(x);
      }
      function evalField(f, v) {
        const x = v[f.id];
        if (f.bad && f.bad.includes(x)) return 'bad';
        if (f.good && f.good.includes(x)) return 'ok';
        return 'none';
      }
      const PFLICHTFELDER = false; // true = Pflichtfelder (req) werden wieder erzwungen
      function fieldError(f, obj) {
        if (!isVis(f, obj.values)) return '';
        const x = obj.values[f.id],
          empty = String(x ?? '').trim() === '';
        if (empty) return PFLICHTFELDER && f.req ? 'Pflichtfeld' : '';
        if (f.type === 'number') {
          if (!isN(x)) return 'Bitte eine gültige Zahl eingeben.';
          const n = num(x);
          if ((f.min != null && n < f.min) || (f.max != null && n > f.max))
            return `Unplausibler Wert (erlaubt ${fmtNum(f.min)} – ${fmtNum(f.max)} ${f.unit || ''})`;
        }
        if (f.type === 'date' && f.notFuture && x > today()) return 'Datum liegt in der Zukunft.';
        return '';
      }
      function pageErrors(c, i) {
        return c.tpl.pages[i].fields.map((f) => [f, fieldError(f, c.obj)]).filter((e) => e[1]);
      }
      function vorbelegtGleich(o, id) {
        return (
          !!o.vorbelegt &&
          JSON.stringify(o.values[id] ?? '') === JSON.stringify(o.vorbelegt[id] ?? '')
        );
      }
      function vorbelegtErfassen(o) {
        o.vorbelegt = {};
        Object.keys(o.values).forEach((id) => {
          if (JSON.stringify(o.values[id] ?? '') !== '""') {
            o.vorbelegt[id] = o.values[id];
          }
        });
      }
      function pageDone(c, i) {
        const fs = c.tpl.pages[i].fields.filter((f) => f.type !== 'auto' && isVis(f, c.obj.values));
        return (
          fs.every((f) => !fieldError(f, c.obj)) &&
          fs.some((f) => !vorbelegtGleich(c.obj, f.id) && String(c.obj.values[f.id] ?? '') !== '')
        );
      }

      /* Stand des Logbuchs: letzte Prüfung, nächste Fälligkeit */
      function summary(p) {
        const es = doneEntries(p),
          d = es.filter((e) => e.values.dicht),
          ld = d[d.length - 1];
        const nopf = /keine/i.test(p.values.intv || '');
        return {
          n: es.length,
          last: es.length ? es[es.length - 1].values.datum : '',
          lastDicht: ld ? ld.values.datum : '',
          lastErg: ld ? ld.values.dicht : '',
          next: nopf ? 'keine Prüfpflicht' : ld ? ld.values.next || '' : '',
        };
      }
      /* Bericht-Datenstruktur – dieselbe Form liefert das Apps Script für alte Zeilen */
      function entryCols(e) {
        const out = { _iso: e.values.datum || '' };
        EINTRAG.all.forEach((f) => {
          const x = e.values[f.id];
          out[f.col] =
            x === '' || x == null
              ? ''
              : f.type === 'date' || f.input === 'date'
                ? fmtDate(x)
                : f.type === 'number' && isN(x)
                  ? fmtNum(String(x).trim())
                  : String(x);
        });
        return out;
      }
      const sigsOf = (o) => ({ sk: safeImg((o.sig || {}).sk), betr: safeImg((o.sig || {}).betr) });
      function buildReport(p) {
        const v = p.values,
          s = summary(p);
        // Zahlen ohne Einheit – die Einheit steht schon in der Beschriftung, z. B. „Füllgewicht (kg)“
        const row = (f) => ({
          label: f.pdf,
          value:
            ['number', 'auto'].includes(f.type) && f.input !== 'date' && isN(v[f.id])
              ? fmtNum(String(v[f.id]).trim())
              : display(f, v[f.id]),
          eval: evalField(f, v),
          wide: !!f.wide,
        });
        const iso = /^\d{4}-\d{2}-\d{2}$/.test(s.next);
        return {
          title: TITLE,
          subtitle: SUBTITLE,
          firma: settings.firma || '',
          status: {
            next: iso ? fmtDate(s.next) : s.next,
            nextIso: iso ? s.next : '',
            lastDicht: fmtDate(s.lastDicht),
            lastErg: s.lastErg,
            co2: isN(v.co2) ? fmtNum(v.co2) : '',
            intv: v.intv || '',
            km: v.km || '',
            fm: isN(v.fm) ? fmtNum(v.fm) + ' kg' : '',
          },
          short: {
            betreiber: betrText(v),
            anlage: [v.typ, v.herst, v.sn && 'S/N ' + v.sn].filter(Boolean).join(' · '),
          },
          sections: STAMM.pages
            .filter((pg) => !pg.header && !pg.final)
            .map((pg) => ({
              title: pg.pdfTitle || pg.title,
              kind: pg.kind || 'grid',
              rows: pg.fields.filter((f) => !(pg.kind === 'check' && f.type === 'yesno')).map(row),
              checks:
                pg.kind === 'check' ? pg.fields.filter((f) => f.type === 'yesno').map(row) : [],
              sign: pg.sign ? sigsOf(p) : null,
            })),
          entries: doneEntries(p).map((e) => Object.assign(entryCols(e), { _sig: sigsOf(e) })),
          fg: v.fm || '',
          remark: v.bem || '',
          hinweis: HINWEIS,
          id: v.projekt || p.id,
          stand: new Date().toISOString(),
        };
      }
      /* Spaltenwerte fürs Google Sheet */
      function buildCols(tpl, v) {
        return tpl.all
          .filter((f) => f.col)
          .map((f) => {
            const x = isVis(f, v) ? v[f.id] : '';
            if (x === '' || x == null) return [f.col, '', ''];
            if (f.type === 'date' || (f.input === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(x)))
              return [f.col, x, 'date'];
            if ((f.type === 'number' || f.type === 'auto') && isN(x)) return [f.col, num(x), ''];
            return [f.col, String(x), ''];
          });
      }
      function summaryCols(p) {
        const s = summary(p),
          d = (x) => (/^\d{4}-\d{2}-\d{2}$/.test(String(x)) ? 'date' : '');
        return [
          ['Anzahl Einträge', s.n, ''],
          ['Letzter Eintrag', s.last, d(s.last)],
          ['Letzte Dichtheitsprüfung', s.lastDicht, d(s.lastDicht)],
          ['Ergebnis letzte Dichtheitsprüfung', s.lastErg, ''],
          ['Nächste Dichtheitsprüfung fällig', s.next, d(s.next)],
        ];
      }

      /* ---------- Navigation ---------- */
      let view = { name: 'home' };
      let enterNext = false,
        enterT = null,
        navBusy = false,
        pdfBusy = null,
        pdfProg = 0,
        pdfTick = null,
        hsubAnim = null;
      function go(name, params) {
        const was = view.name;
        view = Object.assign({ name }, params || {});
        if (name === 'wizard' && was !== 'wizard') calcSeen = {};
        enterNext = name === 'wizard'; // Karten beim Betreten gestaffelt einblenden
        render();
        window.scrollTo(0, 0);
      }
      function render() {
        const enter = enterNext;
        enterNext = false;
        app.innerHTML = (Views[view.name] || Views.home)();
        if (!navBusy) {
          // Klassen nur zurücksetzen, wenn gerade kein Seitenübergang läuft
          app.className = enter && !RM() ? 'entering' : '';
          clearTimeout(enterT);
          if (enter)
            enterT = setTimeout(() => {
              if (!navBusy) app.classList.remove('entering');
            }, 900);
        }
        setHeader(true);
        if (view.name === 'report') showReport();
        initSigs();
        touchAutos();
        setSteps();
        setBar();
        iosAfterRender(view.name);
        updateNet();
      }
      /* Auto-Felder der aktuellen Seite: Werte merken (Aufleuchten erst bei späterer Änderung) */
      function touchAutos() {
        const c = view.name === 'wizard' && ctx();
        if (!c) return;
        c.tpl.pages[c.obj.page].fields
          .filter((f) => f.type === 'auto')
          .forEach((f) => {
            const el = $('#in-' + f.id);
            if (el) calcTouch(f.id, el.value, el);
          });
      }
      /* Kopf: Unterzeile = Logbuch-Nr. · Betreiber (im Formular / Logbuch / Bericht), sonst Bereichsname */
      function hsubText() {
        const p =
          ['wizard', 'book'].includes(view.name) || (view.name === 'report' && !view.db)
            ? book()
            : null;
        if (p) {
          const eP =
            view.name === 'wizard' && view.eid ? p.entries.find((x) => x.id === view.eid) : null;
          return (
            (p.values.projekt || 'ohne Logbuch-Nr.') +
            (betrText(p.values) ? ' · ' + betrText(p.values) : '') +
            (eP ? ' · Eintrag ' + (fmtDate(eP.values.datum) || 'neu') : '')
          );
        }
        if (view.name === 'report' && view.db && view.rep) return view.rep.id || 'Logbuch';
        return view.name === 'settings'
          ? 'Einstellungen'
          : view.name === 'db'
            ? 'Datenbank / alle Logbücher'
            : 'Logbücher';
      }
      function setSteps() {
        const c = view.name === 'wizard' ? ctx() : null;
        stepsRender(
          c && {
            key: view.id + ':' + (view.eid || ''),
            pages: c.tpl.pages,
            index: c.obj.page,
            done: (k) => pageDone(c, k) && !c.tpl.pages[k].final,
            pauseAct: 'pause',
          },
        );
      }
      /* Feste Leiste unten */
      function barHtml() {
        if (view.name === 'wizard') {
          const c = ctx();
          if (!c) return '';
          const i = c.obj.page,
            pg = c.tpl.pages[i];
          return `<div><button class="btn" data-act="prev"${i === 0 ? ' disabled' : ''}>← Zurück</button>${pg.final ? `<button class="btn primary" data-act="finish">${view.eid ? 'Eintrag speichern ✓' : 'Logbuch speichern ✓'}</button>` : '<button class="btn primary" data-act="next">Weiter →</button>'}</div>`;
        }
        if (view.name === 'report' && reportForView()) {
          const run = pdfBusy === viewKey();
          return `<div><button class="btn bback" data-act="${view.db ? 'db' : 'openbook'}" data-id="${view.id || ''}">← Zurück</button><button class="btn primary pdfb${run ? ' run' : ''}" data-act="makepdf"><span class="fill"${run ? ` style="transform:scaleX(${pdfProg})"` : ''}></span><span class="l1">PDF erstellen</span><span class="lr">PDF wird erstellt …</span><span class="l2">✓ PDF fertig</span></button>${lastPdf && lastPdf.key === viewKey() ? '<button class="btn bshare" data-act="sharepdf">Teilen</button>' : ''}</div>`;
        }
        return '';
      }
      function setBar() {
        barRender(barHtml());
      }
      function wizSnapshot() {
        const vid = view.id,
          veid = view.eid;
        return () => view.name === 'wizard' && view.id === vid && view.eid === veid;
      }
      function updateNet() {
        netRender(books.filter((p) => p.status === 'done' && !p.synced).length);
      }
      const anlageText = (v) => [v.typ, v.sn && 'S/N ' + v.sn].filter(Boolean).join(' · ');
      const betrText = (v) => v.bFirma || v.bName || '';
      /* grün = noch Zeit, gelb = in höchstens 60 Tagen fällig, rot = überfällig */
      function nextBadge(s) {
        if (!s.next) return '';
        const d = dueState(s.next);
        if (!d) return `<span class="badge">${esc(s.next)}</span>`;
        return `<span class="badge ${d.cls}">nächste Prüfung ${esc(fmtDate(s.next))} – ${esc(d.text)}</span>`;
      }

      /* Inhalt einer Formularseite (auch für die Unterlage beim Zurück-Wischen) */
      function wizardHtml(c, i) {
        const pg = c.tpl.pages[i];
        const allYes = pg.fields.some((f) => f.allYes && !c.obj.values[f.id]);
        return `
    <div class="row between stag" style="--i:0"><div class="pagetitle">${esc(pg.title)}</div><div class="row">
      ${pg.btn ? `<button class="btn small" data-act="${pg.btn.act}">${esc(pg.btn.label)}</button>` : ''}
      ${allYes ? '<button class="btn small" data-act="allyes">Offene Prüfpunkte auf Ja</button>' : ''}</div></div>
    ${pg.hint ? `<p class="pagehint stag" style="--i:0">${esc(pg.hint)}</p>` : ''}
    ${
      pg.fields.some((f) => !f.sigName)
        ? iosGroups(
            pg.fields.filter((f) => isVis(f, c.obj.values) && !f.sigName),
            (f) => fieldHtml(f, c),
            1,
          )
        : ''
    }
    ${pg.final ? finalHtml(c) : ''}
    ${pg.sign ? sigHtml(c) : ''}
    <div class="err" id="pageerr"></div>`;
      }

      function settingsBody() {
        return (
          settingsConnectionHtml() +
          settingsGeneralHtml(SETTINGS_FIELDS) +
          settingsButtonsHtml() +
          settingsBackupHtml(
            'Sichert alle Logbücher der App als JSON-Datei. Übertragene Logbücher ohne angefangenen Eintrag werden nach 7 Tagen automatisch aus der App entfernt – sie bleiben in der Datenbank.',
          )
        );
      }
      /* ---------- Ansichten ---------- */
      const IC = {
        plus: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
        db: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
        sync: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M3 21v-5h5"/></svg>',
        set: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
        book: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>',
        info: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
      };
      const Views = {
        home() {
          const drafts = books.filter((p) => p.status === 'draft');
          const done = books
            .filter((p) => p.status === 'done')
            .sort((a, b) =>
              String(summary(b).last || b.completedAt).localeCompare(
                String(summary(a).last || a.completedAt),
              ),
            );
          const pending = done.filter((p) => !p.synced).length;
          return `
      <div class="kstart">
      <button type="button" class="cta" data-act="newbook"><span class="hi">${IC.plus}</span><span class="txt"><strong>Neues Logbuch</strong><small>Logbuch für eine neue Anlage anlegen</small></span></button>
      <div class="qa">
        <button class="qt" data-act="db"><span class="qi">${IC.db}</span><span><b>Datenbank / PDF</b><small>alle Logbücher</small></span></button>
        <button class="qt" data-act="sync"><span class="qi">${IC.sync}</span><span><b>Synchronisieren</b><small>${pending ? pending + ' offen' : 'alles übertragen'}</small></span>${pending ? `<span class="pend" aria-hidden="true">${pending}</span>` : ''}</button>
      </div>
      ${!settings.url ? '<div class="warnbox">Noch keine Verbindung zur Datenbank eingerichtet. Logbücher werden lokal gespeichert, bis die Web-App-URL in den Einstellungen eingetragen ist.<br><button type="button" class="btn" data-act="settings">Einstellungen öffnen</button></div>' : ''}
      </div>
      <p class="hint">${IC.info}<span>Jährliche Prüfung einer vorhandenen Anlage: <b>Datenbank</b> → Anlage suchen → <b>+ Eintrag</b>.</span></p>
      ${drafts.length ? `<h2>Logbuch in Arbeit <span class="n">${drafts.length}</span></h2>${drafts.map(bookCard).join('')}` : ''}
      <h2>Logbücher <span class="n">${done.length}</span></h2>
      ${done.length ? done.map(bookCard).join('') : `<div class="emptybox"><span class="qi">${IC.book}</span><b>Noch keine Logbücher</b><span>Lege die erste Anlage an oder lade vorhandene aus der Datenbank.</span></div>`}`;
        },

        book() {
          const p = book();
          if (!p) return '<p>Logbuch nicht gefunden.</p>';
          const v = p.values,
            s = summary(p);
          const draftE = p.entries.filter((e) => e.status === 'draft');
          const es = doneEntries(p).reverse();
          const kv = (k, x) => `<div><b>${esc(k)}</b>${esc(x || '—')}</div>`;
          return `
      <div class="row tb"><button class="btn" data-act="home">← Zurück</button>
        <button class="btn primary" data-act="newentry" data-id="${p.id}">+ Neuer Eintrag</button>
        <button class="btn" data-act="report" data-id="${p.id}">Logbuch / PDF</button>
        <button class="btn" data-act="editstamm" data-id="${p.id}">Anlagendaten bearbeiten</button></div>
      <div class="card kvcard">
        <div class="pagetitle">${esc(v.projekt || 'Ohne Nr.')}</div>
        <div class="bk-b">${nextBadge(s)} <span class="badge ${p.synced ? 'ok' : 'warn'}">${p.synced ? 'in der Datenbank' : 'nicht übertragen'}</span></div>
        <div class="kv" style="margin-top:12px">
          ${kv('Betreiber', [v.bFirma, v.bName].filter(Boolean).join(', '))}
          ${kv('Aufstellort', [v.aFirma || v.aName, v.aStr, [v.aPlz, v.aOrt].filter(Boolean).join(' ')].filter(Boolean).join(', '))}
          ${kv('Anlage', [v.herst, anlageText(v)].filter(Boolean).join(' · '))}
          ${kv('Kältemittel', [v.km, isN(v.fm) && fmtNum(v.fm) + ' kg', isN(v.co2) && fmtNum(v.co2) + ' t CO₂e'].filter(Boolean).join(' · '))}
          ${kv('Prüfintervall', v.intv)}
          ${kv('Letzte Dichtheitsprüfung', s.lastDicht ? fmtDate(s.lastDicht) + ' – ' + s.lastErg : '')}
        </div>
      </div>
      ${
        draftE.length
          ? `<h2>Eintrag in Arbeit <span class="n">${draftE.length}</span></h2>${draftE
              .map(
                (
                  e,
                ) => `<div class="card bk"><div class="bk-t"><b>${esc(fmtDate(e.values.datum))}</b><span class="muted">${esc(e.values.sk || '')}</span></div>
        <div class="bk-a"><button class="btn small primary" data-act="resume" data-id="${p.id}" data-eid="${e.id}">Fortsetzen</button>
        <button class="btn small danger" data-act="delentry" data-id="${p.id}" data-eid="${e.id}">Löschen</button></div></div>`,
              )
              .join('')}`
          : ''
      }
      <h2>Einträge <span class="n">${es.length}</span></h2>
      ${
        es.length
          ? es
              .map((e) => {
                const x = e.values;
                const what = [
                  x.dicht &&
                    `<span class="badge ${x.dicht === 'erfüllt' ? 'ok' : 'bad'}">Dichtheit ${esc(x.dicht)}</span>`,
                  x.art && esc(x.art),
                  (isN(x.auf) || isN(x.ent)) && 'Kältemittel',
                  x.mang && '<span class="badge bad">Mangel</span>',
                  x.erg && 'Ergänzung',
                ]
                  .filter(Boolean)
                  .join(' · ');
                return `<div class="card bk"><div class="bk-t"><b>${esc(fmtDate(x.datum))}</b><span class="muted">${esc([x.sk, x.zert].filter(Boolean).join(' · '))}</span></div>
          <div class="ent-m">${what || '<span class="muted">—</span>'}</div>
          <div class="bk-a"><button class="btn small" data-act="editentry" data-id="${p.id}" data-eid="${e.id}">Bearbeiten</button>
          <button class="btn small danger" data-act="delentry" data-id="${p.id}" data-eid="${e.id}">Löschen</button></div></div>`;
              })
              .join('')
          : `<div class="emptybox"><span class="qi">${IC.book}</span><b>Noch keine Einträge</b><span>Mit <b>+ Neuer Eintrag</b> die erste Prüfung / Wartung eintragen.</span></div>`
      }`;
        },

        wizard() {
          const c = ctx();
          if (!c) return '<p>Nicht gefunden.</p>';
          return wizardHtml(c, c.obj.page);
        },

        report() {
          const r = reportForView();
          if (!r) return '<p>Logbuch nicht gefunden.</p>';
          const p = !view.db && book();
          return `
      <div class="row noprint" style="margin-bottom:12px">
        <span id="pdfbar" class="row">${pdfBarHtml()}</span>
        ${view.db && settings.url ? `<button class="btn" data-act="drivepdf">PDF in Google Drive ablegen</button>` : ''}
        ${p && !p.synced ? '<span class="badge warn">noch nicht in der Datenbank</span>' : ''}

      function initSig(canvas, obj) {
        const key = canvas.dataset.sig;
        const r = canvas.getBoundingClientRect(),
          dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(r.width * dpr);
        canvas.height = Math.round(r.height * dpr);
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = ctx.fillStyle = '#0b1f3a';
        const src = safeImg((obj.sig || {})[key]);
        if (src) {
          const img = new Image();
          img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height);
          img.src = src;
        }
        let drawing = false,
          last = null;
        const pt = (e) => {
          const b = canvas.getBoundingClientRect();
          return [e.clientX - b.left, e.clientY - b.top];
        };
        canvas.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          drawing = true;
          last = pt(e);
          canvas.setPointerCapture(e.pointerId);
          ctx.beginPath();
          ctx.arc(last[0], last[1], 1.1, 0, Math.PI * 2);
          ctx.fill();
        });
        canvas.addEventListener('pointermove', (e) => {
          if (!drawing) return;
          const q = pt(e);
          ctx.beginPath();
          ctx.moveTo(last[0], last[1]);
          ctx.lineTo(q[0], q[1]);
          ctx.stroke();
          last = q;
        });
        const end = () => {
          if (!drawing) return;
          drawing = false;
          const out = document.createElement('canvas');
          out.width = Math.round(r.width);
          out.height = Math.round(r.height);
          out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
          obj.sig = obj.sig || {};
          obj.sig[key] = out.toDataURL('image/png');
          if (obj.sigF) delete obj.sigF[key]; // geändert → beim Übertragen neu hochladen
          save();
        };
        canvas.addEventListener('pointerup', end);
        canvas.addEventListener('pointercancel', end);
      }

      /* Fälligkeit: grün = noch Zeit, gelb = in höchstens 60 Tagen, rot = überfällig */
      function dueState(iso) {
        const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!m) return null;
        const t = new Date();
        t.setHours(12, 0, 0, 0);
        const days = Math.round((new Date(+m[1], +m[2] - 1, +m[3], 12) - t) / 864e5),
          tg = (n) => (n === 1 ? 'Tag' : 'Tagen');
        if (days < 0) return { cls: 'bad', days, text: `überfällig seit ${-days} ${tg(-days)}` };
        if (days === 0) return { cls: 'warn', days, text: 'heute fällig' };
        return { cls: days <= 60 ? 'warn' : 'ok', days, text: `fällig in ${days} ${tg(days)}` };
      }

        const blocks = [];

              titel: l.title,
              ref: l.ref,
              head: l.cols.map((c) => ({
                t: c[1],
                w: c[2] && c[2].w ? c[2].w + '%' : '',
                num: c[2] && c[2].num,
              })),
              rows: rows.map((e) => l.cols.map((c) => cell(e, c))),
            }),
          );
          if (l.leak) {
            const fg = deNum(r.fg),
              years = {};
            es.forEach((e) => {
              const a = deNum(e['Kältemittel aufgefüllt (kg)']),
                y = String(e._iso || '').slice(0, 4);

            });
            const ys = Object.keys(years).sort();
            if (ys.length)
              blocks.push({
                html: `<div class="leak"><b>Leckrate je Jahr</b><span>(ChemKlimaschutzV § 3, aufgefüllte Menge ÷ Füllgewicht${fg > 0 ? ' ' + fmt(fg) + ' kg' : ''}):</span>${ys
                  .map(
                    (y) =>
                      `<span>${y}: ${fmt(years[y])} kg ${fg > 0 ? `<span class="pill warn">${String(Math.round((years[y] / fg) * 1000) / 10).replace('.', ',')} %</span>` : ''}</span>`,
                  )
                  .join('')}</div>`,
              });
          }
        });

        // Unterschriften zu den Einträgen (nur unterschriebene Termine)
        const signed = es.filter((e) => e._sig && (img(e._sig.sk) || img(e._sig.betr)));
        const withBetr = signed.some((e) => img(e._sig.betr)); // Spalte „Betreiber“ nur, wenn ein älterer Eintrag eine Betreiber-Unterschrift hat
        if (signed.length)
          blocks.push(
            B.tabelle({
              titel: 'Unterschriften zu den Einträgen',
              head: [{ t: 'Datum', w: '14%' }, 'Sachkundiger'].concat(
                withBetr ? ['Betreiber'] : [],
              ),
              rows: signed.map((e) =>
                [
                  { t: e['Datum'] || '—', cls: 'date' },
                  {
                    html: `${img(e._sig.sk)}<span class="small">${esc(e['Sachkundiger'] || '')}</span>`,
                    cls: 'sigc',
                  },
                ].concat(
                  withBetr
                    ? [
                        {
                          html: `${img(e._sig.betr)}<span class="small">${img(e._sig.betr) ? esc(e['Name Betreiber'] || '') : ''}</span>`,
                          cls: 'sigc',
                        },
                      ]
                    : [],
                ),
              ),
            }),
          );

        if (r.remark)
          blocks.push({ html: B.notiz({ titel: 'Bemerkungen zur Anlage', text: r.remark }) });
        if (r.hinweis && r.hinweis.length)
          blocks.push({
            html: B.rechtstext(
              r.hinweis.map((t) => {
                const k = t.indexOf(': ');
                return k > 0 && k < 80 ? { titel: t.slice(0, k) + '.', text: t.slice(k + 2) } : t;
              }),
            ),
          });

        return {
          blocks,
          head: B.kopf({
            firma: r.firma,
            kicker: 'Anlagenlogbuch',
            titel: r.title,
            nrLabel: 'Logbuch-Nr.',
            id: r.id,
            datum: stand,
            datumLabel: 'Stand',
            untertitel: r.subtitle,
            untertitelUnten: true,
          }),
          smallHead: B.kopfKlein({
            firma: r.firma,
            zeile: [sh.betreiber, sh.anlage].filter(Boolean).join(' · '),
            titel: r.title,
            nrLabel: 'Logbuch-Nr.',
            id: r.id,
          }),
          foot: B.fuss({ text: r.title, stand: stand ? 'Stand ' + stand : '' }),
          id: esc(r.id),
        };
      }
      /* @@ende */

      function reportForView() {
        if (view.db) return view.rep;
        const p = book();
        return p ? buildReport(p) : null;
      }

      /* ---------- PDF-Erzeugung (offline, ohne Druckdialog – iOS druckt in Home-Bildschirm-Apps nicht) ---------- */
      let lastPdf = null; // {key, file, url}
      const viewKey = () => (view.db ? 'db:' + view.key : 'loc:' + view.id);
      function pdfBarHtml() {
        if (!lastPdf || lastPdf.key !== viewKey()) return '';
        // „Öffnen“ nur im normalen Browser – in der Home-Bildschirm-App gäbe es keinen Weg zurück
        return `${isStandalone() ? '' : `<a class="btn" href="${lastPdf.url}" download="${esc(lastPdf.file.name)}" target="_blank" rel="noopener">Öffnen</a>`}`;
      }

      function dbList() {
        const q = (view.q || '').toLowerCase().trim();
        const list = dbCache.list
          .filter(
            (e) =>
              !q ||
              [e.projekt, e.kunde, e.ort, e.anlage, e.sn, e.last, fmtDate(e.last)]
                .join(' ')
                .toLowerCase()
                .includes(q),
          )
          // „Nach Fälligkeit“: überfällige zuerst, Anlagen ohne Termin ans Ende
          .sort(
            view.sort === 'due'
              ? (a, b) =>
                  (/^\d{4}-/.test(a.next) ? a.next : '9999').localeCompare(
                    /^\d{4}-/.test(b.next) ? b.next : '9999',
                  )
              : (a, b) => String(b.last).localeCompare(String(a.last)),
          );
        if (!list.length)
          return `<p class="muted">${dbCache.list.length ? 'Keine Treffer.' : 'Keine Daten.'}</p>`;
        return list
          .map((e) => {
            const dd = dueState(e.next);
            return `<div class="card bk${dd ? ' due-' + dd.cls : ''}">
      <div class="bk-t"><b>${esc(e.projekt)}</b>${e.kunde ? `<span class="bk-s">${esc(e.kunde)}</span>` : ''}<span class="muted">${esc([e.anlage, e.sn && 'S/N ' + e.sn, e.ort].filter(Boolean).join(' · '))}</span></div>
      <div class="bk-b">${e.n ? `<span class="badge">${esc(e.n)} Einträge</span>` : ''}${e.next ? nextBadge({ next: e.next }) : ''}${e.erg === 'nicht erfüllt' ? '<span class="badge bad">nicht erfüllt</span>' : ''}</div>
      <div class="bk-a">
        <button class="btn small primary" data-act="dbopen" data-key="${esc(e.key)}" data-then="entry">+ Eintrag</button>
        <button class="btn small" data-act="dbopen" data-key="${esc(e.key)}">Öffnen</button>
        ${e.pdfUrl ? `<a class="btn small" href="${esc(e.pdfUrl)}" target="_blank" rel="noopener">PDF</a>` : `<button class="btn small" data-act="dbreport" data-key="${esc(e.key)}">PDF</button>`}
      </div></div>`;
          })
          .join('');
      }

      /* ---------- Google-Sheet-Schnittstelle ---------- */
      const plainEntry = (e) => ({ id: e.id, values: e.values, completedAt: e.completedAt || '' });
      /* Übertragene Protokolle werden 7 Tage nach der Übertragung aus der App entfernt (bleiben in der Datenbank) */
      const KEEP_SYNCED_DAYS = 7;
      function pruneSynced() {
        const now = Date.now(),
          maxAge = KEEP_SYNCED_DAYS * 864e5;
        let changed = false;
        books.forEach((p) => {
          if (p.status === 'done' && p.synced === true && !p.syncedAt) {
            p.syncedAt = new Date().toISOString();
            changed = true;
          }
        }); // alte Einträge: Frist startet jetzt
        // nie löschen: Logbuch mit angefangenem/geöffnetem Eintrag oder noch nicht übertragener Unterschrift-Löschung
        const busy = (p) =>
          (p.entries || []).some((e) => e.status !== 'done') || (p.sigDel || []).length > 0;
        const keep = books.filter(
          (p) =>
            !(
              p.status === 'done' &&
              p.synced === true &&
              p.syncedAt &&
              p.id !== view.id &&
              !busy(p) &&
              now - new Date(p.syncedAt).getTime() > maxAge
            ),
        );
        if (keep.length !== books.length) {
          books = keep;
          changed = true;
        }
        if (changed) save();
      }
      async function syncAll(silent) {
        if (
          !syncCanStart(
            books.some((p) => p.status === 'done' && !p.synced),
            silent,
          )
        )
          return;
        let okCount = 0,
          err = null;
        for (let pass = 0; pass < 2 && !err; pass++) {
          for (const p of books.filter((x) => x.status === 'done' && !x.synced)) {
            try {
              recompute(p, STAMM);
              const es = doneEntries(p);
              es.forEach((e) => recompute(e, EINTRAG, p.values));
              // Unterschriften: nur neue/geänderte Bilder hochladen; „have“ = Bilder, die dieses Gerät schon hat
              const sigs = {},
                have = [];
              [['book', p], ...es.map((e) => [e.id, e])].forEach(([owner, o]) =>
                Object.keys(o.sig || {}).forEach((k) => {
                  if (!safeImg(o.sig[k])) return;
                  have.push(owner + '.' + k);
                  if (!(o.sigF || {})[k]) sigs[owner + '.' + k] = o.sig[k];
                }),
              );
              const j = await api('upsert', {
                protocol: {
                  id: p.id,
                  templateId: STAMM.id,
                  values: p.values,
                  entries: es.map(plainEntry),
                  deleted: p.deleted || [],
                  kundeName: betrText(p.values),
                  completedAt: p.completedAt,
                  sourceKey: p.sourceKey || '',
                  pdf: await pdfBase64(p),
                  sigs,
                  sigDel: p.sigDel || [],
                  sigHave: have,
                },
                cols: buildCols(STAMM, p.values).concat(summaryCols(p)),
                ecols: Object.fromEntries(es.map((e) => [e.id, buildCols(EINTRAG, e.values)])),
              });
              p.synced = true;
              p.syncedAt = new Date().toISOString();
              p.sourceKey = '';
              // Einträge, die inzwischen von einem anderen iPad dazugekommen sind, übernehmen → PDF & Sheet im 2. Durchgang aktualisieren
              const known = new Set(p.entries.map((e) => e.id)),
                del = new Set(j.deleted || []);
              p.deleted = j.deleted || [];
              p.entries = p.entries.filter((e) => e.status === 'draft' || !del.has(e.id));
              const extra = (j.entries || []).filter((e) => !known.has(e.id) && !del.has(e.id));
              if (extra.length) {
                extra.forEach((e) => p.entries.push(Object.assign({ page: 0, status: 'done' }, e)));
                p.synced = false;
              }
              applySigs(p, j.sigFiles, j.sigData);
              p.sigDel = [];
              save();
              okCount++;
            } catch (e) {
              err = e;
              break;
            }
          }
        }
        syncEnd();
        pruneSynced();
        if (err) toast(`Übertragung fehlgeschlagen: ${err.message}`);
        else if (okCount)
          toast('Logbuch in die Datenbank übertragen, PDF in Google Drive abgelegt.');
        if (['home', 'book', 'report'].includes(view.name)) render();
        else updateNet();
      }

      /* Wert aus einer alten Sheet-Zeile in das Eingabeformat der App bringen */
      function fromSheet(f, x) {
        if (x == null) return '';
        if (typeof x === 'boolean') x = x ? 'Ja' : 'Nein';
        if (typeof x === 'number') return fmtNum(x); // Eingabefelder erwarten Text mit Komma
        x = String(x);
        if (f.type === 'date' || f.input === 'date') {
          const m = x.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
          if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
        }
        return x;
      }
      /* Werte aus Sheet-Spalten übernehmen; abweichende Werte in Auto-Feldern gelten als „von Hand“ */
      function valuesFromCols(tpl, cols, L) {
        const v = {};
        tpl.all.forEach((f) => {
          v[f.id] = fromSheet(f, cols[f.col]);
        });
        tpl.all
          .filter((f) => f.type === 'auto')
          .forEach((f) => {
            const auto = f.calc(v, L || v) || '';
            if (v[f.id] !== '' && String(v[f.id]) !== String(auto)) v['_m_' + f.id] = true;
            else v[f.id] = auto;
          });
        return v;
      }
      function initValues(tpl) {
        const v = {};
        tpl.all.forEach((f) => {
          v[f.id] = f.init != null ? (typeof f.init === 'function' ? f.init() || '' : f.init) : '';
        });
        return v;
      }

      /* ---------- Aktionen ---------- */

          const e = {
            id: uid(),

          };
          e.values.km = p.values.km || '';
          recompute(e, EINTRAG, p.values);
          vorbelegtErfassen(e);
          p.entries.push(e);
          save();
          go('wizard', { id: p.id, eid: e.id });
        },
        resume(d) {
          go('wizard', { id: d.id, eid: d.eid });
        },
        report(d) {
          go('report', { id: d.id });
        },
        editstamm(d) {
          const p = book(d.id);
          p.status = 'draft';
          p.synced = false;
          p.page = 0;
          save();
          go('wizard', { id: p.id });
        },
        editentry(d) {
          const e = book(d.id).entries.find((x) => x.id === d.eid);
          e.status = 'draft';
          e.page = 0;
          save();
          go('wizard', { id: d.id, eid: d.eid });
        },
        delentry(d) {
          const p = book(d.id),
            e = p.entries.find((x) => x.id === d.eid);
          if (
            !confirm(
              e.status === 'draft' && !e.completedAt
                ? 'Angefangenen Eintrag verwerfen?'
                : 'Diesen Eintrag aus dem Logbuch löschen? Er wird beim Übertragen auch in der Datenbank entfernt.',
            )
          )
            return;
          p.entries = p.entries.filter((x) => x.id !== d.eid);
          if (e.completedAt) {
            p.deleted = (p.deleted || []).concat(e.id);
            p.synced = false;
          }
          save();
          render();
          if (e.completedAt) syncAll(true);
        },
        delbook(d) {
          const p = book(d.id);
          const msg = p.synced
            ? 'Logbuch aus der App entfernen? (Es bleibt in der Datenbank erhalten und kann jederzeit wieder geladen werden.)'
            : p.status === 'done'
              ? 'ACHTUNG: Änderungen an diesem Logbuch sind noch NICHT in der Datenbank. Wirklich aus der App entfernen?'
              : 'Angefangenes Logbuch verwerfen?';
          if (!confirm(msg)) return;
          books = books.filter((x) => x.id !== d.id);
          save();
          go('home');
        },

        set(d) {
          const c = ctx();
          c.obj.values[d.f] = c.obj.values[d.f] === d.v ? '' : d.v; // erneutes Tippen wählt wieder ab
          recompute(c.obj, c.tpl, c.L);
          save();
          render();
        },
        sigclear(d) {
          const c = ctx(),
            o = c.obj;
          if (o.sig) delete o.sig[d.sig];
          // schon in Google Drive → dort beim nächsten Übertragen löschen
          if (o.sigF && o.sigF[d.sig]) {
            c.p.sigDel = (c.p.sigDel || []).concat(sigOwner() + '.' + d.sig);
            delete o.sigF[d.sig];
          }
          save();
          render();
        },
        allyes() {
          const c = ctx();
          c.tpl.pages[c.obj.page].fields.forEach((f) => {
            if (f.allYes && !c.obj.values[f.id]) c.obj.values[f.id] = 'Ja';
          });
          save();
          render();
        },
        copybetr() {
          const c = ctx(),
            v = c.obj.values;
          [
            ['aFirma', 'bFirma'],
            ['aName', 'bName'],
            ['aStr', 'bStr'],
            ['aPlz', 'bPlz'],
            ['aOrt', 'bOrt'],
          ].forEach(([a, b]) => {
            v[a] = v[b] || '';
          });
          save();
          render();
        },
        next() {
          const c = ctx();
          if (pageErrors(c, c.obj.page).length) {
            view.tried = true;
            render();
            $('#pageerr').textContent = 'Bitte die markierten Felder prüfen.';
            toast('Bitte die markierten Felder prüfen.');
            const first = document.querySelector('.field.err');
            if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
          }
          stepTo('fwd', () => {
            c.obj.page++;
            save();
            view.tried = false;
          });
        },
        prev() {
          const c = ctx();
          if (c.obj.page > 0)
            stepTo('back', () => {
              c.obj.page--;
              save();
              view.tried = false;
            });
        },
        jump(d) {
          const c = ctx(),
            t = Number(d.i);
          if (t === c.obj.page) {
            view.tried = true;
            render();
            window.scrollTo(0, 0);
            return;
          }
          stepTo(t > c.obj.page ? 'fwd' : 'back', () => {
            c.obj.page = t;
            save();
            view.tried = true;
          });
        },
        finish() {
          const c = ctx();
          recompute(c.obj, c.tpl, c.L);
          const bad = c.tpl.pages.findIndex((pg, k) => pageErrors(c, k).length);
          if (bad >= 0) {
            c.obj.page = bad;
            save();
            view.tried = true;
            render();
            window.scrollTo(0, 0);
            toast(`Bitte „${c.tpl.pages[bad].title}“ prüfen.`);
            return;
          }
          c.obj.status = 'done';
          c.obj.completedAt = new Date().toISOString();
          if (!view.eid)
            c.p.entries.forEach((e) => {
              if (e.status === 'done') recompute(e, EINTRAG, c.p.values);
            }); // z. B. neues Prüfintervall
          c.p.synced = false;
          save();
          const wasEntry = !!view.eid;
          iosCheck(wasEntry ? 'Eintrag gespeichert' : 'Logbuch gespeichert');
          go('book', { id: c.p.id });
          toast(wasEntry ? 'Eintrag gespeichert.' : 'Logbuch gespeichert.');
          syncAll(true);
        },

        async makepdf(d, btn) {
          if (!window.jspdf || !window.html2canvas) {
            toast('PDF-Modul nicht geladen – App einmal online neu starten.');
            return;
          }
          if (btn && btn.classList.contains('done')) return; // Doppelstart verhindern
          const r = reportForView();
          if (!r) return;
          const name = pdfName(r.id, 'ohne-Logbuchnummer') + '.pdf',
            key = viewKey();
          if (pdfBusy) {
            toast(
              pdfBusy !== key
                ? 'Es wird gerade ein anderes PDF erstellt …'
                : 'PDF wird noch erstellt …',
            );
            return;
          } // gleicher Bericht: Doppelstart still verhindern
          const cb = () => $('#bar .pdfb'); // immer der aktuell im DOM befindliche Knopf (die Leiste wird bei Neuzeichnen neu gebaut)
          const setP = (v) => {
            pdfProg = v;
            const f = viewKey() === key ? $('#bar .pdfb .fill') : null;
            if (f) f.style.transform = 'scaleX(' + v + ')';
          };
          pdfBusy = key;
          setP(0.05);
          {
            const b = cb();
            if (b) b.classList.add('run');
          }
          // Fortschritt ist geschätzt (der gemeinsame PDF-Code meldet keinen): nähert sich 92 %, springt bei Fertigstellung auf 100 %
          pdfTick = setInterval(() => setP(pdfProg + (0.92 - pdfProg) * 0.07), 250);
          try {
            const blob = await reportPdfBlob(r);
            clearInterval(pdfTick);
            setP(1);
            await new Promise((res) => setTimeout(res, RM() ? 0 : 240));
            if (lastPdf) URL.revokeObjectURL(lastPdf.url);
            lastPdf = {
              key,
              file: new File([blob], name, { type: 'application/pdf' }),
              url: URL.createObjectURL(blob),
            };
            pdfBusy = null;
            if (view.name === 'report' && viewKey() === key) {
              const bar = $('#pdfbar');
              if (bar) bar.innerHTML = pdfBarHtml();
              setBar(); // baut Leiste neu auf (mit Teilen-Knopf) -> neuen Knopf in den Fertig-Zustand setzen
              const nb = cb();
              if (nb) {
                nb.classList.remove('run');
                nb.classList.add('done');
                setTimeout(() => nb.classList.remove('done'), 2600);
              }
            }
            toast('PDF fertig – jetzt „Teilen“ antippen.');
          } catch (e) {
            toast('PDF konnte nicht erstellt werden: ' + e.message);
          } finally {
            clearInterval(pdfTick);
            pdfBusy = null;
            pdfProg = 0;
            const b = cb();
            if (b && !b.classList.contains('done')) {
              b.classList.remove('run');
              setP(0);
            }
          }
        },
        async sharepdf() {
          if (!lastPdf) return;
          const files = [lastPdf.file];
          if (navigator.canShare && navigator.canShare({ files })) {
            try {
              await navigator.share({ files, title: lastPdf.file.name });
            } catch (e) {
              if (e.name !== 'AbortError') toast('Teilen fehlgeschlagen: ' + e.message);
            }
          } else {
            window.open(lastPdf.url, '_blank');
          }
        },
        print() {
          const r = reportForView();
          const old = document.title;
          document.title = pdfName(r.id, 'ohne-Logbuchnummer');
          window.print();
          setTimeout(() => {
            document.title = old;
          }, 1500);
        },

        async dbload() {
          if (!navigator.onLine) {
            toast('Offline – zeige gespeicherten Stand.');
            return;
          }
          try {
            toast('Lade Daten …');
            const j = await api('list');
            dbCache = { at: new Date().toISOString(), list: j.list };
            LS.set('alb.db', dbCache);
            toast(`${j.list.length} Logbücher geladen.`);
            render();
          } catch (e) {
            toast('Laden fehlgeschlagen: ' + e.message);
          }
        },
        async dbreport(d) {
          if (!navigator.onLine) {
            toast('Zum Öffnen eines Logbuchs aus der Datenbank wird Internet benötigt.');
            return;
          }
          try {
            toast('Lade Logbuch …');
            const j = await api('get', { key: d.key });
            go('report', { db: true, rep: j.report, key: d.key, q: view.q });
          } catch (e) {
            toast('Laden fehlgeschlagen: ' + e.message);
          }
        },
        /* Logbuch aus dem Sheet aufs iPad holen (von jedem iPad aus), danach optional gleich neuen Eintrag beginnen */
        async dbopen(d) {
          if (!navigator.onLine) {
            toast('Zum Laden aus der Datenbank wird Internet benötigt.');
            return;
          }
          try {
            toast('Lade Logbuch …');
            const j = await api('load', { key: d.key });
            const local = j.appId && book(j.appId);
            if (
              local &&
              !local.synced &&
              !confirm(
                'In der App gibt es zu diesem Logbuch noch nicht übertragene Änderungen. Durch die Version aus der Datenbank ersetzen?',
              )
            )
              return;
            let p;
            if (j.values) {
              p = {
                id: j.appId,
                templateId: STAMM.id,
                values: j.values,
                deleted: j.deleted || [],
                sourceKey: '',
                entries: (j.entries || []).map((e) =>
                  Object.assign({ page: 0, status: 'done' }, e),
                ),
              };
              applySigs(p, j.sigFiles, j.sigData);
            } else {
              // alte / von Hand angelegte Zeile ohne App-Daten
              const values = valuesFromCols(STAMM, j.cols);
              p = {
                id: uid(),
                templateId: STAMM.id,
                values,
                deleted: [],
                sourceKey: d.key,
                entries: (j.ecols || []).map((ec) => ({
                  id: uid(),
                  values: valuesFromCols(EINTRAG, ec, values),
                  page: 0,
                  status: 'done',
                  completedAt: new Date().toISOString(),
                })),
              };
            }
            // angefangene Einträge dieses iPads behalten
            if (local)
              local.entries.filter((e) => e.status === 'draft').forEach((e) => p.entries.push(e));
            Object.assign(p, {
              page: 0,
              status: 'done',
              createdAt: new Date().toISOString(),
              completedAt: new Date().toISOString(),
              synced: !!j.values,
            });
            books = books.filter((x) => x.id !== p.id);
            books.unshift(p);
            save();
            toast('Logbuch geladen.');
            go('book', { id: p.id });
            if (d.then === 'entry') Actions.newentry({ id: p.id });
          } catch (e) {
            toast('Laden fehlgeschlagen: ' + e.message);
          }
        },
        async drivepdf() {
          try {
            toast('PDF wird in Google Drive erstellt …');
            const b64 = await blobB64(await reportPdfBlob(reportForView()));
            const j = await api('savepdf', { key: view.key, pdf: b64 });
            const e = dbCache.list.find((x) => x.key === view.key);
            if (e) {
              e.pdfUrl = j.url;
              LS.set('alb.db', dbCache);
            }
            toast('PDF in Google Drive gespeichert.');
            window.open(j.url, '_blank');
          } catch (e) {
            toast('Fehler: ' + e.message);
          }
        },

        savesettings(d) {
          settingsSave(SETTINGS_FIELDS, 'alb.settings');
          if (d !== 'silent') toast('Gespeichert.');
        },
        async ping() {
          Actions.savesettings('silent');
          try {
            await api('ping');
            toast('Verbindung zur Datenbank funktioniert ✓');
            syncAll(true);
          } catch (e) {
            toast('Verbindung fehlgeschlagen: ' + e.message);
          }
        },
        backup() {
          backupDownload(
            { app: 'anlagenlogbuch', exportedAt: new Date().toISOString(), books },
            `anlagenlogbuch-backup-${today()}.json`,
          );
        },
      };

      /* ---------- Events ---------- */
      document.addEventListener('click', (e) => {
        const b = e.target.closest('[data-act]');
        if (!b || b.disabled) return;
        const fn = Actions[b.dataset.act];
        if (fn) {
          e.preventDefault();
          if (navBusy) return;
          fn(b.dataset, b);
        } // während eines Seitenübergangs Tipps ignorieren
      });
      app.addEventListener('input', (e) => {
        const el = e.target;
        if (el.dataset.f && view.name === 'wizard') {
          const c = ctx(),
            f = c.tpl.F[el.dataset.f],
            v = c.obj.values;
          v[f.id] = el.value;
          if (f.type === 'auto') v['_m_' + f.id] = el.value !== '';
          recompute(c.obj, c.tpl, c.L);
          save();
          setHeader(false); // Kopf-Unterzeile mitführen (kein Neuzeichnen)
          if (f.type === 'auto') calcTouch(f.id, el.value, el, true);
          // abhängige Auto-Felder dieser Seite live nachführen (nicht das Feld, in dem gerade getippt wird)
          c.tpl.pages[c.obj.page].fields
            .filter((a) => a.type === 'auto')
            .forEach((a) => {
              const ie = $('#in-' + a.id),
                ne = $('#note-' + a.id);
              if (ie && ie !== el) {
                ie.value = v[a.id] || '';
                calcTouch(a.id, ie.value, ie);
              }
              if (ne) ne.innerHTML = autoNote(a, c);
            });
        } else if (el.id === 'dbsearch') {
          view.q = el.value;
          $('#dblist').innerHTML = dbList();
        }
      });
      document.addEventListener('change', (e) => {
        const el = e.target;
        if (el.dataset && el.dataset.pick && view.name === 'wizard') {
          Actions.set({ f: el.dataset.pick, v: el.value });
          return;
        }
        if (el.dataset.f && view.name === 'wizard') {
          const c = ctx(),
            f = c.tpl.F[el.dataset.f];
          if (f.type === 'auto' && el.value === '') {
            el.value = c.obj.values[f.id] || '';
          } // geleert → automatischer Wert erscheint
        } else if (el.id === 's_import' && el.files[0]) {
          backupImport(el.files[0], 'books', books, 'Logbücher', (list) => {
            books = list;
            save();
          });
        }
      });
      /* Wischen vom linken Rand = zurück (Eltern-Seite als Unterlage) */
      iosSwipe.init({
        back() {
          if (view.name === 'wizard') {
            const c = ctx();
            if (!c) return null;
            const i = c.obj.page;
            if (i > 0) {
              const t = i - 1;
              return {
                html: wizardHtml(c, t),
                go() {
                  c.obj.page = t;
                  save();
                  view.tried = false;
                  render();
                  window.scrollTo(0, 0);
                },
              };
            }
            // Seite 1: Eintrag -> Logbuch; Anlagendaten -> Logbuch (beim Bearbeiten) bzw. Start (neues Logbuch)
            if (view.eid || c.p.completedAt)
              return {
                html: Views.book(),
                go() {
                  Actions.openbook({ id: view.id });
                },
              };
            return {
              html: Views.home(),
              go() {
                Actions.home();
              },
            };
          }
          if (view.name === 'report') {
            if (view.db)
              return {
                html: Views.db(),
                go() {
                  Actions.db();
                },
              };
            return {
              html: Views.book(),
              go() {
                Actions.openbook({ id: view.id });
              },
            };
          }
          if (view.name === 'book' || view.name === 'db' || view.name === 'settings')
            return {
              html: Views.home(),
              go() {
                Actions.home();
              },
            };
          return null;
        },
      });
      let lastW = window.innerWidth;
      window.addEventListener('resize', () => {
        // Drehen des Geräts: Unterschriftsfelder neu aufbauen
        if (window.innerWidth !== lastW && document.querySelector('canvas.sig')) render();
        lastW = window.innerWidth;
      });
      window.addEventListener('online', () => {
        updateNet();
        syncAll(true);
      });
      window.addEventListener('offline', updateNet);

      /* ---------- Start ---------- */
      if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
        navigator.serviceWorker.register('sw.js').catch(() => {});
      if (navigator.storage && navigator.storage.persist)
        navigator.storage.persist().catch(() => {});
      pruneSynced();
      render();
      syncAll(true);
    </script>
    <script src="shared/theme.js"></script>
  </body>
</html>
