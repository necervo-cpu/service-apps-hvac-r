<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HVAC-R" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <title>Service Apps HVAC-R</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Verbindlicher Theme-Init: kein FOWC (Flash of Wrong Colors) -->
    <script>
      (function () {
        var root = document.documentElement;
        var saved = null;
        try {
          saved = localStorage.getItem('ag-theme');
        } catch (e) {}
        var light = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = saved === 'light' || saved === 'dark' ? saved : light ? 'light' : 'dark';
        root.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Google Fonts Online & Fallbacks -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="agFonts"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <script type="module" crossorigin src="./assets/index-DUWsYUvw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BlPSLNnY.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body class="bg-canvas text-[var(--text-primary)] antialiased select-none">
    <div id="root"></div>
    <div id="portal-root"></div>
  </body>
</html>
