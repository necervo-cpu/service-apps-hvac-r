<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Klima-Wartung">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a1a">
<meta name="color-scheme" content="light dark">
<script>(function(){try{var t=localStorage.getItem('muther-theme');var r=document.documentElement;if(t==='hell')r.setAttribute('data-theme','light');else if(t==='dunkel')r.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Klima / Kälte Wartung</title>
<script src="lib/html2canvas.min.js" defer></script>
<script src="lib/jspdf.umd.min.js" defer></script>
<style>
/* Farben nach muther-heizung-sanitaer.de: Anthrazit (--pri) für Kopf und Auswahl, Gold (--gold) als Akzent.
   Gold nie als Schriftfarbe auf Hell (zu wenig Kontrast) – nur Flächen/Linien, darauf dunkle Schrift. */
:root{--bg:#f8f7f4;--card:#fff;--ink:#1a1a1a;--muted:#706F6F;--line:#e4e1d8;--pri:#1a1a1a;--pri2:#c4b53e;--gold:#DCCC4B;--gold-soft:#faf6dc;
  --ok:#1e7a46;--bad:#b42318;--na:#8a8989;--warn:#8a5a00;--ctl:#fff;--bdg:#eceae3;--okbg:#e6f4ec;--okbd:#b6dcc4;--okfg:#14532d;--ebg:#fdecea;--wbg:#fdf3d6;--wbd:#e6d98a;--wfg:#4a3d00;--calc:#eef2f7;--sheet:#e9e7e1;--k1:#f4f3ef;--fwbd:#ecd28a;--fwfg:#5a3d00}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark;--bg:#121212;--card:#1e1e1e;--ink:#f0eee6;--muted:#a8a69d;--line:#3a3731;--pri:#0a0a0a;--gold-soft:#3a3516;--ok:#4cc27f;--bad:#ef7070;--na:#9a9a9a;--warn:#f0a53a;--ctl:#2a2a2a;--bdg:#33312d;--okbg:#16301f;--okbd:#2c6b43;--okfg:#b8e8c9;--ebg:#3a1818;--wbg:#3a3010;--wbd:#7a6a20;--wfg:#f3e6a0;--calc:#2b3340;--sheet:#0e0e0e;--k1:#262626;--fwbd:#7a6a20;--fwfg:#f3e6a0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#121212;--card:#1e1e1e;--ink:#f0eee6;--muted:#a8a69d;--line:#3a3731;--pri:#0a0a0a;--gold-soft:#3a3516;--ok:#4cc27f;--bad:#ef7070;--na:#9a9a9a;--warn:#f0a53a;--ctl:#2a2a2a;--bdg:#33312d;--okbg:#16301f;--okbd:#2c6b43;--okfg:#b8e8c9;--ebg:#3a1818;--wbg:#3a3010;--wbd:#7a6a20;--wfg:#f3e6a0;--calc:#2b3340;--sheet:#0e0e0e;--k1:#262626;--fwbd:#7a6a20;--fwfg:#f3e6a0}}
:root[data-theme=dark] .opts .btn.sel,:root[data-theme=dark] .seg .btn.sel.neutral{border-color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .opts .btn.sel,:root:not([data-theme=light]) .seg .btn.sel.neutral{border-color:var(--gold)}}
.themebtn{appearance:none;-webkit-appearance:none;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:99px;font:inherit;font-size:13px;font-weight:600;padding:4px 10px;min-height:30px;cursor:pointer;white-space:nowrap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold)}
header h1{font-size:19px;margin:0;flex:1;cursor:pointer}
.net{font-size:13px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.net.off{background:var(--bad)}
main{max-width:940px;margin:0 auto;padding:16px 16px calc(48px + env(safe-area-inset-bottom))}
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--ctl);color:var(--ink);border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--gold);border-color:var(--pri2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:38px;padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 6px}
label{display:block;font-size:15px;color:var(--ink);margin:0 0 6px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--ctl);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--bdg);color:var(--ink)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--ebg);color:var(--bad)}.badge.warn{background:var(--wbg);color:var(--warn)}
.muted{color:var(--muted)}
.warnbox{background:var(--gold-soft);border:1px solid var(--wbd);border-left:5px solid var(--gold);color:var(--wfg);padding:12px 14px;border-radius:12px;margin:12px 0}
.progress{height:8px;background:var(--bdg);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.progress>div{height:100%;background:var(--gold);transition:width .2s}
.pagetitle{font-size:26px;font-weight:700;margin:2px 0 4px;line-height:1.2}
/* Felder */
.field{padding:14px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.ghead{font-size:15px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.05em;padding:18px 0 4px;border-bottom:2px solid var(--gold)}
.ghead:first-child{padding-top:2px}
.fhint{font-size:14px;color:var(--muted);margin:-3px 0 6px;font-weight:400}
.ferr{color:var(--bad);font-size:14px;font-weight:600;margin-top:6px}
.field.err input,.field.err textarea{border-color:var(--bad)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:14px}
.frow label{margin:0}
.seg{display:flex;gap:6px;flex-shrink:0}
.seg .btn{min-width:92px;min-height:52px}
.seg .btn.sel.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg .btn.sel.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.seg .btn.sel.na{background:var(--na);border-color:var(--na);color:#fff}
.seg .btn.sel.neutral{background:var(--pri);border-color:var(--pri);color:#fff}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.opts .btn{min-height:46px}
.opts .btn.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.inunit{display:flex;align-items:center;gap:10px}
.inunit input{max-width:260px;font-size:22px}
.inunit .unit{color:var(--muted);font-weight:600}
.soll{font-size:14px;margin-top:6px}
.calc{display:inline-block;padding:10px 14px;background:var(--calc);border-radius:10px;font-weight:700;min-width:120px}
.calcnote{font-size:13px;color:var(--muted);margin-left:8px}
@media(max-width:700px){.frow{flex-direction:column;align-items:stretch}.seg .btn{flex:1}}
.navbar{display:flex;gap:12px;margin-top:20px}
.navbar .btn{flex:1;min-height:60px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:24px}
.chip{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--ctl);font:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:0 10px;color:var(--ink)}
.chip.done{background:var(--okbg);border-color:var(--okbd);color:var(--ok)}
.chip.cur{outline:3px solid var(--gold);outline-offset:1px}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sigwrap{border:2px dashed #c4ccd8;border-radius:12px;background:#fff;margin-bottom:8px}
canvas.sig{width:100%;height:170px;display:block;touch-action:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.err{color:var(--bad);font-weight:600;margin-top:10px;min-height:1.2em}
a.jump{color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--pri2);text-decoration-thickness:2px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--gold);outline-offset:0;border-color:var(--pri2)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(40px);opacity:0;background:var(--pri);color:#fff;padding:12px 18px;border-radius:12px;transition:.25s;z-index:20;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== Handy-Layout ===== */
/* iPhone: Datumsfeld nimmt sonst nicht die volle Breite ein */
@supports(-webkit-touch-callout:none){input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:50px;text-align:left}}
/* Schmale Bildschirme (iPhone hochkant): kompakter Kopf, Tabellen als Karten, Zurück/Weiter unten fest */
@media(max-width:600px){
  header{padding-left:12px;padding-right:12px;gap:8px}
  header h1{font-size:16px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .net{font-size:12px;padding:2px 8px}
  main{padding-left:12px;padding-right:12px}
  .card{padding:12px 14px;border-radius:14px}
  .pagetitle{font-size:22px}
  .card>table thead{display:none}
  .card>table,.card>table tbody,.card>table tr,.card>table td{display:block;width:100%}
  .card>table tr{padding:10px 0;border-bottom:1px solid var(--line)}
  .card>table tr:last-child{border-bottom:0}
  .card>table td{border:0;padding:2px 0;text-align:left!important;white-space:normal!important}
  .card>table td:last-child{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px}
  .navbar{position:sticky;bottom:0;z-index:4;background:var(--bg);margin:20px -12px 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .navbar .btn{min-height:52px;font-size:17px}
  #toast{bottom:calc(96px + env(safe-area-inset-bottom))}
}
/* ===== Ende Handy-Layout ===== */
/* Bericht */
/* Schrift des Ausdrucks – lokal, damit das PDF auch offline gleich aussieht (SIL Open Font License) */
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400 700;font-display:swap;
  src:url(lib/fonts/plus-jakarta-sans-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400 700;font-display:swap;
  src:url(lib/fonts/plus-jakarta-sans-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
.sheetwrap{background:var(--sheet);border-radius:12px;padding:16px 0 1px;overflow:hidden}
/* ===== Bericht-CSS (identisch in google-apps-script/PdfDialog.html) ===== */
.report{--gold:#DCCC4B;--gold-soft:#faf6dc;--ink:#1a1a1a;--ink-2:#3a3a3a;--ink-3:#706F6F;--line:#dcd9cf;--line-soft:#eceae3;--zebra:#faf9f5;--head-bg:#f8f7f4;
  --ok:#1e7a46;--ok-bg:#e6f4ec;--bad:#b42318;--bad-bg:#fdecea;--warn:#8a5a00;--warn-bg:#fdf3d6;
  color:var(--ink);font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.report *{box-sizing:border-box}
.report .page{width:210mm;height:297mm;margin:0 auto 16px;background:#fff;box-shadow:0 2px 10px rgba(20,20,20,.15);padding:14mm 15mm 12mm;
  display:flex;flex-direction:column;font-size:8.3pt;line-height:1.4;text-align:left}
.report.flat .page{box-shadow:none;margin:0}
.report .page-body{flex:1;min-height:0;overflow:hidden}
.report .pfoot{display:flex;justify-content:space-between;gap:4mm;border-top:1px solid var(--line);padding-top:2.5mm;margin-top:4mm;font-size:7pt;color:var(--ink-3)}
.report .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8mm;padding-bottom:4mm;border-bottom:2.5px solid var(--gold)}
.report .firm b{display:block;font-size:10pt;color:var(--ink)}
.report .firm span{display:block;font-size:7.6pt;color:var(--ink-2)}
.report .doc{text-align:right;flex-shrink:0}
.report .doc .kicker{font-size:7pt;letter-spacing:.12em;color:var(--ink-3)}
.report .doc h1{margin:.5mm 0 1mm;font-size:17pt;line-height:1.1;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.report .doc .meta{font-size:7.8pt;color:var(--ink-2)}
.report .doc .meta b{color:var(--ink)}
.report .law{font-size:6.8pt;color:var(--ink-3);margin-top:2mm;line-height:1.35}
.report .head.small{padding-bottom:2.5mm}
.report .head.small .doc h1{font-size:11pt}
.report .status{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:3mm;margin:5mm 0 1mm}
.report .tile{border:1px solid var(--line);border-radius:2mm;padding:3mm 3.5mm}
.report .tile .lab{font-size:6.8pt;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.report .tile .val{font-size:14pt;font-weight:700;margin-top:.8mm;line-height:1.15}
.report .tile .sub{font-size:7.6pt;color:var(--ink-2);margin-top:1mm}
.report .tile.primary{border-color:var(--gold);border-left:1.2mm solid var(--gold);background:var(--gold-soft)}
.report .pill{display:inline-flex;align-items:center;gap:1.2mm;font-weight:600;font-size:7.6pt;padding:.5mm 2mm;border-radius:10mm;white-space:nowrap}
.report .pill svg{width:2.8mm;height:2.8mm;flex-shrink:0}
.report .pill.ok{color:var(--ok);background:var(--ok-bg)}.report .pill.bad{color:var(--bad);background:var(--bad-bg)}.report .pill.warn{color:var(--warn);background:var(--warn-bg)}
.report .sec{margin-top:4.5mm}
.report .sec h2{display:flex;align-items:baseline;gap:2.5mm;margin:0 0 2mm;font-size:9.6pt;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0;
  padding-bottom:1.2mm;border-bottom:1px solid var(--line)}
.report .sec h2 .no{display:inline-flex;align-items:center;justify-content:center;width:5mm;height:5mm;border-radius:1mm;background:var(--gold);color:var(--ink);font-size:7.4pt}
.report .sec h2 .ref{margin-left:auto;font-size:7pt;font-weight:500;color:var(--ink-3)}
.report .cols2{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.report .card{border:1px solid var(--line-soft);border-radius:1.5mm;padding:2.5mm 3mm;background:var(--zebra)}
.report .card h3{margin:0 0 1.5mm;font-size:7pt;letter-spacing:.09em;color:var(--ink-3)}
.report .addr{font-size:8.8pt;line-height:1.45}
.report .addr b{font-weight:600}
.report dl.kv{display:grid;grid-template-columns:repeat(4,1fr);margin:0;column-gap:4mm}
.report dl.kv div{padding:1.5mm 0;border-bottom:1px solid var(--line-soft);min-width:0}
.report dl.kv dt{font-size:6.8pt;color:var(--ink-3);letter-spacing:.06em}
.report dl.kv dd{margin:.3mm 0 0;font-size:8.8pt;font-weight:500;overflow-wrap:anywhere}
.report dl.kv dd.empty{color:#9a9999;font-weight:400}
.report .checks{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
.report .cgroup h4{margin:0 0 1mm;font-size:7pt;letter-spacing:.07em;color:var(--ink-2)}
.report .citem{display:flex;align-items:flex-start;gap:1.6mm;padding:.9mm 0;border-bottom:1px dotted var(--line)}
.report .citem svg{width:3.2mm;height:3.2mm;flex-shrink:0;margin-top:.3mm}
.report .citem .t{flex:1}
.report .citem .a{font-size:7.4pt;font-weight:600;color:var(--ink-2);text-align:right}
.report .signoff{display:flex;flex-wrap:wrap;gap:1mm 6mm;margin-top:2.5mm;font-size:7.8pt;color:var(--ink-2)}
.report .signoff b{color:var(--ink);font-weight:600}
.report table{width:100%;border-collapse:collapse;table-layout:fixed}
.report th{font-size:6.8pt;letter-spacing:.06em;color:var(--ink-2);text-align:left;font-weight:600;
  background:var(--head-bg);padding:1.6mm 2mm;border-bottom:1.5px solid var(--gold)}
.report td{padding:1.4mm 2mm;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:8.3pt;overflow-wrap:anywhere}
.report tbody tr:nth-child(even) td{background:var(--zebra)}
.report td.num,.report th.num{text-align:right}
.report td.date{white-space:nowrap;font-weight:600}
.report td .small{display:block;font-size:7pt;color:var(--ink-3)}
.report .none{font-size:7.8pt;color:var(--ink-3);font-style:italic;padding:.5mm 0}
.report .leak{margin-top:1.8mm;font-size:7.8pt;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:1mm 2mm}
.report .leak b{color:var(--ink)}
.report .note{border:1px solid var(--line);border-left:1mm solid var(--gold);border-radius:1mm;padding:2.5mm 3mm;margin-top:4.5mm;font-size:8.4pt}
.report .note b{display:block;font-size:7pt;letter-spacing:.08em;color:var(--ink-3);margin-bottom:.8mm}
.report .legal{margin-top:4mm;display:grid;grid-template-columns:1fr;gap:1.4mm;font-size:6.9pt;color:var(--ink-2);line-height:1.4}
.report .legal p{margin:0}
.report .legal b{color:var(--ink)}
.report .sign{display:grid;grid-template-columns:1fr 1fr;gap:12mm;margin-top:7mm}
.report .sign>div{display:flex;flex-direction:column}
.report .sign b{font-size:7pt;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.report .sign .space{display:block;height:30mm}
.report .sign .cap{border-top:1px solid var(--ink-2);padding-top:1.2mm;font-size:7pt;color:var(--ink-3)}
.report .tile.ok{border-color:var(--ok);border-left:1.2mm solid var(--ok);background:var(--ok-bg)}.report .tile.ok .val{color:var(--ok)}
.report .tile.bad{border-color:var(--bad);border-left:1.2mm solid var(--bad);background:var(--bad-bg)}.report .tile.bad .val{color:var(--bad)}
.report .tile .sub div{margin-top:1mm}
.report dl.kv div.wide{grid-column:1/-1}
.report dl.kv dd.warn{color:var(--warn);font-weight:700}
.report .sub-h{font-size:7pt;letter-spacing:.07em;color:var(--ink-2);font-weight:700;margin:2.5mm 0 .5mm}
.report .checks2{display:grid;grid-template-columns:1fr 1fr;column-gap:6mm}
.report .ci{display:flex;align-items:center;gap:1.8mm;padding:1mm .8mm;border-bottom:1px dotted var(--line)}
.report .ci svg{flex-shrink:0}
.report .ci .t{flex:1}
.report .ci .a{font-size:7.4pt;font-weight:700;white-space:nowrap}
.report .ci.ok .a{color:var(--ok)}.report .ci.bad .a{color:var(--bad)}.report .ci.na .a{color:#8a8989}
.report .ci.bad{background:var(--bad-bg)}
.report .sec-more{margin-top:2mm}
.report td.lbl{background:var(--head-bg);font-weight:600}
.report td.ev.ok{color:var(--ok);font-weight:700}.report td.ev.bad{color:var(--bad);font-weight:700}.report td.ev.warn{color:var(--warn);font-weight:700}.report td.ev.na{color:#8a8989}
.report .note.def{border-left-color:var(--bad);background:#fffafa}
.report .note ul{margin:0;padding-left:4mm}
.report .sign .space{display:flex;align-items:flex-end;padding-bottom:1mm}
.report .sign .space img{max-height:26mm;max-width:100%}
/* ===== Ende Bericht-CSS ===== */
@media print{

<body>

<script>
'use strict';

/* =====================================================================
   Feld-Definition – entspricht dem Blatt "Datenbank_Wartung_VDMA" in "Datenbank_Kältewartung-Service".
   col = exakter Spaltenname im Google Sheet.
   group = Zwischenüberschrift in der App, show = nur anzeigen, wenn …
   Checklisten: i.O. / Mangel / entfällt – wie die Auswahllisten im Sheet.
   ===================================================================== */
const OK3 = ['i.O.', 'Mangel', 'entfällt'];
const ok = (id, col, label, pdf, hint, extra) => Object.assign({id, col, label, pdf, hint, type:'okfail'}, extra || {});
const druck = (id, col, label, pdf, hint) => ({id, col, label, pdf, hint, group:'Messwerte', type:'number', unit:'bar', min:-1, max:150});
const temp = (id, col, label, pdf, hint) => ({id, col, label, pdf, hint, group:'Messwerte', type:'number', unit:'°C', min:-80, max:180});
const kelvin = (id, col, label, pdf, hint) => ({id, col, label, pdf, hint, group:'Messwerte', type:'number', unit:'K', min:-30, max:80});
const medium = (id, col, pdf) => ({id, col, label:'Mediumstemperatur Ein- / Austritt (°C)', pdf, group:'Messwerte', type:'text', ph:'z. B. 22,4 / 34,6'});
// GWP-Werte (AR4, wie in der F-Gase-Verordnung) für das CO₂-Äquivalent
const GWP = {R32:675, R410A:2088, R407C:1774, R404A:3922, R134A:1430, R449A:1397, R448A:1387, R452A:2140, R454B:466, R454C:148,
             R513A:631, R1234YF:4, R1234ZE:7, R290:3, R600A:3, R744:1, R717:0, R22:1810};
const gwpOf = km => GWP[String(km || '').toUpperCase().replace(/[\s\-()]/g, '')];
const HINWEIS = 'Wartung nach VDMA-Einheitsblatt 24186-3 (Leistungsprogramm für die Wartung von kältetechnischen Geräten und Anlagen). '
  + 'Anlagen mit fluorierten Treibhausgasen ab 5 t CO₂-Äquivalent unterliegen der Pflicht zur regelmäßigen Dichtheitskontrolle nach Verordnung (EU) 2024/573. '
  + 'Eine regelmäßige Wartung sichert Betriebssicherheit, Hygiene und einen effizienten Energieverbrauch.';

const TEMPLATE = {
  id: 'klima-wartung', title: 'WARTUNGSPROTOKOLL • KÄLTETECHNISCHE ANLAGEN',
  pages: [
    {title:'Anlagen- & Auftragsdaten', short:'Stammdaten', header:true, fields:[
      {id:'projekt', col:'Projektnummer', label:'Projektnummer', type:'text', hint:'Vorschlag kann überschrieben werden – wird auch der PDF-Dateiname',
        init:() => 'KLW-' + today().replace(/-/g, '') + '-' + uid().slice(0, 4).toUpperCase()},
      {id:'datum', col:'Datum', label:'Datum', type:'date', notFuture:true, init:() => today()},
      {id:'monteur', col:'Monteur', label:'Monteur', type:'text', init:() => settings.techniker},
      {id:'kunde', col:'Kunde / Betreiber', label:'Kunde / Betreiber', type:'text', ph:'z. B. Dr. med. Markus Weber'},
      {id:'anlage', col:'Anlagenbezeichnung', label:'Anlagenbezeichnung', type:'text', ph:'z. B. Split-Klimaanlage Praxis 2. OG'},
      {id:'herst', col:'Hersteller', label:'Hersteller', type:'text', ph:'z. B. Daikin'},
      {id:'sn', col:'Seriennummer (S/N)', label:'Seriennummer (S/N)', type:'text'}
    ]},
    {title:'Verdichter', pdfTitle:'Verdrängungs- und Strömungsmaschinen • Verdichter', short:'Verdichter', kind:'check', fields:[
      ok('vdZust', 'Verdichter Zustand & Sauberkeit', 'Äußerlich auf Verschmutzung, Beschädigung und Korrosion geprüft', 'Zustand & Sauberkeit', '', {group:'Prüfpunkte'}),
      ok('vdRein', 'Verdichter Reinigung erfolgt', 'Funktionserhaltendes Reinigen', 'Funktionserhaltendes Reinigen', '', {group:'Prüfpunkte'}),
      ok('vdBef', 'Verdichter Befestigung & Laufgeräusche', 'Auf Befestigung und Laufgeräusche geprüft', 'Befestigung & Laufgeräusche', '', {group:'Prüfpunkte'}),
      ok('vdKwh', 'Verdichter Kurbelwannenheizung', 'Kurbelwannenheizung auf Funktion geprüft', 'Kurbelwannenheizung', 'Nicht vorhanden → „entfällt“', {group:'Prüfpunkte'}),
      ok('vdDicht', 'Verdichter Dichtheit', 'Kältemittelseitig auf Dichtheit geprüft', 'Dichtheit kältemittelseitig', '', {group:'Prüfpunkte'}),
      ok('vdLauf', 'Verdichter Laufgeräusche / Schwingungen', 'Laufgeräusche / Schwingungen', 'Laufgeräusche / Schwingungen', '', {group:'Prüfpunkte'}),
      druck('vdPs', 'Verdichter Saugdruck (bar)', 'Saugdruck', 'Saugdruck', ''),
      temp('vdTs', 'Verdichter Sauggastemperatur (°C)', 'Sauggastemperatur vor dem Verdichter', 'Sauggastemperatur', ''),
      druck('vdPd', 'Verdichter Verdichtungsdruck (bar)', 'Verdichtungsdruck', 'Verdichtungsdruck', ''),
      temp('vdTd', 'Verdichter Verdichtungsendtemperatur (°C)', 'Verdichtungsendtemperatur am Druckstutzen', 'Verdichtungsendtemperatur', '')
    ]},
    {title:'Verflüssiger', pdfTitle:'Wärmetauscher • Verflüssiger (Luft / Kältemittel)', short:'Verflüssiger', kind:'check', fields:[
      ok('vfZust', 'Verflüssiger Zustand & Sauberkeit', 'Äußerlich auf Verschmutzung, Beschädigung und Korrosion geprüft', 'Zustand & Sauberkeit', '', {group:'Prüfpunkte'}),
      ok('vfRein', 'Verflüssiger Reinigung erfolgt', 'Funktionserhaltendes Reinigen', 'Funktionserhaltendes Reinigen', '', {group:'Prüfpunkte'}),
      ok('vfVent', 'Verflüssiger Ventilator', 'Ventilator auf Befestigung und Funktion geprüft', 'Ventilator', '', {group:'Prüfpunkte'}),
      ok('vfDicht', 'Verflüssiger Dichtheit', 'Kältemittelseitig auf Dichtheit geprüft', 'Dichtheit kältemittelseitig', '', {group:'Prüfpunkte'}),
      ok('vfLam', 'Verflüssiger Lamellenpaket', 'Lamellenpaket frei von Verformungen', 'Lamellenpaket', '', {group:'Prüfpunkte'}),
      temp('vfTc', 'Verflüssiger Verflüssigungstemperatur (°C)', 'Verflüssigungstemperatur', 'Verflüssigungstemperatur', ''),
      kelvin('vfUk', 'Verflüssiger Unterkühlung (K)', 'Unterkühlung am Verflüssigeraustritt', 'Unterkühlung', ''),
      medium('vfMed', 'Verflüssiger Mediumstemperatur Ein/Aus (°C)', 'Mediumstemp. Ein / Aus (°C)')
    ]},
    {title:'Verdampfer', pdfTitle:'Wärmetauscher • Verdampfer (Luft / Kältemittel)', short:'Verdampfer', kind:'check', fields:[
      ok('vaZust', 'Verdampfer Zustand & Sauberkeit', 'Äußerlich auf Verschmutzung, Beschädigung und Korrosion geprüft', 'Zustand & Sauberkeit', '', {group:'Prüfpunkte'}),
      ok('vaRein', 'Verdampfer Reinigung erfolgt', 'Funktionserhaltendes Reinigen', 'Funktionserhaltendes Reinigen', '', {group:'Prüfpunkte'}),
      ok('vaVent', 'Verdampfer Ventilator', 'Ventilator auf Funktion geprüft', 'Ventilator', '', {group:'Prüfpunkte'}),
      ok('vaKlap', 'Verdampfer Klappenregelung', 'Klappenregelung auf Funktion geprüft', 'Klappenregelung', 'Nicht vorhanden → „entfällt“', {group:'Prüfpunkte'}),
      ok('vaKondF', 'Verdampfer Kondensatablauf Funktion', 'Kondensatablauf auf Funktion geprüft', 'Kondensatablauf Funktion', '', {group:'Prüfpunkte'}),
      ok('vaKondR', 'Verdampfer Kondensatablauf Reinigung', 'Kondensatablauf gereinigt', 'Kondensatablauf gereinigt', '', {group:'Prüfpunkte'}),
      ok('vaFilt', 'Verdampfer Filter gereinigt / getauscht', 'Filter gereinigt bzw. getauscht', 'Filter gereinigt / getauscht', '', {group:'Prüfpunkte'}),
      ok('vaDicht', 'Verdampfer Dichtheit', 'Kältemittelseitig auf Dichtheit geprüft', 'Dichtheit kältemittelseitig', '', {group:'Prüfpunkte'}),
      ok('vaHyg', 'Verdampfer Hygienischer Zustand', 'Hygienischer Zustand geprüft', 'Hygienischer Zustand', '', {group:'Prüfpunkte'}),
      druck('vaP', 'Verdampfer Verdampfungsdruck (bar)', 'Verdampfungsdruck', 'Verdampfungsdruck', ''),
      temp('vaT', 'Verdampfer Verdampfungstemperatur (°C)', 'Verdampfungstemperatur am Verdampferaustritt', 'Verdampfungstemperatur', ''),
      kelvin('vaUeh', 'Verdampfer Überhitzung (K)', 'Überhitzung', 'Überhitzung', ''),
      medium('vaMed', 'Verdampfer Mediumstemperatur Ein/Aus (°C)', 'Mediumstemp. Ein / Aus (°C)')
    ]},
    {title:'Anlagenteile & Dokumentation', pdfTitle:'Anlagenteile im Kältekreislauf & Dokumentation', short:'Anlagenteile', kind:'check', fields:[
      ok('rohr', 'Rohrleitungen Zustand, Isolierung & Befestigung', 'Rohrleitungen: Zustand, Isolierung & Befestigung', 'Rohrleitungen: Zustand, Isolierung & Befestigung', ''),
      ok('arm', 'Armaturen & Kompensatoren Dichtheit', 'Armaturen & Kompensatoren auf Dichtheit geprüft', 'Armaturen & Kompensatoren dicht', ''),
      ok('mess', 'Mess- & Anzeigegeräte Funktion', 'Mess- und Anzeigegeräte: Zustand & Funktion', 'Mess- & Anzeigegeräte', ''),
      ok('doku', 'Dokumentation & Typenschilder', 'Dokumentation & Typenschilder auf Vollständigkeit geprüft', 'Dokumentation & Typenschilder', '')
    ]},
    {title:'Zusatzmessungen & Anlagenbetrieb', short:'Zusatz', fields:[
      {id:'km', col:'Kältemitteltyp', label:'Kältemitteltyp', type:'text', group:'Kältemittel', ph:'z. B. R32'},
      {id:'fm', col:'Kältemittel-Füllmenge (kg)', label:'Gesamtfüllmenge', pdf:'Füllmenge', type:'number', unit:'kg', min:0, max:5000, group:'Kältemittel', ph:'z. B. 2,05'},
      {id:'co2', col:'CO₂-Äquivalent (t)', label:'CO₂-Äquivalent', type:'calc', unit:'t CO₂e', group:'Kältemittel',
        calc:v => isN(v.fm) && gwpOf(v.km) != null ? round(num(v.fm) * gwpOf(v.km) / 1000, 3) : '',
        note:v => v.km && gwpOf(v.km) == null ? 'GWP für dieses Kältemittel unbekannt' : isN(v.co2) ? (v.co2 >= 5 ? 'ab 5 t: Dichtheitskontrolle Pflicht' : 'unter 5 t: keine Prüfpflicht') : 'Füllmenge × GWP'},
      {id:'strom', col:'Stromaufnahme Verdichter (A)', label:'Stromaufnahme Verdichter (A)', pdf:'Stromaufnahme Verdichter', type:'text', group:'Elektrik', ph:'z. B. 4,8 oder L1 4,8 / L2 4,7 / L3 4,9'},
      ok('elek', 'Elektrische Anschlüsse & Schutzleiter', 'Elektrische Anschlüsse & Schutzleiter', 'Elektr. Anschlüsse & Schutzleiter', '', {group:'Elektrik'}),
      ok('fgas', 'Dichtheitsprüfung EU-F-Gase-VO', 'Dichtheitsprüfung gem. EU-F-Gase-VO', 'Dichtheitsprüfung F-Gase-VO', 'Nicht prüfpflichtig → „entfällt“', {group:'Prüfungen'}),
      ok('vdi', 'Hygieneinspektion (VDI 6022)', 'Hygieneinspektion (VDI 6022)', 'Hygieneinspektion (VDI 6022)', '', {group:'Prüfungen'}),
      ok('kpump', 'Kondensatförderpumpe & Ablauf', 'Kondensatförderpumpe & Ablauf', 'Kondensatförderpumpe & Ablauf', 'Keine Pumpe vorhanden → „entfällt“', {group:'Prüfungen'})
    ]},
    {title:'Abschlussbeurteilung & Abnahme', short:'Abschluss', final:true, fields:[
      ok('ftest', 'Funktionstest Gesamtanlage', 'Gesamtanlage auf korrekte Funktion im Betriebszyklus geprüft', 'Funktionstest Gesamtanlage', ''),
      {id:'erg', col:'Wartungsstatus Gesamtergebnis', label:'Wartungsstatus Gesamtergebnis', type:'select', opts:['i.O.', 'Mangel'], good:['i.O.'], bad:['Mangel']},
      {id:'next', col:'Nächste Wartung fällig', label:'Nächste Wartung fällig', type:'text', ph:'z. B. Oktober 2027'},
      {id:'bem', col:'Festgestellte Mängel & Bemerkungen', label:'Festgestellte Mängel & Bemerkungen', type:'longtext', wide:true, hint:'Mängel, Nacharbeiten, ersetzte Teile, Hinweise für den Betreiber'}
    ]}
  ]
};
const ALL_FIELDS = TEMPLATE.pages.flatMap(pg => pg.fields);
const FIELD = Object.fromEntries(ALL_FIELDS.map(f => [f.id, f]));
// Auffälligkeiten: Bauteil voranstellen (Dichtheit gibt es bei Verdichter, Verflüssiger und Verdampfer)
const CHECK_PAGE = Object.fromEntries(TEMPLATE.pages.filter(pg => pg.kind === 'check').flatMap(pg => pg.fields.map(f => [f.id, pg.short])));

/* ---------- Speicher ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ toast('Speichern fehlgeschlagen – Speicher voll? Übertragene Protokolle löschen.'); return false; } }
};
let settings  = Object.assign({url:'', token:'', firma:'', techniker:''}, LS.get('klw.settings', {}));
let protocols = LS.get('klw.protocols', []);
let dbCache   = LS.get('klw.db', {at:null, list:[]});
const save = () => LS.set('klw.protocols', protocols);

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); }
function today(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function fmtDate(s){ if(!s) return ''; const d = new Date(String(s).length === 10 ? s + 'T12:00:00' : s); return isNaN(d) ? String(s) : d.toLocaleDateString('de-DE'); }
function fmtDateTime(s){ if(!s) return ''; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleString('de-DE', {dateStyle:'short', timeStyle:'short'}); }
function num(v){ return typeof v === 'number' ? v : Number(String(v).trim().replace(',', '.')); }
function isN(v){ return v !== '' && v != null && !isNaN(num(v)); }
function round(n, d){ const f = Math.pow(10, d); return Math.round(n * f) / f; }
function fmtNum(n){ return String(n).replace('.', ','); }
function safeImg(src){ return typeof src === 'string' && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(src) ? src : ''; }
const isVis = (f, v) => !f.show || f.show(v);
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3500); }

/* ---------- Werte, Prüfung, Bewertung ---------- */
function recompute(p){ ALL_FIELDS.forEach(f => { if(f.type === 'calc') p.values[f.id] = f.calc(p.values); }); }
function display(f, x){
  if(x === '' || x == null) return '';
  if(f.type === 'date') return fmtDate(x);
  if((f.type === 'number' || f.type === 'calc') && isN(x)) return fmtNum(String(x).trim()) + (f.unit ? ' ' + f.unit : '');
  return String(x);
}
function sollText(f){
  const u = f.unit ? ' ' + f.unit : '';
  if(f.sRanges) return 'Soll ' + f.sRanges.map(r => `${fmtNum(r[0])} – ${fmtNum(r[1])}`).join(' oder ') + u;
  if(f.sMin != null && f.sMax != null) return `Soll ${fmtNum(f.sMin)} – ${fmtNum(f.sMax)}${u}`;
  if(f.sMax != null) return `Soll ≤ ${fmtNum(f.sMax)}${u}`;
  if(f.sMin != null) return `Soll ≥ ${fmtNum(f.sMin)}${u}`;
  return '';
}
function evalField(f, v){
  const x = v[f.id];
  if(f.type === 'okfail') return x === 'i.O.' ? 'ok' : x === 'Mangel' || x === 'n.i.O.' ? 'bad' : x === 'entfällt' ? 'na' : 'none';
  if(f.bad && f.bad.includes(x)) return 'bad';
  if(f.good && f.good.includes(x)) return 'ok';
  if(f.type === 'number' && isN(x) && f.sRanges) return f.sRanges.some(r => num(x) >= r[0] && num(x) <= r[1]) ? 'ok' : 'warn';
  if(f.type === 'number' && isN(x) && (f.sMin != null || f.sMax != null)){
    const n = num(x);
    return (f.sMin != null && n < f.sMin) || (f.sMax != null && n > f.sMax) ? 'warn' : 'ok';
  }
  return 'none';
}
function defects(p){
  return ALL_FIELDS.filter(f => f.type !== 'calc' && isVis(f, p.values) && ['bad', 'warn'].includes(evalField(f, p.values)))
    .map(f => `${CHECK_PAGE[f.id] ? CHECK_PAGE[f.id] + ' – ' : ''}${f.pdf || f.label}: ${display(f, p.values[f.id])}` + (evalField(f, p.values) === 'warn' ? ` (${sollText(f)})` : ''));
}
const PFLICHTFELDER = false;   // true = Pflichtfelder (req/reqIf) und Monteur-Unterschrift werden wieder erzwungen
function isRequired(f, p){ return PFLICHTFELDER && (!!f.req || (f.reqIf ? f.reqIf(p.values, p) : false)); }
function fieldError(f, p){
  if(f.type === 'calc' || !isVis(f, p.values)) return '';
  const x = p.values[f.id], empty = String(x ?? '').trim() === '';
  if(empty) return isRequired(f, p) ? (f.reqMsg || 'Pflichtfeld') : '';
  if(f.type === 'number'){
    if(!isN(x)) return 'Bitte eine gültige Zahl eingeben.';
    const n = num(x);
    if((f.min != null && n < f.min) || (f.max != null && n > f.max)) return `Unplausibler Wert (erlaubt ${fmtNum(f.min)} – ${fmtNum(f.max)} ${f.unit || ''})`;
  }
  if(f.type === 'date' && f.notFuture && x > today()) return 'Datum liegt in der Zukunft.';
  return '';
}
function pageErrors(p, i){ return TEMPLATE.pages[i].fields.map(f => [f, fieldError(f, p)]).filter(e => e[1]); }
function pageDone(p, i){
  const fs = TEMPLATE.pages[i].fields.filter(f => f.type !== 'calc' && isVis(f, p.values));
  return fs.every(f => !fieldError(f, p)) && fs.some(f => String(p.values[f.id] ?? '') !== '');
}

/* Bericht-Datenstruktur – identisch genutzt von App-PDF und Apps-Script-PDF */
function buildReport(p){
  const v = p.values;
  const row = f => ({label:f.pdf || f.label, value:display(f, v[f.id]), eval:evalField(f, v), wide:!!f.wide});
  const rowsOf = fs => fs.filter(f => isVis(f, v) && !(f.wide && !v[f.id])).map(row);
  const section = pg => {
    const inTab = new Set(pg.table ? pg.table.rows.flatMap(r => r.ids) : []);
    const rest = pg.fields.filter(f => !inTab.has(f.id));
    const body = pg.table ? pg.table.rows
      .filter(r => (!r.show || r.show(v)) && r.ids.some(id => String(v[id] ?? '') !== ''))
      .map(r => ({label:r.label, cells:r.ids.map(id => ({value:display(FIELD[id], v[id]), eval:evalField(FIELD[id], v)}))})) : [];
    return {title:pg.pdfTitle || pg.title, kind:pg.kind || 'grid',
      table: body.length ? {head:pg.table.head, body} : null,
      rows: rowsOf(rest.filter(f => f.type !== 'okfail')), checks: rowsOf(rest.filter(f => f.type === 'okfail'))};
  };
  return {
    title: TEMPLATE.title, firma: settings.firma || '',
    header: rowsOf(TEMPLATE.pages[0].fields),
    sections: TEMPLATE.pages.filter(pg => !pg.header && !pg.final).map(section),
    defects: defects(p), resultLabel: 'Gesamtergebnis Wartung', success: v.erg || '',
    subline: [v.ftest && 'Funktionstest: ' + v.ftest, v.next && 'Nächste Wartung: ' + v.next].filter(Boolean).join(' · '),
    hinweis: HINWEIS, remark: v.bem || '', remarkLabel: 'Festgestellte Mängel & Bemerkungen',
    techniker: v.monteur || '', kundeName: p.kundeName || '', id: v.projekt || p.id, completedAt: p.completedAt || ''
  };
}
/* Spaltenwerte fürs Google Sheet (ausgeblendete Innengeräte werden geleert) */
function buildCols(p){
  return ALL_FIELDS.filter(f => f.col).map(f => {
    const x = isVis(f, p.values) ? p.values[f.id] : '';
    if(x === '' || x == null) return [f.col, '', ''];
    if(f.type === 'date') return [f.col, x, 'date'];
    if((f.type === 'number' || f.type === 'calc') && isN(x)) return [f.col, num(x), ''];
    return [f.col, String(x), ''];
  });
}

/* ---------- Navigation ---------- */
let view = {name:'home'};
function go(name, params){ view = Object.assign({name}, params || {}); render(); window.scrollTo(0, 0); }
function cur(){ return protocols.find(p => p.id === view.id); }
function render(){
  app.innerHTML = (Views[view.name] || Views.home)();
  if(view.name === 'report') showReport();
  if(After[view.name]) After[view.name]();
  updateNet();
}
/* Bericht seitenweise (A4) anzeigen – auf schmalen Bildschirmen verkleinert */
async function showReport(){
  const host = $('#sheet'), r = reportForView();
  if(!host || !r) return;
  await reportFontsReady();
  if(!host.isConnected) return;
  layoutReport(r, host);
  host.style.zoom = Math.min(1, (host.parentElement.clientWidth - 8) / host.querySelector('.page').offsetWidth);
}
function updateNet(){
  const n = protocols.filter(p => p.status === 'done' && !p.synced).length;
  const el = $('#net');
  el.className = 'net' + (navigator.onLine ? '' : ' off');
  el.textContent = (navigator.onLine ? 'online' : 'offline') + (n ? ` · ${n} ausstehend` : '');
}

/* ---------- Ansichten ---------- */
const Views = {
  home(){
    const drafts = protocols.filter(p => p.status === 'draft');
    const done = protocols.filter(p => p.status === 'done').sort((a, b) => String(b.completedAt).localeCompare(String(a.completedAt)));
    const pending = done.filter(p => !p.synced).length;
    return `
      <div class="row">
        <button class="btn primary" data-act="new">+ Neue Wartung</button>
        <button class="btn" data-act="sync">Synchronisieren${pending ? ` (${pending})` : ''}</button>
        <button class="btn" data-act="db">Datenbank / PDF</button>
        <button class="btn" data-act="settings">Einstellungen</button>
      </div>
      ${!settings.url ? '<div class="warnbox">Noch keine Verbindung zum Google Sheet eingerichtet. Protokolle werden lokal gespeichert, bis du unter <b>Einstellungen</b> die Web-App-URL einträgst.</div>' : ''}
      <h2>Offene Wartungen</h2>
      ${drafts.length ? drafts.map(protoCard).join('') : '<p class="muted">Keine offenen Wartungen.</p>'}
      <h2>Abgeschlossen</h2>
      ${done.length ? done.map(protoCard).join('') : '<p class="muted">Noch keine abgeschlossenen Wartungen.</p>'}`;
  },

  wizard(){
    const p = cur();
    if(!p) return '<p>Protokoll nicht gefunden.</p>';
    const pages = TEMPLATE.pages, i = p.page, pg = pages[i], n = pages.length;

    return `
      <div class="row between"><span class="muted">Schritt ${i + 1} von ${n} · ${esc(p.values.projekt || '')}</span><button class="btn small" data-act="home">Pause</button></div>

      <div class="err" id="pageerr"></div>
      <div class="navbar">
        <button class="btn" data-act="prev" ${i === 0 ? 'disabled' : ''}>← Zurück</button>
        ${pg.final ? '<button class="btn primary" data-act="finish">Abschließen ✓</button>' : `<button class="btn primary" data-act="next">Weiter →</button>`}
      </div>
      <div class="chips">${pages.map((x, k) => `<button class="chip ${pageDone(p, k) && !x.final ? 'done' : ''} ${k === i ? 'cur' : ''}" data-act="jump" data-i="${k}">${k + 1} ${esc(x.short)}</button>`).join('')}</div>`;
  },

  report(){
    const r = reportForView();
    if(!r) return '<p>Protokoll nicht gefunden.</p>';
    const p = !view.db && protocols.find(x => x.id === view.id);
    return `
      <div class="row noprint" style="margin-bottom:12px">
        <button class="btn" data-act="${view.db ? 'db' : 'home'}">← Zurück</button>
        <button class="btn primary" data-act="makepdf">PDF erstellen</button>
        <span id="pdfbar" class="row">${pdfBarHtml()}</span>
        ${!isStandalone() ? '<button class="btn" data-act="print">Drucken</button>' : ''}
        ${view.db && settings.url ? `<button class="btn" data-act="drivepdf">PDF in Google Drive ablegen</button>` : ''}
        ${p && !p.synced ? '<span class="badge warn">noch nicht im Google Sheet</span>' : ''}
      </div>
      <p class="muted noprint" style="font-size:14px">„PDF erstellen“ → „Teilen / Drucken“ → im Menü <b>Drucken</b>, <b>In Dateien sichern</b>, Mail oder AirDrop wählen. Funktioniert auch offline.</p>
      <div class="sheetwrap"><div id="sheet" class="report"></div></div>`;
  },

  db(){
    return `
      <div class="row">
        <button class="btn" data-act="home">← Zurück</button>
        <button class="btn primary" data-act="dbload">Aus Google Sheet laden</button>
      </div>
      <p class="muted">${dbCache.at ? `Stand ${fmtDateTime(dbCache.at)} · ${dbCache.list.length} Einträge. Zum Öffnen eines Protokolls wird Internet benötigt.` : 'Noch nicht geladen.'}</p>
      <input id="dbsearch" type="search" placeholder="Suchen: Projektnummer, Kunde, Anlage, Monteur, Datum …" value="${esc(view.q || '')}">
      <div id="dblist">${dbList()}</div>`;
  },

  settings(){
    return `
      <div class="row"><button class="btn" data-act="home">← Zurück</button></div>
      <h2>Google-Sheet-Verbindung</h2>
      <div class="card">
        <label>Web-App-URL (aus Apps Script → Bereitstellen)</label>
        <input id="s_url" value="${esc(settings.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off">
        <label style="margin-top:14px">Token (muss mit TOKEN im Apps Script übereinstimmen)</label>
        <input id="s_token" value="${esc(settings.token)}" autocapitalize="off" autocorrect="off">
      </div>
      <h2>Allgemein</h2>
      <div class="card">
        <label>Firmenkopf im PDF (mehrzeilig möglich)</label><textarea id="s_firma" style="min-height:110px" placeholder="z. B. Firmenname&#10;Straße&#10;PLZ Ort · Telefon">${esc(settings.firma)}</textarea>
        <label style="margin-top:14px">Monteur (Vorbelegung)</label><input id="s_tech" value="${esc(settings.techniker)}" placeholder="z. B. C.Geuther">
      </div>
      <div class="row"><button class="btn primary" data-act="savesettings">Speichern</button><button class="btn" data-act="ping">Speichern &amp; Verbindung testen</button></div>
      <h2>Datensicherung</h2>
      <div class="card">
        <p class="muted" style="margin-top:0">Sichert alle Protokolle der App als JSON-Datei.</p>
        <div class="row">
          <button class="btn" data-act="backup">Backup exportieren</button>
          <label class="btn" style="margin:0;font-size:17px">Backup importieren<input type="file" id="s_import" accept=".json,application/json" hidden></label>
        </div>
      </div>`;
  }
};

function protoCard(p){
  const v = p.values;
  let badges;
  if(p.status === 'draft'){
    badges = `<span class="badge warn">Schritt ${p.page + 1}/${TEMPLATE.pages.length}</span>`;
  } else {
    badges = `${v.erg ? `<span class="badge ${v.erg === 'i.O.' ? 'ok' : 'bad'}">Gesamtergebnis: ${esc(v.erg)}</span> ` : ''}<span class="badge ${p.synced ? 'ok' : 'warn'}">${p.synced ? 'im Sheet' : 'nicht übertragen'}</span>`;
  }
  return `
    <div class="card">
      <div class="row between">
        <div><b>${esc(v.projekt || 'Ohne Projekt-Nr.')}</b>${v.kunde ? ' · ' + esc(v.kunde) : ''}<br>
          <span class="muted">${esc(fmtDate(v.datum))}${v.anlage ? ' · ' + esc(v.anlage) : ''}${v.monteur ? ' · ' + esc(v.monteur) : ''}</span></div>
        <div>${badges}</div>
      </div>
      <div class="row" style="margin-top:10px">
        ${p.status === 'draft'
          ? `<button class="btn small primary" data-act="resume" data-id="${p.id}">Fortsetzen</button>`
          : `<button class="btn small primary" data-act="report" data-id="${p.id}">Bericht / PDF</button><button class="btn small" data-act="reopen" data-id="${p.id}">Bearbeiten</button>`}
        <button class="btn small danger" data-act="del" data-id="${p.id}">Löschen</button>
      </div>
    </div>`;
}

/* Felder einer Seite mit Zwischenüberschriften (group) */
function fieldsHtml(pg, p){
  let g = null;
  return pg.fields.filter(f => isVis(f, p.values)).map(f => {
    let h = '';
    if(f.group && f.group !== g){ g = f.group; h = `<div class="ghead">${esc(g)}</div>`; }
    return h + fieldHtml(f, p);
  }).join('');
}

function fieldHtml(f, p){
  const v = p.values, x = v[f.id] ?? '';
  const err = view.tried ? fieldError(f, p) : '';
  const req = isRequired(f, p) && f.type !== 'calc' ? ' *' : '';
  const lab = `<label for="in-${f.id}">${esc(f.label)}${req}</label>${f.hint ? `<div class="fhint">${esc(f.hint)}</div>` : ''}`;
  const errHtml = err ? `<div class="ferr">${esc(err)}</div>` : '';
  const seg = (vals, cls) => `<div class="seg">${vals.map((o, k) => `<button class="btn ${cls[k]} ${x === o ? 'sel' : ''}" data-act="set" data-f="${f.id}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  let body;
  switch(f.type){
    case 'okfail': return `<div class="field ${err ? 'err' : ''}"><div class="frow"><div>${lab}</div>${seg(OK3, ['ok', 'bad', 'na'])}</div>${errHtml}</div>`;
    case 'yesno': {
      const cls = ['Ja', 'Nein'].map(o => f.good && f.good.includes(o) ? 'ok' : f.bad && f.bad.includes(o) ? 'bad' : 'neutral');
      return `<div class="field ${err ? 'err' : ''}"><div class="frow"><div>${lab}</div>${seg(['Ja', 'Nein'], cls)}</div>${errHtml}</div>`;
    }
    case 'select': {
      const custom = f.other && x && !f.opts.includes(x);
      body = `<div class="opts">${f.opts.map(o => `<button class="btn ${x === o ? 'sel' : ''}" data-act="set" data-f="${f.id}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
        ${f.other ? `<input id="in-${f.id}" data-f="${f.id}" data-other="1" placeholder="oder anderer Wert …" value="${custom ? esc(x) : ''}" autocomplete="off">` : ''}`;
      break;
    }
    case 'number':
      body = `<div class="inunit"><input id="in-${f.id}" data-f="${f.id}" inputmode="decimal" autocomplete="off" value="${esc(x)}" placeholder="${esc(f.ph || '')}"><span class="unit">${esc(f.unit || '')}</span></div>
        <div class="soll" id="soll-${f.id}">${sollHtml(f, v)}</div>`;
      break;
    case 'date':     body = `<input id="in-${f.id}" type="date" data-f="${f.id}" value="${esc(x)}" style="max-width:260px">`; break;
    case 'longtext': body = `<textarea id="in-${f.id}" data-f="${f.id}" placeholder="${esc(f.ph || '')}">${esc(x)}</textarea>`; break;
    case 'calc':     body = `<span class="calc" id="calc-${f.id}">${esc(display(f, x) || '—')}</span><span class="calcnote" id="note-${f.id}">${f.note ? esc(f.note(v)) : 'wird berechnet'}</span>`; break;
    default:         body = `<input id="in-${f.id}" data-f="${f.id}" value="${esc(x)}" placeholder="${esc(f.ph || '')}" autocomplete="off">`;
  }
  return `<div class="field ${err ? 'err' : ''}">${lab}${body}${errHtml}</div>`;
}
function sollHtml(f, v){
  const s = sollText(f), ev = evalField(f, v);
  if(ev === 'warn') return `<span class="badge warn">außerhalb Sollbereich</span> <span class="muted">${esc(s)}</span>`;
  if(ev === 'ok') return `<span class="badge ok">im Sollbereich</span> <span class="muted">${esc(s)}</span>`;
  return s ? `<span class="muted">${esc(s)}</span>` : '';
}

function finalHtml(p){
  const d = defects(p);
  const missing = TEMPLATE.pages.slice(0, -1).map((pg, k) => [k, pageErrors(p, k)]).filter(x => x[1].length);
  return `
    ${missing.length ? `<div class="warnbox"><b>Bitte prüfen:</b><ul style="margin:6px 0 0">${missing.map(([k, errs]) =>
      `<li><a class="jump" data-act="jump" data-i="${k}">${esc(TEMPLATE.pages[k].title)}</a>: ${errs.map(e => esc(e[0].pdf || e[0].label)).join(', ')}</li>`).join('')}</ul></div>` : ''}
    <div class="card"><b>Auffälligkeiten:</b> ${d.length ? `<span class="badge bad">${d.length}</span><ul>${d.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<span class="badge ok">keine</span>'}</div>
    <div class="card">
      <div class="grid2">
        <div>
          <label>Unterschrift Monteur${PFLICHTFELDER ? ' *' : ''}${p.values.monteur ? ' (' + esc(p.values.monteur) + ')' : ''}</label>
          <div class="sigwrap"><canvas class="sig" data-sig="tech"></canvas></div>
          <button class="btn small" data-act="sigclear" data-sig="tech">Unterschrift löschen</button>
        </div>
        <div>
          <label>Unterschrift Kunde (optional)</label>
          <div class="sigwrap"><canvas class="sig" data-sig="kunde"></canvas></div>
          <input data-kname="1" placeholder="Name des Kunden" value="${esc(p.kundeName || '')}" style="margin-bottom:8px">
          <button class="btn small" data-act="sigclear" data-sig="kunde">Unterschrift löschen</button>
        </div>
      </div>
    </div>`;
}

/* ===== identisch in google-apps-script/PdfDialog.html ===== */
/* Ausdruck im Muther-Design: A4-Seiten mit Kacheln, Checklisten, Seitenumbruch („Fortsetzung“) und Fußzeile „Seite x von y“.
   Nimmt die Bericht-Datenstruktur von buildReport() (App) bzw. rowToReport_() (Apps Script) unverändert entgegen. */
const RICON = {
  ok:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.2" fill="currentColor"/><path d="M4.8 8.3l2.1 2.1 4.3-4.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bad:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.2" fill="currentColor"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>',
  na:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.3 8h5.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'
};
function reportParts(r){
  const nl = s => esc(s).replace(/\n/g, '<br>');
  // Großbuchstaben im Text statt per CSS: html2canvas stürzt sonst bei „ß“ ab (wird zu „SS“, Text wird länger)
  const up = s => esc(String(s ?? '').toUpperCase());
  // Symbole mit fester Farbe und Größe – html2canvas übernimmt „currentColor“ nicht zuverlässig
  const COL = {ok:'#1e7a46', bad:'#b42318', na:'#8a8989'};
  const icon = (k, px) => RICON[k].replace('<svg ', `<svg width="${px}" height="${px}" `).replace(/currentColor/g, COL[k]);
  const pill = (k, text) => `<span class="pill ${k}">${icon(k, 10)}${esc(text)}</span>`;
  const CHECKV = ['i.O.', 'Mangel', 'n.i.O.', 'entfällt'];
  const isCheck = x => ['ok', 'bad', 'na'].includes(x.eval) || CHECKV.includes(x.value);
  const evalOf = x => x.eval && x.eval !== 'none' ? x.eval : x.value === 'i.O.' ? 'ok' : x.value === 'Mangel' || x.value === 'n.i.O.' ? 'bad' : x.value === 'entfällt' ? 'na' : '';
  const firmLines = String(r.firma || (typeof settings !== 'undefined' ? settings.firma : '') || '').split('\n').map(s => s.trim()).filter(Boolean);
  // „WARTUNGSPROTOKOLL • KÄLTETECHNISCHE ANLAGEN“ → Kopfzeile „WARTUNGSPROTOKOLL“, Titel „Kältetechnische Anlagen“
  const tp = String(r.title || '').split(' • ');
  const nice = s => s.split(' ').map(w => w.split('-').map(x => x.length >= 5 && x === x.toUpperCase() ? x[0] + x.slice(1).toLowerCase() : x).join('-')).join(' ');
  const kicker = tp.length > 1 ? tp[0] : '', h1 = nice(tp.length > 1 ? tp.slice(1).join(' • ') : tp[0]);
  const header = r.header || [];
  // erstes Kopffeld, dessen Beschriftung passt (Nummern-Felder wie „Kundennummer“ ausgenommen)
  const hv = re => (header.find(x => re.test(x.label) && !/nummer|nr\.?$/i.test(x.label) && x.value) || {}).value || '';
  const datum = hv(/datum/i);
  const stand = datum || (r.completedAt ? new Date(r.completedAt).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'}) : '');
  let n = 0;
  const h2 = title => `<h2><span class="no">${++n}</span><span class="tt">${esc(title)}</span></h2>`;
  const kv = rows => rows.length ? `<dl class="kv">${rows.map(x => `<div${x.wide ? ' class="wide"' : ''}><dt>${up(x.label)}</dt><dd class="${x.value ? '' : 'empty'} ${x.eval === 'warn' ? 'warn' : ''}">${x.value ? nl(x.value) : '—'}</dd></div>`).join('')}</dl>` : '';
  const checks = rows => rows.length ? `<div class="checks2">${rows.map(x => { const k = evalOf(x) || 'na';
    return `<div class="ci ${k}">${icon(k, 12)}<span class="t">${esc(x.label)}</span><span class="a">${esc(x.value || '—')}</span></div>`; }).join('')}</div>` : '';
  const blocks = [];

  // Kacheln: Ergebnis · Auffälligkeiten · Nächste Wartung (bzw. Datum)
  const res = String(r.success || ''), good = res === 'Ja' || res === 'i.O.', bad = !!res && !good;
  const subs = String(r.subline || (r.betrieb ? 'Betriebszustand: ' + r.betrieb : '')).split(' · ').filter(Boolean);
  const next = subs.find(s => /^Nächste Wartung:/.test(s)), other = subs.filter(s => s !== next);
  const defects = r.defects || [];
  blocks.push({html:`<div class="status">
    <div class="tile ${good ? 'ok' : bad ? 'bad' : ''}"><div class="lab">${up(r.resultLabel || 'Wartung erfolgreich')}</div><div class="val">${esc(res || '—')}</div>
      <div class="sub">${good ? pill('ok', 'in Ordnung') : bad ? pill('bad', 'nicht in Ordnung') : ''}${other.length ? `<div>${esc(other.join(' · '))}</div>` : ''}</div></div>
    <div class="tile"><div class="lab">${up('Auffälligkeiten')}</div><div class="val">${defects.length}</div><div class="sub">${esc(defects.length ? defects[0] + (defects.length > 1 ? ` (+${defects.length - 1} weitere)` : '') : 'keine')}</div></div>
    <div class="tile primary">${next
      ? `<div class="lab">${up('Nächste Wartung')}</div><div class="val">${esc(next.replace(/^Nächste Wartung:\s*/, ''))}</div><div class="sub">${esc(r.techniker ? 'Monteur: ' + r.techniker : '')}</div>`
      : `<div class="lab">${up('Datum')}</div><div class="val">${esc(datum || '—')}</div><div class="sub">${esc(r.techniker ? 'Monteur: ' + r.techniker : '')}</div>`}</div>
  </div>`});

  // Auftrags- und Anlagendaten
  if(header.length) blocks.push({html:`<div class="sec">${h2('Auftrags- & Anlagendaten')}${kv(header)}</div>`});

  // Abschnitte: Prüfpunkte als Checkliste, Messwerte als Feldliste, Tabellen umbrechbar
  (r.sections || []).forEach(s => {
    const all = (s.checks || []).concat(s.rows || []);
    const ck = all.filter(isCheck), fl = all.filter(x => !isCheck(x));
    const body = checks(ck) + (fl.length ? (ck.length ? `<div class="sub-h">${up('Messwerte & Angaben')}</div>` : '') + kv(fl) : '');
    if(s.table && s.table.body && s.table.body.length){
      const t = s.table;
      blocks.push({split:true, html:`<div class="sec">${h2(s.title)}<table><thead><tr>${t.head.map((h, i) => `<th${i ? '' : ' style="width:26%"'}>${up(h)}</th>`).join('')}</tr></thead><tbody>${t.body.map(b =>
        `<tr><td class="lbl">${esc(b.label)}</td>${b.cells.map(c => `<td class="ev ${c.eval && c.eval !== 'none' ? c.eval : ''}">${esc(c.value || '—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`});
      if(body) blocks.push({html:`<div class="sec-more">${body}</div>`});
    } else {
      blocks.push({html:`<div class="sec">${h2(s.title)}${body || '<div class="none">Keine Angaben</div>'}</div>`});
    }
  });

  if(defects.length) blocks.push({html:`<div class="note def"><b>${up('Auffälligkeiten')}</b><ul>${defects.map(d => `<li>${esc(d)}</li>`).join('')}</ul></div>`});
  blocks.push({html:`<div class="note"><b>${up(r.remarkLabel || 'Bemerkungen / Mängel')}</b>${r.remark ? nl(r.remark) : '—'}</div>`});
  if(r.hinweis) blocks.push({html:`<div class="legal"><p><b>Betreiberhinweis.</b> ${esc(r.hinweis)}</p></div>`});
  const sig = r.sig || {}, img = s => typeof s === 'string' && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(s) ? `<img src="${s}" alt="">` : '';
  blocks.push({html:`<div class="sign">
    <div><b>${up('Monteur / Prüfer')}</b><span class="space">${img(sig.tech)}</span><span class="cap">${esc([r.techniker, stand].filter(Boolean).join(' · ') || 'Name, Datum')}</span></div>
    <div><b>${up('Kunde / Betreiber')}</b><span class="space">${img(sig.kunde)}</span><span class="cap">${esc(r.kundeName || 'Name')}</span></div></div>`});

  const firm1 = firmLines[0] ? `<b>${esc(firmLines[0])}</b>` : '';
  const kunde = hv(/kunde|betreiber/i), anlage = hv(/anlage|modell/i);
  return {
    blocks,
    head:`<div class="head"><div class="firm">${firm1}${firmLines.slice(1).map(s => `<span>${esc(s)}</span>`).join('')}</div>
      <div class="doc">${kicker ? `<div class="kicker">${up(kicker)}</div>` : ''}<h1>${esc(h1)}</h1><div class="meta">Projekt-Nr. <b>${esc(r.id)}</b>${datum ? ` · <b>${esc(datum)}</b>` : ''}</div></div></div>`,
    smallHead:`<div class="head small"><div class="firm">${firm1}<span>${esc([kunde, anlage].filter(Boolean).join(' · '))}</span></div>
      <div class="doc"><h1>${esc(kicker ? nice(kicker) : h1)}</h1><div class="meta">Projekt-Nr. <b>${esc(r.id)}</b></div></div></div>`,
    foot:esc((kicker ? nice(kicker) + ' ' : '') + h1) + (stand ? ' · ' + esc(stand) : ''), id:esc(r.id)
  };
}
/* Verteilt die Blöcke auf A4-Seiten. host muss im Dokument hängen (Messung der Höhen). */
function layoutReport(r, host){
  const b = reportParts(r), pages = [];
  let body;
  const el = html => { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; };
  const newPage = () => {
    const pg = el(`<section class="page"><div class="page-body">${pages.length ? b.smallHead : b.head}</div><div class="pfoot"><span>${b.foot}</span><span class="pno"></span></div></section>`);
    host.appendChild(pg); pages.push(pg); body = pg.firstElementChild;
  };
  const fits = () => body.scrollHeight <= body.clientHeight + 1;
  host.innerHTML = '';
  newPage();
  b.blocks.forEach(blk => {
    const node = el(blk.html);
    body.appendChild(node);
    if(fits()) return;
    node.remove();
    if(!blk.split){ newPage(); body.appendChild(node); return; }
    // Tabelle zeilenweise verteilen; auf der Folgeseite Überschrift „(Fortsetzung)“ und Tabellenkopf wiederholen
    const rows = [...node.querySelectorAll('tbody > tr')];
    const shell = cont => { const s = node.cloneNode(true); s.querySelector('tbody').innerHTML = ''; if(cont) s.querySelector('.tt').textContent += ' (Fortsetzung)'; return s; };
    let part = shell(false), placed = 0;
    body.appendChild(part);
    rows.forEach(tr => {
      part.querySelector('tbody').appendChild(tr);
      if(fits()){ placed++; return; }
      tr.remove();
      if(!placed) part.remove();
      const cont = placed > 0;
      newPage(); part = shell(cont); body.appendChild(part);
      part.querySelector('tbody').appendChild(tr); placed = 1;
    });
  });
  pages.forEach((p, i) => { p.querySelector('.pno').innerHTML = `${b.id} · Seite ${i + 1} von ${pages.length}`; });
  return pages;
}

async function reportPdfBlob(r){

  box.className = 'report flat';
  box.style.cssText = 'position:fixed;left:-10000px;top:0;width:220mm;background:#fff';

    const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
    for(let i = 0; i < pages.length; i++){
      const canvas = await html2canvas(pages[i], {scale:2, backgroundColor:'#ffffff', logging:false});
      if(i) pdf.addPage();

  } finally {

  }

async function pdfBase64(p){

    return String(dataUrl).split(',')[1] || '';

async function reportToPdf(src){
  const W = 760, scale = 2, mmW = 190, mmH = 277;   // A4 mit 10 mm Rand
  const box = document.createElement('div');
  box.style.cssText = `position:fixed;left:-10000px;top:0;width:${W}px;background:#fff`;
  const clone = src.cloneNode(true);
  clone.style.border = '0'; clone.style.padding = '0'; clone.style.borderRadius = '0';
  box.appendChild(clone); document.body.appendChild(box);
  try{
    await Promise.all([...clone.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(res => { i.onload = i.onerror = res; })));
    const canvas = await html2canvas(clone, {scale, backgroundColor:'#ffffff', windowWidth:W, logging:false});
    const top0 = clone.getBoundingClientRect().top;
    // Seitenumbrüche nur zwischen Zeilen/Abschnitten, nie direkt nach einer Abschnitts-Überschrift oder Tabellenkopf
    const breaks = [...clone.querySelectorAll('tr, .rsec, .box, .sigs, .rfoot')]
      .filter(e => !(e.tagName === 'TR' && !e.previousElementSibling && (e.parentElement.tagName === 'TBODY' || e.closest('table').previousElementSibling?.classList.contains('rsec'))))
      .map(e => e.getBoundingClientRect().top - top0).filter(y => y > 0).sort((a, b) => a - b);
    const H = canvas.height / scale, pagePx = mmH * W / mmW;
    const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
    let start = 0, first = true;
    while(start < H - 1){
      let end = start + pagePx;
      if(end < H){ const c = breaks.filter(y => y > start + 80 && y <= end); if(c.length) end = c[c.length - 1]; }
      else end = H;
      const sy = Math.round(start * scale), sh = Math.round((end - start) * scale);
      const part = document.createElement('canvas');
      part.width = canvas.width; part.height = sh;
      const ctx = part.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, part.width, sh);
      ctx.drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);
      if(!first) pdf.addPage();
      first = false;
      pdf.addImage(part.toDataURL('image/jpeg', 0.85), 'JPEG', 10, 10, mmW, (end - start) * mmW / W);
      start = end;
    }
    return pdf.output('blob');
  } finally {
    box.remove();
  }
}

/* ---------- Unterschrift ---------- */
function initSig(canvas, p){
  const key = canvas.dataset.sig;
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ctx.fillStyle = '#0b1f3a';
  const src = safeImg(p.sig[key]);
  if(src){ const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height); img.src = src; }
  let drawing = false, last = null;
  const pt = e => { const b = canvas.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); drawing = true; last = pt(e); canvas.setPointerCapture(e.pointerId);
    ctx.beginPath(); ctx.arc(last[0], last[1], 1.1, 0, Math.PI * 2); ctx.fill();
  });
  canvas.addEventListener('pointermove', e => {
    if(!drawing) return;
    const q = pt(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); last = q;
  });
  const end = () => {
    if(!drawing) return; drawing = false;
    const out = document.createElement('canvas');
    out.width = Math.round(r.width); out.height = Math.round(r.height);
    out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
    p.sig[key] = out.toDataURL('image/png'); save();
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
}

/* ---------- Google-Sheet-Schnittstelle ---------- */
async function api(action, data){
  if(!settings.url) throw new Error('Keine Web-App-URL in den Einstellungen.');
  const res = await fetch(settings.url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   // "simple request" → kein CORS-Preflight
    body: JSON.stringify(Object.assign({token:settings.token, action}, data || {}))
  });
  let j;
  try{ j = await res.json(); }catch(e){ throw new Error('Unerwartete Antwort – ist die Web-App für „Jeder“ freigegeben?'); }
  if(!j.ok) throw new Error(j.error || 'Unbekannter Fehler');
  return j;
}
let syncing = false;
async function syncAll(silent){
  if(syncing) return;
  const list = protocols.filter(p => p.status === 'done' && !p.synced);
  if(!list.length){ if(!silent) toast('Alles ist bereits im Google Sheet.'); return; }
  if(!settings.url){ if(!silent) toast('Bitte zuerst die Web-App-URL in den Einstellungen eintragen.'); return; }
  if(!navigator.onLine){ if(!silent) toast('Offline – wird automatisch übertragen, sobald Internet da ist.'); return; }
  syncing = true;
  let okCount = 0, err = null;
  for(const p of list){
    try{
      recompute(p);
      await api('upsert', {
        protocol: {id:p.id, templateId:TEMPLATE.id, values:p.values, kundeName:p.kundeName || '', completedAt:p.completedAt, sourceKey:p.sourceKey || '',
                   summary:{report:buildReport(p)}, pdf:await pdfBase64(p)},
        cols: buildCols(p)
      });
      p.synced = true; p.syncedAt = new Date().toISOString(); save(); okCount++;
    }catch(e){ err = e; break; }
  }
  syncing = false;
  if(err) toast(`Übertragung fehlgeschlagen: ${err.message}`);
  else if(okCount) toast(`${okCount} Protokoll(e) ins Google Sheet übertragen.`);
  if(view.name === 'home' || view.name === 'report') render(); else updateNet();
}

/* Wert aus einer alten Sheet-Zeile in das Eingabeformat der App bringen */
function fromSheet(f, x){
  if(x == null) return '';
  if(typeof x === 'boolean') x = x ? 'Ja' : 'Nein';
  if(typeof x === 'number' && f.type !== 'calc') return fmtNum(x);   // Eingabefelder erwarten Text mit Komma
  x = String(x);
  if(f.type === 'date'){ const m = x.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); if(m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  if(f.type === 'okfail') return x === 'Ja' ? 'i.O.' : x === 'Nein' || x === 'n.i.O.' ? 'Mangel' : x;   // ältere Zeilen: Ja/Nein
  return x;
}
