<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script>(function(){try{var t=localStorage.getItem('muther-theme');var r=document.documentElement;if(t==='hell')r.setAttribute('data-theme','light');else if(t==='dunkel')r.setAttribute('data-theme','dark');}catch(e){}})();</script>
<title>Auslegungstool Samsung FJM Multisplit</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="shared/base.css">
<style>
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400 700;font-display:swap;
  src:url(shared/lib/fonts/plus-jakarta-sans-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400 700;font-display:swap;
  src:url(shared/lib/fonts/plus-jakarta-sans-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
html{overscroll-behavior-y:none}
button,[role=button],select,summary,label.btn{touch-action:manipulation}
button,.steps>*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--gold);outline-offset:0;border-color:var(--pri2)}
header{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
#stepwrap,main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
input,select{min-height:48px;font-size:16px}
textarea{font-size:16px}
.steps>*{min-height:44px}
.btn{min-height:48px}
.btn.small{min-height:44px}
.row{gap:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num,.tnum{font-variant-numeric:tabular-nums}

/* Übergänge, Aufleuchten */
.flash{animation:flash 900ms var(--out)}
@keyframes flash{from{background-color:var(--flash)}}
.pg-out-fwd{animation:pgoutf var(--t-exit) var(--in) forwards}.pg-out-back{animation:pgoutb var(--t-exit) var(--in) forwards}
.pg-in-fwd{animation:pginf var(--t-med) var(--out) both}.pg-in-back{animation:pginb var(--t-med) var(--out) both}
@keyframes pgoutf{to{transform:translateX(-22%);opacity:0}}@keyframes pgoutb{to{transform:translateX(22%);opacity:0}}
@keyframes pginf{from{transform:translateX(100%);opacity:0}}@keyframes pginb{from{transform:translateX(-100%);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.001ms!important;transition-delay:0ms!important;animation-duration:.001ms!important;animation-delay:0ms!important}}

/* Toast, feste Leiste */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(40px);opacity:0;background:var(--pri);color:#fff;padding:12px 18px;border-radius:12px;transition:opacity var(--t-med) var(--out),transform var(--t-med) var(--out);z-index:20;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.bar>div{max-width:940px;margin:0 auto;display:flex;gap:10px}
.bar .btn{flex:1;min-height:52px;border-radius:13px;font-weight:700;font-size:16px}
.bar .btn.primary{border-color:var(--gold-dark)}
body.hasbar main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
body:not(.hasbar) main{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
body.hasbar #toast{bottom:calc(90px + env(safe-area-inset-bottom))}

/* Felder */
.fld{margin:0 0 16px}
.fld:last-child{margin-bottom:0}
.fhint{font-size:14px;color:var(--muted);margin:6px 0 0;font-weight:400}
.ferr{color:var(--bad);font-size:14px;font-weight:600;margin-top:6px;min-height:0}
.ferr:empty{display:none}
.fld.err input{border-color:var(--bad);border-width:2px}
.inunit{display:flex;align-items:center;gap:10px}
.inunit input{flex:1;min-width:0}
.inunit .unit{color:var(--muted);font-weight:600;min-width:2.2em}
select{appearance:auto;-webkit-appearance:menulist}
.grid2{display:grid;grid-template-columns:1fr;gap:0 16px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}

/* Liste */
.pcard{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 10px}
.pcard .open{appearance:none;-webkit-appearance:none;flex:1 1 220px;min-width:0;min-height:56px;text-align:left;font:inherit;color:var(--ink);background:none;border:0;padding:4px 0;cursor:pointer;display:block}
.pcard .open b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .open span{display:block;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .acts{display:flex;gap:8px;flex:none}
.empty{border:2px dashed var(--line);border-radius:16px;padding:24px 16px;text-align:center;color:var(--muted);margin:10px 0}
.empty .btn{margin-top:12px}
.bigact{width:100%;min-height:64px;font-size:18px;border-radius:16px}

/* Reiter für Anlagen */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tab{appearance:none;-webkit-appearance:none;min-height:48px;min-width:48px;max-width:100%;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.sel{background:var(--pri);border-color:var(--pri);color:var(--bg)}
:root[data-theme=dark] .tab.sel{background:var(--gold);border-color:var(--gold);color:var(--pri)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tab.sel{background:var(--gold);border-color:var(--gold);color:var(--pri)}}
.tab.add{border-style:dashed;color:var(--ink)}

/* Raumkarten */
.room{margin:0 0 12px}
.room h3{font-size:16px;margin:0 0 12px}
.room .rfoot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.rmsgs:empty{display:none}
.rmsgs{margin-top:12px}
.msgs{list-style:none;margin:0;padding:0}
.msgs li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:15px;line-height:1.35}
.msgs li .mi{margin-top:2px}
.mi{width:18px;height:18px;flex:none}
.s-ok{color:var(--ok)}.s-orange{color:var(--warn)}.s-rot{color:var(--bad)}.s-info{color:var(--muted)}
.limitnote{font-size:14px;color:var(--muted);margin:8px 0 0}
.astat{display:flex;gap:8px;align-items:flex-start;font-size:15px;margin:6px 0 0}
.astat b{font-weight:700}

/* Ergebnis */
.recbox{border-left:5px solid var(--gold)}
.recbox h3,.det h3{margin:0 0 6px;font-size:17px}
.recbox ul{margin:6px 0 0;padding-left:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--bdg);color:var(--ink);white-space:nowrap}
.chip.gold{background:var(--gold);color:var(--pri)}
.aglist{display:grid;gap:8px;margin:10px 0}
.agrow{appearance:none;-webkit-appearance:none;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left-width:5px;border-radius:14px;padding:10px 14px;min-height:64px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center}
.agrow .mi{width:22px;height:22px;grid-row:1}
.agrow .t1{font-weight:700;grid-column:2}
.agrow .t1 small{font-weight:400;color:var(--muted);font-size:14px}
.agrow .chips{grid-column:3;grid-row:1;justify-content:flex-end}
.agrow .t2{grid-column:2 / 4;font-size:14px}
.agrow .t3{grid-column:2 / 4;font-size:14px;color:var(--muted)}
.agrow.ok{border-left-color:var(--ok)}.agrow.orange{border-left-color:var(--warn)}.agrow.rot{border-left-color:var(--bad)}
.agrow[aria-pressed=true]{background:var(--gold-soft);border-color:var(--gold);border-left-width:5px}
:root[data-theme=dark] .agrow[aria-pressed=true]{background:var(--card)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .agrow[aria-pressed=true]{background:var(--card)}}
.agrow.ok[aria-pressed=true]{border-left-color:var(--ok)}.agrow.orange[aria-pressed=true]{border-left-color:var(--warn)}.agrow.rot[aria-pressed=true]{border-left-color:var(--bad)}
.agrow:active{transform:scale(.99)}
.det h3{margin-top:18px;padding-bottom:4px;border-bottom:2px solid var(--gold);font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.det h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;margin:8px 0 0;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
.kv dd .mi{vertical-align:-3px;margin-right:4px}
.rrow{padding:10px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .rt{font-weight:700}
.rrow .rm{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:14px;color:var(--muted);margin-top:2px}
.rrow .rm span.s-orange,.rrow .rm span.s-rot{font-weight:600}
.mgroup{margin-top:10px}
.mgroup h4{margin:0 0 2px;font-size:15px;display:flex;gap:8px;align-items:center}

#details.flash{border-radius:16px}
/* Bericht-CSS (PDF, Helvetica/Arial) */
.report{--gold:#DCCC4B;--ink:#1a1a1a;--ink-2:#3a3a3a;--ink-3:#706F6F;--line:#dcd9cf;--line-soft:#eceae3;--zebra:#faf9f5;--head-bg:#f8f7f4;--bad:#b42318;--warn:#8a5a00;
  color:var(--ink);font-family:Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.report *{box-sizing:border-box}
.report .page{width:210mm;height:297mm;margin:0 auto;background:#fff;padding:14mm 15mm 12mm;display:flex;flex-direction:column;font-size:8.3pt;line-height:1.4;text-align:left}
.report .page-body{flex:1;min-height:0;overflow:hidden}
.report .pfoot{display:flex;justify-content:space-between;gap:4mm;border-top:1px solid var(--line);padding-top:2.5mm;margin-top:4mm;font-size:7pt;color:var(--ink-3)}
.report .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8mm;padding-bottom:4mm;border-bottom:2.5px solid var(--gold)}
.report .firm b{display:block;font-size:10pt}
.report .firm span{display:block;font-size:7.6pt;color:var(--ink-2)}
.report .doc{text-align:right;flex-shrink:0}
.report .doc h1{margin:.5mm 0 1mm;font-size:15pt;line-height:1.1;font-weight:700;color:var(--ink)}
.report .doc .meta{font-size:7.8pt;color:var(--ink-2)}
.report .head.small{padding-bottom:2.5mm}
.report .head.small .doc h1{font-size:11pt}
.report .sec{margin-top:4.5mm}
.report .sec h2{margin:0 0 2mm;font-size:9.6pt;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0;padding-bottom:1.2mm;border-bottom:1px solid var(--line)}
.report .sec h2.anl{font-size:12pt;border-bottom:2px solid var(--gold)}
.report .sec.nomt{margin-top:2mm}
.report dl.kv2{display:grid;grid-template-columns:repeat(3,1fr);margin:0;column-gap:4mm}
.report dl.kv2 div{padding:1.5mm 0;border-bottom:1px solid var(--line-soft);min-width:0}
.report dl.kv2 div.wide{grid-column:1/-1}
.report dl.kv2 dt{font-size:6.8pt;color:var(--ink-3);letter-spacing:.06em;margin:0}
.report dl.kv2 dd{margin:.3mm 0 0;font-size:8.8pt;font-weight:500;overflow-wrap:anywhere}
.report table{width:100%;border-collapse:collapse;table-layout:fixed}
.report th{text-transform:none;font-size:6.8pt;letter-spacing:.04em;color:var(--ink-2);text-align:left;font-weight:600;background:var(--head-bg);padding:1.6mm 1.5mm;border-bottom:1.5px solid var(--gold)}
.report td{padding:1.4mm 1.5mm;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:8pt;overflow-wrap:anywhere}
.report tbody tr:nth-child(even) td{background:var(--zebra)}
.report .r{text-align:right}
.report ul.hn{margin:0;padding-left:4mm}.report ul.hn li{margin:.6mm 0}
.report .hn .rot{color:var(--bad)}.report .hn .orange{color:var(--warn)}
.report .note{font-size:7.6pt;color:var(--ink-2);margin-top:4mm;line-height:1.4}
.report .sum{margin-top:5mm;font-size:9pt;font-weight:700;border-top:1px solid var(--line);padding-top:2mm}
header button.tt{appearance:none;-webkit-appearance:none;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:0;margin:0}
header .tt .ttn{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

<body>
<header><div class="logo">S</div><button type="button" class="tt" id="ttl" data-act="home" aria-label="Zur Liste"><span class="ttn">Samsung FJM</span><span id="hsub">Multisplit-Auslegung</span></button>
<button type="button" class="ib themebtn" id="themebtn" aria-label="Darstellung wechseln"></button>
<button type="button" class="ib" id="btnset" data-act="settings" aria-label="Einstellungen"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button></header>
<div id="stepwrap" hidden></div>
<div class="stage"><main id="app"></main></div>
<div class="bar" id="bar" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="daten.js"></script>
<script src="engine.js"></script>
<script src="shared/lib/jspdf.umd.min.js"></script>
<script src="shared/lib/html2canvas.min.js"></script>
<script src="shared/core.js"></script>
<script src="shared/settings.js"></script>
<script src="shared/wizard.js"></script>
<script src="shared/pdf.js"></script>
<script>
'use strict';
/* ====== Grundlagen ====== */
const KEY = 'samsung-fjm-projekte', SKEY = 'samsung-fjm-settings';
const num = v => { const n = Engine.num(v); return n == null ? NaN : n; };   // von core.js (isN) erwartet
const DB = Engine.normalize(window.DATEN_SEED);
const MAXR = Math.max.apply(null, DB.odu.map(o => o.ig_max));               // max. Räume je Anlage (aus den Daten)
const app = $('#app');
let navBusy = false, enterT = null, hsubAnim = null;
let settings = Object.assign({firma:'', bearbeiter:''}, LS.get(SKEY, {}));
let projects = [];
let view = {name:'list'};          // list | settings | wizard {id, step, an}
let EV = null;                     // Ergebnis von Engine.evaluateProjekt (mit .labels / .n je Anlage)
const PAGES = [
  {title:'Projekt', short:'Projekt'},
  {title:'Anlagen und Räume', short:'Anlagen'},
  {title:'Ergebnis', short:'Ergebnis'},
  {title:'PDF', short:'PDF'}
];

const IC = {
  ok:'<svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.9 8.2l2.1 2.1 4.1-4.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  orange:'<svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8L15 14H1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 6.4v3.4M8 11.7v.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  rot:'<svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 5.5l5 5M10.5 5.5l-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  info:'<svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v4M8 4.7v.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>'
};
const STXT = {ok:'zulässig', orange:'zulässig mit Hinweisen', rot:'unzulässig', info:'Info'};
const SPREFIX = {ok:'Zulässig: ', orange:'Hinweis: ', rot:'Unzulässig: ', info:'Info: '};
const stufeOf = c => !c.ok ? 'rot' : c.warns.length ? 'orange' : 'ok';
const g = (x, d) => (x == null || x === '' || isNaN(x)) ? '–' : String(round(Number(x), d == null ? 2 : d)).replace('.', ',');
const gk = x => g(x, 1);

/* ====== Datenmodell ====== */
function newRoom(){ return {id: uid(), name:'', modell:'', laenge:'', flaeche:'', hoehe:''}; }
function newAnlage(name){ return {id: uid(), name: name, ag:'', raeume:[newRoom(), newRoom()]}; }
function newProject(){
  const now = new Date().toISOString();
  return {id: uid(), nr:'', datum: today(), kunde:'', bearbeiter: settings.bearbeiter || '', bemerkung:'', anlagen:[newAnlage('Anlage 1')], erstellt: now, geaendert: now};
}
const okId = x => typeof x === 'string' && /^[\w-]+$/.test(x);
const str = v => v == null ? '' : String(v);
/* Prüft/normalisiert ein Projekt (auch aus fremden Dateien). Gibt null zurück, wenn es kein Objekt ist. */
function normProject(p){
  if(!p || typeof p !== 'object' || Array.isArray(p)) return null;
  const seen = new Set(), fixId = o => { if(!okId(o.id) || seen.has(o.id)) o.id = uid(); seen.add(o.id); };
  fixId(p);
  ['nr','datum','kunde','bearbeiter','bemerkung','erstellt','geaendert'].forEach(k => { p[k] = str(p[k]); });
  p.anlagen = Array.isArray(p.anlagen) ? p.anlagen.filter(a => a && typeof a === 'object' && !Array.isArray(a)) : [];
  if(!p.anlagen.length) p.anlagen = [newAnlage('Anlage 1')];
  p.anlagen.forEach((a, i) => {
    fixId(a); a.name = str(a.name) || ('Anlage ' + (i + 1)); a.ag = str(a.ag);
    a.raeume = Array.isArray(a.raeume) ? a.raeume.filter(r => r && typeof r === 'object' && !Array.isArray(r)) : [];
    a.raeume.forEach(r => { fixId(r); ['name','modell','laenge','flaeche','hoehe'].forEach(k => { r[k] = str(r[k]); }); });
  });
  return p;
}
function normList(list){
  const out = new Map();
  (Array.isArray(list) ? list : []).forEach(p => { try{ const n = normProject(p); if(n) out.set(n.id, n); }catch(e){} });
  return [...out.values()];
}
projects = normList(LS.get(KEY, []));
function dropPdf(){ if(lastPdf && lastPdf.url) URL.revokeObjectURL(lastPdf.url); lastPdf = null; }
function istManuell(e){ return !!(e.a.ag && !e.agUngueltig && e.a.ag !== e.empfohlen); }
function leerProjekt(p){
  if(p.nr || p.kunde || p.bemerkung) return false;
  return p.anlagen.every(a => !a.ag && /^Anlage \d+$/.test(a.name) && a.raeume.every(r => !(r.name || r.modell || r.laenge || r.flaeche || r.hoehe)));
}
const cur = () => projects.find(p => p.id === view.id);
function curA(p){ return p.anlagen.find(a => a.id === view.an) || p.anlagen[0]; }
function save(){ dropPdf(); const p = view.name === 'wizard' ? cur() : null; if(p) p.geaendert = new Date().toISOString(); return LS.set(KEY, projects); }
function saveSettings(){ dropPdf(); return LS.set(SKEY, settings); }

/* Räume für die Engine: nur mit Gerät, Name = Anzeigename (eindeutig). Meldungen der Engine tragen diesen Namen. */
function engRooms(a){
  const seen = {}, label = {}, list = [];
  a.raeume.forEach((r, i) => {
    if(!r.modell) return;
    let nm = String(r.name || '').trim() || ('Raum ' + (i + 1));
    if(seen[nm]){ seen[nm]++; nm += ' (' + seen[nm] + ')'; } else seen[nm] = 1;
    label[r.id] = nm;
    list.push({id: r.id, name: nm, modell: r.modell, laenge: r.laenge, flaeche: r.flaeche, hoehe: r.hoehe});
  });
  return {list, label};
}
function evalP(p){
  const per = p.anlagen.map(engRooms);
  const ev = Engine.evaluateProjekt({anlagen: p.anlagen.map((a, i) => ({id: a.id, name: a.name, ag: a.ag, raeume: per[i].list}))}, DB);
  ev.anlagen.forEach((e, i) => { e.labels = per[i].label; e.n = per[i].list.length; e.a = p.anlagen[i]; e.agUngueltig = !!(e.a.ag && !e.alle.some(c => c.odu.id === e.a.ag)); });
  EV = ev; return ev;
}
const evOf = a => EV && EV.anlagen.find(e => e.a === a);

/* ====== Zahlen prüfen (beim Verlassen des Felds) ====== */
function numErr(kind, v){
  v = String(v == null ? '' : v).trim();
  if(!v) return '';
  if(/^[+-]?\d{1,3}(\.\d{3})+(,\d+)?$/.test(v)) return 'Bitte ohne Tausenderpunkt eingeben, z. B. 1250,5.';
  if(!/^[+-]?\d+([.,]\d+)?$/.test(v)) return 'Bitte eine Zahl eingeben, z. B. 12,5.';
  if(kind !== 'hoehe' && !(Engine.num(v) > 0)) return 'Der Wert muss größer als 0 sein.';
  return '';
}

    !n ? 'Es gibt noch keine Anlage mit Räumen. Bitte zuerst in Schritt 2 Räume mit Innengerät eingeben.'
    : done ? 'Das PDF „' + esc(lastPdf.file.name) + '“ ist fertig. Mit „PDF teilen“ weitergeben oder speichern.'
    : 'Das PDF enthält ' + n + (n === 1 ? ' Anlage' : ' Anlagen') + ' mit Außengerät, Räumen, Kältemittel, Elektrik und Hinweisen' + (kein ? ' (davon ' + kein + ' ohne zulässiges Außengerät, mit Begründung)' : '') + '. Anlagen ohne Räume werden weggelassen.'}</p></div>`;
}

/* ====== PDF ====== */
let lastPdf = null, pdfBusy = false;
function fmtDatum(d){ const m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}.${m[2]}.${m[1]}` : String(d || ''); }
/* Bericht-Daten für reportParts (nur Anlagen mit Räumen) */
function buildReport(p){
  const ev = evalP(p), cfg = DB.cfg;
  const anlagen = ev.anlagen.filter(e => e.n > 0).map(e => {
    const a = e.a;
    if(!e.res) return {name: a.name || 'Anlage', c: null, why: e.why.slice(), gruende: e.alle.map(x => ({id: x.odu.id, modell: x.odu.modell, text: x.errs.length ? x.errs[0].text : ''}))};
    const c = e.res;
    let vermerk = 'empfohlen';
    if(istManuell(e)) vermerk = e.empfohlen ? 'gewählt statt Empfehlung ' + e.empfohlen : 'gewählt, keine Empfehlung vorhanden';
    return {name: a.name || 'Anlage', c, stufe: stufeOf(c), vermerk};
  });
  return {id: p.nr || '', nr: p.nr, kunde: p.kunde, datum: fmtDatum(p.datum), bearbeiter: p.bearbeiter, bemerkung: p.bemerkung,
    firma: settings.firma, anlagen, co2: EV.co2_gesamt_t, gwp: cfg.gwp, norm: cfg.norm_hinweis, stand: cfg.datenstand};
}
function reportParts(r){
  const nl = s => esc(s).replace(/\n/g, '<br>');
  const kv = rows => `<dl class="kv2">${rows.filter(x => x[1] !== '' && x[1] != null).map(x => `<div${x[2] ? ' class="wide"' : ''}><dt>${esc(String(x[0]).toUpperCase())}</dt><dd>${x[2] ? nl(x[1]) : esc(x[1])}</dd></div>`).join('')}</dl>`;
  const sec = (title, inner, cls) => `<div class="sec${cls ? ' ' + cls : ''}"><h2 class="${cls === 'anl' ? 'anl' : ''}"><span class="tt">${esc(title)}</span></h2>${inner}</div>`;
  const firmLines = String(r.firma || '').split('\n').map(s => s.trim()).filter(Boolean);
  const firm1 = firmLines[0] ? `<b>${esc(firmLines[0])}</b>` : '';
  const TITEL = 'Auslegung Samsung FJM Multisplit R32';
  const blocks = [];
  blocks.push({html: `<div class="sec nomt">${kv([['Projekt-Nr.', r.nr], ['Kunde', r.kunde], ['Datum', r.datum], ['Bearbeiter', r.bearbeiter], ['Bemerkung', r.bemerkung, true]])}</div>`});
  if(!r.anlagen.length) blocks.push({html: '<div class="note">Keine Anlage mit Räumen vorhanden.</div>'});
  /* Liste in kleine Gruppen teilen: Überschrift steht mit den ersten Einträgen im selben Block, lange Listen sind seitenweise teilbar */
  const listBlocks = (title, lis, cls) => {
    for(let i = 0; i < lis.length; i += 3){
      const ul = `<ul class="hn">${lis.slice(i, i + 3).join('')}</ul>`;
      blocks.push({html: i ? `<div class="sec nomt">${ul}</div>` : `<div class="sec"><h2 class="${cls || ''}"><span class="tt">${esc(title)}</span></h2>${ul}</div>`});
    }
  };
  const STAT = {ok:'zulässig', orange:'zulässig mit Hinweisen', rot:'nicht zulässig'};
  r.anlagen.forEach(an => {
    if(!an.c){
      listBlocks(an.name + ' – Kein zulässiges Außengerät', an.why.map(w => `<li class="rot"><b>Nicht zulässig:</b> ${esc(w)}</li>`)
        .concat(an.gruende.map(x => `<li class="rot"><b>${esc(x.id)}</b> (${esc(x.modell)}): ${esc(x.text || 'nicht zulässig')}</li>`)), 'anl');
      return;
    }
    const c = an.c, o = c.odu, cfg = DB.cfg, el = c.elektrik;
    blocks.push({html: sec(an.name, kv([
      ['Außengerät', o.modell + '/EU'], ['Nennleistung Kühlen / Heizen', `${g(o.kuehlen_kw, 1)} / ${g(o.heizen_kw, 1)} kW`], ['SEER / SCOP', `${o.seer} / ${o.scop}`],
      ['Maße (H×B×T)', o.masse_mm + ' mm'], ['Gewicht', g(o.gewicht_kg, 1) + ' kg'], ['Status', STAT[an.stufe] + ' (' + an.vermerk + ')']]), 'anl')});
    const rows = c.rows.map(x => `<tr><td>${esc(x.raum)}</td><td>${esc(x.unit ? x.unit.modell : '–')}</td><td class="r">${x.unit ? g(x.unit.kuehlen_kw, 1) + ' / ' + g(x.unit.heizen_kw, 1) : '–'}</td>
      <td>${esc(x.port ? x.port + '"' : '–')}${x.reduz ? '<br>Reduzierung ' + esc(String(x.reduz).replace('→', ' → ')) + '"' : ''}</td>
      <td class="r">${g(x.laenge)}</td><td class="r">${g(x.hoehe)}</td><td class="r">${g(x.flaeche, 1)}</td><td class="r">${x.amin > 0 ? g(x.amin, 1) : '–'}</td></tr>`).join('');
    const W = [18, 21, 10, 15, 9, 9, 9, 9];
    const heads = ['Raum', 'Innengerät', 'kW K / H', 'Anschluss', 'Länge m', 'Höhe m', 'Fläche m²', 'A_min m²'];
    blocks.push({split: true, html: `<div class="sec"><h2><span class="tt">Räume – ${esc(an.name)}</span></h2><table><thead><tr>${heads.map((h, i) => `<th style="width:${W[i]}%"${i > 1 && i !== 3 ? ' class="r"' : ''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`});
    const kOk = c.sumK >= o.anschl_k_min - 1e-9 && c.sumK <= o.anschl_k_max + 1e-9, hOk = c.sumH >= o.anschl_h_min - 1e-9 && c.sumH <= o.anschl_h_max + 1e-9;
    blocks.push({html: sec('Summen und Leitungen – ' + an.name, kv([
      ['Summe Kühlen', `${g(c.sumK, 1)} kW (zulässig ${g(o.anschl_k_min, 1)}–${g(o.anschl_k_max, 1)} kW${kOk ? '' : ', außerhalb'})`],
      ['Summe Heizen', `${g(c.sumH, 1)} kW (zulässig ${g(o.anschl_h_min, 1)}–${g(o.anschl_h_max, 1)} kW${hOk ? '' : ', außerhalb'})`],
      ['Belegung', g(c.belegung, 0) + ' % der Kühlleistung'],
      ['Leitung gesamt', `${g(c.gesamtL, 1)} m (max. ${g(o.leitung_gesamt_max_m, 0)} m)`], ['Leitung je Innengerät', 'max. ' + g(o.leitung_ig_max_m, 0) + ' m']]))});
    blocks.push({html: sec('Kältemittel R32 – ' + an.name, kv([
      [`Werksfüllung (bis ${g(o.werk_bis_m, 0)} m)`, g(o.werk_kg, 2) + ' kg'], ['Nachfüllung', g(c.extra_kg, 1) + ' kg'], ['Gesamtfüllung', g(c.fuell_kg, 2) + ' kg'],
      [`CO₂-Äquivalent (GWP ${g(cfg.gwp, 0)})`, g(c.co2_t, 2) + ' t CO₂e']]))});
    blocks.push({html: sec('Elektrik – ' + an.name, kv([
      ['Absicherung Außengerät', g(el.absicherung_a, 0) + ' A träge'], ['Zuleitung Außengerät', el.zuleitung],
      ['Leitung je Innengerät', el.ig_kabel + ' (' + el.anzahl + ' Stück)'], ['Bus-Leitung', el.bus]]))});
    const grp = (st, lab, pre, list) => list.length ? listBlocks(lab, list.map(m => `<li class="${st}"><b>${pre}</b> ${m.raum ? '<b>' + esc(m.raum) + ':</b> ' : ''}${esc(m.text)}</li>`)) : 0;
    grp('rot', 'Nicht zulässig – ' + an.name, 'Nicht zulässig:', c.errs); grp('orange', 'Hinweise – ' + an.name, 'Hinweis:', c.warns); grp('info', 'Info – ' + an.name, 'Info:', c.infos);
  });
  if(r.anlagen.some(an => an.c)) blocks.push({html: `<div class="sum">CO₂-Äquivalent aller Anlagen: ${g(r.co2, 2)} t CO₂e</div>`});
  blocks.push({html: `<div class="note">${esc(r.norm)}<br>Auslegung nach Herstellerprospekt, ohne Gewähr; Leistungsdaten bei Teillast nicht berücksichtigt.</div>`});
  const sub = [r.kunde, r.datum].filter(Boolean).join(' · ');
  return {
    blocks,
    head: `<div class="head"><div class="firm">${firm1}${firmLines.slice(1).map(s => `<span>${esc(s)}</span>`).join('')}</div><div class="doc"><h1>${esc(TITEL)}</h1><div class="meta">${r.nr ? 'Projekt-Nr. <b>' + esc(r.nr) + '</b>' : ''}${r.nr && r.datum ? ' · ' : ''}${r.datum ? '<b>' + esc(r.datum) + '</b>' : ''}</div></div></div>`,
    smallHead: `<div class="head small"><div class="firm">${firm1}<span>${esc(sub)}</span></div><div class="doc"><h1>${esc(TITEL)}</h1><div class="meta">${r.nr ? 'Projekt-Nr. <b>' + esc(r.nr) + '</b>' : ''}</div></div></div>`,
    foot: esc(TITEL), id: 'Datenstand: ' + esc(r.stand)
  };
}
function pdfFileName(p){ return pdfName(p.nr || [p.kunde, p.datum].filter(Boolean).join(' ') || 'Auslegung-' + p.datum, 'Auslegung') + '.pdf'; }

function vWizard(p){
  evalP(p);
  return [vStep1, vStep2, vStep3, vStep4][view.step](p);
}

/* ====== Zeichnen ====== */
function render(){
  let html = '';
  if(view.name === 'list') html = vList();
  else if(view.name === 'settings') html = vSettings();
  else { const p = cur(); if(!p){ view = {name:'list'}; html = vList(); } else html = vWizard(p); }
  const p = view.name === 'wizard' ? cur() : null;
  stepsRender(p ? {key: view.id, pages: PAGES, index: view.step, done: k => stepDone(p, k), pauseAct: 'home'} : null);
  barRender(barHtml());
  setHeader(true);
  app.innerHTML = html;
  if(view.name === 'settings') linkLabels();
  if(view.name === 'wizard' && view.step === 1) fillHints();
}
/* Beschriftungen der Einstellungen (aus shared/settings.js, ohne for) mit dem folgenden Feld verknüpfen */
function linkLabels(){
  app.querySelectorAll('label:not([for])').forEach(l => {
    const n = l.nextElementSibling;
    if(!l.querySelector('input') && n && n.id && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(n.tagName)) l.htmlFor = n.id;
  });
}
function rerender(focusSel){
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
  if(focusSel){ const el = app.querySelector(focusSel); if(el) el.focus({preventScroll:true}); }
}
function go(name, extra){ view = Object.assign({name}, extra || {}); render(); window.scrollTo(0, 0); }

/* ====== Aktionen ====== */
function openP(id, step){
  const p = projects.find(x => x.id === id); if(!p) return;
  go('wizard', {id, step: step || 0, an: p.anlagen[0].id});
}
const ACT = {
  home(){
    if(view.name === 'wizard'){
      save();
      const p = cur();
      if(p && leerProjekt(p)){ projects = projects.filter(x => x !== p); LS.set(KEY, projects); }
    }
    go('list');
  },
  settings(){ go('settings'); },
  new(){ const p = newProject(); projects.push(p); LS.set(KEY, projects); openP(p.id, 0); },
  open(t){ openP(t.dataset.id, 0); },
  copy(t){
    const p = projects.find(x => x.id === t.dataset.id); if(!p) return;
    const c = JSON.parse(JSON.stringify(p)), now = new Date().toISOString();
    c.id = uid(); c.nr = (p.nr ? p.nr.replace(/\s*\(Kopie\)\s*$/, '') + ' ' : '') + '(Kopie)'; c.datum = today(); c.erstellt = c.geaendert = now;
    c.anlagen.forEach(a => { a.id = uid(); a.raeume.forEach(r => { r.id = uid(); }); });
    projects.push(c); LS.set(KEY, projects); render(); toast('Kopie angelegt.');
  },
  del(t){
    const p = projects.find(x => x.id === t.dataset.id); if(!p) return;
    if(!confirm('Auslegung „' + (p.nr || 'ohne Projektnummer') + '“ wirklich löschen? Das kann nicht rückgängig gemacht werden.')) return;
    projects = projects.filter(x => x !== p); LS.set(KEY, projects); render();
  },
  prev(){ stepTo('back', () => { view.step = Math.max(0, view.step - 1); }); },
  next(){ stepTo('fwd', () => { view.step = Math.min(PAGES.length - 1, view.step + 1); }); },
  jump(t){ const i = +t.dataset.i; if(i === view.step) return; stepTo(i > view.step ? 'fwd' : 'back', () => { view.step = i; }); },
  tab(t){ view.an = t.dataset.id; rerender(); },
  addAnlage(){
    const p = cur(), a = newAnlage('Anlage ' + (p.anlagen.length + 1));
    p.anlagen.push(a); view.an = a.id; save(); rerender('#an_name');
  },
  delAnlage(){
    const p = cur(), a = curA(p); if(p.anlagen.length < 2) return;
    const n = a.raeume.filter(r => r.modell || r.name).length;
    if(!confirm('Anlage „' + a.name + '“' + (n ? ' mit ' + n + ' Raum/Räumen' : '') + ' wirklich löschen?')) return;
    p.anlagen = p.anlagen.filter(x => x !== a); view.an = p.anlagen[0].id; save(); rerender();
  },
  addRoom(){
    const p = cur(), a = curA(p); if(a.raeume.length >= MAXR) return;
    const r = newRoom(); a.raeume.push(r); save(); rerender(); const el = $('#f_' + r.id + '_name'); if(el){ el.focus(); el.scrollIntoView({block:'center', behavior: RM() ? 'auto' : 'smooth'}); }
  },
  delRoom(t){
    const p = cur(), a = curA(p), r = a.raeume.find(x => x.id === t.dataset.id); if(!r) return;
    if(!confirm('Raum „' + (r.name || 'ohne Namen') + '“ wirklich löschen?')) return;
    a.raeume = a.raeume.filter(x => x !== r); save(); rerender();
  },
  pickag(t){
    const p = cur(), a = curA(p); a.ag = t.dataset.id; save(); rerender('[data-act="pickag"][data-id="' + t.dataset.id + '"]'); flash($('#details'));
  },
  resetag(){ const p = cur(), a = curA(p); a.ag = ''; save(); rerender(); flash($('#details')); },
  theme(){ $('#themebtn').click(); const b = $('#themeset'); if(b) b.textContent = ($('#themebtn').title || '').replace('Darstellung: ', '') + ' – wechseln'; },
  backup(){ backupDownload({app:'samsung-fjm-auslegung', exportedAt: new Date().toISOString(), projects}, `samsung-fjm-backup-${today()}.json`); },
  async pdf(){
    if(pdfBusy) return;
    if(!window.jspdf || !window.html2canvas){ toast('PDF-Modul nicht geladen – App einmal online neu starten.'); return; }
    const p = cur(); if(!p) return;
    if(!p.anlagen.some(a => a.raeume.some(r => r.modell))){ toast('Zuerst Räume mit Innengerät eingeben.'); return; }
    pdfBusy = true; rerender();
    try{
      const blob = await reportPdfBlob(buildReport(p));
      dropPdf();
      lastPdf = {id: p.id, file: new File([blob], pdfFileName(p), {type:'application/pdf'}), url: URL.createObjectURL(blob)};
      toast('PDF fertig – jetzt „PDF teilen“ antippen.');
    }catch(e){ toast('PDF konnte nicht erstellt werden: ' + e.message); }
    finally{ pdfBusy = false; if(view.name === 'wizard') rerender(); }
  },
  async sharepdf(){
    if(!lastPdf) return;
    const files = [lastPdf.file];
    if(navigator.canShare && navigator.canShare({files})){
      try{ await navigator.share({files, title: lastPdf.file.name}); }
      catch(e){ if(e.name !== 'AbortError') toast('Teilen fehlgeschlagen: ' + e.message); }
    } else {
      const a = document.createElement('a'); a.href = lastPdf.url; a.download = lastPdf.file.name;
      document.body.appendChild(a); a.click(); a.remove();
    }
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t || t.disabled || !ACT[t.dataset.act]) return;
  ACT[t.dataset.act](t);
});

/* Eingaben: bei jeder Eingabe speichern, ohne Neuzeichnen (Tastatur bleibt offen) */
function setErr(inp, msg){
  const fld = inp.closest('.fld'), er = $('#' + inp.id + '_e');
  if(fld) fld.classList.toggle('err', !!msg);
  if(er) er.textContent = msg || '';
  if(msg) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid');
}
app.addEventListener('input', e => {
  const t = e.target;
  if(view.name === 'settings'){
    if(t.id === 's_firma') settings.firma = t.value; else if(t.id === 's_bearbeiter') settings.bearbeiter = t.value; else return;
    saveSettings(); return;
  }
  const p = cur(); if(!p) return;
  if(t.dataset.p){ p[t.dataset.p] = t.value; save(); setHeader(false); }
  else if(t.dataset.an){
    const a = curA(p); a.name = t.value; save();
    const tab = app.querySelector(`[data-tab="${a.id}"]`); if(tab) tab.textContent = a.name || 'Anlage';
  } else if(t.dataset.r){
    const a = curA(p), r = a.raeume.find(x => x.id === t.dataset.r); if(!r) return;
    r[t.dataset.k] = t.value; save();
    if(t.dataset.k !== 'name' && t.dataset.k !== 'modell' && t.closest('.fld').classList.contains('err') && !numErr(t.dataset.k, t.value)) setErr(t, '');
    fillHints();
  }
});
/* Backup einlesen: erst vollständig prüfen/normalisieren und nachfragen, dann über shared/settings.js zusammenführen */
function importBackup(file){
  const r = new FileReader();
  r.onerror = () => toast('Import fehlgeschlagen: Datei nicht lesbar.');
  r.onload = () => {
    let d;
    try{ d = JSON.parse(r.result); }catch(e){ toast('Import fehlgeschlagen: keine gültige Backup-Datei.'); return; }
    if(!d || typeof d !== 'object' || !Array.isArray(d.projects)){ toast('Import fehlgeschlagen: keine gültige Backup-Datei.'); return; }
    const list = normList(d.projects);
    if(!list.length){ toast('Import fehlgeschlagen: keine Auslegungen in der Datei.'); return; }
    const ids = new Set(projects.map(p => p.id)), y = list.filter(p => ids.has(p.id)).length;
    if(!confirm(list.length + ' Auslegung(en) einlesen, ' + y + ' gleiche werden überschrieben?')) return;
    const clean = new File([JSON.stringify({projects: list})], 'import.json', {type:'application/json'});
    backupImport(clean, 'projects', projects, 'Auslegungen', merged => { projects = normList(merged); LS.set(KEY, projects); render(); });
  };
  r.readAsText(file);
}
app.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 's_import' && t.files[0]){
    importBackup(t.files[0]);
    t.value = '';
  } else if(t.dataset.r && t.dataset.k === 'modell') fillHints();
});
app.addEventListener('focusout', e => {
  const t = e.target;
  if(t.dataset && t.dataset.r && ['laenge','flaeche','hoehe'].indexOf(t.dataset.k) >= 0) setErr(t, numErr(t.dataset.k, t.value));
});
</script>

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
