<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="apple-mobile-web-app-title" content="Kalk. Klima" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <title>Kalkulation Service Klimaanlage</title>

    <script>
      (function () {
        var root = document.documentElement,
          saved = null;
        try {
          saved = localStorage.getItem('ag-theme');
        } catch (e) {}
        var light = window.matchMedia('(prefers-color-scheme: light)').matches;
        root.setAttribute(
          'data-theme',
          saved === 'light' || saved === 'dark' ? saved : light ? 'light' : 'dark',
        );
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="agFonts"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0..200&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0..200&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      (function () {
        var root = document.documentElement,
          link = document.getElementById('agFonts');
        if (!link || !document.fonts || !document.fonts.load) return;
        var done = function () {
          root.classList.remove('icons-pending');
        };
        root.classList.add('icons-pending');
        setTimeout(done, 4000);
        link.addEventListener('load', function () {
          setTimeout(function () {
            document.fonts.load('24px "Material Symbols Rounded"').then(done, done);
          }, 0);
        });
        link.addEventListener('error', done);
      })();
    </script>

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/png" href="icon-180.png" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="shared/lib/fonts/material-symbols-rounded.woff2"
      crossorigin
    />
    <script src="config.js"></script>
    <script src="shared/lib/html2canvas.min.js" defer></script>
    <script src="shared/lib/jspdf.umd.min.js" defer></script>
    <link rel="stylesheet" href="shared/global.css" />
    <link rel="stylesheet" href="shared/pdf.css" />
    <style>
      /* Nur App-Spezifisches. Farben, Radien und Schriften kommen als Tokens aus shared/global.css. */

      /* ===== Rahmen: Übersicht, Kopf, untere Leiste ===== */
      html {
        overscroll-behavior-y: none;
      }
      .brand-title {
        font-size: 1.5rem;
        hyphens: none;
      }
      button.row,
      .proto-open {
        font: inherit;
        color: inherit;
        text-align: left;
        background: transparent;
        border: 0;
        cursor: pointer;
        touch-action: manipulation;
      }
      a.btn-primary,
      a.btn-secondary {
        text-decoration: none;
      }
      .btn-secondary:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .net {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        min-height: 20px;
        margin-top: 0.25rem;
        color: var(--text-secondary);
        font-size: var(--text-caption);
      }
      .net .nd {
        width: 6px;
        height: 6px;
        flex: none;
        border-radius: 50%;
        background: var(--system-green);
      }
      .net.off .nd {
        background: var(--system-orange);
      }
      .net.off .nt {
        color: var(--system-orange);
        font-weight: 600;
      }
      .net .sep {
        display: none;
      }
      /* Im Formular zeigt die Kopfzeile nur den Offline-Zustand, der Inhalt beginnt dadurch früher */
      body.in-wizard .net:not(.off) {
        display: none;
      }
      .net .np {
        color: var(--text-primary);
        font-weight: 600;
      }
      .settings-update-dot[hidden] {
        display: none;
      }
      .notice {
        display: flex;
        flex-direction: column;
        gap: 0.625rem;
        align-items: flex-start;
        margin-bottom: 1.5rem;
        padding: 0.75rem 1rem;
        border: 1px solid var(--system-orange-border);
        border-radius: var(--radius-control);
        background: var(--system-orange-tint);
        color: var(--text-primary);
        font-size: var(--text-sub);
      }
      .empty-note {
        margin: 0 0 2.25rem;
        color: var(--text-secondary);
        font-size: var(--text-sub);
      }
      .lead-note {
        margin: 0 0 1rem;
        color: var(--text-secondary);
        font-size: var(--text-sub);
      }
      .btn-wide {
        margin-bottom: 1.5rem;
      }
      /* Kalkulations-Zeile: antippbarer Hauptteil, rechts Einzel-Aktionen ohne Fläche */
      .proto-row {
        gap: 0.25rem;
        padding-right: 0.25rem;
      }
      .proto-open {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 0.875rem;
        min-width: 0;
        min-height: 44px;
        padding: 0;
        text-decoration: none;
      }
      .proto-open .row-text {
        overflow-wrap: anywhere;
      }
      .proto-act.is-danger {
        color: var(--system-red);
      }
      .proto-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
        margin-top: 0.375rem;
      }
      .proto-pills .status-pill {
        padding: 0.15rem 0.55rem;
      }
      /* Untere Leiste (Zurück / Weiter / Abschließen / PDF) */
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        padding: 0.625rem max(1rem, env(safe-area-inset-right))
          calc(0.75rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background: var(--bg-canvas);
        border-top: 1px solid var(--border-separator);
      }
      .bar > div {
        display: flex;
        gap: 0.625rem;
        max-width: 1080px;
        margin: 0 auto;
      }
      .bar > div > * {
        flex: 1;
        min-width: 0;
      }
      .bar .btn-primary,
      .bar .btn-secondary {
        min-height: 52px;
      }
      body.hasbar #app {
        padding-bottom: calc(96px + env(safe-area-inset-bottom));
      }
      body.hasbar .toast-pill {
        bottom: calc(5.75rem + env(safe-area-inset-bottom));
      }
      /* PDF-Knopf mit Fortschritt */
      .pdfb {
        position: relative;
        overflow: hidden;
      }
      .pdfb .fill {
        position: absolute;
        inset: 0;
        background: var(--on-accent);
        opacity: 0.22;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 220ms linear;
        pointer-events: none;
      }
      .pdfb .l1,
      .pdfb .l2,
      .pdfb .lr {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        position: relative;
        transition:
          opacity 0.2s ease,
          transform 0.2s var(--ease-spring);
      }
      .pdfb .l2,
      .pdfb .lr {
        position: absolute;
        opacity: 0;
        transform: translateY(8px);
      }
      .pdfb.run .l1,
      .pdfb.done .l1 {
        opacity: 0;
        transform: translateY(-8px);
      }
      .pdfb.run .lr {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .lr {
        opacity: 0;
      }
      .pdfb.done .l2 {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .fill {
        opacity: 0;
      }
      .pdfbar {
        display: contents;
      }
      .pdfbar:empty {
        display: none;
      }
      /* Einstellungen und Rückfrage: Inhalt der Modal-Karte */
      .panel {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .panel[hidden] {
        display: none;
      }
      .panel .group {
        margin-bottom: 0;
      }
      .panel .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
      }
      .field-box {
        display: flex;
        align-items: center;
        min-height: 50px;
        padding: 0 0.875rem;
      }
      .field-box textarea.text-input {
        min-height: 88px;
        padding: 0.625rem 0;
      }
      .toast-pill .material-symbols-rounded {
        color: var(--accent);
      }
      /* ===== Formular-Seiten: Kopf mit Gesamtpreis, Abschnitte, Felder ===== */
      #stepwrap .hero {
        margin-bottom: 0.875rem;
      }
      #stepwrap .progress-bar {
        color: var(--accent);
      }
      #stepwrap .back-btn {
        margin-bottom: 0.25rem;
      }
      #stepwrap .tab-strip {
        margin-top: 0.875rem;
        margin-bottom: 0.75rem;
      }
      .group--form > * + * {
        border-top: 1px solid var(--border-separator);
      }
      textarea.text-input {
        resize: none;
      }
      .field-hint,
      .check-label small {
        display: block;
        color: var(--text-tertiary);
        font-size: var(--text-caption);
      }
      .field .field-box {
        margin: 0.5rem 0 0.25rem;
      }
      .field .tab-strip {
        margin-inline: 0;
        padding-inline: 0;
        margin-top: 0.375rem;
        margin-bottom: 0.5rem;
      }
      .segmented-inline {
        flex: none;
        width: 9.5rem;
      }
      .meas-notes {
        padding: 0 0.25rem 0.625rem;
        color: var(--text-secondary);
        font-size: var(--text-caption);
      }
      .auto b {
        color: var(--system-green);
        font-weight: 600;
      }
      .auto .man {
        color: var(--system-orange);
        font-weight: 600;
      }
      .jump-link {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--accent);
        font: inherit;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }
      .ferr {
        color: var(--system-red);
        font-size: var(--text-sub);
        font-weight: 600;
        margin-top: 0.375rem;
      }
      .has-error {
        outline: 1px solid var(--system-red);
        border-radius: var(--radius-icon);
      }
      /* F-Gase-Status: Tint-Hinweis, Farbe nur über Tokens */
      .fgas {
        margin: 0 0 1.5rem;
        padding: 0.75rem 1rem;
        border: 1px solid var(--surface-inner-border);
        border-radius: var(--radius-control);
        background: var(--surface-inner-bg);
        color: var(--text-primary);
        font-size: var(--text-sub);
      }
      .fgas.warn {
        border-color: var(--system-orange-border);
        background: var(--system-orange-tint);
      }
      .fgas.ok {
        border-color: var(--system-green-border);
        background: var(--system-green-tint);
      }
      .fgas b {
        display: block;
        font-size: var(--text-body);
        font-weight: 600;
      }
      /* Ergebnis: Zeilen mit Haarlinien, Summen betont */
      .info-row--sum .info-row-label,
      .info-row--sum .info-row-value {
        color: var(--text-primary);
        font-weight: 600;
      }
      .info-row--total .info-row-label,
      .info-row--total .info-row-value {
        color: var(--text-primary);
        font-size: 1.125rem;
        font-weight: 700;
      }
      .info-row-label {
        flex: 1;
        overflow-wrap: anywhere;
      }
      .info-row-value {
        text-align: right;
      }
      /* Lesetexte (Fragen an den Kunden, Info) */
      .prose {
        margin: 0 0 2.25rem;
        font-size: var(--text-sub);
      }
      .prose-list {
        display: flex;
        flex-direction: column;
        gap: 0.625rem;
        margin: 0 0 2.25rem;
        padding-left: 1.25rem;
        font-size: var(--text-sub);
      }
      .flash {
        border-radius: var(--radius-icon);
        animation: flash 900ms ease-out;
      }
      @keyframes flash {
        from {
          background-color: var(--surface-inner-bg);
        }
      }
      /* iPhone/iPad: Datumsfeld hat sonst eine feste Mindestbreite und ragt über den Rand */
      input[type='date'] {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        text-align: left;
        margin: 0;
      }
      input[type='date']::-webkit-date-and-time-value {
        text-align: left;
        min-width: 0;
        margin: 0;
      }
      input[type='date']::-webkit-datetime-edit {
        padding: 0;
        text-align: left;
      }
      /* Bericht-Vorschau (A4-Seiten) */
      .sheetwrap {
        padding: 1rem 0 1px;
        border-radius: var(--radius-icon);
        background: var(--surface-inner-bg);
        overflow: hidden;
      }
      /* Bericht: Tabellen wie vor dem Wechsel auf global.css (gleiche Spezifität wie die frühere Grundregel) */
      :where(.report) th,
      :where(.report) td {
        vertical-align: top;
      }
      .report table {
        font-feature-settings: 'tnum' 1;
      }
      /* Schrift des Ausdrucks – lokal, damit das PDF auch offline gleich aussieht (SIL Open Font License) */
      @font-face {
        font-family: var(--font-sans);
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(shared/lib/fonts/plus-jakarta-sans-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF,
          U+FFFD;
      }
      @font-face {
        font-family: var(--font-sans);
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(shared/lib/fonts/plus-jakarta-sans-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF,
          U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }
    </style>
  </head>
  <body>
    <div class="ambient-canvas" aria-hidden="true"></div>

    <div class="app-shell" id="appShell">
      <header class="app-header">
        <div class="app-header-text">
          <h1 class="brand-title" id="apptitle">Kalkulation</h1>
          <p class="brand-subtitle" id="hsub">Kalkulationen</p>
          <div id="net" class="net"></div>
        </div>
        <button
          type="button"
          class="icon-btn"
          id="themeToggleBtn"
          aria-label="Darstellung wechseln"
        ></button>
        <button
          type="button"
          class="icon-btn"
          id="btnset"
          data-act="settings"
          aria-label="Einstellungen"
        >
          <span class="material-symbols-rounded" aria-hidden="true">settings</span>
          <span class="status-dot settings-update-dot" id="app-update-dot" hidden></span>
        </button>
      </header>
      <div id="stepwrap" hidden></div>
      <div class="stage"><main id="app"></main></div>
    </div>
    <div class="bar" id="bar" hidden></div>

    <!-- Einstellungen und Rückfragen: mittige Karte, einzige Glasfläche der Seite -->
    <div
      class="modal-overlay"
      id="modalHost"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >
      <div class="liquid-glass modal-card">
        <div class="panel" id="panelSettings">
          <div class="modal-head">
            <h2 class="modal-title" id="settingsTitle">Einstellungen</h2>
            <button class="icon-btn" id="modalCloseBtn" type="button" aria-label="Schließen">
              <span class="material-symbols-rounded" aria-hidden="true">close</span>
            </button>
          </div>
          <div class="panel" id="settingsBody"></div>
        </div>

        <div class="panel" id="panelConfirm" hidden>
          <h2 class="modal-title" id="cfTitle"></h2>
          <p class="modal-text" id="cfText"></p>
          <div class="modal-actions modal-actions--row">
            <button type="button" class="btn-secondary" id="cfCancel">Abbrechen</button>
            <button type="button" class="btn-primary" id="cfOk">Bestätigen</button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast-pill" id="toast" role="status" aria-live="polite">
      <span class="material-symbols-rounded" aria-hidden="true">info</span>
      <span id="toastText"></span>
    </div>

    <script src="shared/pdf-bausteine.js"></script>
    <script src="shared/pdf.js"></script>
    <script src="shared/settings.js"></script>
    <script>
      'use strict';
      const C = window.CFG;
      document.title = C.appName;
      document.getElementById('apptitle').textContent = C.header;

      /* =====================================================================
   Felder einer Kalkulation. col = exakter Spaltenname im Blatt "Kalkulationen".
   Geräte und Material kommen aus config.js.
   ===================================================================== */
      const POS = C.geraete
        .map((g) => Object.assign({ grp: 'geraet' }, g))
        .concat(C.material.map((m) => Object.assign({ grp: 'material' }, m)));
      const POSBY = Object.fromEntries(POS.map((x) => [x.id, x]));
      const FIELDS = [
        { id: 'projekt', col: 'Projektnummer' },
        { id: 'datum', col: 'Datum', type: 'date' },
        { id: 'kunde', col: 'Kunde' },
        { id: 'standort', col: 'Objekt / Standort' },
        { id: 'bearbeiter', col: 'Erstellt von' },
        { id: 'anzTech', col: 'Anzahl Servicetechniker', type: 'num' },
        { id: 'anzHelfer', col: 'Anzahl Helfer / Azubis', type: 'num' },
        ...POS.map((x) => ({
          id: x.id,
          col:
            (x.grp === 'geraet' ? 'Anzahl ' : 'Menge ') +
            x.label +
            (x.grp === 'material' ? ` (${x.unit})` : ''),
          type: 'num',
        })),
        { id: 'km', col: 'Kältemittel' },
        { id: 'gwp', col: 'GWP', type: 'num' },
        { id: 'menge', col: 'Füllmenge je Kreis (kg)', type: 'num' },
        { id: 'kreise', col: 'Anzahl Kältekreise', type: 'num' },
        { id: 'herm', col: 'Hermetisch geschlossen' },
        { id: 'leck', col: 'Leckage-Erkennungssystem' },
        { id: 'anfahrt', col: 'Anfahrtspauschale (€)', type: 'num' },
        { id: 'erschwernis', col: 'Steigtechnik / Erschwernis (€)', type: 'num' },
        { id: 'sonderText', col: 'Sonderposition' },
        { id: 'sonderPreis', col: 'Sonderposition (€)', type: 'num' },
        { id: 'pauschal', col: 'Pauschalangebot' },
        { id: 'bem', col: 'Bemerkungen' },
      ];
      const PAGES = [
        { short: 'Projekt', title: 'Projekt & Team' },
        { short: 'Anlage', title: C.geraeteTitle },
        { short: 'Kältemittel', title: 'Kältemittel & F-Gase-Prüfung' },
        { short: 'Material', title: 'Material, Anfahrt & Sonstiges' },
        { short: 'Ergebnis', title: 'Ergebnis & Abschluss' },
      ];

      /* ---------- Speicher ---------- */
      const LS = {
        get(k, d) {
          try {
            const v = localStorage.getItem(k);
            return v ? JSON.parse(v) : d;
          } catch (e) {
            return d;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, JSON.stringify(v));
            return true;
          } catch (e) {
            toast('Speichern fehlgeschlagen – Speicher voll? Übertragene Kalkulationen löschen.');
            return false;
          }
        },
      };
      const K = (name) => C.ls + '.' + name;
      let settings = Object.assign(
        { url: '', token: '', firma: '', techniker: '' },
        LS.get(K('settings'), {}),
      );
      let calcs = LS.get(K('calcs'), []);
      let dbCache = LS.get(K('db'), { at: null, list: [] });
      let stammCache = LS.get(K('stamm'), { at: null, values: {} });
      const save = () => LS.set(K('calcs'), calcs);

      /* ---------- Helfer ---------- */
      const $ = (s) => document.querySelector(s);
      const app = $('#app');
      document.addEventListener('focusin', (e) => {
        const el = e.target;
        if (
          el &&
          el.tagName === 'INPUT' &&
          (el.type === 'number' || el.inputMode === 'decimal' || el.inputMode === 'numeric')
        ) {
          try {
            el.select();
          } catch (err) {}
        }
      });
      function esc(s) {
        return String(s ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      }
      function uid() {
        return window.crypto && crypto.randomUUID
          ? crypto.randomUUID()
          : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      }
      function today() {
        const d = new Date();
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 10);
      }
      function fmtDate(s) {
        if (!s) return '';
        const d = new Date(String(s).length === 10 ? s + 'T12:00:00' : s);
        return isNaN(d) ? String(s) : d.toLocaleDateString('de-DE');
      }
      function fmtDateTime(s) {
        if (!s) return '';
        const d = new Date(s);
        return isNaN(d)
          ? String(s)
          : d.toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' });
      }
      function num(v) {
        return typeof v === 'number'
          ? v
          : Number(
              String(v ?? '')
                .trim()
                .replace(/\s/g, '')
                .replace(',', '.'),
            );
      }
      function isN(v) {
        return v !== '' && v != null && !isNaN(num(v));
      }
      function n0(v) {
        return isN(v) ? num(v) : 0;
      }
      function round(n, d) {
        const f = Math.pow(10, d);
        return Math.round(n * f) / f;
      }
      function fmtNum(n) {
        return String(n).replace('.', ',');
      }
      function de(n, d) {
        return Number(n || 0).toLocaleString('de-DE', {
          minimumFractionDigits: d,
          maximumFractionDigits: d,
        });
      }
      function eur(n) {
        return de(n, 2) + ' €';
      }
      function hrs(min) {
        return de(min / 60, 2) + ' h';
      }
      function qtyText(n, unit) {
        return fmtNum(round(n, 2)) + (unit ? ' ' + unit : '');
      }
      let toastTimer;
      function toast(msg) {
        const t = $('#toast');
        if (!t) return;
        $('#toastText').textContent = msg;
        t.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('is-visible'), 3500);
      }
      /* Bewegung reduzieren (Systemeinstellung) und kurzes Aufleuchten eines geänderten Werts */
      const RM = () =>
        !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      function flash(el) {
        if (!el || RM()) return;
        el.classList.remove('flash');
        void el.offsetWidth;
        el.classList.add('flash');
      }
      let calcSeen = {}; // zuletzt angezeigte Rechenwerte -> Aufleuchten nur bei echter Änderung
      function calcTouch(id, text, el) {
        const k = view.id + ':' + id;
        if (k in calcSeen && calcSeen[k] !== text) flash(el);
        calcSeen[k] = text;
      }

      /* ---------- Stammdaten (zentral im Google Sheet, hier zwischengespeichert) ---------- */
      function stammNow() {
        const S = {};
        C.stamm.forEach((s) => {
          const x = stammCache.values[s.key];
          S[s.key] =
            typeof s.def === 'number'
              ? isN(x)
                ? num(x)
                : s.def
              : x != null && String(x).trim() !== ''
                ? String(x)
                : s.def;
        });
        return S;
      }
      async function loadStamm(silent) {
        if (!settings.url || !navigator.onLine) return false;
        try {
          const j = await api('stamm');
          stammCache = { at: new Date().toISOString(), values: j.values || {} };
          LS.set(K('stamm'), stammCache);
          if (!silent) toast('Stammdaten aus der Datenbank geladen.');
          return true;
        } catch (e) {
          if (!silent) toast('Stammdaten konnten nicht geladen werden: ' + e.message);
          return false;
        }
      }

      /* ---------- Rechnen ---------- */
      function qtys(v) {
        return Object.fromEntries(POS.map((x) => [x.id, n0(v[x.id])]));
      }
      /* Automatische Vorschläge (Reinigungsmittel, GWP …) – nur solange der Wert nicht von Hand geändert wurde */
      function applyAutos(p) {
        const S = p.stamm,
          v = p.values,
          man = p.manual || (p.manual = {});
        POS.filter((x) => x.auto).forEach((x) => {
          if (man[x.id]) return;
          const a = round(Math.max(0, x.auto(qtys(v), S)), 2);
          v[x.id] = a ? fmtNum(a) : '';
        });
        if (!man.gwp) {
          const g = C.kaeltemittel[v.km];
          v.gwp = g != null ? String(g) : '';
        }
        if (C.hermAuto && !man.herm) v.herm = C.hermAuto(qtys(v));
      }
      /* F-Gase-Verordnung (EU) 2024/573, Art. 5: Prüfpflicht ab 5 t CO₂-Äq. (hermetisch geschlossen ab 10 t);
   Intervalle 12 / 6 / 3 Monate ab 5 / 50 / 500 t – mit Leckage-Erkennungssystem doppelt so lang. */
      function pruefung(v, S) {
        const km = String(v.km || '').trim(),
          gwp = n0(v.gwp),
          kreise = Math.max(1, Math.round(n0(v.kreise)) || 1);
        const menge = n0(v.menge),
          co2 = round((menge * gwp) / 1000, 2);
        const herm = v.herm === 'Ja',
          leck = v.leck === 'Ja',
          grenze = herm ? 10 : 5;
        const out = {
          km,
          gwp,
          kreise,
          menge,
          co2,
          herm,
          leck,
          grenze,
          state: 'leer',
          monate: 0,
          min: 0,
          text: 'Kältemittel nicht angegeben',
        };
        if (!km) return out;
        if (/^R ?290/i.test(km) || (isN(v.gwp) && gwp < 150 && /propan|r ?290/i.test(km))) {
          if (C.r290Key) {
            return Object.assign(out, {
              state: 'r290',
              min: S[C.r290Key] * kreise,
              text: 'R290 (Propan, A3): jährliche Sicherheits- und Dichtheitsprüfung (Schutzbereich, Lecksuche mit Ex-geschütztem Gerät)',
            });
          }
          return Object.assign(out, {
            state: 'frei',
            text: 'Natürliches Kältemittel (R290): keine Prüfpflicht nach F-Gase-Verordnung',
          });
        }
        if (!isN(v.gwp))
          return Object.assign(out, {
            state: 'leer',
            text: 'GWP-Wert für dieses Kältemittel eintragen',
          });
        if (!menge)
          return Object.assign(out, { state: 'leer', text: 'Füllmenge je Kältekreis eintragen' });
        const m = co2 >= 500 ? 3 : co2 >= 50 ? 6 : co2 >= grenze ? 12 : 0;
        if (!m)
          return Object.assign(out, {
            state: 'frei',
            text: `Keine Prüfpflicht: ${de(co2, 2)} t CO₂-Äq. je Kreis (Grenze ${grenze} t${herm ? ', hermetisch geschlossen' : ''})`,
          });
        const monate = leck ? m * 2 : m;
        return Object.assign(out, {
          state: 'pflicht',
          monate,
          min: S.t_dicht * kreise,
          text: `Dichtheitsprüfung Pflicht alle ${monate} Monate: ${de(co2, 2)} t CO₂-Äq. je Kreis${leck ? ' (mit Leckage-Erkennungssystem)' : ''}`,
        });
      }
      function teamText(nT, nH) {
        return (
          `${nT} Servicetechniker` +
          (nH ? ` + ${nH} ${nH === 1 ? 'Helfer / Azubi' : 'Helfer / Azubis'}` : '')
        );
      }
      /* Richtzeiten = Einsatzdauer vor Ort. Jeder Servicetechniker und jeder Helfer ist den ganzen Einsatz dabei
   und wird für die volle Dauer berechnet (2 Techniker = doppelte Lohnkosten Techniker). */
      function calc(p) {
        const v = p.values,
          S = p.stamm,
          q = qtys(v),
          pr = pruefung(v, S);
        const nT = Math.max(1, Math.round(n0(v.anzTech)) || 1),
          nH = Math.max(0, Math.round(n0(v.anzHelfer)));
        const leistung = C.geraete
          .filter((g) => q[g.id] > 0)
          .map((g) => ({
            kat: g.kat,
            label: g.label,
            menge: qtyText(q[g.id], g.unit),
            umfang: g.umfang,
            min: q[g.id] * S[g.t],
          }));
        if (pr.state === 'pflicht')
          leistung.push({
            kat: 'Gesetzliche Prüfung',
            label: 'Dichtheitsprüfung nach F-Gase-Verordnung (EU) 2024/573 inkl. Protokoll',
            menge: pr.kreise === 1 ? '1 Kreis' : pr.kreise + ' Kreise',
            umfang: `Prüfintervall alle ${pr.monate} Monate`,
            min: pr.min,
          });
        if (pr.state === 'r290')
          leistung.push({
            kat: 'Sicherheit (A3)',
            label: 'R290 Dichtheits- & Sicherheitsprüfung inkl. Protokoll',
            menge: pr.kreise === 1 ? '1 Kreis' : pr.kreise + ' Kreise',
            umfang: 'Schutzbereich, Lecksuche mit Ex-geschütztem Gerät, Sicherheitseinrichtungen',
            min: pr.min,
          });
        const material = C.material
          .filter((m) => q[m.id] > 0)
          .map((m) => ({
            label: m.label,
            menge: qtyText(q[m.id], m.unit),
            preis: S[m.price],
            betrag: round(q[m.id] * S[m.price], 2),
          }));
        const pausch = (label, x) => {
          if (n0(x) > 0)
            material.push({ label, menge: '1 Pauschale', preis: n0(x), betrag: round(n0(x), 2) });
        };
        pausch('Anfahrtspauschale (An- und Abfahrt zum Objekt)', v.anfahrt);
        pausch(C.erschwernisLabel, v.erschwernis);
        if (n0(v.sonderPreis) > 0 || String(v.sonderText || '').trim())
          material.push({
            label: String(v.sonderText || '').trim() || 'Sonderposition',
            menge: '1 Pauschale',
            preis: n0(v.sonderPreis),
            betrag: round(n0(v.sonderPreis), 2),
          });
        const minRicht = leistung.reduce((a, x) => a + x.min, 0);
        const dauer = minRicht,
          minTech = minRicht * nT;
        const lohnTech = round((minTech / 60) * S.satz_tech, 2),
          lohnHelfer = round((dauer / 60) * nH * S.satz_helfer, 2);
        const lohn = round(lohnTech + lohnHelfer, 2);
        const mat = round(
          material.reduce((a, x) => a + x.betrag, 0),
          2,
        );
        const netto = round(lohn + mat, 2),
          mwst = round((netto * S.mwst) / 100, 2),
          brutto = round(netto + mwst, 2);
        return {
          S,
          q,
          pr,
          nT,
          nH,
          team: teamText(nT, nH),
          leistung,
          material,
          minRicht,
          minTech,
          dauer,
          lohnTech,
          lohnHelfer,
          lohn,
          mat,
          netto,
          mwst,
          brutto,
        };
      }

      /* Bericht-Datenstruktur – identisch genutzt von App-PDF und Apps-Script-PDF */
      function buildReport(p) {
        const v = p.values,
          k = calc(p),
          S = k.S,
          pa = v.pauschal === 'Ja',
          pr = k.pr;
        const tiles = [
          {
            cls: 'primary',
            lab: 'Gesamtpreis brutto',
            val: eur(k.brutto),
            sub: `Netto ${eur(k.netto)} zzgl. ${fmtNum(S.mwst)} % MwSt.`,
          },
        ];
        tiles.push(
          pa
            ? {
                lab: 'Team vor Ort',
                val: `${k.nT + k.nH} ${k.nT + k.nH === 1 ? 'Person' : 'Personen'}`,
                sub: k.team,
              }
            : {
                lab: 'Arbeitszeit gesamt',
                val: hrs(k.minTech + k.dauer * k.nH),
                sub: `Einsatz vor Ort ca. ${hrs(k.dauer)}, ${k.nT + k.nH} ${k.nT + k.nH === 1 ? 'Person' : 'Personen'}`,
              },
        );
        tiles.push(
          pr.state === 'pflicht'
            ? {
                cls: 'warn',
                lab: 'Dichtheitsprüfung',
                val: `alle ${pr.monate} Monate`,
                sub: `Pflicht: ${de(pr.co2, 2)} t CO₂-Äq. je Kreis`,
              }
            : pr.state === 'r290'
              ? {
                  cls: 'warn',
                  lab: 'Sicherheitsprüfung',
                  val: 'R290 jährlich',
                  sub: 'Dichtheits- & Sicherheitsprüfung (A3)',
                }
              : pr.state === 'frei'
                ? {
                    cls: 'ok',
                    lab: 'Dichtheitsprüfung',
                    val: 'keine Pflicht',
                    sub:
                      pr.km === 'R290' || /290/.test(pr.km)
                        ? 'natürliches Kältemittel'
                        : `${de(pr.co2, 2)} t CO₂-Äq. je Kreis (Grenze ${pr.grenze} t)`,
                  }
                : { lab: 'Dichtheitsprüfung', val: '—', sub: pr.text },
        );
        const projekt = [
          { label: 'Kunde', value: v.kunde },
          { label: 'Objekt / Standort', value: v.standort },
          { label: 'Team vor Ort', value: k.team },
          { label: 'Erstellt von', value: v.bearbeiter },
        ];
        const leistung = pa
          ? {
              head: ['Pos.', 'Komponente / Leistung', 'Menge', 'Leistungsumfang'],
              cls: ['', '', 'num', ''],
              widths: ['7%', '41%', '12%', '40%'],
              rows: k.leistung.map((x, i) => ({
                cells: [String(i + 1), x.label, x.menge, x.umfang],
              })),
            }
          : {
              head: ['Pos.', 'Komponente / Leistung', 'Menge', 'Leistungsumfang', 'Zeit'],
              cls: ['', '', 'num', '', 'num'],
              widths: ['6%', '38%', '11%', '35%', '10%'],
              rows: k.leistung.map((x, i) => ({
                cells: [String(i + 1), x.label, x.menge, x.umfang, de(x.min, 0) + ' Min'],
              })),
            };
        const material = pa
          ? {
              head: ['Pos.', 'Material / Nebenleistung', 'Menge', 'Abrechnung'],
              cls: ['', '', 'num', ''],
              widths: ['7%', '51%', '16%', '26%'],
              rows: k.material.map((x, i) => ({
                cells: [String(i + 1), x.label, x.menge, 'im Pauschalpreis enthalten'],
              })),
            }
          : {
              head: ['Pos.', 'Material / Nebenleistung', 'Menge', 'Einzelpreis', 'Betrag netto'],
              cls: ['', '', 'num', 'num', 'num'],
              widths: ['6%', '46%', '16%', '16%', '16%'],
              rows: k.material.map((x, i) => ({
                cells: [String(i + 1), x.label, x.menge, eur(x.preis), eur(x.betrag)],
              })),
            };
        const km = pr.km
          ? [
              {
                label: 'Kältemittel',
                value: pr.km + (isN(v.gwp) ? ` (GWP ${fmtNum(v.gwp)})` : ''),
              },
              {
                label: 'Füllmenge',
                value:
                  (isN(v.menge) ? fmtNum(v.menge) + ' kg' : '—') +
                  ` × ${pr.kreise} ${pr.kreise === 1 ? 'Kreis' : 'Kreise'}`,
              },
              {
                label: 'CO₂-Äquivalent je Kreis',
                value: isN(v.gwp) && pr.menge ? de(pr.co2, 2) + ' t' : '',
              },
              {
                label: 'Hermetisch / Leckage-Erk.',
                value: `${v.herm || 'Nein'} / ${v.leck || 'Nein'}`,
              },
              { label: 'Prüfpflicht', value: pr.text, wide: true },
            ]
          : [];
        const kosten = {
          head: ['Kostenaufstellung', 'Betrag'],
          cls: ['', 'num'],
          widths: ['75%', '25%'],
          rows: [],
        };
        if (pa)
          kosten.rows.push({
            cells: [
              'Pauschalpreis netto (Arbeitszeit, Material, Anfahrt und Nebenleistungen)',
              eur(k.netto),
            ],
            cls: 'sum',
          });
        else {
          kosten.rows.push({
            cells: [
              `Lohnkosten Servicetechniker (${k.nT > 1 ? k.nT + ' × ' : ''}${hrs(k.dauer)} × ${eur(S.satz_tech)})`,
              eur(k.lohnTech),
            ],
          });
          if (k.nH)
            kosten.rows.push({
              cells: [
                `Lohnkosten Helfer / Azubi (${k.nH} × ${hrs(k.dauer)} × ${eur(S.satz_helfer)})`,
                eur(k.lohnHelfer),
              ],
            });
          kosten.rows.push({ cells: ['Material, Anfahrt & Nebenleistungen', eur(k.mat)] });
          kosten.rows.push({ cells: ['Nettobetrag gesamt', eur(k.netto)], cls: 'sum' });
        }
        kosten.rows.push({ cells: [`zzgl. ${fmtNum(S.mwst)} % MwSt.`, eur(k.mwst)] });
        kosten.rows.push({ cells: ['Gesamtpreis brutto', eur(k.brutto)], cls: 'tot' });
        return {
          kicker: pa ? 'ANGEBOT' : 'KALKULATION',
          title: C.pdfTitle,
          firma: settings.firma || '',
          id: v.projekt || '',
          datum: fmtDate(v.datum),
          kunde: v.kunde || '',
          tiles,
          projekt,
          leistung,
          material,
          km,
          kosten,
          remark: v.bem || '',
          hinweis: pa ? S.text_angebot : S.text_intern,
        };
      }
      /* Spaltenwerte fürs Google Sheet */
      function buildCols(p) {
        const v = p.values,
          k = calc(p);
        const out = [];
        const add = (col, x, kind) => out.push([col, x, kind || '']);
        const f = (id) => FIELDS.find((x) => x.id === id);
        ['projekt', 'datum', 'kunde', 'standort', 'bearbeiter'].forEach((id) => {
          const x = f(id);
          add(x.col, v[id] || '', x.type === 'date' && v[id] ? 'date' : '');
        });
        add('Netto (€)', k.netto);
        add('MwSt (€)', k.mwst);
        add('Brutto (€)', k.brutto);
        add('Arbeitszeit Techniker (h)', round(k.minTech / 60, 2));
        add('Einsatzdauer vor Ort (h)', round(k.dauer / 60, 2));
        add('Lohnkosten netto (€)', k.lohn);
        add('Material & Nebenkosten netto (€)', k.mat);
        add('CO₂-Äquivalent je Kreis (t)', k.pr.km && isN(v.gwp) && k.pr.menge ? k.pr.co2 : '');
        add('Prüfpflicht F-Gase', k.pr.km ? k.pr.text : '');
        FIELDS.slice(5).forEach((x) => {
          const val = v[x.id];
          add(
            x.col,
            val === '' || val == null ? '' : x.type === 'num' && isN(val) ? num(val) : String(val),
          );
        });
        return out;
      }

      /* ---------- Navigation ---------- */
      let view = { name: 'home' };
      let pdfBusy = null,
        pdfProg = 0,
        pdfTick = null,
        hsubAnim = null,
        lastPk = '';
      /* Überblenden beim Wechsel der Ansicht: alte Fläche 90 ms aus, neue 220 ms ein */
      let fadenNr = 0;
      function fadeThrough(change) {
        if (RM() || !app.animate) {
          change();
          return;
        }
        const nr = ++fadenNr;
        app.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 90, easing: 'ease-out' });
        setTimeout(() => {
          if (nr !== fadenNr) return;
          change();
          app.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' });
        }, 90);
      }
      function go(name, params) {
        const was = view.name;
        view = Object.assign({ name }, params || {});
        if (name === 'wizard' && was !== 'wizard') calcSeen = {};
        if (name === 'wizard') {
          render();
          window.scrollTo(0, 0);
          return;
        }
        fadeThrough(() => {
          render();
          window.scrollTo(0, 0);
        });
      }
      function cur() {
        return calcs.find((p) => p.id === view.id);
      }
      function render() {
        app.innerHTML = (Views[view.name] || Views.home)();
        const wiz = view.name === 'wizard' && cur();
        if (wiz) {
          const pk = view.id + ':' + wiz.page;
          if (pk !== lastPk) {
            lastPk = pk;
            Object.keys(calcSeen).forEach((k) => {
              if (k.indexOf(':res') > 0) delete calcSeen[k];
            });
          }
        }
        document.body.classList.toggle('in-wizard', view.name === 'wizard');
        setHeader(true);
        setSteps();
        setBar();
        if (wiz) live();
        if (view.name === 'report') showReport();
        updateNet();
        nachRender();
      }

      /* ===== Rahmen: Modal-Karte, Darstellung, Update ===== */
      /* Mittige Karte (Einstellungen und Rückfragen): Rest der Seite inaktiv, Escape schließt */
      let modalFocus = null;
      let modalPanel = null;
      let confirmDone = null;
      function modalOpen(panel) {
        const host = $('#modalHost');
        modalPanel = panel;
        $('#panelSettings').hidden = panel !== 'settings';
        $('#panelConfirm').hidden = panel !== 'confirm';
        host.setAttribute('aria-labelledby', panel === 'settings' ? 'settingsTitle' : 'cfTitle');
        $('#appShell').inert = true;
        $('#bar').inert = true;
        modalFocus = document.activeElement;
        host.classList.add('is-open');
        const first = host.querySelector(
          `#${panel === 'settings' ? 'panelSettings' : 'panelConfirm'} button`,
        );
        if (first) first.focus();
      }
      function modalClose() {
        if (!modalPanel) return;
        const war = modalPanel;
        modalPanel = null;
        $('#modalHost').classList.remove('is-open');
        $('#appShell').inert = false;
        $('#bar').inert = false;
        if (modalFocus && modalFocus.focus) modalFocus.focus();
        if (war === 'confirm' && confirmDone) {
          const fertig = confirmDone;
          confirmDone = null;
          fertig(false);
        }
        if (war === 'settings') render();
      }
      /* Rückfrage (ersetzt den Browser-Dialog) */
      function confirmModal(title, message, confirmLabel = 'Bestätigen', danger = false) {
        return new Promise((resolve) => {
          $('#cfTitle').textContent = title;
          $('#cfText').textContent = message;
          const ok = $('#cfOk');
          ok.textContent = confirmLabel;
          ok.className = danger ? 'btn-danger' : 'btn-primary';
          confirmDone = resolve;
          modalOpen('confirm');
        });
      }
      function openSettings() {
        $('#settingsBody').innerHTML = settingsBody();
        syncThemeUi();
        updateUi();
        modalOpen('settings');
        nachRender();
      }
      document.addEventListener('click', (e) => {
        if (e.target.closest('#modalCloseBtn') || e.target === $('#modalHost')) {
          modalClose();
        } else if (e.target.closest('#cfCancel')) {
          modalClose();
        } else if (e.target.closest('#cfOk')) {
          const fertig = confirmDone;
          confirmDone = null;
          modalPanel = null;
          $('#modalHost').classList.remove('is-open');
          $('#appShell').inert = false;
          $('#bar').inert = false;
          if (modalFocus && modalFocus.focus) modalFocus.focus();
          if (fertig) fertig(true);
        }
        const tc = e.target.closest('[data-theme-choice]');
        if (tc) setzeDarstellung(tc.dataset.themeChoice);
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') modalClose();
      });

      /* Darstellung: Segment in den Einstellungen kennt zusätzlich „System“, der Kopf-Knopf schaltet Hell und Dunkel */
      const systemHell = window.matchMedia('(prefers-color-scheme: light)');
      function gespeicherteDarstellung() {
        try {
          const v = localStorage.getItem('ag-theme');
          return v === 'light' || v === 'dark' ? v : null;
        } catch (e) {
          return null;
        }
      }
      function syncThemeUi() {
        const wahl = gespeicherteDarstellung() || 'system';
        document

          const data = await res.json();
          const remote = String(data.version || '').trim();
          neueVersion = remote && remote !== APP_VERSION ? remote : '';

          if (manuell) {

      /* @@quelle:reportParts */
      /* Ausdruck im Muther-Design: A4-Seiten mit Kacheln, Tabellen mit Seitenumbruch („Fortsetzung“) und Fußzeile „Seite x von y“.
   Nimmt die Bericht-Datenstruktur von buildReport() unverändert entgegen (die App speichert sie auch im Sheet).
   Die HTML-Bausteine kommen aus shared/pdf-bausteine.js (pdfBausteine()), das CSS aus shared/pdf.css. */
      function reportParts(r) {
        const B = pdfBausteine(),
          { esc, nl } = B;
        const firma = r.firma || (typeof settings !== 'undefined' ? settings.firma : '') || '';
        // Tabelle aus buildReport: head, cls (Spalten, 'num' = rechts), widths, rows [{cells, cls:'sum'|'tot'}]
        const tab = (titel, t, split) => {
          const bl = B.tabelle({
            titel,
            head: t.head.map((h, i) => ({ t: h, w: t.widths[i], num: t.cls[i] === 'num' })),
            rows: t.rows.map((row) => ({
              cls: row.cls,
              cells: row.cells.map((c, i) => ({ html: nl(c), cls: t.cls[i] })),
            })),
          });
          bl.split = split; // Preis-Tabelle bleibt zusammen (kein Umbruch mitten in der Summe)
          return bl;
        };
        const blocks = [];
        blocks.push({
          html: B.kacheln(
            (r.tiles || []).map((t) => ({ art: t.cls, lab: t.lab, val: t.val, sub: t.sub })),
          ),
        });
        blocks.push({ html: B.abschnitt('Projektdaten', B.kv(r.projekt || [])) });
        const tsec = (title, t) =>
          t && t.rows && t.rows.length
            ? blocks.push(tab(title, t, true))
            : blocks.push({ html: B.abschnitt(title, '<div class="none">Keine Positionen</div>') });
        tsec('Leistungsumfang', r.leistung);
        tsec('Material & Nebenleistungen', r.material);
        blocks.push(tab(r.kicker === 'ANGEBOT' ? 'Preis' : 'Kostenaufstellung', r.kosten, false));
        if (r.km && r.km.length)
          blocks.push({ html: B.abschnitt('Kältemittel & F-Gase-Prüfung', B.kv(r.km)) });
        if (r.remark) blocks.push({ html: B.notiz({ titel: 'Bemerkungen', text: r.remark }) });
        if (r.hinweis)
          blocks.push({ html: B.rechtstext([{ titel: 'Hinweis.', text: r.hinweis }]) });
        const kick = r.kicker === 'ANGEBOT' ? 'Angebot' : 'Kalkulation';
        const id = r.id || '—';
        return {
          blocks,
          head: B.kopf({
            firma,
            kicker: r.kicker,
            titel: r.title,
            nrLabel: 'Projekt-Nr.',
            id,
            datum: r.datum,
          }),
          smallHead: B.kopfKlein({
            firma,
            zeile: r.kunde || '',
            titel: kick + ' ' + r.title,
            nrLabel: 'Projekt-Nr.',
            id,
          }),
          foot: B.fuss({ text: kick + ' ' + r.title, stand: r.datum }),
          id: esc(id),
        };
      }

      /* ---------- Google-Sheet-Schnittstelle ---------- */
      async function api(action, data) {
        if (!settings.url) throw new Error('Keine Web-App-URL in den Einstellungen.');
        const res = await fetch(settings.url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // "simple request" → kein CORS-Preflight
          body: JSON.stringify(Object.assign({ token: settings.token, action }, data || {})),
        });
        let j;
        try {
          j = await res.json();
        } catch (e) {
          throw new Error('Unerwartete Antwort – ist die Web-App für „Jeder“ freigegeben?');
        }
        if (!j.ok) throw new Error(j.error || 'Unbekannter Fehler');
        return j;
      }
      let syncing = false;
      async function syncAll(silent) {
        if (syncing) return;
        const list = calcs.filter((p) => p.status === 'done' && !p.synced);
        if (!list.length) {
          if (!silent) toast('Alles ist bereits in der Datenbank.');
          return;
        }
        if (!settings.url) {
          if (!silent) toast('Bitte zuerst die Web-App-URL in den Einstellungen eintragen.');
          return;
        }
        if (!navigator.onLine) {
          if (!silent) toast('Offline – wird automatisch übertragen, sobald Internet da ist.');
          return;
        }
        syncing = true;
        let okCount = 0,
          err = null;
        for (const p of list) {
          try {
            await api('upsert', {
              protocol: {
                id: p.id,
                templateId: C.id,
                values: p.values,
                manual: p.manual || {},
                stamm: p.stamm,
                completedAt: p.completedAt,
                sourceKey: p.sourceKey || '',
                summary: { report: buildReport(p) },
                pdf: await pdfBase64(p),
              },
              cols: buildCols(p),
            });
            p.synced = true;
            p.syncedAt = new Date().toISOString();
            save();
            okCount++;
          } catch (e) {
            err = e;
            break;
          }
        }
        syncing = false;
        if (err) toast(`Übertragung fehlgeschlagen: ${err.message}`);
        else if (okCount) toast(`${okCount} Kalkulation(en) in die Datenbank übertragen.`);
        if (view.name === 'home' || view.name === 'report') render();
        else updateNet();
      }

      /* ---------- Aktionen ---------- */
      function newCalc(values, stamm) {
        const p = {
          id: uid(),
          templateId: C.id,

          manual: {},

          page: 0,
          status: 'draft',
          createdAt: new Date().toISOString(),
          synced: false,
        };
        applyAutos(p);
        calcs.unshift(p);
        save();
        return p;
      }

        copy(d) {
          const src = calcs.find((x) => x.id === d.id);
          const values = Object.assign({}, src.values, {
            projekt: '',
            datum: today(),
            bearbeiter: settings.techniker || src.values.bearbeiter || '',
          });
          const p = newCalc(values);
          p.manual = Object.assign({}, src.manual || {});
          save();
          toast('Kopie angelegt – bitte Projektnummer und Kunde anpassen.');
          go('wizard', { id: p.id });
        },
        resume(d) {
          go('wizard', { id: d.id });
        },
        report(d) {
          go('report', { id: d.id });
        },
        async reopen(d) {
          const p = calcs.find((x) => x.id === d.id);
          if (
            p.synced &&
            !(await confirmModal(
              'Bestätigen',
              'Kalkulation wieder öffnen und bearbeiten? Nach erneutem Abschließen wird der Eintrag in der Datenbank aktualisiert.',
              'Fortsetzen',
              true,
            ))
          )
            return;
          p.status = 'draft';
          p.synced = false;
          p.page = PAGES.length - 1;
          save();
          go('wizard', { id: p.id });
        },
        async del(d) {
          const p = calcs.find((x) => x.id === d.id);
          const msg = p.synced
            ? 'Kalkulation aus der App entfernen? (Sie bleibt in der Datenbank erhalten.)'
            : p.status === 'done'
              ? 'ACHTUNG: Diese Kalkulation ist noch NICHT in der Datenbank. Wirklich endgültig löschen?'
              : 'Entwurf löschen?';
          if (!(await confirmModal('Bestätigen', msg, 'Fortsetzen', true))) return;
          calcs = calcs.filter((x) => x.id !== d.id);
          save();
          render();
        },

        set(d) {
          const p = cur();
          p.values[d.f] = p.values[d.f] === d.v ? '' : d.v; // erneutes Tippen wählt ab
          if (d.f === 'herm') p.manual.herm = true;
          if (d.f === 'pauschal' && !p.values.pauschal) p.values.pauschal = 'Nein';
          applyAutos(p);
          save();
          render();
        },
        unauto(d) {
          const p = cur();
          delete p.manual[d.f];
          applyAutos(p);
          save();
          render();
        },
        stammapply() {
          const p = cur();
          p.stamm = stammNow();
          applyAutos(p);
          save();
          render();
          toast('Aktuelle Stammdaten übernommen.');
        },
        next() {
          const p = cur();
          if (p.page < PAGES.length - 1)
            wechsleSeite(() => {
              p.page++;
              save();
            });
        },
        prev() {
          const p = cur();
          if (p.page > 0)
            wechsleSeite(() => {
              p.page--;
              save();
            });
        },
        jump(d) {
          const p = cur(),
            t = Number(d.i);
          if (t === p.page) {
            render();
            window.scrollTo(0, 0);
            return;
          }
          wechsleSeite(() => {
            p.page = t;
            save();
          });
        },
        finish() {
          const p = cur();
          applyAutos(p);
          p.status = 'done';
          p.completedAt = new Date().toISOString();
          p.synced = false;
          save();
          toast('Kalkulation abgeschlossen.');
          go('report', { id: p.id });
          syncAll(true);
        },

        async makepdf(d, btn) {
          if (!window.jspdf || !window.html2canvas) {
            toast('PDF-Modul nicht geladen – App einmal online neu starten.');
            return;
          }
          if (btn && btn.classList.contains('done')) return; // Doppelstart verhindern
          const r = reportForView();
          if (!r) return;
          const name = pdfName(r.id) + '.pdf',
            key = viewKey();
          if (pdfBusy) {
            toast(
              pdfBusy !== key
                ? 'Es wird gerade ein anderes PDF erstellt …'
                : 'PDF wird noch erstellt …',
            );
            return;
          } // gleicher Bericht: Doppelstart still verhindern
          const cb = () => $('#bar .pdfb'); // immer der aktuell im DOM befindliche Knopf (die Leiste wird bei Neuzeichnen neu gebaut)
          const setP = (v) => {
            pdfProg = v;
            const f = viewKey() === key ? $('#bar .pdfb .fill') : null;
            if (f) f.style.transform = 'scaleX(' + v + ')';
          };
          pdfBusy = key;
          setP(0.05);
          {
            const b = cb();
            if (b) b.classList.add('run');
          }
          // Fortschritt ist geschätzt (der gemeinsame PDF-Code meldet keinen): nähert sich 92 %, springt bei Fertigstellung auf 100 %
          pdfTick = setInterval(() => setP(pdfProg + (0.92 - pdfProg) * 0.07), 250);
          try {
            const blob = await reportPdfBlob(r);
            clearInterval(pdfTick);
            setP(1);
            await new Promise((res) => setTimeout(res, RM() ? 0 : 240));
            if (lastPdf) URL.revokeObjectURL(lastPdf.url);
            lastPdf = {
              key,
              file: new File([blob], name, { type: 'application/pdf' }),
              url: URL.createObjectURL(blob),
            };
            pdfBusy = null;
            if (view.name === 'report' && viewKey() === key) {
              const bar = $('#pdfbar');
              if (bar) bar.innerHTML = pdfBarHtml();
              setBar(); // baut Leiste neu auf (mit Teilen-Knopf) -> neuen Knopf in den Fertig-Zustand setzen
              const nb = cb();
              if (nb) {
                nb.classList.remove('run');
                nb.classList.add('done');
                setTimeout(() => nb.classList.remove('done'), 2600);
              }
            }
            toast('PDF fertig – jetzt „Teilen“ antippen.');
          } catch (e) {
            toast('PDF konnte nicht erstellt werden: ' + e.message);
          } finally {
            clearInterval(pdfTick);
            pdfBusy = null;
            pdfProg = 0;
            const b = cb();
            if (b && !b.classList.contains('done')) {
              b.classList.remove('run');
              setP(0);
            }
          }
        },
        async sharepdf() {
          if (!lastPdf) return;
          const files = [lastPdf.file];
          if (navigator.canShare && navigator.canShare({ files })) {
            try {
              await navigator.share({ files, title: lastPdf.file.name });
            } catch (e) {
              if (e.name !== 'AbortError') toast('Teilen fehlgeschlagen: ' + e.message);
            }
          } else {
            window.open(lastPdf.url, '_blank');
          }
        },

        async dbload() {
          if (!navigator.onLine) {
            toast('Offline – zeige gespeicherten Stand.');
            return;
          }
          try {
            toast('Lade Daten …');
            const j = await api('list');
            dbCache = { at: new Date().toISOString(), list: j.list };
            LS.set(K('db'), dbCache);
            toast(`${j.list.length} Einträge geladen.`);
            render();
          } catch (e) {
            toast('Laden fehlgeschlagen: ' + e.message);
          }
        },
        async dbreport(d) {
          if (!navigator.onLine) {
            toast('Zum Öffnen einer Kalkulation aus der Datenbank wird Internet benötigt.');
            return;
          }
          try {
            toast('Lade Kalkulation …');
            const j = await api('get', { key: d.key });
            go('report', { db: true, rep: j.report, key: d.key, q: view.q });
          } catch (e) {
            toast('Laden fehlgeschlagen: ' + e.message);
          }
        },
        async dbedit(d) {
          if (!navigator.onLine) {
            toast('Zum Laden aus der Datenbank wird Internet benötigt.');
            return;
          }
          try {
            toast('Lade Kalkulation …');
            const j = await api('load', { key: d.key });
            const local = j.appId && calcs.find((x) => x.id === j.appId);
            if (
              local &&
              local.status === 'done' &&
              !local.synced &&
              !(await confirmModal(
                'Bestätigen',
                'In der App gibt es zu dieser Kalkulation noch nicht übertragene Änderungen. Durch die Version aus der Datenbank ersetzen?',
                'Fortsetzen',
                true,
              ))
            )
              return;
            if (
              local &&
              local.status === 'draft' &&
              !(await confirmModal(
                'Bestätigen',
                'Diese Kalkulation ist hier schon als Entwurf geöffnet. Durch die Version aus der Datenbank ersetzen?',
                'Fortsetzen',
                true,
              ))
            )
              return;
            const values = {};
            FIELDS.forEach((f) => {
              let x = j.values ? j.values[f.id] : j.cols[f.col];
              if (x == null) x = '';
              if (typeof x === 'number') x = fmtNum(x);
              values[f.id] = String(x);
            });
            if (j.values)
              POS.forEach((x) => {
                if (j.values[x.id] != null) values[x.id] = String(j.values[x.id]);
              });
            const p = {
              id: j.appId || uid(),
              templateId: C.id,
              values,
              manual:
                j.manual || Object.fromEntries(POS.filter((x) => x.auto).map((x) => [x.id, true])),
              stamm: Object.assign(stammNow(), j.stamm || {}),
              sourceKey: d.key,
              page: 0,
              status: 'draft',
              createdAt: new Date().toISOString(),
              synced: false,
            };
            if (!j.values) p.manual.gwp = true;
            calcs = calcs.filter((x) => x.id !== p.id);
            calcs.unshift(p);
            save();
            toast('Geladen – nach dem Bearbeiten erneut abschließen.');
            go('wizard', { id: p.id });
          } catch (e) {
            toast('Laden fehlgeschlagen: ' + e.message);
          }
        },
        async drivepdf() {
          try {
            toast('PDF wird in Google Drive erstellt …');
            const blob = await reportPdfBlob(reportForView());
            const b64 = await new Promise((res, rej) => {
              const fr = new FileReader();
              fr.onload = () => res(String(fr.result).split(',')[1]);
              fr.onerror = rej;
              fr.readAsDataURL(blob);
            });
            const j = await api('savepdf', { key: view.key, pdf: b64 });
            const e = dbCache.list.find((x) => x.key === view.key);
            if (e) {
              e.pdfUrl = j.url;
              LS.set(K('db'), dbCache);
            }
            toast('PDF in Google Drive gespeichert.');
            window.open(j.url, '_blank');
          } catch (e) {
            toast('Fehler: ' + e.message);
          }
        },
        checkupdate() {
          pruefeUpdate(true);
        },
        forcereload() {
          clearCachesAndReload();
        },

        savesettings(d) {
          settings.url = $('#s_url').value.trim();
          settings.token = $('#s_token').value.trim();
          settings.firma = $('#s_firma').value.trim();
          settings.techniker = $('#s_tech').value.trim();
          LS.set(K('settings'), settings);
          if (d !== 'silent') toast('Gespeichert.');
        },
        async ping() {
          Actions.savesettings('silent');
          try {
            await api('ping');
            toast('Verbindung zur Datenbank funktioniert.');
            await loadStamm(true);
            renderSettings();
            syncAll(true);
          } catch (e) {
            toast('Verbindung fehlgeschlagen: ' + e.message);
          }
        },
        async stammload() {
          if (await loadStamm(false)) renderSettings();
        },
        async stammsave(d, btn) {
          const err = $('#stammerr'),
            values = {},
            bad = [];
          document.querySelectorAll('[data-stamm]').forEach((el) => {
            const s = C.stamm.find((x) => x.key === el.dataset.stamm),
              raw = el.value.trim();
            el.style.borderColor = '';
            if (typeof s.def === 'number') {
              if (!isN(raw) || num(raw) < 0) {
                bad.push(s.label);
                el.style.borderColor = 'var(--system-red)';
                return;
              }
              values[s.key] = { value: num(raw), label: s.label, unit: s.unit };
            } else if (raw) values[s.key] = { value: raw, label: s.label, unit: s.unit };
          });
          if (bad.length) {
            err.textContent = 'Bitte eine gültige Zahl eintragen: ' + bad.join(', ');
            return;
          }
          err.textContent = '';
          if (!settings.url) {
            toast('Bitte zuerst die Web-App-URL eintragen und speichern.');
            return;
          }
          if (!navigator.onLine) {
            toast('Offline – Stammdaten können nur mit Internet gespeichert werden.');
            return;
          }
          btn.disabled = true;
          btn.textContent = 'Wird gespeichert …';
          try {
            const j = await api('setstamm', { values });
            stammCache = { at: new Date().toISOString(), values: j.values || {} };
            LS.set(K('stamm'), stammCache);
            toast('Stammdaten in der Datenbank gespeichert.');
            renderSettings();
          } catch (e) {
            toast('Speichern fehlgeschlagen: ' + e.message);
            btn.disabled = false;
            btn.textContent = 'In Datenbank speichern';
          }
        },
        backup() {
          const data = JSON.stringify(
            { app: C.id, exportedAt: new Date().toISOString(), calcs },
            null,
            1,
          );
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
          a.download = `${C.id}-backup-${today()}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
        },
      };

      /* ---------- Events ---------- */
      document.addEventListener('click', (e) => {
        const b = e.target.closest('[data-act]');
        if (!b || b.disabled) return;
        const fn = Actions[b.dataset.act];
        if (fn) {
          e.preventDefault();
          fn(b.dataset, b);
        } // während eines Seitenübergangs Tipps ignorieren
      });
      app.addEventListener('input', (e) => {
        const el = e.target;
        if (el.dataset.f && view.name === 'wizard') {
          const p = cur(),
            id = el.dataset.f;
          p.values[id] = el.value;
          if (id === 'projekt' || id === 'kunde') setHeader(false); // Kopf-Unterzeile mitführen (kein Neuzeichnen)
          if ((POSBY[id] && POSBY[id].auto) || id === 'gwp') p.manual[id] = true;
          if (el.dataset.other)
            document
              .querySelectorAll('[data-act=set][data-f="km"]')
              .forEach((b) => b.setAttribute('aria-selected', String(b.dataset.v === el.value)));
          applyAutos(p);
          save();
          live();
        } else if (el.id === 'dbsearch') {
          view.q = el.value;
          $('#dblist').innerHTML = dbList();
        }
      });
      document.addEventListener('change', async (e) => {
        const el = e.target;
        if (el.id === 's_import' && el.files[0]) {
          const r = new FileReader();
          r.onload = () => {
            try {
              const d = JSON.parse(r.result);
              if (!Array.isArray(d.calcs)) throw new Error('Keine gültige Backup-Datei');
              const byId = new Map(calcs.map((p) => [p.id, p]));
              d.calcs.forEach((p) => byId.set(p.id, p));
              calcs = [...byId.values()];
              save();
              toast(`Backup importiert: ${d.calcs.length} Kalkulationen.`);
            } catch (err) {
              toast('Import fehlgeschlagen: ' + err.message);
            }
          };
          r.readAsText(el.files[0]);
        }
      });
      window.addEventListener('online', () => {
        updateNet();
        loadStamm(true);
        syncAll(true);
      });
      window.addEventListener('offline', updateNet);

      /* ---------- Start ---------- */
      if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
        navigator.serviceWorker.register('sw.js').catch(() => {});
      if (navigator.storage && navigator.storage.persist)
        navigator.storage.persist().catch(() => {});
      render();
      loadStamm(true).then((ok) => {
        if (ok && view.name !== 'wizard') render();
      });
      syncAll(true);
      syncThemeUi();
      if (navigator.onLine) pruefeUpdate(false);
    </script>
    <script src="shared/theme.js"></script>
    <script type="module">
      import { initChoiceDropdowns, initUnitPadding } from './shared/choice-dropdown.js';
      let bereit = false;
      window.agUiInit = () => {
        if (bereit) return;
        bereit = true;
        initChoiceDropdowns();
        initUnitPadding();
      };
      window.agUiInit();
    </script>
  </body>
</html>
