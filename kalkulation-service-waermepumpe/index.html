<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="apple-mobile-web-app-title" content="Kalk. WP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <title>Kalkulation Service Wärmepumpe</title>

    <script>
      (function () {
        var root = document.documentElement,
          saved = null;
        try {
          saved = localStorage.getItem('ag-theme');
        } catch (e) {}
        var light = window.matchMedia('(prefers-color-scheme: light)').matches;
        root.setAttribute(
          'data-theme',
          saved === 'light' || saved === 'dark' ? saved : light ? 'light' : 'dark',
        );
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="agFonts"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0..200&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0..200&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      (function () {
        var root = document.documentElement,
          link = document.getElementById('agFonts');
        if (!link || !document.fonts || !document.fonts.load) return;
        var done = function () {
          root.classList.remove('icons-pending');
        };
        root.classList.add('icons-pending');
        setTimeout(done, 4000);
        link.addEventListener('load', function () {
          setTimeout(function () {
            document.fonts.load('24px "Material Symbols Rounded"').then(done, done);
          }, 0);
        });
        link.addEventListener('error', done);
      })();
    </script>

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/png" href="icon-180.png" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="shared/lib/fonts/material-symbols-rounded.woff2"
      crossorigin
    />
    <script src="config.js" defer></script>
    <script src="shared/lib/html2canvas.min.js" defer></script>
    <script src="shared/lib/jspdf.umd.min.js" defer></script>
    <link rel="stylesheet" href="shared/global.css" />
    <link rel="stylesheet" href="shared/pdf.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <header class="app-header">
        <div class="app-header-text">
          <h1 class="brand-title" id="apptitle">Kalkulation</h1>
          <p class="brand-subtitle" id="hsub">Kalkulationen</p>
          <div id="net" class="net"></div>
        </div>
        <button
          type="button"
          class="icon-btn"
          id="themeToggleBtn"
          aria-label="Darstellung wechseln"
        ></button>
        <button
          type="button"
          class="icon-btn"
          id="btnset"
          data-act="settings"
          aria-label="Einstellungen"
        >
          <span class="material-symbols-rounded" aria-hidden="true">settings</span>
          <span class="status-dot settings-update-dot" id="app-update-dot" hidden></span>
        </button>
      </header>
      <div id="stepwrap" hidden></div>
      <div class="stage"><main id="app"></main></div>
    </div>
    <div class="bar" id="bar" hidden></div>

    <!-- Einstellungen und Rückfragen: mittige Karte -->
    <div
      class="modal-overlay"
      id="modalHost"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >
      <div class="modal-card">
        <div class="panel" id="panelSettings">
          <div class="modal-head">
            <h2 class="modal-title" id="settingsTitle">Einstellungen</h2>
            <button class="icon-btn" id="modalCloseBtn" type="button" aria-label="Schließen">
              <span class="material-symbols-rounded" aria-hidden="true">close</span>
            </button>
          </div>
          <div class="panel" id="settingsBody"></div>
        </div>

        <div class="panel" id="panelConfirm" hidden>
          <h2 class="modal-title" id="cfTitle"></h2>
          <p class="modal-text" id="cfText"></p>
          <div class="modal-actions modal-actions--row">
            <button type="button" class="btn-secondary" id="cfCancel">Abbrechen</button>
            <button type="button" class="btn-primary" id="cfOk">Bestätigen</button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast-pill" id="toast" role="status" aria-live="polite">
      <span class="material-symbols-rounded" aria-hidden="true">info</span>
      <span id="toastText"></span>
    </div>


    <script src="shared/core.js" defer></script>
    <script src="shared/pdf-bausteine.js" defer></script>
    <script src="shared/pdf.js" defer></script>
    <script src="shared/settings.js" defer></script>
    <script src="app-kern.js" defer></script>
    <script src="app-rahmen.js" defer></script>
    <script src="app-ansichten.js" defer></script>
    <script src="app-aktionen.js" defer></script>
    <script src="app.js" defer></script>
    <script src="shared/theme.js" defer></script>
    <script type="module">
      import { initChoiceDropdowns, initUnitPadding } from './shared/choice-dropdown.js';
      let bereit = false;
      window.agUiInit = () => {
        if (bereit) return;
        bereit = true;
        initChoiceDropdowns();
        initUnitPadding();
      };
      window.agUiInit();
    </script>
  </body>
</html>
