<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('muther-theme');
          var r = document.documentElement;
          if (t === 'hell') r.setAttribute('data-theme', 'light');
          else if (t === 'dunkel') r.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>

    <script src="shared/lib/jspdf.umd.min.js" defer></script>
    <link rel="stylesheet" href="shared/base.css" />
    <link rel="stylesheet" href="shared/knoepfe.css" />
    <link rel="stylesheet" href="shared/kacheln.css" />

    <style>
      .ferr {
        color: var(--bad);
        font-size: 14px;
        font-weight: 600;
        margin-top: 6px;
      }
      .mangel {
        margin-top: 4px;
      }
      .field.err input,
      .field.err textarea {
        border-color: var(--bad);
      }
      .inunit input {
        max-width: 260px;
        font-size: 22px;
      }
      .inunit .unit {
        color: var(--muted);
        font-weight: 600;
      }
      .soll {
        font-size: 14px;
        margin-top: 6px;
      }
      .calc {
        display: inline-block;
        padding: 10px 14px;
        background: var(--gold-soft);
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: 10px;
        font-weight: 700;
        min-width: 120px;
      }
      .calcnote {
        font-size: 13px;
        color: var(--muted);
        margin-left: 8px;
      }
      @media (max-width: 700px) {
        .frow {
          flex-direction: column;
          align-items: stretch;
        }
        .seg .btn {
          flex: 1;
        }
      }
      .sigwrap {
        border: 2px dashed var(--line);
        border-radius: 12px;
        background: #fff;
        margin-bottom: 8px;
      }
      canvas.sig {
        width: 100%;
        height: 170px;
        display: block;
        touch-action: none;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
      }
      @media (max-width: 640px) {
        .grid2 {
          grid-template-columns: 1fr;
        }
      }
      .err {
        color: var(--bad);
        font-weight: 600;
        margin-top: 10px;
        min-height: 1.2em;
      }
      a.jump {
        color: var(--ink);
        font-weight: 600;
        cursor: pointer;
        text-decoration: underline;
        text-decoration-color: var(--pri2);
        text-decoration-thickness: 2px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 3px solid var(--gold);
        outline-offset: 0;
        border-color: var(--pri2);
      }
      /* Meldung: Kapsel oben, Aussehen und Bewegung in shared/ios.css */
      #toast {
        position: fixed;
        left: 50%;
        opacity: 0;
        max-width: 90vw;
        text-align: center;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
      /* Feste Leiste unten (Zurück / Weiter / Abschließen / PDF) */
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
      }
      .bar .btn {
        flex: 1;
        min-height: 52px;
        font-weight: 700;
        font-size: 15px;
      }
      .bar .btn.primary {
        border-color: var(--gold-dark);
      }
      body.hasbar main {
        padding-bottom: calc(110px + env(safe-area-inset-bottom));
      }
      /* PDF-Knopf mit Fortschritt */
      .bar .btn.pdfb {
        overflow: hidden;
      }
      .pdfb .fill {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.14);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 220ms linear;
        pointer-events: none;
      }
      .pdfb .l1,
      .pdfb .l2,
      .pdfb .lr {
        display: flex;
        align-items: center;
        gap: 6px;
        position: relative;
        transition:
          opacity var(--t-fast),
          transform var(--t-fast) var(--out);
      }
      .pdfb .l2,
      .pdfb .lr {
        position: absolute;
        opacity: 0;
        transform: translateY(8px);
      }
      .pdfb.run .l1,
      .pdfb.done .l1 {
        opacity: 0;
        transform: translateY(-8px);
      }
      .pdfb.run .lr {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .lr {
        opacity: 0;
      }
      .pdfb.done .l2 {
        opacity: 1;
        transform: none;
      }
      .pdfb.done .fill {
        opacity: 0;
      }
      /* Wert wechselt: kurzes Aufleuchten */
      .flash {
        animation: flash 900ms var(--out);
      }
      @keyframes flash {
        from {
          background-color: var(--flash);
        }
      }
      /* Seitenwechsel zwischen den Schritten (.pg-*): shared/ios.css */
      /* Karten erscheinen gestaffelt (nur solange .entering am Container hängt) */
      .entering .stag {
        opacity: 0;
        transform: translateY(12px);
        animation: up var(--t-med) var(--out) forwards;
        animation-delay: calc(var(--i) * 70ms + 120ms);
      }
      @keyframes up {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          transition-duration: 0.001ms !important;
          transition-delay: 0ms !important;
          animation-duration: 0.001ms !important;
          animation-delay: 0ms !important;
        }
        .entering .stag {
          opacity: 1;
          transform: none;
        }
      }
      /* ===== Handy-Layout ===== */
      /* iPhone/iPad: Datumsfeld hat sonst eine feste Mindestbreite und ragt über den Rand */
      input[type='date'] {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        min-height: 50px;
        height: 50px;
        text-align: left;
        margin: 0;
      }
      input[type='date']::-webkit-date-and-time-value {
        text-align: left;
        min-width: 0;
        margin: 0;
      }
      input[type='date']::-webkit-datetime-edit {
        padding: 0;
        text-align: left;
      }
      /* Schmale Bildschirme (iPhone hochkant): Status kompakt, Tabellen als Karten */
      @media (max-width: 480px) {
        .net:not(.off) .nt,
        .net:not(.off) .sep,
        .net .nl {
          display: none;
        }
        .net:not(.off) .nd {
          margin-right: 0;
        }
        .net:not(.off) .np {
          margin-left: 5px;
        }
        .ib {
          width: 40px;
          height: 40px;
        }
        header {
          gap: 8px;
        }
        header .tt h1 {
          font-size: 15px;
        }
      }
      @media (max-width: 600px) {
        header {
          padding-left: 12px;
          padding-right: 12px;
        }
        main,
        #stepwrap {
          padding-left: 12px;
          padding-right: 12px;
        }
        .card {
          padding: 12px 14px;
        }
        .pagetitle {
          font-size: 22px;
        }
        .card > table thead {
          display: none;
        }
        .card > table,
        .card > table tbody,
        .card > table tr,
        .card > table td {
          display: block;
          width: 100%;
        }
        .card > table tr {
          padding: 10px 0;
          border-bottom: 1px solid var(--line);
        }
        .card > table tr:last-child {
          border-bottom: 0;
        }
        .card > table td {
          border: 0;
          padding: 2px 0;
          text-align: left !important;
          white-space: normal !important;
        }
        .card > table td:last-child {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          padding-top: 8px;
        }
      }
      /* ===== Ende Handy-Layout ===== */
      /* ===== Design-Überarbeitung (Stil der Startseite: Kacheln, Zähler-Chips, ruhige Flächen) ===== */
      html {
        overscroll-behavior-y: none;
      }
      button,
      .btn,
      .ib,
      .steps > *,
      .tt,
      a.jump {
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .btn {
        transition:
          transform var(--t-fast) var(--out),
          filter var(--t-fast),
          background-color var(--t-fast),
          border-color var(--t-fast),
          color var(--t-fast);
      }
      .btn:focus-visible,
      .ib:focus-visible,
      .steps button:focus-visible,
      .tt:focus-visible,
      a.jump:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      :root[data-theme='dark'] .btn:focus-visible,
      :root[data-theme='dark'] .steps button:focus-visible {
        outline-color: var(--gold);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .btn:focus-visible,
        :root:not([data-theme='light']) .steps button:focus-visible {
          outline-color: var(--gold);
        }
      }
      header {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      main,
      #stepwrap {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      .bar {
        padding-left: max(14px, env(safe-area-inset-left));
        padding-right: max(14px, env(safe-area-inset-right));
      }
      /* Startseite */
      .secth {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .secth .n {
        background: var(--gold-soft);
        color: var(--gold-text);
        border-radius: 99px;
        padding: 1px 9px;
        font-size: 12px;
        letter-spacing: 0;
      }
      .emptybox {
        border: 1.5px dashed var(--line);
        border-radius: 16px;
        padding: 20px 16px;
        text-align: center;
        color: var(--muted);
        margin: 10px 0;
        font-size: 15px;
      }
      .warnbox .btn {
        margin-top: 10px;
      }
      /* Protokoll-Karten */
      .pc {
        padding: 14px 16px;
      }
      .pc-main {
        min-width: 0;
        flex: 1;
        overflow-wrap: anywhere;
      }
      .pc-main b {
        font-size: 17px;
      }
      .pc-main .pc-k {
        display: block;
        line-height: 1.3;
      }
      .pc-meta {
        margin-top: 4px;
        font-size: 14px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .pc-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .pc-act {
        margin-top: 12px;
        gap: 8px;
      }
      .pc-act .btn.primary {
        flex: 1 1 140px;
      }
      .pc.dr {
        border-left: 4px solid var(--gold);
      }
      .badge {
        overflow-wrap: anywhere;
      }
      /* Formular */
      .field label,
      .pagetitle,
      .steplab > span {
        overflow-wrap: anywhere;
        -webkit-hyphens: auto;
        hyphens: auto;
      }
      .pagetitle {
        min-width: 0;
      }
      .row.between > .pagetitle {
        flex: 1 1 200px;
      }
      .sigwrap {
        overscroll-behavior: contain;
      }
      textarea {
        overscroll-behavior: contain;
      }
      @media (max-width: 600px) {
        main,
        #stepwrap {
          padding-left: max(12px, env(safe-area-inset-left));
          padding-right: max(12px, env(safe-area-inset-right));
        }
        header {
          padding-left: max(12px, env(safe-area-inset-left));
          padding-right: max(12px, env(safe-area-inset-right));
        }
        .pc {
          padding: 12px 14px;
        }
      }
      @media (max-width: 600px) {
        .seg {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
          width: 100%;
        }
        .seg .btn {
          min-width: 0;
          padding: 8px 4px;
          font-size: 15px;
          white-space: nowrap;
        }
      }
      @media (max-width: 240px) {
        .net:not(.off) {
          display: none;
        }
      }
      @media (max-width: 340px) {
        .logo {
          display: none;
        }
        .bar .btn {
          font-size: 14px;
          padding: 8px 10px;
        }
        .steps {
          gap: 3px;
        }
      }
      /* Schrift des Ausdrucks – lokal, damit das PDF auch offline gleich aussieht (SIL Open Font License) */
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(shared/lib/fonts/plus-jakarta-sans-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF,
          U+FFFD;
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(shared/lib/fonts/plus-jakarta-sans-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF,
          U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }
      .sheetwrap {
        background: var(--sheet);
        border-radius: 12px;
        padding: 16px 0 1px;
        overflow: hidden;
      }
      @media print {
        header,
        .noprint,
        #toast,
        .bar,
        #stepwrap {
          display: none !important;
        }
        html,
        body {
          background: #fff;
        }
        main {
          max-width: none;
          padding: 0 !important;
        }
        .stage {
          overflow: visible;
        }
        .sheetwrap {
          background: none;
          padding: 0;
          border-radius: 0;
        }
        .report {
          zoom: 1 !important;
        }
        .report .page {
          box-shadow: none;
          margin: 0;
          break-after: page;
        }
        @page {
          size: A4;
          margin: 0;
        }
      }
      :root {
        --mat-ease: cubic-bezier(0.25, 1, 0.5, 1);
        --mat-dur-in: 220ms;
        --mat-dur-pulse: 200ms;
        --mat-in-shift: 8px;
        --mat-pulse-scale: 1.12;
      }
      .fx-in {
        animation: mat-in var(--mat-dur-in) var(--mat-ease);
      }
      .fx-pulse {
        animation: mat-pulse var(--mat-dur-pulse) var(--mat-ease);
      }
      @keyframes mat-in {
        from {
          opacity: 0;
          transform: translateY(var(--mat-in-shift));
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes mat-pulse {
        from {
          transform: scale(var(--mat-pulse-scale));
        }
        to {
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fx-in,
        .fx-pulse {
          animation: none;
        }
      }
      .matrow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      .matrow .mt {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .matrow input {
        width: 88px;
        max-width: 88px;
        flex: none;
      }
      .matadd {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .matadd input {
        flex: 1;
        min-width: 0;
      }
    </style>

  </head>

      ></button>
      <button type="button" class="ib" id="btnset" data-act="settings" aria-label="Einstellungen">
        <svg class="ico" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"

    <div id="stepwrap" hidden></div>

    <script>
      'use strict';

      /* =====================================================================
   Feld-Definition – entspricht dem Blatt "Datenbank" / "AppSheet_Konfiguration".
   col = exakter Spaltenname im Google Sheet.
   ===================================================================== */
      const GWP = { R290: 3, R32: 675, R410A: 2088, R454B: 466, R134a: 1430, R407C: 1774 };
      const OK3 = ['i.O.', 'n.i.O.', 'entfällt'];
      const MANGEL_SUFFIX = ' – Mangel';
      const BEWERTUNG = ['i.O.', 'n.i.O.'];
      const BEWERTUNG_KLASSEN = ['ok', 'bad'];
      const BEWERTUNG_ALT = new Map([
        ['Ja', 'ok'],
        ['Nein', 'bad'],
        ['Mangel', 'bad'],
      ]);
      function bewertungArt(x) {
        if (x === 'i.O.') {
          return 'ok';
        }
        if (x === 'n.i.O.') {
          return 'bad';
        }
        return BEWERTUNG_ALT.has(x) ? BEWERTUNG_ALT.get(x) : 'none';
      }
      function altwertHint(x) {
        if (!x || BEWERTUNG.includes(x) || bewertungArt(x) === 'none') {
          return '';
        }
        return `<div class="fhint">Altwert: ${esc(x)}</div>`;
      }
      const ok = (id, col, label, pdf, hint, req = true) => ({
        id,
        col,
        label,
        pdf,
        hint,
        type: 'okfail',
        req,
      });

      const TEMPLATE = {
        id: 'wp-wartung',
        title: 'WARTUNGSPROTOKOLL • WÄRMEPUMPE',
        pages: [
          {
            title: 'Stammdaten & Auftrag',
            short: 'Stammdaten',
            header: true,
            fields: [
              {
                id: 'projekt',
                col: 'Projektnummer',
                label: 'Projektnummer',
                pdf: 'Protokoll-Nr.',
                type: 'text',
                req: true,
                hint: 'Vorschlag kann überschrieben werden',
                init: () =>
                  'WP-' + today().replace(/-/g, '') + '-' + uid().slice(0, 4).toUpperCase(),
              },
              {
                id: 'kunde',
                col: 'Kundennummer',
                label: 'Kundennummer',
                pdf: 'Kunden-Nr.',
                type: 'text',
                req: true,
                ph: 'z. B. KD-98101',
              },
              {
                id: 'datum',
                col: 'Datum',
                label: 'Datum',
                type: 'date',
                req: true,
                notFuture: true,
                init: () => today(),
              },
              {
                id: 'monteur',
                col: 'Monteur',
                label: 'Monteur',
                pdf: 'Monteur / Prüfer',
                type: 'text',
                req: true,
                init: () => settings.techniker,
              },
              {
                id: 'zusatz',
                col: 'Zusatzinformationen',
                label: 'Zusatzinformationen',
                type: 'longtext',
                wide: true,
                hint: 'Allgemeine Angaben, Kundengespräche, Anfahrt',
              },
            ],
          },

            show: (v) => v[f.id] === 'n.i.O.',
          };
          if (f.group) {
            mangel.group = f.group;
          }
          return [f, mangel];
        });
      });
      const ALL_FIELDS = TEMPLATE.pages.flatMap((pg) => pg.fields);
      const FIELD = Object.fromEntries(ALL_FIELDS.map((f) => [f.id, f]));

      /* ---------- Speicher ---------- */
      LS.fullMsg += ' Übertragene Protokolle löschen.';
      const SETTINGS_FIELDS = [
        {
          id: 's_tech',
          key: 'techniker',
          label: 'Monteur (Vorbelegung)',
          placeholder: 'z. B. C.Geuther',
        },
      ];
      let settings = Object.assign(
        { url: '', token: '', firma: '', techniker: '' },
        LS.get('wp2.settings', {}),
      );
      let protocols = LS.get('wp2.protocols', []);
      let dbCache = LS.get('wp2.db', { at: null, list: [] });
      const save = () => LS.set('wp2.protocols', protocols);

      /* ---------- Helfer ---------- */
      const app = $('#app');
      function fmtDate(s) {
        if (!s) return '';
        const d = new Date(String(s).length === 10 ? s + 'T12:00:00' : s);
        return isNaN(d) ? String(s) : d.toLocaleDateString('de-DE');
      }
      function num(v) {
        return typeof v === 'number' ? v : Number(String(v).trim().replace(',', '.'));
      }
      function safeImg(src) {
        return typeof src === 'string' &&
          /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(src)
          ? src
          : '';
      }
      let calcSeen = {}; // zuletzt angezeigte Rechenwerte -> Aufleuchten nur bei echter Änderung
      function calcTouch(id, text, el) {
        const k = view.id + ':' + id;
        if (k in calcSeen && calcSeen[k] !== text) flash(el);
        calcSeen[k] = text;
      }

      function materialListe(v) {
        if (!Array.isArray(v.material)) {
          return [];
        }
        return v.material
          .filter((m) => m && String(m.teil ?? '').trim() !== '')
          .map((m) => ({ teil: String(m.teil).trim(), menge: String(m.menge ?? '').trim() }));
      }
      function materialText(v) {
        return materialListe(v)
          .map((m) => (m.menge ? `${m.teil} ×${m.menge}` : m.teil))
          .join('; ');
      }
      const MENGE_VOLL = /^\d+([.,]\d+)?$/;
      const MENGE_TIPP = /^\d*[.,]?\d*$/;
      function parseMenge(s) {
        const t = String(s ?? '').trim();
        if (!MENGE_VOLL.test(t)) {
          return null;
        }
        return parseFloat(t.replace(',', '.'));
      }
      function fmtMenge(n) {
        return String(Math.round(n * 1000) / 1000).replace('.', ',');
      }
      function materialName(s) {
        return String(s ?? '')
          .replace(/;/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }
      function materialAusText(text) {
        return String(text ?? '')
          .split(';')
          .map((t) => t.trim())
          .filter((t) => t !== '')
          .map((t) => {
            const m = t.match(/^(.*) ×(\d+(?:[.,]\d+)?)$/);
            return m ? { teil: m[1].trim(), menge: m[2] } : { teil: t, menge: '' };
          })
          .filter((m) => m.teil !== '');
      }
      function materialArray(p) {
        if (!Array.isArray(p.values.material)) {
          p.values.material = [];
        }
        return p.values.material;
      }

      /* ---------- Werte, Prüfung, Bewertung ---------- */
      function recompute(p) {
        ALL_FIELDS.forEach((f) => {
          if (f.type === 'calc') p.values[f.id] = f.calc(p.values);
        });
      }
      function display(f, x) {
        if (x === '' || x == null) return '';
        if (f.type === 'date') return fmtDate(x);
        if ((f.type === 'number' || f.type === 'calc') && isN(x))
          return fmtNum(String(x).trim()) + (f.unit ? ' ' + f.unit : '');
        return String(x);
      }
      function sollText(f) {
        if (f.soll) return f.soll;
        const u = f.unit && f.unit !== 'pH' ? ' ' + f.unit : '';
        if (f.sMin != null && f.sMax != null)
          return `Soll ${fmtNum(f.sMin)} – ${fmtNum(f.sMax)}${u}`;
        if (f.sMax != null) return `Soll ≤ ${fmtNum(f.sMax)}${u}`;
        if (f.sMin != null) return `Soll ≥ ${fmtNum(f.sMin)}${u}`;
        return '';
      }
      function evalField(f, v) {
        const x = v[f.id];
        if (f.type === 'bewertung') {
          return bewertungArt(x);
        }
        if (f.type === 'okfail')
          return x === 'i.O.' ? 'ok' : x === 'n.i.O.' ? 'bad' : x === 'entfällt' ? 'na' : 'none';
        if (f.bad && f.bad.includes(x)) return 'bad';
        if (f.good && f.good.includes(x)) return 'ok';
        if (f.warn && f.warn.includes(x)) return 'warn';
        if (f.type === 'number' && isN(x) && (f.sMin != null || f.sMax != null)) {
          const n = num(x);
          return (f.sMin != null && n < f.sMin) || (f.sMax != null && n > f.sMax) ? 'warn' : 'ok';
        }
        if (f.id === 'wasser' && x) return x === 'im Richtbereich' ? 'ok' : 'warn';
        return 'none';
      }
      function defects(p) {
        return ALL_FIELDS.filter(
          (f) =>
            f.type !== 'calc' &&
            f.type !== 'bewertung' &&
            f.type !== 'material' &&
            ['bad', 'warn'].includes(evalField(f, p.values)),
        ).map((f) => {
          let text = `${f.pdf || f.label}: ${display(f, p.values[f.id])}`;
          if (evalField(f, p.values) === 'warn') {
            text += ` (${sollText(f)})`;
          }
          const mangel = String(p.values[f.id + 'M'] ?? '').trim();
          if (f.type === 'okfail' && mangel) {
            text += ` – ${mangel}`;
          }
          return text;
        });
      }
      const PFLICHTFELDER = false; // true = Pflichtfelder (req/reqIf) und Monteur-Unterschrift werden wieder erzwungen
      function isRequired(f, p) {
        return PFLICHTFELDER && (!!f.req || (f.reqIf ? f.reqIf(p.values, p) : false));
      }
      function fieldError(f, p) {
        if (f.type === 'calc' || f.type === 'material') return '';
        const x = p.values[f.id],
          empty = String(x ?? '').trim() === '';
        if (empty) return isRequired(f, p) ? f.reqMsg || 'Pflichtfeld' : '';
        if (f.type === 'number') {
          if (!isN(x)) return 'Bitte eine gültige Zahl eingeben.';
          const n = num(x);
          if ((f.min != null && n < f.min) || (f.max != null && n > f.max))
            return `Unplausibler Wert (erlaubt ${fmtNum(f.min)} – ${fmtNum(f.max)} ${f.unit || ''})`;
        }
        if (f.type === 'date' && f.notFuture && x > today()) return 'Datum liegt in der Zukunft.';
        return '';
      }
      function pageErrors(p, i) {
        return TEMPLATE.pages[i].fields.map((f) => [f, fieldError(f, p)]).filter((e) => e[1]);
      }
      function vorbelegtGleich(p, id) {
        return (
          !!p.vorbelegt &&
          JSON.stringify(p.values[id] ?? '') === JSON.stringify(p.vorbelegt[id] ?? '')
        );
      }
      function vorbelegtErfassen(p) {
        p.vorbelegt = {};
        Object.keys(p.values).forEach((id) => {
          if (JSON.stringify(p.values[id] ?? '') !== '""') {
            p.vorbelegt[id] = p.values[id];
          }
        });
      }
      function pageDone(p, i) {
        return (
          TEMPLATE.pages[i].fields.every((f) => f.type === 'calc' || !fieldError(f, p)) &&
          TEMPLATE.pages[i].fields.some(
            (f) =>
              f.type !== 'calc' &&
              !f.parent &&
              !(f.type === 'bewertung' && !BEWERTUNG.includes(p.values[f.id])) &&
              (f.type === 'material' ||
                (p.vorbelegt ? !vorbelegtGleich(p, f.id) : f.init == null)) &&
              (f.type === 'material'
                ? materialListe(p.values).length > 0
                : String(p.values[f.id] ?? '') !== ''),
          )
        );
      }

      /* Bericht-Datenstruktur – identisch genutzt von App-PDF und Apps-Script-PDF */
      function buildReport(p) {
        const v = p.values;
        const rowsOf = (pg) =>
          pg.fields
            .filter(
              (f) => !f.parent && !(f.wide && !v[f.id]) && !(f.show && !f.show(v) && !v[f.id]),
            )
            .map((f) => ({
              label: f.pdf || f.label,
              value: display(f, v[f.id]),
              eval: evalField(f, v),
              wide: !!f.wide,
              mangel:
                f.type === 'okfail' && v[f.id] === 'n.i.O.'
                  ? String(v[f.id + 'M'] ?? '').trim()
                  : '',
            }));
        return {
          title: TEMPLATE.title,
          firma: settings.firma || '',
          header: rowsOf(TEMPLATE.pages[0]),
          sections: TEMPLATE.pages
            .filter((pg) => !pg.header && !pg.final && pg.fields[0].type !== 'material')
            .map((pg) => ({
              title: pg.pdfTitle || pg.title,
              kind: pg.kind || 'grid',
              rows: rowsOf(pg),
            })),
          material: materialListe(v),
          defects: defects(p),
          dpv: v.dpv || '',
          co2: isN(v.co2) ? num(v.co2) : '',
          success: v.erfolg || '',
          successMangel: v.erfolg === 'n.i.O.' ? String(v.erfolgM ?? '').trim() : '',
          betrieb: v.betrieb || '',
          remark: v.bem || '',
          techniker: v.monteur || '',
          kundeName: p.kundeName || '',
          id: v.projekt || p.id,
          completedAt: p.completedAt || '',
        };
      }
      /* Spaltenwerte fürs Google Sheet */
      function buildCols(p) {
        return ALL_FIELDS.filter((f) => f.col).map((f) => {
          if (f.type === 'material') {
            return [f.col, materialText(p.values), ''];
          }
          const x = f.parent && p.values[f.parent] !== 'n.i.O.' ? '' : p.values[f.id];
          if (x === '' || x == null) return [f.col, '', ''];
          if (f.type === 'date') return [f.col, x, 'date'];
          if ((f.type === 'number' || f.type === 'calc') && isN(x)) return [f.col, num(x), ''];
          return [f.col, String(x), ''];
        });
      }

      /* ---------- Navigation ---------- */
      let view = { name: 'home' };
      let enterNext = false,
        enterT = null,
        navBusy = false,
        pdfBusy = null,
        pdfProg = 0,
        pdfTick = null,
        hsubAnim = null;
      function go(name, params) {
        const was = view.name;
        view = Object.assign({ name }, params || {});
        if (name === 'wizard' && was !== 'wizard') calcSeen = {};
        enterNext = name === 'wizard'; // Karten beim Betreten gestaffelt einblenden
        render();
        window.scrollTo(0, 0);
      }
      function cur() {
        return protocols.find((p) => p.id === view.id);
      }
      function render() {
        const enter = enterNext;
        enterNext = false;
        app.innerHTML = (Views[view.name] || Views.home)();
        if (!navBusy) {
          // Klassen nur zurücksetzen, wenn gerade kein Seitenübergang läuft
          app.className = enter && !RM() ? 'entering' : '';
          clearTimeout(enterT);
          if (enter)
            enterT = setTimeout(() => {
              if (!navBusy) app.classList.remove('entering');
            }, 900);
        }
        setHeader(true);
        if (view.name === 'report') showReport();
        if (After[view.name]) After[view.name]();
        setSteps();
        setBar();
        iosAfterRender(view.name);
        updateNet();
      }
      /* Kopf: Unterzeile = Projektnummer · Kunde (im Formular / Bericht), sonst Bereichsname */
      function hsubText() {
        const p = view.name === 'wizard' || (view.name === 'report' && !view.db) ? cur() : null;
        if (p)
          return (
            (p.values.projekt || 'ohne Projektnummer') +
            (p.values.kunde ? ' · ' + p.values.kunde : '')
          );
        if (view.name === 'report' && view.db && view.rep) return view.rep.id || 'Bericht';
        return view.name === 'settings'
          ? 'Einstellungen'
          : view.name === 'db'
            ? 'Datenbank / PDF'
            : 'Wartungsprotokolle';
      }
      function setSteps() {
        const p = view.name === 'wizard' ? cur() : null;
        stepsRender(
          p && {
            key: p.id,
            pages: TEMPLATE.pages,
            index: p.page,
            done: (k) => pageDone(p, k) && !TEMPLATE.pages[k].final,
            pauseAct: 'home',
          },
        );
      }
      /* Feste Leiste unten */
      function barHtml() {
        if (view.name === 'wizard') {
          const p = cur();
          if (!p) return '';
          const i = p.page,
            pg = TEMPLATE.pages[i];
          return `<div><button class="btn" data-act="prev"${i === 0 ? ' disabled' : ''}>← Zurück</button>${pg.final ? '<button class="btn primary" data-act="finish">Abschließen ✓</button>' : '<button class="btn primary" data-act="next">Weiter →</button>'}</div>`;
        }
        if (view.name === 'report' && reportForView()) {
          const run = pdfBusy === viewKey();
          return `<div><button class="btn bback" data-act="${view.db ? 'db' : 'home'}">← Zurück</button><button class="btn primary pdfb${run ? ' run' : ''}" data-act="makepdf"><span class="fill"${run ? ` style="transform:scaleX(${pdfProg})"` : ''}></span><span class="l1">PDF erstellen</span><span class="lr">PDF wird erstellt …</span><span class="l2">✓ PDF fertig</span></button>${lastPdf && lastPdf.key === viewKey() ? '<button class="btn bshare" data-act="sharepdf">Teilen</button>' : ''}</div>`;
        }
        return '';
      }
      function setBar() {
        barRender(barHtml());
      }
      function wizSnapshot() {
        const vid = view.id;
        return () => view.name === 'wizard' && view.id === vid;
      }
      function updateNet() {
        netRender(protocols.filter((p) => p.status === 'done' && !p.synced).length);
      }

      /* Inhalt einer Formularseite (auch für die Unterlage beim Zurück-Wischen) */
      function wizardHtml(p, i) {
        const pg = TEMPLATE.pages[i];
        const allOk =
          pg.kind === 'check' && pg.fields.some((f) => f.type === 'okfail' && !p.values[f.id]);
        return `
    <div class="row between stag" style="--i:0"><div class="pagetitle">${esc(pg.title)}</div>${allOk ? '<button class="btn small" data-act="allok">Offene Punkte auf i.O.</button>' : ''}</div>
    ${iosGroups(
      pg.fields.filter((f) => !f.show || f.show(p.values)),
      (f) => fieldHtml(f, p),
      1,
    )}
    ${pg.final ? finalHtml(p) : ''}
    <div class="err" id="pageerr"></div>`;
      }

      function settingsBody() {
        return (
          settingsConnectionHtml() +
          settingsGeneralHtml(SETTINGS_FIELDS) +
          settingsButtonsHtml() +
          settingsBackupHtml(
            'Sichert alle Protokolle der App als JSON-Datei. Übertragene Protokolle werden nach 7 Tagen automatisch aus der App entfernt – sie bleiben in der Datenbank.',
          )
        );
      }
      /* ---------- Ansichten ---------- */
      const Views = {
        home() {
          const drafts = protocols.filter((p) => p.status === 'draft');
          const done = protocols
            .filter((p) => p.status === 'done')
            .sort((a, b) => String(b.completedAt).localeCompare(String(a.completedAt)));
          const pending = done.filter((p) => !p.synced).length;
          const plus =
            '<svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
          return `
      <div class="kstart">
      <button type="button" class="cta" data-act="new"><span class="hi">${plus}</span><span class="txt"><strong>Neue Wartung</strong><small>Protokoll angelehnt an die VDMA starten</small></span></button>
      <div class="qa">
        <button class="qt" data-act="db"><span class="qi"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span><span><b>Datenbank / PDF</b><small>Suchen &amp; öffnen</small></span></button>
        <button class="qt" data-act="sync"><span class="qi"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/></svg></span><span><b>Synchronisieren</b><small>${pending ? pending + ' offen' : 'alles übertragen'}</small></span>${pending ? `<span class="pend" aria-hidden="true">${pending}</span>` : ''}</button>
      </div>
      ${!settings.url ? '<div class="warnbox">Noch keine Verbindung zur Datenbank eingerichtet. Protokolle werden lokal gespeichert, bis die Web-App-URL in den Einstellungen eingetragen ist.<br><button type="button" class="btn" data-act="settings">Einstellungen öffnen</button></div>' : ''}
      </div>
      <h2 class="secth">Offene Wartungen <span class="n">${drafts.length}</span></h2>
      ${drafts.length ? drafts.map(protoCard).join('') : '<div class="emptybox">Keine offenen Wartungen.</div>'}
      <h2 class="secth">Abgeschlossen <span class="n">${done.length}</span></h2>
      ${done.length ? done.map(protoCard).join('') : '<div class="emptybox">Noch keine abgeschlossenen Wartungen.</div>'}`;
        },

        wizard() {
          const p = cur();
          if (!p) return '<p>Protokoll nicht gefunden.</p>';
          return wizardHtml(p, p.page);
        },

        report() {
          const r = reportForView();
          if (!r) return '<p>Protokoll nicht gefunden.</p>';
          const p = !view.db && protocols.find((x) => x.id === view.id);
          return `
      <div class="row noprint" style="margin-bottom:12px">
        <span id="pdfbar" class="row">${pdfBarHtml()}</span>
        ${view.db && settings.url ? `<button class="btn" data-act="drivepdf">PDF in Google Drive ablegen</button>` : ''}
        ${p && !p.synced ? '<span class="badge warn">noch nicht in der Datenbank</span>' : ''}
      </div>
      <p class="muted noprint" style="font-size:14px">„PDF erstellen“ → „Teilen“ → im Menü <b>Drucken</b>, <b>In Dateien sichern</b>, Mail oder AirDrop wählen. Funktioniert auch offline.</p>
      <div class="sheetwrap"><div id="sheet" class="report"></div></div>`;
        },

        db() {
          return `
      <div class="row">
        <button class="btn" data-act="home">← Zurück</button>
        <button class="btn primary" data-act="dbload">Aus Datenbank laden</button>
      </div>
      <p class="muted">${dbCache.at ? `Stand ${fmtDateTime(dbCache.at)} · ${dbCache.list.length} Einträge. Zum Öffnen eines Protokolls wird Internet benötigt.` : 'Noch nicht geladen.'}</p>
      <input id="dbsearch" type="search" placeholder="Suchen: Projekt-Nr., Kunden-Nr., Monteur, Modell, Datum …" value="${esc(view.q || '')}">
      <div id="dblist">${dbList()}</div>`;
        },

        settings() {
          // Ausweich-Ansicht; normal öffnet Actions.settings das Blatt
          return (
            `<div class="row"><button class="btn" data-act="home">← Zurück</button></div>` +
            settingsBody()
          );
        },
      };

      function protoCard(p) {
        const v = p.values;
        let badges;
        if (p.status === 'draft') {
          badges = `<span class="badge warn">Schritt ${p.page + 1}/${TEMPLATE.pages.length}</span>`;
        } else {
          badges = `${v.erfolg ? `<span class="badge ${bewertungArt(v.erfolg) === 'ok' ? 'ok' : 'bad'}">Gesamtbewertung: ${esc(v.erfolg)}</span> ` : ''}<span class="badge ${p.synced ? 'ok' : 'warn'}">${p.synced ? 'in der Datenbank' : 'nicht übertragen'}</span>`;
        }
        const meta = [fmtDate(v.datum), v.agModell, v.monteur].filter(Boolean).map(esc).join(' · ');
        return `
    <div class="card pc${p.status === 'draft' ? ' dr' : ''}">
      <div class="pc-main"><b>${esc(v.projekt || 'Ohne Projektnummer')}</b>${v.kunde ? `<span class="pc-k">${esc(v.kunde)}</span>` : ''}</div>
      ${meta ? `<div class="pc-meta">${meta}</div>` : ''}
      <div class="pc-badges">${badges}</div>
      <div class="row btnrow pc-act">
        ${
          p.status === 'draft'
            ? `<button class="btn small primary" data-act="resume" data-id="${p.id}">Fortsetzen</button>`
            : `<button class="btn small primary" data-act="report" data-id="${p.id}">Bericht / PDF</button><button class="btn small" data-act="reopen" data-id="${p.id}">Bearbeiten</button>`
        }
        <button class="btn small danger" data-act="del" data-id="${p.id}">Löschen</button>
      </div>
    </div>`;
      }

      function playFx(el, cls) {
        if (!el) {
          return;
        }
        el.classList.add(cls);
        el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
      }
      function materialFeedback(teil, fx) {
        const input = app.querySelector(`.matrow input[data-i="${fx.i}"]`);
        const zeile = input ? input.closest('.matrow') : null;
        if (!RM()) {
          if (fx.art === 'neu') {
            playFx(zeile, 'fx-in');
          } else {
            playFx(input, 'fx-pulse');
          }
        }
        toast(fx.art === 'plus' ? `${teil} hinzugefügt (×${fx.menge})` : `${teil} hinzugefügt`);
      }
      function materialHtml(p) {
        const liste = materialArray(p);
        const zeilen = liste
          .map(
            (m, i) => `<div class="matrow">
        <span class="mt">${esc(m.teil)}</span>
        <input data-mat="menge" data-i="${i}" inputmode="decimal" maxlength="12" value="${esc(m.menge)}" placeholder="Menge" aria-label="Menge ${esc(m.teil)}" autocomplete="off">
        <button type="button" class="btn small danger" data-act="matdel" data-i="${i}" aria-label="${esc(m.teil)} entfernen">Entfernen</button>
      </div>`,
          )
          .join('');
        return `<div class="fhint">Benötigtes Material eintragen.</div>
      <div>${zeilen || '<div class="emptybox">Noch kein Material eingetragen.</div>'}</div>
      <div class="matadd"><input id="matfree" maxlength="80" placeholder="Eigenes Material …" autocomplete="off"><button type="button" class="btn" data-act="matfree">Hinzufügen</button></div>`;
      }

      function fieldHtml(f, p) {
        const v = p.values,
          x = v[f.id] ?? '';
        const err = view.tried ? fieldError(f, p) : '';
        const req = isRequired(f, p) && f.type !== 'calc' ? ' *' : '';

          case 'bewertung':

          case 'yesno':

          case 'select': {

      /* @@quelle:reportParts */
      /* Ausdruck im Muther-Design: A4-Seiten mit Kacheln, Checklisten, Seitenumbruch („Fortsetzung“) und Fußzeile „Seite x von y“.
   Nimmt die Bericht-Datenstruktur von buildReport() (App) bzw. rowToReport_() (Apps Script) unverändert entgegen.
   Die HTML-Bausteine kommen aus shared/pdf-bausteine.js (pdfBausteine()), das CSS aus shared/pdf.css. */
      function reportParts(r) {
        const B = pdfBausteine(),
          { esc, nl, up, pill } = B;
        const CHECKV = ['i.O.', 'Mangel', 'n.i.O.', 'entfällt'];
        const isCheck = (x) => ['ok', 'bad', 'na'].includes(x.eval) || CHECKV.includes(x.value);
        const evalOf = (x) =>
          x.eval && x.eval !== 'none'
            ? x.eval
            : x.value === 'i.O.'
              ? 'ok'
              : x.value === 'Mangel' || x.value === 'n.i.O.'
                ? 'bad'
                : x.value === 'entfällt'
                  ? 'na'
                  : '';
        const firma = r.firma || (typeof settings !== 'undefined' ? settings.firma : '') || '';
        // „WARTUNGSPROTOKOLL • KÄLTETECHNISCHE ANLAGEN“ → Kopfzeile „WARTUNGSPROTOKOLL“, Titel „Kältetechnische Anlagen“
        const tp = String(r.title || '').split(' • ');
        const nice = (s) =>
          s
            .split(' ')
            .map((w) =>
              w
                .split('-')
                .map((x) =>
                  x.length >= 5 && x === x.toUpperCase() ? x[0] + x.slice(1).toLowerCase() : x,
                )
                .join('-'),
            )
            .join(' ');
        const kicker = tp.length > 1 ? tp[0] : '',
          h1 = nice(tp.length > 1 ? tp.slice(1).join(' • ') : tp[0]);
        const header = r.header || [];
        // erstes Kopffeld, dessen Beschriftung passt (Nummern-Felder wie „Kundennummer“ ausgenommen)
        const hv = (re) =>
          (header.find((x) => re.test(x.label) && !/nummer|nr\.?$/i.test(x.label) && x.value) || {})
            .value || '';
        const datum = hv(/datum/i);
        const stand =
          datum ||
          (r.completedAt
            ? new Date(r.completedAt).toLocaleDateString('de-DE', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
              })
            : '');
        const blocks = [];

        // Kacheln: Ergebnis · Nächste Wartung · Wartungsdatum (+ Monteur)
        const res = String(r.success || ''),
          good = res === 'Ja' || res === 'i.O.',
          bad = !!res && !good;
        const subs = String(r.subline || (r.betrieb ? 'Betriebszustand: ' + r.betrieb : ''))
          .split(' · ')
          .filter(Boolean);
        const defects = r.defects || [];
        // Datum für die Kacheln einheitlich TT.MM.JJJJ (Eingang: „31.8.2026“, „31.08.2026“ oder „2026-08-31“)
        const p2 = (x) => String(x).padStart(2, '0');
        const dm =
          String(stand || '').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/) ||
          String(stand || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
        const y0 = dm ? +(dm[1].length === 4 ? dm[1] : dm[3]) : 0,
          mo0 = dm ? +dm[2] - 1 : 0,
          d0 = dm ? +(dm[1].length === 4 ? dm[3] : dm[1]) : 0;
        const tileDate = dm ? `${p2(d0)}.${p2(mo0 + 1)}.${y0}` : stand || '';
        // Nächste Wartung: Dichtheitsprüfung vorgeschrieben → Intervall nach CO₂-Äquivalent (ab 5 t [hermetisch 10 t] 12 Monate, ab 50 t 6, ab 500 t 3), sonst Wartungsdatum + 12 Monate
        const nextDue = (() => {
          if (!dm) return { date: '', sub: '' };
          const co2 = parseFloat(String(r.co2 ?? '').replace(',', '.')),
            dp = r.dpv === 'Ja';
          if (dp && !(co2 > 0)) return { date: '', sub: 'CO₂-Äquivalent fehlt' };
          const months = dp ? (co2 >= 500 ? 3 : co2 >= 50 ? 6 : 12) : 12;
          const t = mo0 + months,
            y = y0 + Math.floor(t / 12),
            mo = t % 12;
          const d = Math.min(d0, new Date(y, mo + 1, 0).getDate());
          return {
            date: `${p2(d)}.${p2(mo + 1)}.${y}`,
            sub: dp ? `Dichtheitsprüfung alle ${months} Monate` : 'jährliche Wartung',
          };
        })();
        blocks.push({
          html: B.kacheln(
            [
              {
                art: good ? 'ok' : bad ? 'bad' : '',
                lab: r.resultLabel || 'Gesamtbewertung',
                val: res,
                subHtml: `${good ? pill('ok', 'in Ordnung') : bad ? pill('bad', 'nicht in Ordnung') : ''}${r.successMangel ? `<div>${esc(r.successMangel)}</div>` : ''}${subs.length ? `<div>${esc(subs.join(' · '))}</div>` : ''}`,
              },
              { lab: 'Nächste Wartung', val: nextDue.date, sub: nextDue.sub },
              {
                art: 'primary',
                lab: 'Wartungsdatum',
                val: tileDate,
                sub: r.techniker ? 'Monteur: ' + r.techniker : '',
              },
            ],
            { links: true },
          ),
        });

        // Auftrags- und Anlagendaten
        if (header.length)
          blocks.push({ html: B.abschnitt('Auftrags- & Anlagendaten', B.kv(header)) });

        // Abschnitte: Prüfpunkte als Checkliste, Messwerte als Feldliste, Tabellen umbrechbar
        (r.sections || []).forEach((s) => {
          const all = (s.checks || []).concat(s.rows || []);
          const ck = all.filter(isCheck),
            fl = all.filter((x) => !isCheck(x));
          const body =
            B.checkliste(
              ck.map((x) => ({
                label: x.label,
                mangel: x.mangel,
                value: x.value,
                eval: evalOf(x),
              })),
            ) +
            (fl.length ? (ck.length ? B.zwischenTitel('Messwerte & Angaben') : '') + B.kv(fl) : '');
          if (s.table && s.table.body && s.table.body.length) {
            const t = s.table;
            blocks.push(
              B.tabelle({
                titel: s.title,
                head: t.head.map((h, i) => (i ? h : { t: h, w: '26%' })),
                rows: t.body.map((b) =>
                  [{ t: b.label, cls: 'lbl' }].concat(
                    b.cells.map((c) => ({
                      t: c.value || '—',
                      cls: 'ev ' + (c.eval && c.eval !== 'none' ? c.eval : ''),
                    })),
                  ),
                ),
              }),
            );
            if (body) blocks.push({ html: `<div class="sec-more">${body}</div>` });
          } else {
            blocks.push({
              html: B.abschnitt(s.title, body || '<div class="none">Keine Angaben</div>'),
            });
          }
        });

        if ((r.material || []).length) {
          blocks.push(
            B.tabelle({
              titel: 'Benötigtes Material',
              head: [{ t: 'Pos.', w: '10%' }, 'Bezeichnung', { t: 'Menge', w: '20%' }],
              rows: r.material.map((m, i) => [
                { t: String(i + 1) },
                { t: m.teil, cls: 'lbl' },
                { t: m.menge || '—' },
              ]),
            }),
          );
        }

        if (defects.length)
          blocks.push({ html: B.notiz({ titel: 'Auffälligkeiten', liste: defects, art: 'def' }) });
        blocks.push({
          html: B.notiz({ titel: r.remarkLabel || 'Bemerkungen / Mängel', text: r.remark }),
        });
        if (r.hinweis)
          blocks.push({ html: B.rechtstext([{ titel: 'Betreiberhinweis.', text: r.hinweis }]) });
        const sig = r.sig || {};
        // Kundenunterschrift: der Baustein druckt sie, sobald ein altes Protokoll ein Bild enthält
        blocks.push({
          html: B.unterschrift({
            tech: { bild: sig.tech, name: [r.techniker, stand].filter(Boolean).join(' · ') },
            kunde: { bild: sig.kunde, name: r.kundeName },
            labels: { tech: 'Monteur / Prüfer', kunde: 'Kunde / Betreiber' },
          }),
        });

        const kunde = hv(/kunde|betreiber/i),
          anlage = hv(/anlage|modell/i);
        return {
          blocks,
          head: B.kopf({ firma, kicker, titel: h1, nrLabel: 'Projekt-Nr.', id: r.id, datum }),
          smallHead: B.kopfKlein({
            firma,
            zeile: [kunde, anlage].filter(Boolean).join(' · '),
            titel: kicker ? nice(kicker) : h1,
            nrLabel: 'Projekt-Nr.',
            id: r.id,
          }),
          foot: B.fuss({ text: (kicker ? nice(kicker) + ' ' : '') + h1, stand }),
          id: esc(r.id),
        };
      }

      /* ---------- Unterschrift ---------- */
      function initSig(canvas, p) {
        const key = canvas.dataset.sig;
        const r = canvas.getBoundingClientRect(),
          dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(r.width * dpr);
        canvas.height = Math.round(r.height * dpr);
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = ctx.fillStyle = '#0b1f3a';
        const src = safeImg(p.sig[key]);
        if (src) {
          const img = new Image();
          img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height);
          img.src = src;
        }
        let drawing = false,
          last = null;
        const pt = (e) => {
          const b = canvas.getBoundingClientRect();
          return [e.clientX - b.left, e.clientY - b.top];
        };
        canvas.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          drawing = true;
          last = pt(e);
          canvas.setPointerCapture(e.pointerId);
          ctx.beginPath();
          ctx.arc(last[0], last[1], 1.1, 0, Math.PI * 2);
          ctx.fill();
        });
        canvas.addEventListener('pointermove', (e) => {
          if (!drawing) return;
          const q = pt(e);
          ctx.beginPath();
          ctx.moveTo(last[0], last[1]);
          ctx.lineTo(q[0], q[1]);
          ctx.stroke();
          last = q;
        });
        const end = () => {
          if (!drawing) return;
          drawing = false;
          const out = document.createElement('canvas');
          out.width = Math.round(r.width);
          out.height = Math.round(r.height);
          out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
          p.sig[key] = out.toDataURL('image/png');
          save();
        };
        canvas.addEventListener('pointerup', end);
        canvas.addEventListener('pointercancel', end);
      }
      const After = {
        wizard() {
          const p = cur();
          if (p && TEMPLATE.pages[p.page].final)
            document.querySelectorAll('canvas.sig').forEach((c) => initSig(c, p));
          document

      /* ---------- Google-Sheet-Schnittstelle ---------- */
      /* Übertragene Protokolle werden 7 Tage nach der Übertragung aus der App entfernt (bleiben in der Datenbank) */
      const KEEP_SYNCED_DAYS = 7;
      function pruneSynced() {
        const now = Date.now(),
          maxAge = KEEP_SYNCED_DAYS * 864e5;
        let changed = false;
        protocols.forEach((p) => {
          if (p.status === 'done' && p.synced === true && !p.syncedAt) {
            p.syncedAt = new Date().toISOString();
            changed = true;
          }
        }); // alte Einträge: Frist startet jetzt
        const keep = protocols.filter(
          (p) =>
            !(
              p.status === 'done' &&
              p.synced === true &&
              p.syncedAt &&
              p.id !== view.id &&
              now - new Date(p.syncedAt).getTime() > maxAge
            ),
        );
        if (keep.length !== protocols.length) {
          protocols = keep;
          changed = true;
        }
        if (changed) save();
      }
      async function syncAll(silent) {
        const list = protocols.filter((p) => p.status === 'done' && !p.synced);
        if (!syncCanStart(list.length > 0, silent)) return;
        let okCount = 0,
          err = null;
        for (const p of list) {
          try {
            recompute(p);
            await api('upsert', {
              protocol: {
                id: p.id,
                templateId: TEMPLATE.id,
                values: p.values,
                kundeName: p.kundeName || '',
                completedAt: p.completedAt,
                sig: p.sig,
                sourceKey: p.sourceKey || '',
                summary: { report: buildReport(p) },
                pdf: await pdfBase64(p, reportOf(p), PDF_OPTS),
              },
              cols: buildCols(p),
            });
            p.synced = true;
            p.syncedAt = new Date().toISOString();
            save();
            okCount++;
          } catch (e) {
            err = e;
            break;
          }
        }
        syncEnd();
        pruneSynced();
        if (err) toast(`Übertragung fehlgeschlagen: ${err.message}`);
        else if (okCount) toast(`${okCount} Protokoll(e) in die Datenbank übertragen.`);
        if (view.name === 'home' || view.name === 'report') render();
        else updateNet();
      }

        },
        db() {
          go('db', { q: view.q });
        },
        dbmore() {
          view.lim = (view.lim || 100) + 100;
          $('#dblist').innerHTML = dbList();
        },
        sync() {
          syncAll(false);
        },

        new() {
          const values = {};
          ALL_FIELDS.forEach((f) => {
            values[f.id] = f.init != null ? (typeof f.init === 'function' ? f.init() : f.init) : '';
          });
          const p = {
            id: uid(),
            templateId: TEMPLATE.id,
            values,
            sig: {},
            kundeName: '',
            page: 0,
            status: 'draft',
            createdAt: new Date().toISOString(),
            synced: false,
          };
          recompute(p);
          vorbelegtErfassen(p);
          protocols.unshift(p);
          save();
          go('wizard', { id: p.id });
        },
        resume(d) {
          go('wizard', { id: d.id });
        },
        report(d) {
          go('report', { id: d.id });
        },
        reopen(d) {
          const p = protocols.find((x) => x.id === d.id);
          if (
            !confirm(
              'Protokoll wieder öffnen und bearbeiten? Nach erneutem Abschließen wird der Eintrag in der Datenbank aktualisiert.',
            )
          )
            return;
          p.status = 'draft';
          p.synced = false;
          p.page = TEMPLATE.pages.length - 1;
          save();
          go('wizard', { id: p.id });
        },
        del(d) {
          const p = protocols.find((x) => x.id === d.id);
          const msg = p.synced
            ? 'Protokoll aus der App entfernen? (Es bleibt in der Datenbank erhalten.)'
            : p.status === 'done'
              ? 'ACHTUNG: Dieses Protokoll ist noch NICHT in der Datenbank. Wirklich endgültig löschen?'
              : 'Entwurf löschen?';
          if (!confirm(msg)) return;
          protocols = protocols.filter((x) => x.id !== d.id);
          save();
          render();
        },

        set(d) {
          const p = cur();
          p.values[d.f] = p.values[d.f] === d.v && !isRequired(FIELD[d.f], p) ? '' : d.v; // optionale Felder lassen sich durch erneutes Tippen abwählen
          recompute(p);
          save();
          render();
        },
        allok() {
          const p = cur();
          TEMPLATE.pages[p.page].fields.forEach((f) => {
            if (f.type === 'okfail' && !p.values[f.id]) p.values[f.id] = 'i.O.';
          });
          save();
          render();
        },
        next() {
          const p = cur();
          if (pageErrors(p, p.page).length) {
            view.tried = true;
            render();
            $('#pageerr').textContent = 'Bitte die markierten Felder prüfen.';
            toast('Bitte die markierten Felder prüfen.');
            const first = document.querySelector('.field.err');
            if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
          }
          stepTo('fwd', () => {
            p.page++;
            save();
            view.tried = false;
          });
        },
        prev() {
          const p = cur();
          if (p.page > 0)
            stepTo('back', () => {
              p.page--;
              save();
              view.tried = false;
            });
        },
        jump(d) {
          const p = cur(),
            t = Number(d.i);
          if (t === p.page) {
            view.tried = true;
            render();
            window.scrollTo(0, 0);
            return;
          }
          stepTo(t > p.page ? 'fwd' : 'back', () => {
            p.page = t;
            save();
            view.tried = true;
          });
        },
        sigclear(d) {
          const p = cur();
          delete p.sig[d.sig];
          save();
          render();
        },
        finish() {
          const p = cur();
          recompute(p);
          const bad = TEMPLATE.pages.findIndex((pg, k) => pageErrors(p, k).length);
          if (bad >= 0) {
            p.page = bad;
            save();
            view.tried = true;
            render();
            window.scrollTo(0, 0);
            toast(`Bitte „${TEMPLATE.pages[bad].title}“ vervollständigen.`);
            return;
          }
          if (PFLICHTFELDER && !p.sig.tech) {
            $('#pageerr').textContent = 'Bitte als Monteur unterschreiben.';
            toast('Bitte als Monteur unterschreiben.');
            return;
          }
          p.status = 'done';
          p.completedAt = new Date().toISOString();
          p.synced = false;
          save();
          iosCheck();
          go('report', { id: p.id });
          syncAll(true);
        },

        async makepdf(d, btn) {
          if (!window.jspdf || !window.html2canvas) {
            toast('PDF-Modul nicht geladen – App einmal online neu starten.');
            return;
          }
          if (btn && btn.classList.contains('done')) return; // Doppelstart verhindern
          const r = reportForView();
          if (!r) return;
          const name = pdfName(r.id) + '.pdf',
            key = viewKey();
          if (pdfBusy) {
            toast(
              pdfBusy !== key
                ? 'Es wird gerade ein anderes PDF erstellt …'
                : 'PDF wird noch erstellt …',
            );
            return;
          } // gleicher Bericht: Doppelstart still verhindern
          const cb = () => $('#bar .pdfb'); // immer der aktuell im DOM befindliche Knopf (die Leiste wird bei Neuzeichnen neu gebaut)
          const setP = (v) => {
            pdfProg = v;
            const f = viewKey() === key ? $('#bar .pdfb .fill') : null;
            if (f) f.style.transform = 'scaleX(' + v + ')';
          };
          pdfBusy = key;
          setP(0.05);
          {
            const b = cb();
            if (b) b.classList.add('run');
          }
          // Fortschritt ist geschätzt (der gemeinsame PDF-Code meldet keinen): nähert sich 92 %, springt bei Fertigstellung auf 100 %
          pdfTick = setInterval(() => setP(pdfProg + (0.92 - pdfProg) * 0.07), 250);
          try {
            const blob = await reportPdfBlob(reportForView(), PDF_OPTS);
            clearInterval(pdfTick);
            setP(1);
            await new Promise((res) => setTimeout(res, RM() ? 0 : 240));
            if (lastPdf) URL.revokeObjectURL(lastPdf.url);
            lastPdf = {
              key,
              file: new File([blob], name, { type: 'application/pdf' }),
              url: URL.createObjectURL(blob),
            };
            pdfBusy = null;
            if (view.name === 'report' && viewKey() === key) {
              const bar = $('#pdfbar');
              if (bar) bar.innerHTML = pdfBarHtml();
              setBar(); // baut Leiste neu auf (mit Teilen-Knopf) -> neuen Knopf in den Fertig-Zustand setzen
              const nb = cb();
              if (nb) {
                nb.classList.remove('run');
                nb.classList.add('done');
                setTimeout(() => nb.classList.remove('done'), 2600);
              }
            }
            toast('PDF fertig – jetzt „Teilen“ antippen.');
          } catch (e) {
            toast('PDF konnte nicht erstellt werden: ' + e.message);
          } finally {
            clearInterval(pdfTick);
            pdfBusy = null;
            pdfProg = 0;
            const b = cb();
            if (b && !b.classList.contains('done')) {
              b.classList.remove('run');
              setP(0);
            }
          }
        },
        async sharepdf() {
          if (!lastPdf) return;
          const files = [lastPdf.file];
          if (navigator.canShare && navigator.canShare({ files })) {
            try {
              await navigator.share({ files, title: lastPdf.file.name });
            } catch (e) {
              if (e.name !== 'AbortError') toast('Teilen fehlgeschlagen: ' + e.message);
            }
          } else {
            window.open(lastPdf.url, '_blank');
          }
        },
        print() {
          const r = reportForView();
          const old = document.title;
          document.title = pdfName(r.id);
          window.print();
          setTimeout(() => {
            document.title = old;
          }, 1500);
        },

        async dbload() {
          if (!navigator.onLine) {
            toast('Offline – zeige gespeicherten Stand.');
            return;
          }
          try {
            toast('Lade Daten …');
            const j = await api('list');
            dbCache = { at: new Date().toISOString(), list: j.list };
            LS.set('wp2.db', dbCache);
            toast(`${j.list.length} Einträge geladen.`);
            render();
          } catch (e) {
            toast('Laden fehlgeschlagen: ' + e.message);
          }
        },
        async dbreport(d) {
          if (!navigator.onLine) {
            toast('Zum Öffnen eines Protokolls aus der Datenbank wird Internet benötigt.');
            return;
          }
          try {
            toast('Lade Protokoll …');
            const j = await api('get', { key: d.key });
            go('report', { db: true, rep: j.report, key: d.key, q: view.q });
          } catch (e) {
            toast('Laden fehlgeschlagen: ' + e.message);
          }
        },
        async dbedit(d) {
          if (!navigator.onLine) {
            toast('Zum Laden aus der Datenbank wird Internet benötigt.');
            return;
          }
          try {
            toast('Lade Protokoll …');
            const j = await api('load', { key: d.key });
            const local = j.appId && protocols.find((x) => x.id === j.appId);
            if (
              local &&
              local.status === 'done' &&
              !local.synced &&
              !confirm(
                'In der App gibt es zu diesem Protokoll noch nicht übertragene Änderungen. Durch die Version aus der Datenbank ersetzen?',
              )
            )
              return;
            if (
              local &&
              local.status === 'draft' &&
              !confirm(
                'Dieses Protokoll ist hier schon als Entwurf geöffnet. Durch die Version aus der Datenbank ersetzen?',
              )
            )
              return;
            const values = {};
            ALL_FIELDS.forEach((f) => {
              let x = j.values ? j.values[f.id] : f.col ? j.cols[f.col] : '';
              if (x == null) x = '';
              if (f.type === 'material') {
                if (Array.isArray(x)) {
                  values[f.id] = x;
                } else if (j.cols && typeof j.cols[f.col] === 'string' && j.cols[f.col].trim()) {
                  values[f.id] = materialAusText(j.cols[f.col]);
                } else {
                  values[f.id] = [];
                }
                return;
              }
              if (typeof x === 'number' && f.type !== 'calc') x = fmtNum(x); // Eingabefelder erwarten Text mit Komma
              if (typeof x === 'boolean') x = x ? 'Ja' : 'Nein';
              values[f.id] = f.type === 'calc' ? x : String(x);
            });
            const p = {
              id: j.appId || uid(),
              templateId: TEMPLATE.id,
              values,
              sig: {},
              kundeName: j.kundeName || '',
              sourceKey: d.key,
              page: 0,
              status: 'draft',
              createdAt: new Date().toISOString(),
              synced: false,
            };
            recompute(p);
            protocols = protocols.filter((x) => x.id !== p.id);
            protocols.unshift(p);
            save();
            toast('Geladen – nach dem Bearbeiten neu unterschreiben und abschließen.');
            go('wizard', { id: p.id });
          } catch (e) {
            toast('Laden fehlgeschlagen: ' + e.message);
          }
        },
        async drivepdf() {
          try {
            toast('PDF wird in Google Drive erstellt …');
            const blob = await reportPdfBlob(reportForView(), PDF_OPTS);
            const b64 = await blobB64(blob);
            const j = await api('savepdf', { key: view.key, pdf: b64 });
            const e = dbCache.list.find((x) => x.key === view.key);
            if (e) {
              e.pdfUrl = j.url;
              LS.set('wp2.db', dbCache);
            }
            toast('PDF in Google Drive gespeichert.');
            window.open(j.url, '_blank');
          } catch (e) {
            toast('Fehler: ' + e.message);
          }
        },

        savesettings(d) {
          settingsSave(SETTINGS_FIELDS, 'wp2.settings');
          if (d !== 'silent') toast('Gespeichert.');
        },
        async ping() {
          Actions.savesettings('silent');
          try {
            await api('ping');
            toast('Verbindung zur Datenbank funktioniert ✓');
            syncAll(true);
          } catch (e) {
            toast('Verbindung fehlgeschlagen: ' + e.message);
          }
        },
        backup() {
          backupDownload(
            { app: 'wp-service', exportedAt: new Date().toISOString(), protocols },
            `wp-service-backup-${today()}.json`,
          );
        },
      };

      /* ---------- Events ---------- */
      document.addEventListener('click', (e) => {
        const b = e.target.closest('[data-act]');
        if (!b || b.disabled) return;
        const fn = Actions[b.dataset.act];
        if (fn) {
          e.preventDefault();
          if (navBusy) return;
          fn(b.dataset, b);
        } // während eines Seitenübergangs Tipps ignorieren
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target && e.target.id === 'matfree') {
          e.preventDefault();
          Actions.matfree();
        }
      });
      app.addEventListener('input', (e) => {
        const el = e.target;
        if (el.dataset.mat === 'menge' && view.name === 'wizard') {
          const m = materialArray(cur())[Number(el.dataset.i)];
          if (m) {
            if (MENGE_TIPP.test(el.value)) {
              m.menge = el.value;
              save();
            } else {
              el.value = m.menge;
              toast('Bitte eine Menge als positive Zahl eingeben, z. B. 2,5.');
            }
          }
          return;
        }
        if (el.dataset.f && view.name === 'wizard') {
          const p = cur(),
            f = FIELD[el.dataset.f];
          p.values[f.id] = el.value;
          recompute(p);
          save();
          if (f.id === 'projekt' || f.id === 'kunde') setHeader(false); // Kopf-Unterzeile mitführen (kein Neuzeichnen)
          if (el.dataset.other)
            document
              .querySelectorAll(`[data-act=set][data-f="${f.id}"]`)
              .forEach((b) => b.classList.toggle('sel', b.dataset.v === el.value));
          if (f.type === 'number') $('#soll-' + f.id).innerHTML = sollHtml(f, p.values);
          TEMPLATE.pages[p.page].fields
            .filter((c) => c.type === 'calc')
            .forEach((c) => {
              const ce = $('#calc-' + c.id),
                t = display(c, p.values[c.id]) || '—';
              ce.textContent = t;
              calcTouch(c.id, t, ce);
              if (c.note) $('#note-' + c.id).textContent = c.note(p.values);
            });
        } else if (el.id === 'dbsearch') {
          view.q = el.value;
          view.lim = 100;
          $('#dblist').innerHTML = dbList();
        }
      });
      document.addEventListener('change', (e) => {
        const el = e.target;
        if (el.dataset && el.dataset.pick && view.name === 'wizard') {
          Actions.set({ f: el.dataset.pick, v: el.value });
          return;
        }
        if (el.dataset && el.dataset.mat === 'menge' && view.name === 'wizard') {
          const m = materialArray(cur())[Number(el.dataset.i)];
          const n = parseMenge(el.value.replace(/[.,]$/, ''));
          if (m && el.value.trim() !== '') {
            if (n === null) {
              toast('Bitte eine Menge als positive Zahl eingeben, z. B. 2,5.');
              el.value = m.menge;
            } else {
              m.menge = fmtMenge(n);
              el.value = m.menge;
              save();
            }
          }
          return;
        }
        if (el.id === 's_import' && el.files[0]) {
          backupImport(el.files[0], 'protocols', protocols, 'Protokolle', (list) => {
            protocols = list;
            save();
          });
        }
      });
      /* Wischen vom linken Rand = zurück (Eltern-Seite als Unterlage) */
      iosSwipe.init({
        back() {
          if (view.name === 'wizard') {
            const p = cur();
            if (!p) return null;
            if (p.page > 0) {
              const t = p.page - 1;
              return {
                html: wizardHtml(p, t),
                go() {
                  p.page = t;
                  save();
                  view.tried = false;
                  render();
                  window.scrollTo(0, 0);
                },
              };
            }
            return {
              html: Views.home(),
              go() {
                Actions.home();
              },
            };
          }
          if (view.name === 'report') {
            if (view.db)
              return {
                html: Views.db(),
                go() {
                  Actions.db();
                },
              };
            return {
              html: Views.home(),
              go() {
                Actions.home();
              },
            };
          }
          if (view.name === 'db' || view.name === 'settings')
            return {
              html: Views.home(),
              go() {
                Actions.home();
              },
            };
          return null;
        },
      });
      window.addEventListener('online', () => {
        updateNet();
        syncAll(true);
      });
      window.addEventListener('offline', updateNet);
      let lastW = window.innerWidth;
      window.addEventListener('resize', () => {
        // Drehen des iPads: Unterschriftsfelder neu aufbauen
        if (
          window.innerWidth !== lastW &&
          view.name === 'wizard' &&
          cur() &&
          TEMPLATE.pages[cur().page].final
        )
          render();
        lastW = window.innerWidth;
      });

      /* ---------- Start ---------- */
      if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
        navigator.serviceWorker.register('sw.js').catch(() => {});
      if (navigator.storage && navigator.storage.persist)
        navigator.storage.persist().catch(() => {});
      pruneSynced();
      render();
      syncAll(true);
    </script>
    <script src="shared/theme.js"></script>
  </body>
</html>
