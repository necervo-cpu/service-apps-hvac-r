<style>
.ferr{color:var(--bad);font-size:14px;font-weight:600;margin-top:6px}
.field.err input,.field.err textarea{border-color:var(--bad)}
.seg .btn.sel.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg .btn.sel.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.seg .btn.sel.na{background:var(--na);border-color:var(--na);color:#fff}
.seg .btn.sel.neutral{background:var(--pri);border-color:var(--pri);color:#fff}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.opts .btn{min-height:46px}
.opts .btn.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.inunit input{max-width:260px;font-size:22px}
.inunit .unit{color:var(--muted);font-weight:600}
.soll{font-size:14px;margin-top:6px}
.calc{display:inline-block;padding:10px 14px;background:var(--calc);border-radius:10px;font-weight:700;min-width:120px}
.calcnote{font-size:13px;color:var(--muted);margin-left:8px}
@media(max-width:700px){.frow{flex-direction:column;align-items:stretch}.seg .btn{flex:1}}
.sigwrap{border:2px dashed #c4ccd8;border-radius:12px;background:#fff;margin-bottom:8px}
canvas.sig{width:100%;height:170px;display:block;touch-action:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.err{color:var(--bad);font-weight:600;margin-top:10px;min-height:1.2em}
a.jump{color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--pri2);text-decoration-thickness:2px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--gold);outline-offset:0;border-color:var(--pri2)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(40px);opacity:0;background:var(--pri);color:#fff;padding:12px 18px;border-radius:12px;transition:opacity var(--t-med) var(--out),transform var(--t-med) var(--out);z-index:20;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Feste Leiste unten (Zurück / Weiter / Abschließen / PDF) */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.bar>div{max-width:940px;margin:0 auto;display:flex;gap:10px}
.bar .btn{flex:1;min-height:52px;border-radius:13px;font-weight:700;font-size:15px}
.bar .btn.primary{border-color:var(--gold-dark)}
body.hasbar main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
body.hasbar #toast{bottom:calc(90px + env(safe-area-inset-bottom))}
/* PDF-Knopf mit Fortschritt */
.bar .btn.pdfb{overflow:hidden}
.pdfb .fill{position:absolute;inset:0;background:rgba(0,0,0,.14);transform:scaleX(0);transform-origin:left;transition:transform 220ms linear;pointer-events:none}
.pdfb .l1,.pdfb .l2,.pdfb .lr{display:flex;align-items:center;gap:6px;position:relative;transition:opacity var(--t-fast),transform var(--t-fast) var(--out)}
.pdfb .l2,.pdfb .lr{position:absolute;opacity:0;transform:translateY(8px)}
.pdfb.run .l1,.pdfb.done .l1{opacity:0;transform:translateY(-8px)}
.pdfb.run .lr{opacity:1;transform:none}
.pdfb.done .lr{opacity:0}
.pdfb.done .l2{opacity:1;transform:none}
.bar .btn.pdfb.done{background:#1e8e4e;border-color:#1e8e4e;color:#fff}
.pdfb.done .fill{opacity:0}
/* Wert wechselt: kurzes Aufleuchten */
.flash{animation:flash 900ms var(--out)}
@keyframes flash{from{background-color:var(--flash)}}
/* Seitenwechsel zwischen den Schritten */
.pg-out-fwd{animation:pgoutf var(--t-exit) var(--in) forwards}
.pg-out-back{animation:pgoutb var(--t-exit) var(--in) forwards}
.pg-in-fwd{animation:pginf var(--t-med) var(--out) both}
.pg-in-back{animation:pginb var(--t-med) var(--out) both}
@keyframes pgoutf{to{transform:translateX(-22%);opacity:0}}
@keyframes pgoutb{to{transform:translateX(22%);opacity:0}}
@keyframes pginf{from{transform:translateX(100%);opacity:0}}
@keyframes pginb{from{transform:translateX(-100%);opacity:0}}
/* Karten erscheinen gestaffelt (nur solange .entering am Container hängt) */
.entering .stag{opacity:0;transform:translateY(12px);animation:up var(--t-med) var(--out) forwards;animation-delay:calc(var(--i)*70ms + 120ms)}
@keyframes up{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.001ms!important;transition-delay:0ms!important;animation-duration:.001ms!important;animation-delay:0ms!important}.entering .stag{opacity:1;transform:none}}

  .card>table td{border:0;padding:2px 0;text-align:left!important;white-space:normal!important}

/* ===== Bericht-CSS (identisch in google-apps-script/PdfDialog.html) ===== */
.report{--gold:#DCCC4B;--gold-soft:#faf6dc;--ink:#1a1a1a;--ink-2:#3a3a3a;--ink-3:#706F6F;--line:#dcd9cf;--line-soft:#eceae3;--zebra:#faf9f5;--head-bg:#f8f7f4;
  --ok:#1e7a46;--ok-bg:#e6f4ec;--bad:#b42318;--bad-bg:#fdecea;--warn:#8a5a00;--warn-bg:#fdf3d6;
  color:var(--ink);font-family:Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.report *{box-sizing:border-box}
.report .page{width:210mm;height:297mm;margin:0 auto 16px;background:#fff;box-shadow:0 2px 10px rgba(20,20,20,.15);padding:14mm 15mm 12mm;
  display:flex;flex-direction:column;font-size:8.3pt;line-height:1.4;text-align:left}
.report.flat .page{box-shadow:none;margin:0}
.report .page-body{flex:1;min-height:0;overflow:hidden}
.report .pfoot{display:flex;justify-content:space-between;gap:4mm;border-top:1px solid var(--line);padding-top:2.5mm;margin-top:4mm;font-size:7pt;color:var(--ink-3)}
.report .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8mm;padding-bottom:4mm;border-bottom:2.5px solid var(--gold)}
.report .firm b{display:block;font-size:10pt;color:var(--ink)}
.report .firm span{display:block;font-size:7.6pt;color:var(--ink-2)}
.report .doc{text-align:right;flex-shrink:0}
.report .doc .kicker{font-size:7pt;letter-spacing:.12em;color:var(--ink-3)}
.report .doc h1{margin:.5mm 0 1mm;font-size:17pt;line-height:1.1;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.report .doc .meta{font-size:7.8pt;color:var(--ink-2)}
.report .doc .meta b{color:var(--ink)}
.report .law{font-size:6.8pt;color:var(--ink-3);margin-top:2mm;line-height:1.35}
.report .head.small{padding-bottom:2.5mm}
.report .head.small .doc h1{font-size:11pt}
.report .status{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:3mm;margin:5mm 0 1mm}
.report .tile{border:1px solid var(--line);border-radius:2mm;padding:3mm 3.5mm}
.report .tile .lab{font-size:6.8pt;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.report .tile .val{font-size:14pt;font-weight:700;margin-top:.8mm;line-height:1.15}
.report .tile .sub{font-size:7.6pt;color:var(--ink-2);margin-top:1mm}
.report .tile.primary{border-color:var(--gold);border-left:1.2mm solid var(--gold);background:var(--gold-soft)}
.report .pill{display:inline-flex;align-items:center;gap:1.2mm;font-weight:600;font-size:7.6pt;padding:.5mm 2mm;border-radius:10mm;white-space:nowrap}
.report .pill svg{width:2.8mm;height:2.8mm;flex-shrink:0}
.report .tile .pill{margin-left:-2mm;display:inline-block}
.report .tile .pill svg{display:inline-block;vertical-align:-.6mm;margin-right:1.2mm}
.report .pill.ok{color:var(--ok);background:var(--ok-bg)}
.report .pill.bad{color:var(--bad);background:var(--bad-bg)}
.report .pill.warn{color:var(--warn);background:var(--warn-bg)}
.report .sec{margin-top:4.5mm}
.report .sec h2{display:flex;align-items:baseline;gap:2.5mm;margin:0 0 2mm;font-size:9.6pt;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0;
  padding-bottom:1.2mm;border-bottom:1px solid var(--line)}
.report .sec h2 .no{display:inline-flex;align-items:center;justify-content:center;width:5mm;height:5mm;border-radius:1mm;background:var(--gold);color:var(--ink);font-size:7.4pt}
.report .sec h2 .ref{margin-left:auto;font-size:7pt;font-weight:500;color:var(--ink-3)}
.report .cols2{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.report .card{border:1px solid var(--line-soft);border-radius:1.5mm;padding:2.5mm 3mm;background:var(--zebra)}
.report .card h3{margin:0 0 1.5mm;font-size:7pt;letter-spacing:.09em;color:var(--ink-3)}
.report .addr{font-size:8.8pt;line-height:1.45}
.report .addr b{font-weight:600}
.report dl.kv{display:grid;grid-template-columns:repeat(4,1fr);margin:0;column-gap:4mm}
.report dl.kv div{padding:1.5mm 0;border-bottom:1px solid var(--line-soft);min-width:0}
.report dl.kv dt{font-size:6.8pt;color:var(--ink-3);letter-spacing:.06em}
.report dl.kv dd{margin:.3mm 0 0;font-size:8.8pt;font-weight:500;overflow-wrap:anywhere}
.report dl.kv dd.empty{color:#9a9999;font-weight:400}
.report .checks{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
.report .cgroup h4{margin:0 0 1mm;font-size:7pt;letter-spacing:.07em;color:var(--ink-2)}
.report .citem{display:flex;align-items:flex-start;gap:1.6mm;padding:.9mm 0;border-bottom:1px dotted var(--line)}
.report .citem svg{width:3.2mm;height:3.2mm;flex-shrink:0;margin-top:.3mm}
.report .citem .t{flex:1}
.report .citem .a{font-size:7.4pt;font-weight:600;color:var(--ink-2);text-align:right}
.report .signoff{display:flex;flex-wrap:wrap;gap:1mm 6mm;margin-top:2.5mm;font-size:7.8pt;color:var(--ink-2)}
.report .signoff b{color:var(--ink);font-weight:600}
.report table{width:100%;border-collapse:collapse;table-layout:fixed}
.report th{font-size:6.8pt;letter-spacing:.06em;color:var(--ink-2);text-align:left;font-weight:600;
  background:var(--head-bg);padding:1.6mm 2mm;border-bottom:1.5px solid var(--gold)}
.report td{padding:1.4mm 2mm;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:8.3pt;overflow-wrap:anywhere}
.report tbody tr:nth-child(even) td{background:var(--zebra)}
.report td.num,.report th.num{text-align:right}
.report td.date{white-space:nowrap;font-weight:600}
.report td .small{display:block;font-size:7pt;color:var(--ink-3)}
.report .none{font-size:7.8pt;color:var(--ink-3);font-style:italic;padding:.5mm 0}
.report .leak{margin-top:1.8mm;font-size:7.8pt;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:1mm 2mm}
.report .leak b{color:var(--ink)}
.report .note{border:1px solid var(--line);border-left:1mm solid var(--gold);border-radius:1mm;padding:2.5mm 3mm;margin-top:4.5mm;font-size:8.4pt}
.report .note b{display:block;font-size:7pt;letter-spacing:.08em;color:var(--ink-3);margin-bottom:.8mm}
.report .legal{margin-top:4mm;display:grid;grid-template-columns:1fr;gap:1.4mm;font-size:6.9pt;color:var(--ink-2);line-height:1.4}
.report .legal p{margin:0}
.report .legal b{color:var(--ink)}
.report .sign{display:grid;grid-template-columns:1fr 1fr;gap:12mm;margin-top:7mm}
.report .sign>div{display:flex;flex-direction:column}
.report .sign b{font-size:7pt;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.report .sign .space{display:block;height:30mm}
.report .sign .cap{border-top:1px solid var(--ink-2);padding-top:1.2mm;font-size:7pt;color:var(--ink-3)}
.report .tile.ok{border-color:var(--ok);border-left:1.2mm solid var(--ok);background:var(--ok-bg)}
.report .tile.ok .val{color:var(--ok)}
.report .tile.bad{border-color:var(--bad);border-left:1.2mm solid var(--bad);background:var(--bad-bg)}
.report .tile.bad .val{color:var(--bad)}
.report .tile .sub div{margin-top:1mm}
.report dl.kv div.wide{grid-column:1/-1}
.report dl.kv dd.warn{color:var(--warn);font-weight:700}
.report .sub-h{font-size:7pt;letter-spacing:.07em;color:var(--ink-2);font-weight:700;margin:2.5mm 0 .5mm}
.report .checks2{display:grid;grid-template-columns:1fr 1fr;column-gap:6mm}
.report .ci{display:flex;align-items:center;gap:1.8mm;padding:1mm .8mm;border-bottom:1px dotted var(--line)}
.report .ci svg{flex-shrink:0}
.report .ci .t{flex:1}
.report .ci .a{font-size:7.4pt;font-weight:700;white-space:nowrap}
.report .ci.ok .a{color:var(--ok)}
.report .ci.bad .a{color:var(--bad)}
.report .ci.na .a{color:#8a8989}
.report .ci.bad{background:var(--bad-bg)}
.report .sec-more{margin-top:2mm}
.report td.lbl{background:var(--head-bg);font-weight:600}
.report td.ev.ok{color:var(--ok);font-weight:700}
.report td.ev.bad{color:var(--bad);font-weight:700}
.report td.ev.warn{color:var(--warn);font-weight:700}
.report td.ev.na{color:#8a8989}
.report .note.def{border-left-color:var(--bad);background:#fffafa}
.report .note ul{margin:0;padding-left:4mm}
.report .sign .space{display:flex;align-items:flex-end;padding-bottom:1mm}
.report .sign .space img{max-height:26mm;max-width:100%}
/* ===== Ende Bericht-CSS ===== */
@media print{
  header,.noprint,#toast,.bar,#stepwrap{display:none!important}

  .stage{overflow:visible}
  .sheetwrap{background:none;padding:0;border-radius:0}
  .report{zoom:1!important}
  .report .page{box-shadow:none;margin:0;break-after:page}
  @page{size:A4;margin:0}
}
</style>

<script>
'use strict';

/* =====================================================================
   Feld-Definition – entspricht dem Blatt "Datenbank" / "AppSheet_Konfiguration".
   col = exakter Spaltenname im Google Sheet.
   ===================================================================== */
const GWP = {R290:3, R32:675, R410A:2088, R454B:466, R134a:1430, R407C:1774};
const OK3 = ['i.O.', 'n.i.O.', 'entfällt'];
const ok = (id, col, label, pdf, hint, req = true) => ({id, col, label, pdf, hint, type:'okfail', req});

const TEMPLATE = {
  id: 'wp-wartung', title: 'WARTUNGSPROTOKOLL • WÄRMEPUMPE',
  pages: [
    {title:'Stammdaten & Auftrag', short:'Stammdaten', header:true, fields:[
      {id:'projekt', col:'Projektnummer', label:'Projektnummer', pdf:'Protokoll-Nr.', type:'text', req:true, hint:'Vorschlag kann überschrieben werden',
        init:() => 'WP-' + today().replace(/-/g, '') + '-' + uid().slice(0, 4).toUpperCase()},
      {id:'kunde', col:'Kundennummer', label:'Kundennummer', pdf:'Kunden-Nr.', type:'text', req:true, ph:'z. B. KD-98101'},
      {id:'datum', col:'Datum', label:'Datum', type:'date', req:true, notFuture:true, init:() => today()},
      {id:'monteur', col:'Monteur', label:'Monteur', pdf:'Monteur / Prüfer', type:'text', req:true, init:() => settings.techniker},
      {id:'zusatz', col:'Zusatzinformationen', label:'Zusatzinformationen', type:'longtext', wide:true, hint:'Allgemeine Angaben, Kundengespräche, Anfahrt'}
    ]},
    {title:'Anlagendaten (Außen- & Inneneinheit)', short:'Anlage', fields:[

/* ---------- Helfer ---------- */
const app = $('#app');
function fmtDate(s){ if(!s) return ''; const d = new Date(String(s).length === 10 ? s + 'T12:00:00' : s); return isNaN(d) ? String(s) : d.toLocaleDateString('de-DE'); }
function num(v){ return typeof v === 'number' ? v : Number(String(v).trim().replace(',', '.')); }
function safeImg(src){ return typeof src === 'string' && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(src) ? src : ''; }
let calcSeen = {};   // zuletzt angezeigte Rechenwerte -> Aufleuchten nur bei echter Änderung
function calcTouch(id, text, el){ const k = view.id + ':' + id; if(k in calcSeen && calcSeen[k] !== text) flash(el); calcSeen[k] = text; }

/* ---------- Werte, Prüfung, Bewertung ---------- */
function recompute(p){ ALL_FIELDS.forEach(f => { if(f.type === 'calc') p.values[f.id] = f.calc(p.values); }); }
function display(f, x){
  if(x === '' || x == null) return '';
  if(f.type === 'date') return fmtDate(x);
  if((f.type === 'number' || f.type === 'calc') && isN(x)) return fmtNum(String(x).trim()) + (f.unit ? ' ' + f.unit : '');
  return String(x);
}
function sollText(f){
  const u = f.unit && f.unit !== 'pH' ? ' ' + f.unit : '';
  if(f.sMin != null && f.sMax != null) return `Soll ${fmtNum(f.sMin)} – ${fmtNum(f.sMax)}${u}`;
  if(f.sMax != null) return `Soll ≤ ${fmtNum(f.sMax)}${u}`;
  if(f.sMin != null) return `Soll ≥ ${fmtNum(f.sMin)}${u}`;
  return '';
}
function evalField(f, v){
  const x = v[f.id];
  if(f.type === 'okfail') return x === 'i.O.' ? 'ok' : x === 'n.i.O.' ? 'bad' : x === 'entfällt' ? 'na' : 'none';
  if(f.bad && f.bad.includes(x)) return 'bad';
  if(f.good && f.good.includes(x)) return 'ok';
  if(f.type === 'number' && isN(x) && (f.sMin != null || f.sMax != null)){
    const n = num(x);
    return (f.sMin != null && n < f.sMin) || (f.sMax != null && n > f.sMax) ? 'warn' : 'ok';
  }
  if(f.id === 'wasser' && x) return x === 'im Richtbereich' ? 'ok' : 'warn';
  return 'none';
}
function defects(p){
  return ALL_FIELDS.filter(f => f.type !== 'calc' && ['bad', 'warn'].includes(evalField(f, p.values)))
    .map(f => `${f.pdf || f.label}: ${display(f, p.values[f.id])}` + (evalField(f, p.values) === 'warn' ? ` (${sollText(f)})` : ''));
}
const PFLICHTFELDER = false;   // true = Pflichtfelder (req/reqIf) und Monteur-Unterschrift werden wieder erzwungen
function isRequired(f, p){ return PFLICHTFELDER && (!!f.req || (f.reqIf ? f.reqIf(p.values, p) : false)); }
function fieldError(f, p){
  if(f.type === 'calc') return '';
  const x = p.values[f.id], empty = String(x ?? '').trim() === '';
  if(empty) return isRequired(f, p) ? (f.reqMsg || 'Pflichtfeld') : '';
  if(f.type === 'number'){
    if(!isN(x)) return 'Bitte eine gültige Zahl eingeben.';
    const n = num(x);
    if((f.min != null && n < f.min) || (f.max != null && n > f.max)) return `Unplausibler Wert (erlaubt ${fmtNum(f.min)} – ${fmtNum(f.max)} ${f.unit || ''})`;
  }
  if(f.type === 'date' && f.notFuture && x > today()) return 'Datum liegt in der Zukunft.';
  return '';
}
function pageErrors(p, i){ return TEMPLATE.pages[i].fields.map(f => [f, fieldError(f, p)]).filter(e => e[1]); }
function pageDone(p, i){ return TEMPLATE.pages[i].fields.every(f => f.type === 'calc' || !fieldError(f, p)) && TEMPLATE.pages[i].fields.some(f => f.type !== 'calc' && String(p.values[f.id] ?? '') !== ''); }

/* Bericht-Datenstruktur – identisch genutzt von App-PDF und Apps-Script-PDF */
function buildReport(p){
  const v = p.values;
  const rowsOf = pg => pg.fields.filter(f => !(f.wide && !v[f.id])).map(f => ({label:f.pdf || f.label, value:display(f, v[f.id]), eval:evalField(f, v), wide:!!f.wide}));
  return {
    title: TEMPLATE.title, firma: settings.firma || '',
    header: rowsOf(TEMPLATE.pages[0]),
    sections: TEMPLATE.pages.filter(pg => !pg.header && !pg.final).map(pg => ({title:pg.pdfTitle || pg.title, kind:pg.kind || 'grid', rows:rowsOf(pg)})),
    defects: defects(p), dpv: v.dpv || '', co2: isN(v.co2) ? num(v.co2) : '', success: v.erfolg || '', betrieb: v.betrieb || '', remark: v.bem || '',
    techniker: v.monteur || '', kundeName: p.kundeName || '', id: v.projekt || p.id, completedAt: p.completedAt || ''
  };
}
/* Spaltenwerte fürs Google Sheet */
function buildCols(p){
  return ALL_FIELDS.filter(f => f.col).map(f => {
    const x = p.values[f.id];
    if(x === '' || x == null) return [f.col, '', ''];
    if(f.type === 'date') return [f.col, x, 'date'];
    if((f.type === 'number' || f.type === 'calc') && isN(x)) return [f.col, num(x), ''];
    return [f.col, String(x), ''];
  });
}

/* ---------- Navigation ---------- */
let view = {name:'home'};
let enterNext = false, enterT = null, navBusy = false, pdfBusy = null, pdfProg = 0, pdfTick = null, hsubAnim = null;
function go(name, params){
  const was = view.name;
  view = Object.assign({name}, params || {});
  if(name === 'wizard' && was !== 'wizard') calcSeen = {};
  enterNext = name === 'wizard';   // Karten beim Betreten gestaffelt einblenden
  render(); window.scrollTo(0, 0);
}
function cur(){ return protocols.find(p => p.id === view.id); }
function render(){
  const enter = enterNext; enterNext = false;
  app.innerHTML = (Views[view.name] || Views.home)();
  if(!navBusy){   // Klassen nur zurücksetzen, wenn gerade kein Seitenübergang läuft
    app.className = enter && !RM() ? 'entering' : '';
    clearTimeout(enterT);
    if(enter) enterT = setTimeout(() => { if(!navBusy) app.classList.remove('entering'); }, 900);
  }
  setHeader(true);
  if(view.name === 'report') showReport();
  if(After[view.name]) After[view.name]();
  setSteps(); setBar();
  updateNet();
}
/* Kopf: Unterzeile = Projektnummer · Kunde (im Formular / Bericht), sonst Bereichsname */
function hsubText(){
  const p = (view.name === 'wizard' || (view.name === 'report' && !view.db)) ? cur() : null;
  if(p) return (p.values.projekt || 'ohne Projektnummer') + (p.values.kunde ? ' · ' + p.values.kunde : '');
  if(view.name === 'report' && view.db && view.rep) return view.rep.id || 'Bericht';
  return view.name === 'settings' ? 'Einstellungen' : view.name === 'db' ? 'Datenbank / PDF' : 'Wartungsprotokolle';
}
function setSteps(){ const p = view.name === 'wizard' ? cur() : null; stepsRender(p && {key:p.id, pages:TEMPLATE.pages, index:p.page, done:k => pageDone(p, k) && !TEMPLATE.pages[k].final, pauseAct:'home'}); }

function barHtml(){
  if(view.name === 'wizard'){
    const p = cur(); if(!p) return '';
    const i = p.page, pg = TEMPLATE.pages[i];
    return `<div><button class="btn" data-act="prev"${i === 0 ? ' disabled' : ''}>← Zurück</button>${pg.final ? '<button class="btn primary" data-act="finish">Abschließen ✓</button>' : '<button class="btn primary" data-act="next">Weiter →</button>'}</div>`;
  }
  if(view.name === 'report' && reportForView()){
    const run = pdfBusy === viewKey();
    return `<div><button class="btn" style="flex:.6" data-act="${view.db ? 'db' : 'home'}">← Zurück</button><button class="btn primary pdfb${run ? ' run' : ''}" data-act="makepdf"><span class="fill"${run ? ` style="transform:scaleX(${pdfProg})"` : ''}></span><span class="l1">PDF erstellen</span><span class="lr">PDF wird erstellt …</span><span class="l2">✓ PDF fertig</span></button>${lastPdf && lastPdf.key === viewKey() ? '<button class="btn" style="flex:.7" data-act="sharepdf">Teilen</button>' : ''}</div>`;
  }
  return '';
}

    const pending = done.filter(p => !p.synced).length;

      <div class="row">
        <button class="btn primary" data-act="new">+ Neue Wartung</button>
        <button class="btn" data-act="sync">Synchronisieren${pending ? ` (${pending})` : ''}</button>

        <button class="btn" data-act="settings">Einstellungen</button>
      </div>
      ${!settings.url ? '<div class="warnbox">Noch keine Verbindung zum Google Sheet eingerichtet. Protokolle werden lokal gespeichert, bis du unter <b>Einstellungen</b> die Web-App-URL einträgst.</div>' : ''}

  },

  wizard(){
    const p = cur();
    if(!p) return '<p>Protokoll nicht gefunden.</p>';
    const pg = TEMPLATE.pages[p.page];

    return `
      <div class="row between stag" style="--i:0"><div class="pagetitle">${esc(pg.title)}</div>${allOk ? '<button class="btn small" data-act="allok">Offene Punkte auf i.O.</button>' : ''}</div>

  },

  report(){

      <div class="row noprint" style="margin-bottom:12px">
        <span id="pdfbar" class="row">${pdfBarHtml()}</span>

        ${p && !p.synced ? '<span class="badge warn">noch nicht im Google Sheet</span>' : ''}
      </div>

  db(){
    return `

        <button class="btn" data-act="home">← Zurück</button>

      <input id="dbsearch" type="search" placeholder="Suchen: Projekt-Nr., Kunden-Nr., Monteur, Modell, Datum …" value="${esc(view.q || '')}">

  }

function protoCard(p){
  const v = p.values;
  let badges;
  if(p.status === 'draft'){
    badges = `<span class="badge warn">Schritt ${p.page + 1}/${TEMPLATE.pages.length}</span>`;
  } else {
    badges = `<span class="badge ${v.erfolg === 'Ja' ? 'ok' : 'bad'}">Wartung erfolgreich: ${esc(v.erfolg)}</span> <span class="badge ${p.synced ? 'ok' : 'warn'}">${p.synced ? 'im Sheet' : 'nicht übertragen'}</span>`;
  }
  return `
    <div class="card">
      <div class="row between">
        <div><b>${esc(v.projekt || 'Ohne Projektnummer')}</b>${v.kunde ? ' · ' + esc(v.kunde) : ''}<br>
          <span class="muted">${esc(fmtDate(v.datum))}${v.agModell ? ' · ' + esc(v.agModell) : ''}${v.monteur ? ' · ' + esc(v.monteur) : ''}</span></div>
        <div>${badges}</div>
      </div>
      <div class="row" style="margin-top:10px">
        ${p.status === 'draft'
          ? `<button class="btn small primary" data-act="resume" data-id="${p.id}">Fortsetzen</button>`
          : `<button class="btn small primary" data-act="report" data-id="${p.id}">Bericht / PDF</button><button class="btn small" data-act="reopen" data-id="${p.id}">Bearbeiten</button>`}
        <button class="btn small danger" data-act="del" data-id="${p.id}">Löschen</button>
      </div>
    </div>`;
}

function fieldHtml(f, p){
  const v = p.values, x = v[f.id] ?? '';
  const err = view.tried ? fieldError(f, p) : '';
  const req = isRequired(f, p) && f.type !== 'calc' ? ' *' : '';
  const lab = `<label for="in-${f.id}">${esc(f.label)}${req}</label>${f.hint ? `<div class="fhint">${esc(f.hint)}</div>` : ''}`;
  const errHtml = err ? `<div class="ferr">${esc(err)}</div>` : '';
  const seg = (vals, cls) => `<div class="seg">${vals.map((o, k) => `<button class="btn ${cls[k]} ${x === o ? 'sel' : ''}" data-act="set" data-f="${f.id}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  let body;
  switch(f.type){
    case 'okfail': return `<div class="field ${err ? 'err' : ''}"><div class="frow"><div>${lab}</div>${seg(OK3, ['ok', 'bad', 'na'])}</div>${errHtml}</div>`;
    case 'yesno':  return `<div class="field ${err ? 'err' : ''}"><div class="frow"><div>${lab}</div>${seg(['Ja', 'Nein'], ['neutral', 'neutral'])}</div>${errHtml}</div>`;
    case 'select': {
      const custom = f.other && x && !f.opts.includes(x);
      body = `<div class="opts">${f.opts.map(o => `<button class="btn ${x === o ? 'sel' : ''}" data-act="set" data-f="${f.id}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
        ${f.other ? `<input id="in-${f.id}" data-f="${f.id}" data-other="1" placeholder="oder anderer Wert …" value="${custom ? esc(x) : ''}" autocomplete="off">` : ''}`;
      break;
    }
    case 'number':
      body = `<div class="inunit"><input id="in-${f.id}" data-f="${f.id}" inputmode="decimal" autocomplete="off" value="${esc(x)}" placeholder="${esc(f.ph || '')}"><span class="unit">${esc(f.unit || '')}</span></div>
        <div class="soll" id="soll-${f.id}">${sollHtml(f, v)}</div>`;
      break;
    case 'date':     body = `<input id="in-${f.id}" type="date" data-f="${f.id}" value="${esc(x)}" style="max-width:260px">`; break;
    case 'longtext': body = `<textarea id="in-${f.id}" data-f="${f.id}" placeholder="${esc(f.ph || '')}">${esc(x)}</textarea>`; break;
    case 'calc':     body = `<span class="calc" id="calc-${f.id}">${esc(display(f, x) || '—')}</span><span class="calcnote" id="note-${f.id}">${f.note ? esc(f.note(v)) : 'wird berechnet'}</span>`; break;
    default:         body = `<input id="in-${f.id}" data-f="${f.id}" value="${esc(x)}" placeholder="${esc(f.ph || '')}" autocomplete="off">`;
  }
  return `<div class="field ${err ? 'err' : ''}">${lab}${body}${errHtml}</div>`;
}
function sollHtml(f, v){
  const s = sollText(f), ev = evalField(f, v);
  if(ev === 'warn') return `<span class="badge warn">außerhalb Sollbereich</span> <span class="muted">${esc(s)}</span>`;
  if(ev === 'ok') return `<span class="badge ok">im Sollbereich</span> <span class="muted">${esc(s)}</span>`;
  return s ? `<span class="muted">${esc(s)}</span>` : '';
}

function finalHtml(p){
  const d = defects(p);
  const missing = TEMPLATE.pages.slice(0, -1).map((pg, k) => [k, pageErrors(p, k)]).filter(x => x[1].length);
  return `
    ${missing.length ? `<div class="warnbox stag" style="--i:2"><b>Noch unvollständig:</b><ul style="margin:6px 0 0">${missing.map(([k, errs]) =>
      `<li><a class="jump" data-act="jump" data-i="${k}">${esc(TEMPLATE.pages[k].title)}</a>: ${errs.map(e => esc(e[0].label)).join(', ')}</li>`).join('')}</ul></div>` : ''}
    <div class="card stag" style="--i:3"><b>Auffälligkeiten:</b> ${d.length ? `<span class="badge bad">${d.length}</span><ul>${d.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<span class="badge ok">keine</span>'}</div>
    <div class="card stag" style="--i:4">
      <div class="grid2">
        <div>
          <label>Unterschrift Monteur${PFLICHTFELDER ? ' *' : ''}${p.values.monteur ? ' (' + esc(p.values.monteur) + ')' : ''}</label>
          <div class="sigwrap"><canvas class="sig" data-sig="tech"></canvas></div>
          <button class="btn small" data-act="sigclear" data-sig="tech">Unterschrift löschen</button>
        </div>
      </div>
    </div>`;
}

/* ===== identisch in google-apps-script/PdfDialog.html (Teil 1 von 2: RICON, reportParts; Teil 2 steht in shared/pdf.js) ===== */
/* Ausdruck im Muther-Design: A4-Seiten mit Kacheln, Checklisten, Seitenumbruch („Fortsetzung“) und Fußzeile „Seite x von y“.
   Nimmt die Bericht-Datenstruktur von buildReport() (App) bzw. rowToReport_() (Apps Script) unverändert entgegen. */
const RICON = {
  ok:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.2" fill="currentColor"/><path d="M4.8 8.3l2.1 2.1 4.3-4.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bad:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.2" fill="currentColor"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>',
  na:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.3 8h5.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'
};
function reportParts(r){
  const nl = s => esc(s).replace(/\n/g, '<br>');
  // Großbuchstaben im Text statt per CSS: html2canvas stürzt sonst bei „ß“ ab (wird zu „SS“, Text wird länger)
  const up = s => esc(String(s ?? '').toUpperCase());
  // Symbole mit fester Farbe und Größe – html2canvas übernimmt „currentColor“ nicht zuverlässig
  const COL = {ok:'#1e7a46', bad:'#b42318', na:'#8a8989'};
  const icon = (k, px) => RICON[k].replace('<svg ', `<svg width="${px}" height="${px}" `).replace(/currentColor/g, COL[k]);
  const pill = (k, text) => `<span class="pill ${k}">${icon(k, 10)}${esc(text)}</span>`;
  const CHECKV = ['i.O.', 'Mangel', 'n.i.O.', 'entfällt'];
  const isCheck = x => ['ok', 'bad', 'na'].includes(x.eval) || CHECKV.includes(x.value);
  const evalOf = x => x.eval && x.eval !== 'none' ? x.eval : x.value === 'i.O.' ? 'ok' : x.value === 'Mangel' || x.value === 'n.i.O.' ? 'bad' : x.value === 'entfällt' ? 'na' : '';
  const firmLines = String(r.firma || (typeof settings !== 'undefined' ? settings.firma : '') || '').split('\n').map(s => s.trim()).filter(Boolean);
  // „WARTUNGSPROTOKOLL • KÄLTETECHNISCHE ANLAGEN“ → Kopfzeile „WARTUNGSPROTOKOLL“, Titel „Kältetechnische Anlagen“
  const tp = String(r.title || '').split(' • ');
  const nice = s => s.split(' ').map(w => w.split('-').map(x => x.length >= 5 && x === x.toUpperCase() ? x[0] + x.slice(1).toLowerCase() : x).join('-')).join(' ');
  const kicker = tp.length > 1 ? tp[0] : '', h1 = nice(tp.length > 1 ? tp.slice(1).join(' • ') : tp[0]);
  const header = r.header || [];
  // erstes Kopffeld, dessen Beschriftung passt (Nummern-Felder wie „Kundennummer“ ausgenommen)
  const hv = re => (header.find(x => re.test(x.label) && !/nummer|nr\.?$/i.test(x.label) && x.value) || {}).value || '';
  const datum = hv(/datum/i);
  const stand = datum || (r.completedAt ? new Date(r.completedAt).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'}) : '');
  let n = 0;
  const h2 = title => `<h2><span class="no">${++n}</span><span class="tt">${esc(title)}</span></h2>`;
  const kv = rows => rows.length ? `<dl class="kv">${rows.map(x => `<div${x.wide ? ' class="wide"' : ''}><dt>${up(x.label)}</dt><dd class="${x.value ? '' : 'empty'} ${x.eval === 'warn' ? 'warn' : ''}">${x.value ? nl(x.value) : '—'}</dd></div>`).join('')}</dl>` : '';
  const checks = rows => rows.length ? `<div class="checks2">${rows.map(x => { const k = evalOf(x) || 'na';
    return `<div class="ci ${k}">${icon(k, 12)}<span class="t">${esc(x.label)}</span><span class="a">${esc(x.value || '—')}</span></div>`; }).join('')}</div>` : '';
  const blocks = [];

  // Kacheln: Ergebnis · Nächste Wartung · Wartungsdatum (+ Monteur)
  const res = String(r.success || ''), good = res === 'Ja' || res === 'i.O.', bad = !!res && !good;
  const subs = String(r.subline || (r.betrieb ? 'Betriebszustand: ' + r.betrieb : '')).split(' · ').filter(Boolean);
  const defects = r.defects || [];
  // Datum für die Kacheln einheitlich TT.MM.JJJJ (Eingang: „31.8.2026“, „31.08.2026“ oder „2026-08-31“)
  const p2 = x => String(x).padStart(2, '0');
  const dm = String(stand || '').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/) || String(stand || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  const y0 = dm ? +(dm[1].length === 4 ? dm[1] : dm[3]) : 0, mo0 = dm ? +dm[2] - 1 : 0, d0 = dm ? +(dm[1].length === 4 ? dm[3] : dm[1]) : 0;
  const tileDate = dm ? `${p2(d0)}.${p2(mo0 + 1)}.${y0}` : (stand || '');
  // Nächste Wartung: Dichtheitsprüfung vorgeschrieben → Intervall nach CO₂-Äquivalent (ab 5 t [hermetisch 10 t] 12 Monate, ab 50 t 6, ab 500 t 3), sonst Wartungsdatum + 12 Monate
  const nextDue = (() => {
    if(!dm) return {date:'', sub:''};
    const co2 = parseFloat(String(r.co2 ?? '').replace(',', '.')), dp = r.dpv === 'Ja';
    if(dp && !(co2 > 0)) return {date:'', sub:'CO₂-Äquivalent fehlt'};
    const months = dp ? (co2 >= 500 ? 3 : co2 >= 50 ? 6 : 12) : 12;
    const t = mo0 + months, y = y0 + Math.floor(t / 12), mo = t % 12;
    const d = Math.min(d0, new Date(y, mo + 1, 0).getDate());
    return {date:`${p2(d)}.${p2(mo + 1)}.${y}`, sub: dp ? `Dichtheitsprüfung alle ${months} Monate` : 'jährliche Wartung'};
  })();
  blocks.push({html:`<div class="status">
    <div class="tile ${good ? 'ok' : bad ? 'bad' : ''}"><div class="lab">${up(r.resultLabel || 'Wartung erfolgreich')}</div><div class="val">${esc(res || '—')}</div>
      <div class="sub">${good ? pill('ok', 'in Ordnung') : bad ? pill('bad', 'nicht in Ordnung') : ''}${subs.length ? `<div>${esc(subs.join(' · '))}</div>` : ''}</div></div>
    <div class="tile"><div class="lab">${up('Nächste Wartung')}</div><div class="val">${esc(nextDue.date || '—')}</div><div class="sub">${esc(nextDue.sub)}</div></div>
    <div class="tile primary"><div class="lab">${up('Wartungsdatum')}</div><div class="val">${esc(tileDate || '—')}</div><div class="sub">${esc(r.techniker ? 'Monteur: ' + r.techniker : '')}</div></div>
  </div>`});

  // Auftrags- und Anlagendaten
  if(header.length) blocks.push({html:`<div class="sec">${h2('Auftrags- & Anlagendaten')}${kv(header)}</div>`});

  // Abschnitte: Prüfpunkte als Checkliste, Messwerte als Feldliste, Tabellen umbrechbar
  (r.sections || []).forEach(s => {
    const all = (s.checks || []).concat(s.rows || []);
    const ck = all.filter(isCheck), fl = all.filter(x => !isCheck(x));
    const body = checks(ck) + (fl.length ? (ck.length ? `<div class="sub-h">${up('Messwerte & Angaben')}</div>` : '') + kv(fl) : '');
    if(s.table && s.table.body && s.table.body.length){
      const t = s.table;
      blocks.push({split:true, html:`<div class="sec">${h2(s.title)}<table><thead><tr>${t.head.map((h, i) => `<th${i ? '' : ' style="width:26%"'}>${up(h)}</th>`).join('')}</tr></thead><tbody>${t.body.map(b =>
        `<tr><td class="lbl">${esc(b.label)}</td>${b.cells.map(c => `<td class="ev ${c.eval && c.eval !== 'none' ? c.eval : ''}">${esc(c.value || '—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`});
      if(body) blocks.push({html:`<div class="sec-more">${body}</div>`});
    } else {
      blocks.push({html:`<div class="sec">${h2(s.title)}${body || '<div class="none">Keine Angaben</div>'}</div>`});
    }
  });

  if(defects.length) blocks.push({html:`<div class="note def"><b>${up('Auffälligkeiten')}</b><ul>${defects.map(d => `<li>${esc(d)}</li>`).join('')}</ul></div>`});
  blocks.push({html:`<div class="note"><b>${up(r.remarkLabel || 'Bemerkungen / Mängel')}</b>${r.remark ? nl(r.remark) : '—'}</div>`});
  if(r.hinweis) blocks.push({html:`<div class="legal"><p><b>Betreiberhinweis.</b> ${esc(r.hinweis)}</p></div>`});
  const sig = r.sig || {}, img = s => typeof s === 'string' && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(s) ? `<img src="${s}" alt="">` : '';
  // Kundenblock nur, wenn ein altes Protokoll bereits eine Kundenunterschrift enthält
  const kImg = img(sig.kunde);
  blocks.push({html:`<div class="sign">
    <div><b>${up('Monteur / Prüfer')}</b><span class="space">${img(sig.tech)}</span><span class="cap">${esc([r.techniker, stand].filter(Boolean).join(' · ') || 'Name, Datum')}</span></div>${kImg
      ? `<div><b>${up('Kunde / Betreiber')}</b><span class="space">${kImg}</span><span class="cap">${esc(r.kundeName || 'Name')}</span></div>` : ''}</div>`});

  const firm1 = firmLines[0] ? `<b>${esc(firmLines[0])}</b>` : '';
  const kunde = hv(/kunde|betreiber/i), anlage = hv(/anlage|modell/i);
  return {
    blocks,
    head:`<div class="head"><div class="firm">${firm1}${firmLines.slice(1).map(s => `<span>${esc(s)}</span>`).join('')}</div>
      <div class="doc">${kicker ? `<div class="kicker">${up(kicker)}</div>` : ''}<h1>${esc(h1)}</h1><div class="meta">Projekt-Nr. <b>${esc(r.id)}</b>${datum ? ` · <b>${esc(datum)}</b>` : ''}</div></div></div>`,
    smallHead:`<div class="head small"><div class="firm">${firm1}<span>${esc([kunde, anlage].filter(Boolean).join(' · '))}</span></div>
      <div class="doc"><h1>${esc(kicker ? nice(kicker) : h1)}</h1><div class="meta">Projekt-Nr. <b>${esc(r.id)}</b></div></div></div>`,
    foot:esc((kicker ? nice(kicker) + ' ' : '') + h1) + (stand ? ' · ' + esc(stand) : ''), id:esc(r.id)
  };
}

/* Bericht samt Unterschrift; PDF_OPTS: vor dem Rendern auf die Unterschrift (Bild) warten */

let lastPdf = null;   // {key, file, url}

function dbList(){

    .filter(e => !q || [e.projekt, e.kunde, e.monteur, e.modell, e.datum, fmtDate(e.datum)].join(' ').toLowerCase().includes(q))
    .sort((a, b) => String(b.datum).localeCompare(String(a.datum)));

      <td>${e.erfolg ? `<span class="badge ${e.erfolg === 'Ja' ? 'ok' : 'bad'}">${esc(e.erfolg)}</span>` : ''}</td>

/* ---------- Unterschrift ---------- */
function initSig(canvas, p){
  const key = canvas.dataset.sig;
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ctx.fillStyle = '#0b1f3a';
  const src = safeImg(p.sig[key]);
  if(src){ const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height); img.src = src; }
  let drawing = false, last = null;
  const pt = e => { const b = canvas.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); drawing = true; last = pt(e); canvas.setPointerCapture(e.pointerId);
    ctx.beginPath(); ctx.arc(last[0], last[1], 1.1, 0, Math.PI * 2); ctx.fill();
  });
  canvas.addEventListener('pointermove', e => {
    if(!drawing) return;
    const q = pt(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); last = q;
  });
  const end = () => {
    if(!drawing) return; drawing = false;
    const out = document.createElement('canvas');
    out.width = Math.round(r.width); out.height = Math.round(r.height);
    out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
    p.sig[key] = out.toDataURL('image/png'); save();
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
}
const After = {
  wizard(){
    const p = cur();
    if(p && TEMPLATE.pages[p.page].final) document.querySelectorAll('canvas.sig').forEach(c => initSig(c, p));
    document.querySelectorAll('.calc').forEach(el => calcTouch(el.id.replace('calc-', ''), el.textContent, el));
  }
};

/* ---------- Google-Sheet-Schnittstelle ---------- */
async function syncAll(silent){
  const list = protocols.filter(p => p.status === 'done' && !p.synced);
  if(!syncCanStart(list.length > 0, silent)) return;
  let okCount = 0, err = null;
  for(const p of list){
    try{
      recompute(p);
      await api('upsert', {
        protocol: {id:p.id, templateId:TEMPLATE.id, values:p.values, kundeName:p.kundeName || '', completedAt:p.completedAt, sig:p.sig, sourceKey:p.sourceKey || '',
                   summary:{report:buildReport(p)}, pdf:await pdfBase64(p, reportOf(p), PDF_OPTS)},
        cols: buildCols(p)
      });
      p.synced = true; p.syncedAt = new Date().toISOString(); save(); okCount++;
    }catch(e){ err = e; break; }
  }
  syncEnd();
  if(err) toast(`Übertragung fehlgeschlagen: ${err.message}`);
  else if(okCount) toast(`${okCount} Protokoll(e) ins Google Sheet übertragen.`);
  if(view.name === 'home' || view.name === 'report') render(); else updateNet();
}

/* ---------- Aktionen ---------- */
const Actions = {
  home(){ go('home'); },
  settings(){ go('settings'); },
  db(){ go('db', {q:view.q}); },
  sync(){ syncAll(false); },

  new(){
    const values = {};
    ALL_FIELDS.forEach(f => { values[f.id] = f.init != null ? (typeof f.init === 'function' ? f.init() : f.init) : ''; });
    const p = {id:uid(), templateId:TEMPLATE.id, values, sig:{}, kundeName:'', page:0, status:'draft', createdAt:new Date().toISOString(), synced:false};
    recompute(p);
    protocols.unshift(p); save();
    go('wizard', {id:p.id});
  },
  resume(d){ go('wizard', {id:d.id}); },
  report(d){ go('report', {id:d.id}); },
  reopen(d){
    const p = protocols.find(x => x.id === d.id);
    if(!confirm('Protokoll wieder öffnen und bearbeiten? Nach erneutem Abschließen wird die Zeile im Sheet aktualisiert.')) return;
    p.status = 'draft'; p.synced = false; p.page = TEMPLATE.pages.length - 1; save();
    go('wizard', {id:p.id});
  },
  del(d){
    const p = protocols.find(x => x.id === d.id);
    const msg = p.synced ? 'Protokoll aus der App entfernen? (Es bleibt im Google Sheet erhalten.)'
      : p.status === 'done' ? 'ACHTUNG: Dieses Protokoll ist noch NICHT im Google Sheet. Wirklich endgültig löschen?' : 'Entwurf löschen?';
    if(!confirm(msg)) return;
    protocols = protocols.filter(x => x.id !== d.id); save(); render();
  },

  set(d){
    const p = cur();
    p.values[d.f] = p.values[d.f] === d.v && !isRequired(FIELD[d.f], p) ? '' : d.v;   // optionale Felder lassen sich durch erneutes Tippen abwählen
    recompute(p); save(); render();
  },
  allok(){
    const p = cur();
    TEMPLATE.pages[p.page].fields.forEach(f => { if(f.type === 'okfail' && !p.values[f.id]) p.values[f.id] = 'i.O.'; });
    save(); render();
  },
  next(){
    const p = cur();
    if(pageErrors(p, p.page).length){
      view.tried = true; render();
      $('#pageerr').textContent = 'Bitte die markierten Felder prüfen.'; toast('Bitte die markierten Felder prüfen.');
      const first = document.querySelector('.field.err'); if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    stepTo('fwd', () => { p.page++; save(); view.tried = false; });
  },
  prev(){ const p = cur(); if(p.page > 0) stepTo('back', () => { p.page--; save(); view.tried = false; }); },
  jump(d){
    const p = cur(), t = Number(d.i);
    if(t === p.page){ view.tried = true; render(); window.scrollTo(0, 0); return; }
    stepTo(t > p.page ? 'fwd' : 'back', () => { p.page = t; save(); view.tried = true; });
  },
  sigclear(d){ const p = cur(); delete p.sig[d.sig]; save(); render(); },
  finish(){
    const p = cur();
    recompute(p);
    const bad = TEMPLATE.pages.findIndex((pg, k) => pageErrors(p, k).length);
    if(bad >= 0){
      p.page = bad; save(); view.tried = true; render(); window.scrollTo(0, 0);
      toast(`Bitte „${TEMPLATE.pages[bad].title}“ vervollständigen.`);
      return;
    }
    if(PFLICHTFELDER && !p.sig.tech){ $('#pageerr').textContent = 'Bitte als Monteur unterschreiben.'; toast('Bitte als Monteur unterschreiben.'); return; }
    p.status = 'done'; p.completedAt = new Date().toISOString(); p.synced = false;
    save();
    go('report', {id:p.id});
    syncAll(true);
  },

  async makepdf(d, btn){
    if(!window.jspdf || !window.html2canvas){ toast('PDF-Modul nicht geladen – App einmal online neu starten.'); return; }
    if(btn && btn.classList.contains('done')) return;   // Doppelstart verhindern
    const r = reportForView();
    if(!r) return;
    const name = pdfName(r.id) + '.pdf', key = viewKey();
    if(pdfBusy){ toast(pdfBusy !== key ? 'Es wird gerade ein anderes PDF erstellt …' : 'PDF wird noch erstellt …'); return; }   // gleicher Bericht: Doppelstart still verhindern
    const cb = () => $('#bar .pdfb');   // immer der aktuell im DOM befindliche Knopf (die Leiste wird bei Neuzeichnen neu gebaut)
    const setP = v => { pdfProg = v; const f = viewKey() === key ? $('#bar .pdfb .fill') : null; if(f) f.style.transform = 'scaleX(' + v + ')'; };
    pdfBusy = key; setP(.05); { const b = cb(); if(b) b.classList.add('run'); }
    // Fortschritt ist geschätzt (der gemeinsame PDF-Code meldet keinen): nähert sich 92 %, springt bei Fertigstellung auf 100 %
    pdfTick = setInterval(() => setP(pdfProg + (.92 - pdfProg) * .07), 250);
    try{
      const blob = await reportPdfBlob(reportForView(), PDF_OPTS);
      clearInterval(pdfTick); setP(1);
      await new Promise(res => setTimeout(res, RM() ? 0 : 240));
      if(lastPdf) URL.revokeObjectURL(lastPdf.url);
      lastPdf = {key, file:new File([blob], name, {type:'application/pdf'}), url:URL.createObjectURL(blob)};
      pdfBusy = null;
      if(view.name === 'report' && viewKey() === key){
        const bar = $('#pdfbar'); if(bar) bar.innerHTML = pdfBarHtml();
        setBar();   // baut Leiste neu auf (mit Teilen-Knopf) -> neuen Knopf in den Fertig-Zustand setzen
        const nb = cb();
        if(nb){ nb.classList.remove('run'); nb.classList.add('done'); setTimeout(() => nb.classList.remove('done'), 2600); }
      }
      toast('PDF fertig – jetzt „Teilen“ antippen.');
    }catch(e){ toast('PDF konnte nicht erstellt werden: ' + e.message); }
    finally{
      clearInterval(pdfTick); pdfBusy = null; pdfProg = 0;
      const b = cb(); if(b && !b.classList.contains('done')){ b.classList.remove('run'); setP(0); }
    }
  },
  async sharepdf(){
    if(!lastPdf) return;
    const files = [lastPdf.file];
    if(navigator.canShare && navigator.canShare({files})){
      try{ await navigator.share({files, title:lastPdf.file.name}); }
      catch(e){ if(e.name !== 'AbortError') toast('Teilen fehlgeschlagen: ' + e.message); }
    } else {
      window.open(lastPdf.url, '_blank');
    }
  },
  print(){
    const r = reportForView();
    const old = document.title;
    document.title = pdfName(r.id);
    window.print();
    setTimeout(() => { document.title = old; }, 1500);
  },

  async dbload(){
    if(!navigator.onLine){ toast('Offline – zeige gespeicherten Stand.'); return; }
    try{
      toast('Lade Daten …');
      const j = await api('list');
      dbCache = {at:new Date().toISOString(), list:j.list};
      LS.set('wp2.db', dbCache);
      toast(`${j.list.length} Einträge geladen.`);
      render();
    }catch(e){ toast('Laden fehlgeschlagen: ' + e.message); }
  },
  async dbreport(d){
    if(!navigator.onLine){ toast('Zum Öffnen eines Protokolls aus dem Sheet wird Internet benötigt.'); return; }
    try{ toast('Lade Protokoll …'); const j = await api('get', {key:d.key}); go('report', {db:true, rep:j.report, key:d.key, q:view.q}); }
    catch(e){ toast('Laden fehlgeschlagen: ' + e.message); }
  },
  async dbedit(d){
    if(!navigator.onLine){ toast('Zum Laden aus dem Sheet wird Internet benötigt.'); return; }
    try{
      toast('Lade Protokoll …');
      const j = await api('load', {key:d.key});
      const local = j.appId && protocols.find(x => x.id === j.appId);
      if(local && local.status === 'done' && !local.synced && !confirm('In der App gibt es zu diesem Protokoll noch nicht übertragene Änderungen. Durch die Version aus dem Sheet ersetzen?')) return;
      if(local && local.status === 'draft' && !confirm('Dieses Protokoll ist hier schon als Entwurf geöffnet. Durch die Version aus dem Sheet ersetzen?')) return;
      const values = {};
      ALL_FIELDS.forEach(f => {
        let x = j.values ? j.values[f.id] : (f.col ? j.cols[f.col] : '');
        if(x == null) x = '';
        if(typeof x === 'number' && f.type !== 'calc') x = fmtNum(x);   // Eingabefelder erwarten Text mit Komma
        if(typeof x === 'boolean') x = x ? 'Ja' : 'Nein';
        values[f.id] = f.type === 'calc' ? x : String(x);
      });
      const p = {id:j.appId || uid(), templateId:TEMPLATE.id, values, sig:{}, kundeName:j.kundeName || '', sourceKey:d.key,
                 page:0, status:'draft', createdAt:new Date().toISOString(), synced:false};
      recompute(p);
      protocols = protocols.filter(x => x.id !== p.id);
      protocols.unshift(p); save();
      toast('Geladen – nach dem Bearbeiten neu unterschreiben und abschließen.');
      go('wizard', {id:p.id});
    }catch(e){ toast('Laden fehlgeschlagen: ' + e.message); }
  },
  async drivepdf(){
    try{
      toast('PDF wird in Google Drive erstellt …');
      const blob = await reportPdfBlob(reportForView(), PDF_OPTS);
      const b64 = await blobB64(blob);
      const j = await api('savepdf', {key:view.key, pdf:b64});
      const e = dbCache.list.find(x => x.key === view.key); if(e){ e.pdfUrl = j.url; LS.set('wp2.db', dbCache); }
      toast('PDF in Google Drive gespeichert.');
      window.open(j.url, '_blank');
    }catch(e){ toast('Fehler: ' + e.message); }
  },

  savesettings(d){
    settingsSave(SETTINGS_FIELDS, 'wp2.settings');
    if(d !== 'silent') toast('Gespeichert.');
  },
  async ping(){
    Actions.savesettings('silent');
    try{ await api('ping'); toast('Verbindung zum Google Sheet funktioniert ✓'); syncAll(true); }
    catch(e){ toast('Verbindung fehlgeschlagen: ' + e.message); }
  },
  backup(){
    backupDownload({app:'wp-service', exportedAt:new Date().toISOString(), protocols}, `wp-service-backup-${today()}.json`);
  }
};

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const fn = Actions[b.dataset.act];
  if(fn){ e.preventDefault(); if(navBusy) return; fn(b.dataset, b); }   // während eines Seitenübergangs Tipps ignorieren
});
app.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.f && view.name === 'wizard'){
    const p = cur(), f = FIELD[el.dataset.f];
    p.values[f.id] = el.value;
    recompute(p); save();
    if(f.id === 'projekt' || f.id === 'kunde') setHeader(false);   // Kopf-Unterzeile mitführen (kein Neuzeichnen)
    if(el.dataset.other) document.querySelectorAll(`[data-act=set][data-f="${f.id}"]`).forEach(b => b.classList.toggle('sel', b.dataset.v === el.value));
    if(f.type === 'number') $('#soll-' + f.id).innerHTML = sollHtml(f, p.values);
    TEMPLATE.pages[p.page].fields.filter(c => c.type === 'calc').forEach(c => {
      const ce = $('#calc-' + c.id), t = display(c, p.values[c.id]) || '—';
      ce.textContent = t; calcTouch(c.id, t, ce);
      if(c.note) $('#note-' + c.id).textContent = c.note(p.values);
    });
  } else if(el.id === 'dbsearch'){
    view.q = el.value; $('#dblist').innerHTML = dbList();
  }
});
app.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 's_import' && el.files[0]){
    backupImport(el.files[0], 'protocols', protocols, 'Protokolle', list => { protocols = list; save(); });
  }
});
window.addEventListener('online', () => { updateNet(); syncAll(true); });
window.addEventListener('offline', updateNet);
let lastW = window.innerWidth;
window.addEventListener('resize', () => {   // Drehen des iPads: Unterschriftsfelder neu aufbauen
  if(window.innerWidth !== lastW && view.name === 'wizard' && cur() && TEMPLATE.pages[cur().page].final) render();
  lastW = window.innerWidth;
});

/* ---------- Start ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
render();
syncAll(true);
</script>
<script src="shared/theme.js"></script>
